<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>清华紫 · AI 绘图工坊 (调试版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'PingFang SC', sans-serif; }
        body {
            background: #f2edf8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            max-width: 1040px;
            width: 100%;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(14px);
            border-radius: 56px;
            padding: 40px 38px 44px;
            box-shadow: 0 28px 60px rgba(60,20,100,0.20);
            border: 1px solid rgba(255,215,255,0.35);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            border-bottom: 2px solid rgba(102,45,145,0.18);
            padding-bottom: 18px;
        }
        .header h1 {
            font-weight: 650;
            font-size: 2.2rem;
            color: #321b4a;
            background: linear-gradient(145deg, #4a1a6b, #7b3fa0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .badge {
            margin-left: auto;
            background: rgba(102,45,145,0.12);
            padding: 6px 22px;
            border-radius: 60px;
            color: #4a1a6b;
            border: 1px solid rgba(102,45,145,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .api-section, .prompt-box {
            background: rgba(245,237,255,0.5);
            border-radius: 40px;
            padding: 18px 26px;
            margin-bottom: 20px;
            border: 1px solid rgba(160,120,200,0.2);
        }
        .api-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 20px;
        }
        .api-section label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 550;
            color: #3d2357;
            flex: 1 0 180px;
        }
        .api-section label i { color: #662d91; font-size: 1.2rem; width: 28px; }
        .api-section input, .api-section select {
            padding: 12px 22px;
            border: 1px solid #c9b5dd;
            border-radius: 60px;
            font-size: 0.95rem;
            background: #fbf8ff;
            outline: none;
            color: #1f1135;
        }
        .api-section input { flex: 2 1 280px; }
        .api-section select { flex: 1 1 180px; cursor: pointer; }
        .api-section input:focus, .api-section select:focus {
            border-color: #662d91;
            box-shadow: 0 0 0 4px rgba(102,45,145,0.18);
        }
        .prompt-box textarea {
            width: 100%;
            padding: 16px 22px;
            border: 1px solid #d5c3e8;
            border-radius: 32px;
            font-size: 1rem;
            resize: vertical;
            min-height: 96px;
            background: #fbf8ff;
            outline: none;
            color: #1f1135;
        }
        .prompt-box textarea:focus {
            border-color: #662d91;
            box-shadow: 0 0 0 4px rgba(102,45,145,0.12);
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 20px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 34px;
            border-radius: 60px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            flex: 1 0 auto;
        }
        .btn-primary {
            background: #662d91;
            color: white;
            box-shadow: 0 10px 24px rgba(102,45,145,0.30);
        }
        .btn-primary:hover { background: #4f1f73; transform: scale(1.02); }
        .btn-secondary {
            background: #f4effa;
            border: 1px solid #cdb9e2;
        }
        .btn-secondary:hover { background: #ffffff; border-color: #a685c4; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .image-result {
            background: #f4edfc;
            border-radius: 40px;
            padding: 16px;
            border: 1px solid rgba(200,170,225,0.3);
        }
        .image-wrapper {
            background: #ffffff;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            border: 1px solid #ddd0ec;
        }
        .image-wrapper img {
            max-width: 100%;
            max-height: 560px;
            display: block;
            object-fit: contain;
            width: 100%;
        }
        .placeholder-text {
            color: #6a4b86;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 40px 20px;
        }
        .placeholder-text i { font-size: 3.8rem; color: #b297cc; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 0.95rem;
            color: #3d2357;
            padding: 0 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #d5c3e8;
            border-top: 3px solid #662d91;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .debug-log {
            margin-top: 16px;
            background: #1a1128;
            color: #d4c4e8;
            border-radius: 20px;
            padding: 14px 20px;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 20px;
            text-align: center;
            color: #5b4079;
            border-top: 1px solid #dcccec;
            padding-top: 20px;
        }
        @media (max-width: 640px) {
            .card { padding: 24px 16px; }
            .api-section { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <i class="fas fa-landmark" style="font-size:2.4rem;color:#662d91;"></i>
        <h1>清华 · AI 绘图</h1>
        <div class="badge"><i class="fas fa-bug"></i> 调试版</div>
    </div>

    <!-- API 配置 -->
    <div class="api-section">
        <label><i class="fas fa-key"></i> API 密钥</label>
        <input type="password" id="apiKeyInput" placeholder="sk-..." />
        <label><i class="fas fa-globe"></i> 接口地址</label>
        <select id="apiUrlSelect">
            <option value="https://api.deepseek.com/v1/images/generations">DeepSeek 官方 (v1/images/generations)</option>
            <option value="https://api.deepseek.com/v1/images/generations">备用相同</option>
        </select>
        <button class="btn btn-secondary" id="saveKeyBtn" style="flex:0 1 auto;padding:10px 24px;">
            <i class="fas fa-save"></i> 保存
        </button>
    </div>

    <!-- 提示词 -->
    <div class="prompt-box">
        <label><i class="fas fa-feather-pointed"></i> 绘画描述</label>
        <textarea id="promptInput">清华二校门雪景，水彩风格，典雅宁静，紫荆花点缀</textarea>
    </div>

    <!-- 按钮 -->
    <div class="action-row">
        <button class="btn btn-primary" id="generateBtn"><i class="fas fa-wand-magic-sparkles"></i> 生成图片</button>
        <button class="btn btn-secondary" id="clearBtn"><i class="fas fa-rotate-left"></i> 清空</button>
    </div>

    <!-- 图片展示 -->
    <div class="image-result">
        <div class="image-wrapper" id="imageWrapper">
            <div id="imagePlaceholder" class="placeholder-text">
                <i class="fas fa-image"></i>
                <span>输入描述，点击生成</span>
                <span style="font-size:0.8rem;color:#8466a8;">调试日志在下方显示</span>
            </div>
            <img id="generatedImage" style="display:none;" alt="AI 生成的图片" />
        </div>

        <div class="status-bar">
            <span id="statusText"><i class="fas fa-circle-info"></i> 等待操作</span>
            <div class="spinner" id="loadingSpinner"></div>
        </div>

        <!-- 调试日志 -->
        <div class="debug-log" id="debugLog">📋 调试日志将显示在此处...</div>
    </div>

    <div class="footer-note">
        <i class="fas fa-shield-alt"></i> 密钥本地存储 · 若图片未生成，请查看下方日志
    </div>
</div>

<script>
(function() {
    const apiKeyInput = document.getElementById('apiKeyInput');
    const apiUrlSelect = document.getElementById('apiUrlSelect');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const placeholder = document.getElementById('imagePlaceholder');
    const generatedImg = document.getElementById('generatedImage');
    const statusText = document.getElementById('statusText');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const debugLog = document.getElementById('debugLog');

    // 日志函数
    function log(msg, data = null) {
        const time = new Date().toLocaleTimeString();
        let text = `[${time}] ${msg}`;
        if (data) {
            text += '\n' + (typeof data === 'object' ? JSON.stringify(data, null, 2) : data);
        }
        debugLog.textContent = text + '\n\n' + debugLog.textContent;
        if (debugLog.textContent.length > 2000) {
            debugLog.textContent = debugLog.textContent.slice(0, 2000);
        }
        console.log('[DeepSeek调试]', msg, data);
    }

    // 恢复密钥
    const savedKey = localStorage.getItem('deepseek_api_key');
    if (savedKey) {
        apiKeyInput.value = savedKey;
        log('✅ 已从本地恢复 API 密钥');
    }

    // 保存密钥
    saveKeyBtn.addEventListener('click', function() {
        const key = apiKeyInput.value.trim();
        if (key) {
            localStorage.setItem('deepseek_api_key', key);
            setStatus('✅ 密钥已保存', '#4a1a6b');
            log('✅ API 密钥已保存');
        } else {
            localStorage.removeItem('deepseek_api_key');
            setStatus('⚠️ 密钥已清除', '#9d5f3a');
            log('⚠️ API 密钥已清除');
        }
    });

    // 清空
    clearBtn.addEventListener('click', function() {
        resetImageDisplay();
        setStatus('🔄 已清空', '#4a1a6b');
        log('🔄 已清空图片');
    });

    function resetImageDisplay() {
        generatedImg.style.display = 'none';
        generatedImg.src = '';
        placeholder.style.display = 'flex';
    }

    function displayImage(imageUrl) {
        placeholder.style.display = 'none';
        generatedImg.style.display = 'block';
        generatedImg.src = imageUrl;
        log('✅ 图片已加载，URL:', imageUrl);
    }

    function setStatus(msg, color = '#3d2357') {
        statusText.innerHTML = msg;
        statusText.style.color = color;
    }

    function setLoading(isLoading) {
        if (isLoading) {
            loadingSpinner.style.display = 'inline-block';
            generateBtn.disabled = true;
            setStatus('⏳ 生成中...', '#4a1a6b');
        } else {
            loadingSpinner.style.display = 'none';
            generateBtn.disabled = false;
        }
    }

    // ---------- 核心生成 ----------
    generateBtn.addEventListener('click', async function() {
        const apiKey = apiKeyInput.value.trim();
        const prompt = promptInput.value.trim();
        const apiUrl = apiUrlSelect.value;

        if (!apiKey) {
            setStatus('❌ 请先输入并保存 API 密钥', '#b13e3e');
            log('❌ 缺少 API 密钥');
            return;
        }
        if (!prompt) {
            setStatus('❌ 请输入绘画描述', '#b13e3e');
            log('❌ 缺少绘画描述');
            return;
        }

        if (apiKey) localStorage.setItem('deepseek_api_key', apiKey);

        resetImageDisplay();
        setLoading(true);
        log('🚀 开始生成图片');
        log('📝 提示词:', prompt);
        log('🌐 API 地址:', apiUrl);

        try {
            const requestBody = {
                model: 'deepseek-image',
                prompt: prompt,
                n: 1,
                size: '1024x1024'
            };
            log('📦 请求体:', requestBody);

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(requestBody)
            });

            log('📡 响应状态:', response.status, response.statusText);

            // 获取原始响应文本（用于调试）
            const responseText = await response.text();
            log('📄 原始响应:', responseText);

            let data;
            try {
                data = JSON.parse(responseText);
            } catch (e) {
                throw new Error('响应不是有效的 JSON: ' + responseText.substring(0, 200));
            }

            if (!response.ok) {
                const errMsg = data?.error?.message || data?.message || `HTTP ${response.status}`;
                throw new Error(errMsg);
            }

            // 尝试多种可能的数据结构
            let imageUrl = null;
            if (data.data && Array.isArray(data.data) && data.data.length > 0) {
                imageUrl = data.data[0].url || data.data[0].b64_json || data.data[0].image;
            } else if (data.image) {
                imageUrl = data.image;
            } else if (data.url) {
                imageUrl = data.url;
            } else if (data.output && data.output.url) {
                imageUrl = data.output.url;
            }

            if (!imageUrl) {
                throw new Error('未找到图片 URL，请查看上方日志中的原始响应');
            }

            displayImage(imageUrl);
            setStatus('✅ 生成成功！', '#1e7b4c');
            log('🎉 生成成功，图片 URL:', imageUrl);

        } catch (error) {
            console.error('生成错误:', error);
            const errorMsg = error.message || '未知错误';
            setStatus(`❌ 错误: ${errorMsg}`, '#b13e3e');
            log('❌ 错误详情:', errorMsg);
            resetImageDisplay();
        } finally {
            setLoading(false);
        }
    });

    // 回车保存密钥
    apiKeyInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            saveKeyBtn.click();
        }
    });

    // 初始状态
    if (savedKey) {
        setStatus('🔑 密钥已加载，可开始生成', '#4a1a6b');
        log('✅ 已就绪，密钥已加载');
    } else {
        setStatus('ℹ️ 请设置 API 密钥', '#4a1a6b');
        log('ℹ️ 请先输入 API 密钥');
    }
})();
</script>
</body>
</html>
