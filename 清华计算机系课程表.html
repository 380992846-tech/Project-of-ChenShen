<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵系课程表 · 清华黑紫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局 黑紫玻璃 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0710; color: #e6e0f0; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .app-container {
            width: 1440px; max-width: 100%; height: 920px; max-height: 98vh;
            background: rgba(22, 16, 35, 0.45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-radius: 40px; box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), 0 0 0 1px rgba(160,120,255,0.2);
            display: flex; flex-direction: column; overflow: hidden; transition: background-image 0.5s ease;
            position: relative; background-size: cover; background-position: center;
        }
        .app-container::before { content: ''; position: absolute; inset: 0; background: rgba(10,6,20,0.25); backdrop-filter: blur(4px); pointer-events: none; z-index: 0; }
        .app-container>* { position: relative; z-index: 1; }

        /* ===== 顶部导航 ===== */
        .navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 24px;
            border-bottom: 1px solid rgba(180,140,255,0.15); background: rgba(12,8,22,0.25);
            flex-shrink: 0; flex-wrap: wrap; gap: 6px;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background: linear-gradient(145deg, #b28aff, #7a4bff); width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #f0ecff; box-shadow: 0 6px 14px rgba(90,40,200,0.6); }
        .logo-text { font-weight: 700; font-size: 18px; letter-spacing: 1px; background: linear-gradient(to right, #d9caff, #b28aff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-text small { font-weight: 400; font-size: 11px; color: #9480c0; background: none; -webkit-background-clip: unset; margin-left: 4px; }
        .nav-center { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .wallpaper-selector { display: flex; align-items: center; gap: 5px; background: rgba(30,20,55,0.4); padding: 3px 10px 3px 12px; border-radius: 40px; border: 1px solid rgba(160,120,255,0.15); flex-wrap: wrap; }
        .wallpaper-selector span { font-size: 11px; color: #b3a1d4; }
        .wallpaper-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(200,180,255,0.3); cursor: pointer; transition: 0.2s; background-size: cover; background-position: center; flex-shrink: 0; }
        .wallpaper-dot:hover { transform: scale(1.12); border-color: #b28aff; }
        .wallpaper-dot.active { border-color: #b28aff; box-shadow: 0 0 12px rgba(130,70,255,0.4); }
        .upload-btn { background: rgba(130,70,255,0.2); border: 1px solid rgba(160,120,255,0.3); border-radius: 30px; padding: 1px 8px; font-size: 10px; color: #cbb8f0; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 3px; }
        .upload-btn:hover { background: rgba(130,70,255,0.35); border-color: #b28aff; }
        #wallpaperUpload { display: none; }
        .nav-clock-weather { display: flex; align-items: center; gap: 10px; background: rgba(30,20,55,0.3); padding: 3px 12px 3px 10px; border-radius: 40px; border: 1px solid rgba(160,120,255,0.08); }
        .nav-clock { display: flex; align-items: baseline; gap: 4px; }
        .nav-clock .time { font-size: 15px; font-weight: 600; color: #f0eaff; }
        .nav-clock .date { font-size: 10px; color: #b3a1d4; }
        .nav-weather { display: flex; align-items: baseline; gap: 4px; padding-left: 8px; border-left: 1px solid rgba(160,120,255,0.15); }
        .nav-weather .temp { font-size: 15px; font-weight: 500; color: #f0eaff; }
        .nav-weather .desc { font-size: 10px; color: #b3a1d4; }
        .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .nav-actions i { font-size: 15px; color: #b8a8e0; transition: 0.2s; cursor: pointer; }
        .nav-actions i:hover { color: #d4c0ff; transform: scale(1.05); }
        .avatar { width: 30px; height: 30px; background: linear-gradient(135deg, #6d44d0, #371b7a); border-radius: 100px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; color: #e8dcff; border: 1px solid #a47eff; }

        /* ===== 主体 ===== */
        .main-layout { display: flex; flex: 1; min-height: 0; padding: 12px 20px 14px 20px; gap: 16px; overflow: hidden; }
        .course-sidebar {
            width: 280px; background: rgba(16,10,30,0.3); backdrop-filter: blur(4px); border-radius: 24px;
            border: 1px solid rgba(160,120,255,0.08); padding: 14px 12px; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
        }
        .course-sidebar::-webkit-scrollbar { width: 3px; }
        .course-sidebar::-webkit-scrollbar-thumb { background: #4e3a78; border-radius: 10px; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .sidebar-header h3 { font-weight: 500; font-size: 13px; color: #cbb8f0; }
        .sidebar-header i { color: #a07aff; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .sidebar-header i:hover { color: #c9b0ff; }
        .search-box { background: rgba(40,28,70,0.4); border-radius: 40px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; border: 1px solid rgba(150,110,255,0.1); }
        .search-box i { color: #8b75b5; font-size: 11px; }
        .search-box input { background: transparent; border: none; outline: none; color: #e6def5; font-size: 12px; width: 100%; }
        .search-box input::placeholder { color: #6f5b96; }
        .search-box:focus-within { border-color: #9f7aff; box-shadow: 0 0 12px rgba(130,70,255,0.1); }
        .course-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
        .course-item { background: rgba(33,22,58,0.3); border-radius: 12px; padding: 8px 12px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
        .course-item:hover { background: rgba(55,38,90,0.45); border-color: #6a47b0; transform: translateX(3px); }
        .course-item.active { background: rgba(88,55,170,0.25); border-color: #9b77f0; }
        .course-item .name { font-weight: 600; font-size: 13px; color: #ede6ff; display: flex; justify-content: space-between; }
        .course-item .name i { color: #8d71c7; font-size: 10px; }
        .course-item .info { font-size: 10px; color: #b3a1d4; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

        /* 右侧 */
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow-y: auto; padding-right: 4px; }
        .right-panel::-webkit-scrollbar { width: 3px; }
        .right-panel::-webkit-scrollbar-thumb { background: #4e3a78; border-radius: 10px; }

        .detail-card { background: rgba(10,6,20,0.25); backdrop-filter: blur(4px); border-radius: 24px; border: 1px solid rgba(160,120,255,0.08); padding: 14px 18px; }
        .detail-card .title-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .detail-card .title-row h2 { font-weight: 500; font-size: 20px; color: #f0eaff; }
        .detail-card .title-row .badge { background: rgba(130,70,255,0.25); padding: 2px 12px; border-radius: 30px; font-size: 11px; color: #cbb8f0; border: 1px solid rgba(160,120,255,0.15); }
        .detail-card .meta-grid { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 6px 0 4px 0; font-size: 13px; color: #c0b0dd; }
        .detail-card .meta-grid i { width: 18px; color: #9f87d0; }
        .detail-card .desc { margin-top: 6px; font-size: 13px; line-height: 1.6; color: #ddd2f0; background: rgba(20,12,38,0.2); padding: 8px 14px; border-radius: 16px; border-left: 3px solid #7a4bff; }

        /* 笔记 */
        .note-area { background: rgba(10,6,20,0.2); backdrop-filter: blur(4px); border-radius: 20px; border: 1px solid rgba(160,120,255,0.08); padding: 12px 16px; }
        .note-area textarea { width: 100%; background: rgba(20,12,38,0.15); border: 1px solid rgba(130,90,210,0.1); border-radius: 14px; padding: 10px 14px; color: #ddd2f0; font-size: 13px; line-height: 1.6; resize: vertical; min-height: 70px; outline: none; transition: 0.2s; }
        .note-area textarea:focus { border-color: #9e7aff; box-shadow: 0 0 16px rgba(110,60,220,0.06); }
        .note-area .note-label { font-size: 11px; color: #7f6aac; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }

        /* 周视图 + 暑假寒假 */
        .week-schedule { background: rgba(10,6,20,0.2); backdrop-filter: blur(4px); border-radius: 24px; border: 1px solid rgba(160,120,255,0.08); padding: 12px 14px; }
        .week-schedule .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: #cbb8f0; font-size: 12px; }
        .week-schedule .week-header i { cursor: pointer; transition: 0.2s; }
        .week-schedule .week-header i:hover { color: #dcc8ff; }
        .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .week-day { background: rgba(33,22,58,0.2); border-radius: 12px; padding: 4px 2px; text-align: center; border: 1px solid rgba(160,120,255,0.05); min-height: 60px; }
        .week-day .day-label { font-size: 10px; color: #9a83c7; }
        .week-day .day-num { font-size: 15px; font-weight: 400; color: #ede6ff; }
        .week-day .course-tag { background: rgba(130,70,255,0.15); border-radius: 20px; padding: 1px 4px; font-size: 7px; color: #cbb8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .week-day.today { border-color: #9b77f0; background: rgba(88,55,170,0.15); }
        .week-day.holiday { background: rgba(200,180,255,0.05); border-color: rgba(200,180,255,0.1); }
        .week-day .holiday-label { font-size: 8px; color: #b8a0d0; }

        /* 固定按钮 */
        .fixed-actions { position: fixed; bottom: 28px; right: 28px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .glass-btn { background: rgba(30,18,50,0.75); backdrop-filter: blur(10px); border: 1px solid rgba(160,120,255,0.12); padding: 8px 16px; font-size: 13px; color: #c8b0e0; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border-radius: 30px; cursor: pointer; transition: 0.25s; display: inline-flex; align-items: center; gap: 6px; min-width: 110px; justify-content: center; background: rgba(30,18,50,0.75); border-color: rgba(120,80,160,0.25); }
        .glass-btn:hover { background: rgba(50,30,80,0.8); border-color: #9a7acc; color: #f0eaff; transform: translateY(-1px); }
        .glass-btn i { font-size: 14px; }

        /* Toast & Modal */
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(30,20,60,0.9); backdrop-filter: blur(10px); padding: 10px 26px; border-radius: 40px; border: 1px solid rgba(160,120,255,0.2); color: #e6def5; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.4s; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .toast.show { opacity: 1; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: rgba(22,16,40,0.95); border-radius: 28px; padding: 24px 30px; max-width: 540px; width: 90%; border: 1px solid rgba(160,120,255,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .modal-box h3 { color: #f0eaff; font-weight: 500; margin-bottom: 6px; font-size: 18px; }
        .modal-box p { color: #b3a1d4; font-size: 13px; margin-bottom: 12px; }
        .modal-box textarea { width: 100%; background: rgba(10,6,20,0.4); border: 1px solid rgba(160,120,255,0.1); border-radius: 16px; padding: 12px; color: #ddd2f0; font-size: 14px; line-height: 1.6; resize: vertical; min-height: 100px; outline: none; }
        .modal-box textarea:focus { border-color: #9e7aff; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 14px; }
        .modal-actions button { background: rgba(130,70,255,0.2); border: 1px solid rgba(160,120,255,0.15); border-radius: 40px; padding: 6px 20px; color: #cbb8f0; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .modal-actions button:hover { background: rgba(130,70,255,0.4); }
        .modal-actions button.primary { background: rgba(130,70,255,0.4); border-color: #7a4bff; }
        .modal-actions button.primary:hover { background: rgba(130,70,255,0.6); }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(160,120,255,0.2); border-top: 2px solid #b28aff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #aiResult { background: rgba(10,6,20,0.3); border-radius: 12px; padding: 12px; color: #ddd2f0; font-size: 14px; line-height: 1.7; min-height: 50px; white-space: pre-wrap; border: 1px solid rgba(160,120,255,0.05); margin-bottom: 10px; }

        @media (max-width: 820px) {
            .navbar { flex-direction: column; align-items: stretch; gap: 4px; padding: 8px 12px; }
            .nav-center { justify-content: center; }
            .main-layout { flex-direction: column; padding: 10px 12px; gap: 12px; }
            .course-sidebar { width: 100%; max-height: 160px; border-radius: 18px; }
            .right-panel { padding-right: 0; }
            .week-grid { gap: 3px; }
            .week-day { min-height: 48px; padding: 2px 1px; }
            .week-day .day-num { font-size: 12px; }
            .fixed-actions { bottom: 16px; right: 16px; gap: 8px; }
            .fixed-actions .glass-btn { padding: 6px 12px; font-size: 12px; min-width: 70px; }
        }
        @media (max-width: 480px) {
            .app-container { border-radius: 24px; height: 98vh; }
            .detail-card .title-row h2 { font-size: 17px; }
            .week-grid { grid-template-columns: repeat(7, 1fr); gap: 2px; }
            .week-day { min-height: 40px; padding: 1px; }
            .week-day .day-label { font-size: 8px; }
            .week-day .day-num { font-size: 10px; }
            .week-day .course-tag { font-size: 6px; padding: 0 2px; }
            .fixed-actions { bottom: 12px; right: 12px; gap: 6px; }
            .fixed-actions .glass-btn { padding: 4px 8px; font-size: 10px; min-width: 50px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- 导航 -->
        <header class="navbar">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <div class="logo-text">贵系课程 <small>· 清华黑紫</small></div>
            </div>
            <div class="nav-center">
                <div class="wallpaper-selector" id="wallpaperSelector">
                    <span><i class="fas fa-image"></i></span>
                    <div class="wallpaper-dot active" data-wallpaper="default" style="background: linear-gradient(135deg, #1a1030, #2a1a4a);" title="默认"></div>
                    <div class="wallpaper-dot" data-wallpaper="gugong" style="background-image: url('https://picsum.photos/seed/gugong/200/200');" title="故宫"></div>
                    <div class="wallpaper-dot" data-wallpaper="southgate" style="background-image: url('https://picsum.photos/seed/southgate/200/200');" title="清华南门"></div>
                    <div class="wallpaper-dot" data-wallpaper="ergate" style="background-image: url('https://picsum.photos/seed/ergate/200/200');" title="二校门"></div>
                    <div class="wallpaper-dot" data-wallpaper="beach" style="background-image: url('https://picsum.photos/seed/beach/200/200');" title="海滩"></div>
                    <div class="wallpaper-dot" data-wallpaper="peach" style="background-image: url('https://picsum.photos/seed/peach/200/200');" title="桃花"></div>
                    <div class="wallpaper-dot" data-wallpaper="boston" style="background-image: url('https://picsum.photos/seed/boston/200/200');" title="波士顿"></div>
                    <label class="upload-btn" for="wallpaperUpload"><i class="fas fa-upload"></i> 自定</label>
                    <input type="file" id="wallpaperUpload" accept="image/*">
                </div>
                <div class="nav-clock-weather">
                    <div class="nav-clock"><span class="time" id="navClockTime">--:--:--</span><span class="date" id="navClockDate">--/--</span></div>
                    <div class="nav-weather"><span class="temp" id="navWeatherTemp">--°C</span><span class="desc" id="navWeatherDesc">--</span></div>
                </div>
            </div>
            <div class="nav-actions">
                <i class="fas fa-search"></i><i class="fas fa-bell"></i><i class="fas fa-th-large"></i>
                <div class="avatar">CS</div>
            </div>
        </header>

        <!-- 主体 -->
        <div class="main-layout">
            <aside class="course-sidebar">
                <div class="sidebar-header">
                    <h3><i class="fas fa-list-ul" style="margin-right:4px;"></i>课程目录</h3>
                    <i class="fas fa-plus-circle" id="addCourseBtn"></i>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索课程...">
                </div>
                <div class="course-list" id="courseListContainer"></div>
            </aside>

            <div class="right-panel">
                <div class="detail-card">
                    <div class="title-row">
                        <h2 id="detailTitle">计算机组成原理</h2>
                        <span class="badge" id="detailCredit">3 学分</span>
                    </div>
                    <div class="meta-grid">
                        <span><i class="fas fa-user-tie"></i> <span id="detailTeacher">刘卫东</span></span>
                        <span><i class="fas fa-clock"></i> <span id="detailTime">周三 10:00-12:00</span></span>
                        <span><i class="fas fa-map-pin"></i> <span id="detailLocation">三教 2101</span></span>
                        <span><i class="fas fa-tag"></i> <span id="detailCategory">本科·专业核心</span></span>
                    </div>
                    <div class="desc" id="detailDesc">计算机系统结构基础，涵盖CPU、存储器、指令系统等核心内容。</div>
                </div>

                <!-- 笔记区域 -->
                <div class="note-area">
                    <div class="note-label"><i class="fas fa-pencil-alt"></i> 课程笔记 <span style="color:#6c5890;font-size:10px;">(自动保存)</span></div>
                    <textarea id="courseNote" placeholder="记录本节课的要点、疑问或心得……"></textarea>
                </div>

                <!-- 周视图 + 暑假寒假 -->
                <div class="week-schedule">
                    <div class="week-header">
                        <span><i class="fas fa-calendar-alt"></i> <span id="weekLabel">第6周</span></span>
                        <span><i class="fas fa-chevron-left" id="weekPrev"></i> <i class="fas fa-chevron-right" id="weekNext"></i></span>
                    </div>
                    <div class="week-grid" id="weekGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 固定按钮 -->
    <div class="fixed-actions">
        <button class="glass-btn" id="aiAssistantBtn"><i class="fas fa-robot"></i> 贵系助教</button>
        <button class="glass-btn" id="resetCoursesBtn"><i class="fas fa-sync-alt"></i> 重置课表</button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- AI Modal -->
    <div class="modal-overlay" id="aiModal">
        <div class="modal-box">
            <h3><i class="fas fa-robot" style="color:#b28aff;"></i> 贵系助教 (DeepSeek)</h3>
            <p>输入你的 DeepSeek API Key，助教将帮你解答课程问题或整理要点。</p>
            <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API Key..." style="width:100%;background:rgba(10,6,20,0.4);border:1px solid rgba(160,120,255,0.1);border-radius:12px;padding:8px 12px;color:#ddd2f0;font-size:13px;outline:none;margin-bottom:10px;">
            <div id="aiResult">等待提问……</div>
            <textarea id="aiQuestion" placeholder="向助教提问，例如：解释一下Cache的工作原理" style="width:100%;background:rgba(10,6,20,0.3);border:1px solid rgba(160,120,255,0.1);border-radius:12px;padding:8px 12px;color:#ddd2f0;font-size:13px;resize:vertical;min-height:50px;outline:none;margin-bottom:8px;"></textarea>
            <div class="modal-actions">
                <button id="aiModalClose">关闭</button>
                <button class="primary" id="aiAskBtn"><i class="fas fa-magic"></i> 提问</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ===================== 课程数据 (本科+研究生) =====================
            // 本科课程 (来自培养方案)
            const UNDERGRAD_COURSES = [
                // 基础理论
                { id: 'u1', name: '微积分A(1)', teacher: '数学系', credit: '5', time: '周一 08:00-10:00', location: '六教', category: '本科·基础理论', day: 1 },

            // ===== 周视图 (含暑假寒假) =====
            function getWeekDates(offset) {
                const now = new Date();
                const day = now.getDay() || 7;
                const diff = (day - 1) * 24 * 60 * 60 * 1000;
                const monday = new Date(now.getTime() - diff + offset * 7 * 24 * 60 * 60 * 1000);
                const dates = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday);
                    d.setDate(d.getDate() + i);
                    dates.push(d);
                }
                return dates;
            }

            function isSummerHoliday(date) {
                const m = date.getMonth(), d = date.getDate();
                // 暑假 7月-8月 (8周)
                if (m === 6 || m === 7) return true;
                // 寒假 2月 (6周)
                if (m === 1) return true;
                return false;
            }

            function renderWeekGrid() {
                const dates = getWeekDates(weekOffset);
                const today = new Date();
                const weekNum = getWeekNumber(today) + weekOffset;
                weekLabel.textContent = `第${weekNum}周`;

                let html = '';
                const dayNames = ['一', '二', '三', '四', '五', '六', '日'];
                dates.forEach((d, idx) => {
                    const isToday = d.toDateString() === today.toDateString();
                    const isHoliday = isSummerHoliday(d);
                    const dayCourses = courses.filter(c => c.day === (idx + 1));
                    const tags = dayCourses.slice(0, 2).map(c => `<div class="course-tag">${c.name}</div>`).join('');
                    const more = dayCourses.length > 2 ? `<div class="course-tag" style="background:rgba(90,60,150,0.1);">+${dayCourses.length-2}</div>` : '';
                    const holidayLabel = isHoliday ? (d.getMonth() === 6 || d.getMonth() === 7 ? '🌞暑假' : '❄️寒假') : '';
                    html += `
                        <div class="week-day ${isToday ? 'today' : ''} ${isHoliday ? 'holiday' : ''}">
                            <div class="day-label">${dayNames[idx]}</div>
                            <div class="day-num">${d.getDate()}</div>
                            ${holidayLabel ? `<div class="holiday-label">${holidayLabel}</div>` : ''}
                            ${!isHoliday ? tags + more : ''}
                        </div>
                    `;
                });
                weekGrid.innerHTML = html;
            }

            function getWeekNumber(d) {
                const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const yearStart = new Date(date.getFullYear(), 0, 1);
                const days = Math.floor((date - yearStart) / (24 * 60 * 60 * 1000));
                return Math.ceil((days + yearStart.getDay() + 1) / 7);
            }

            // ===== 添加课程 (下拉选择) =====
            function addCourse() {
                // 构建分类选项
                const cats = {};

                    if (!cats[c.category]) cats[c.category] = [];
                    cats[c.category].push(c);
                });
                let msg = '选择课程分类:\n';
                const keys = Object.keys(cats);
                keys.forEach((k, i) => { msg += `${i+1}. ${k}\n`; });
                const catChoice = prompt(msg + '输入编号:');
                if (!catChoice) return;
                const idx = parseInt(catChoice) - 1;
                if (isNaN(idx) || idx < 0 || idx >= keys.length) { showToast('❌ 无效选择'); return; }
                const cat = keys[idx];
                const courseList = cats[cat];
                let subMsg = '选择课程:\n';
                courseList.forEach((c, i) => { subMsg += `${i+1}. ${c.name} (${c.credit}学分)\n`; });
                const subChoice = prompt(subMsg + '输入编号:');
                if (!subChoice) return;
                const subIdx = parseInt(subChoice) - 1;
                if (isNaN(subIdx) || subIdx < 0 || subIdx >= courseList.length) { showToast('❌ 无效选择'); return; }
                const selected = courseList[subIdx];
                // 检查是否已存在
                if (courses.find(c => c.id === selected.id)) {
                    showToast('⚠️ 该课程已添加');
                    return;

                renderCourseList(searchInput.value.trim());
                loadCourseById(currentCourseId);
                saveData();
                showToast(`✅ 已添加 ${newCourse.name}`);
            }

                if (!apiKey) { apiKey = DEFAULT_API_KEY; if (!apiKey || apiKey.includes('填入')) { aiResult.textContent = '⚠️ 请填写有效的 DeepSeek API Key'; return; } }
                localStorage.setItem('deepseek_api_key', apiKey);
                aiResult.innerHTML = '<div style="display:flex;align-items:center;gap:8px;"><span class="loading-spinner"></span> 助教思考中……</div>';
                aiAskBtn.disabled = true;
                try {
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: [
                                { role: 'system', content: '你是清华计算机系助教，回答计算机专业相关问题，简洁清晰。' },
                                { role: 'user', content: question }
                            ],
                            max_tokens: 800,
                            temperature: 0.3
                        })
                    });
                    if (!response.ok) { const errData = await response.json().catch(()=>({})); throw new Error(errData.error?.message || `请求失败 (${response.status})`); }
                    const data = await response.json();
                    const result = data.choices?.[0]?.message?.content || '⚠️ 无回复';
                    aiResult.textContent = result;
                } catch (err) {
                    aiResult.textContent = '❌ 错误: ' + err.message;
                } finally {
                    aiAskBtn.disabled = false;
                }
            });

            // ===== 笔记自动保存 =====
            courseNote.addEventListener('input', function() {
                const course = courses.find(c => c.id === currentCourseId);
                if (course) { course.note = this.value; saveData(); }
            });

            // ===== 事件 =====
            weekPrev.addEventListener('click', () => { weekOffset--; renderWeekGrid(); saveData(); });
            weekNext.addEventListener('click', () => { weekOffset++; renderWeekGrid(); saveData(); });
            addBtn.addEventListener('click', addCourse);
            resetBtn.addEventListener('click', resetCourses);

            searchInput.addEventListener('input', function(e) {
                const keyword = e.target.value.trim();
                renderCourseList(keyword);
                const visible = courseListEl.querySelectorAll('.course-item');
                if (visible.length > 0) {
                    const firstId = visible[0].dataset.id;
                    if (firstId && !courses.find(c => c.id === currentCourseId && (c.name.includes(keyword) || c.teacher.includes(keyword)))) {
                        loadCourseById(firstId);
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveData(); showToast('💾 已保存'); }
            });

            // ===== 初始化 =====
            const loaded = loadData();
            if (!loaded) {
                courses = allCourses.slice(0, 30);
                currentCourseId = courses[0]?.id || 'u16';
                nextId = 1000;
                weekOffset = 0;
                saveData();
            }
            renderCourseList('');
            loadCourseById(currentCourseId);
            renderWeekGrid();

            const lastWp = localStorage.getItem('lastWallpaper');
            if (lastWp && lastWp !== 'default') setWallpaper(lastWp);
            else setWallpaper('default');

            showToast('📚 贵系课程表已加载');
        })();
    </script>
</body>
</html>
