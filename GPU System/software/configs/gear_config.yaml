# GEAR — GPU Energy-Aware Runtime 配置文件

system:
  name: "GEAR"
  log_level: "INFO"
  sampling_interval_ms: 200

gpu:
  index: 0
  vendor: "nvidia"  # nvidia | amd
  power_limits_w:
    min: 30
    max: 300        # 按实际 GPU 调整
  clock_limits_mhz:
    min: 300
    max: 2100

modes:
  max_performance:
    power_limit_pct: 100
    clock_target: "max"

  balanced:
    power_limit_pct: 75
    clock_target: "auto"

  power_save:
    power_limit_pct: 50
    clock_target: "min"

  energy_optimal:
    power_limit_pct: "auto"     # 由 ML 模型/启发式决定
    clock_target: "ml"

  thermal_aware:
    power_limit_pct: "auto"
    clock_target: "auto"
    temp_assert_c: 83           # 进入降频
    temp_critical_c: 90         # 强制保护

thermal:
  baseline_recover_c: 40        # 高于此温度才计为可回收废热
  heat_recovery_efficiency: 0.85
  coolant_flow_range_lpm: [0.5, 5.0]

ml_model:
  enabled: true
  model_path: "models/rf_power_model.joblib"
  features: ["utilization", "occupancy", "power", "temperature"]
