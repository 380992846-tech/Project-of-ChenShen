name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --quiet pytest
      - name: Unit tests
        run: pytest -q
      - name: Compile check
        run: python -m py_compile software/core/*.py software/main.py scripts/*.py
