<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清云笔记 · 清华黑紫 · 全能版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background-color: #0b0710;
            color: #e6e0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            width: 1440px;
            max-width: 100%;
            height: 920px;
            max-height: 98vh;
            background: rgba(22, 16, 35, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 40px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(160, 120, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-image 0.5s ease;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .app-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 6, 20, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 0;
        }
        .app-container>* {
            position: relative;
            z-index: 1;
        }
        /* ===== 顶部导航 ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 1px solid rgba(180, 140, 255, 0.15);
            background: rgba(12, 8, 22, 0.25);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 6px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            background: linear-gradient(145deg, #b28aff, #7a4bff);
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #f0ecff;
            box-shadow: 0 6px 14px rgba(90, 40, 200, 0.6);
        }
        .logo-text {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
            background: linear-gradient(to right, #d9caff, #b28aff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-text small {
            font-weight: 400;
            font-size: 11px;
            color: #9480c0;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            margin-left: 4px;
        }
        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .wallpaper-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(30, 20, 55, 0.4);
            padding: 3px 10px 3px 12px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.15);
            flex-wrap: wrap;
            max-width: 500px;
        }
        .wallpaper-selector span {
            font-size: 11px;
            color: #b3a1d4;
        }
        .wallpaper-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(200, 180, 255, 0.3);
            cursor: pointer;
            transition: 0.2s;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .wallpaper-dot:hover {
            transform: scale(1.12);
            border-color: #b28aff;
        }
        .wallpaper-dot.active {
            border-color: #b28aff;
            box-shadow: 0 0 12px rgba(130, 70, 255, 0.4);
        }
        .upload-btn {
            background: rgba(130, 70, 255, 0.2);
            border: 1px solid rgba(160, 120, 255, 0.3);
            border-radius: 30px;
            padding: 1px 8px;
            font-size: 10px;
            color: #cbb8f0;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .upload-btn:hover {
            background: rgba(130, 70, 255, 0.35);
            border-color: #b28aff;
        }
        #wallpaperUpload { display: none; }
        .nav-clock-weather {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 20, 55, 0.3);
            padding: 3px 12px 3px 10px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.08);
        }
        .nav-clock {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .nav-clock .time {
            font-size: 15px;
            font-weight: 600;
            color: #f0eaff;
        }
        .nav-clock .date {
            font-size: 10px;
            color: #b3a1d4;
        }
        .nav-weather {
            display: flex;
            align-items: baseline;
            gap: 4px;
            padding-left: 8px;
            border-left: 1px solid rgba(160, 120, 255, 0.15);
        }
        .nav-weather .temp {
            font-size: 15px;
            font-weight: 500;
            color: #f0eaff;
        }
        .nav-weather .desc {
            font-size: 10px;
            color: #b3a1d4;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-actions i {
            font-size: 15px;
            color: #b8a8e0;
            transition: 0.2s;
            cursor: pointer;
        }
        .nav-actions i:hover {
            color: #d4c0ff;
            transform: scale(1.05);
        }
        .avatar {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #6d44d0, #371b7a);
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            color: #e8dcff;
            border: 1px solid #a47eff;
        }
        /* ===== 主体 ===== */
        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .note-sidebar {
            width: 260px;
            background: rgba(16, 10, 30, 0.3);
            backdrop-filter: blur(4px);
            border-right: 1px solid rgba(160, 120, 255, 0.1);
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 2px;
        }
        .sidebar-header h3 {
            font-weight: 500;
            font-size: 13px;
            color: #cbb8f0;
        }
        .sidebar-header i {
            color: #a07aff;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .sidebar-header i:hover {
            color: #c9b0ff;
        }
        .search-box {
            background: rgba(40, 28, 70, 0.4);
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            border: 1px solid rgba(150, 110, 255, 0.1);
            transition: 0.2s;
        }
        .search-box i {
            color: #8b75b5;
            font-size: 11px;
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #e6def5;
            font-size: 12px;
            width: 100%;
        }
        .search-box input::placeholder {
            color: #6f5b96;
        }
        .search-box:focus-within {
            border-color: #9f7aff;
            box-shadow: 0 0 12px rgba(130, 70, 255, 0.1);
        }
        .note-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 2px;
        }
        .note-list::-webkit-scrollbar {
            width: 3px;
        }
        .note-list::-webkit-scrollbar-thumb {
            background: #4e3a78;
            border-radius: 10px;
        }
        .note-item {
            background: rgba(33, 22, 58, 0.3);
            border-radius: 12px;
            padding: 10px 12px;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
            position: relative;
        }
        .note-item:hover {
            background: rgba(55, 38, 90, 0.45);
            border-color: #6a47b0;
            transform: translateX(3px);
        }
        .note-item.active {
            background: rgba(88, 55, 170, 0.25);
            border-color: #9b77f0;
        }
        .note-title {
            font-weight: 600;
            font-size: 13px;
            color: #ede6ff;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }
        .note-title i {
            color: #8d71c7;
            font-size: 10px;
        }
        .note-preview {
            font-size: 11px;
            color: #b3a1d4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        .note-meta {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #6c5890;
        }
        .note-meta i {
            margin-right: 2px;
            font-size: 9px;
        }
        .pin-icon {
            color: #f7c948;
            margin-right: 6px;
            font-size: 10px;
        }
        .todo-badge {
            background: rgba(247, 201, 72, 0.15);
            color: #f7c948;
            font-size: 9px;
            padding: 0 8px;
            border-radius: 12px;
            margin-left: 6px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px 20px 14px 20px;
            overflow-y: auto;
            gap: 10px;
        }
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 6, 20, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 14px 18px 12px 18px;
            border: 1px solid rgba(160, 120, 255, 0.08);
            min-height: 200px;
        }
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .editor-actions {
            display: flex;
            gap: 10px;
            color: #9a83c7;
            align-items: center;
            flex-wrap: wrap;
        }
        .editor-actions i,
        .editor-actions button {
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            background: none;
            border: none;
            color: #9a83c7;
        }
        .editor-actions i:hover,
        .editor-actions button:hover {
            color: #cbb4ff;
        }
        .word-count {
            font-size: 11px;
            color: #7f6aac;
            margin-right: 6px;
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(160, 120, 255, 0.15);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 12px;
            color: #cbb8f0;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #b28aff;
            box-shadow: 0 4px 20px rgba(130, 70, 255, 0.2);
            transform: translateY(-1px);
        }
        .glass-btn i {
            font-size: 12px;
        }
        .editor-title-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(160, 120, 255, 0.12);
            padding: 4px 4px 6px 0;
            font-size: 20px;
            font-weight: 500;
            color: #f0eaff;
            outline: none;
            transition: 0.2s;
            margin-bottom: 6px;
        }
        .editor-title-input:focus {
            border-bottom-color: #a981ff;
        }
        .editor-textarea {
            flex: 1;
            background: rgba(20, 12, 38, 0.12);
            border: 1px solid rgba(130, 90, 210, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            color: #ddd2f0;
            font-size: 14px;
            line-height: 1.7;
            resize: none;
            outline: none;
            transition: 0.2s;
            min-height: 150px;
        }
        .editor-textarea:focus {
            border-color: #9e7aff;
            box-shadow: 0 0 16px rgba(110, 60, 220, 0.06);
        }
        .editor-footer {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            color: #7f6aac;
            font-size: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .editor-footer a {
            color: #7f6aac;
            text-decoration: none;
            transition: 0.2s;
            font-size: 10px;
        }
        .editor-footer a:hover {
            color: #b28aff;
            text-decoration: underline;
        }
        .fixed-actions {
            position: fixed;
            bottom: 28px;
            right: 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .fixed-actions .glass-btn {
            background: rgba(30, 18, 50, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(160, 120, 255, 0.12);
            padding: 8px 16px;
            font-size: 13px;
            color: #c8b0e0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            justify-content: center;
            min-width: 110px;
            border-color: rgba(120, 80, 160, 0.25);
        }
        .fixed-actions .glass-btn:hover {
            background: rgba(50, 30, 80, 0.8);
            border-color: #9a7acc;
            color: #f0eaff;
        }
        .fixed-actions .glass-btn i {
            font-size: 14px;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 20, 60, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 26px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.2);
            color: #e6def5;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            opacity: 1;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(22, 16, 40, 0.95);
            border-radius: 28px;
            padding: 30px 36px;
            max-width: 560px;
            width: 90%;
            border: 1px solid rgba(160, 120, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            color: #f0eaff;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .modal-box p {
            color: #b3a1d4;
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .modal-box textarea {
            width: 100%;
            background: rgba(10, 6, 20, 0.4);
            border: 1px solid rgba(160, 120, 255, 0.1);
            border-radius: 16px;
            padding: 14px;
            color: #ddd2f0;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            min-height: 120px;
            outline: none;
        }
        .modal-box textarea:focus {
            border-color: #9e7aff;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal-actions button {
            background: rgba(130, 70, 255, 0.2);
            border: 1px solid rgba(160, 120, 255, 0.15);
            border-radius: 40px;
            padding: 8px 22px;
            color: #cbb8f0;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-actions button:hover {
            background: rgba(130, 70, 255, 0.4);
        }
        .modal-actions button.primary {
            background: rgba(130, 70, 255, 0.4);
            border-color: #7a4bff;
        }
        .modal-actions button.primary:hover {
            background: rgba(130, 70, 255, 0.6);
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(160, 120, 255, 0.2);
            border-top: 2px solid #b28aff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .tomato-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 20, 55, 0.3);
            padding: 2px 12px 2px 8px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.08);
        }
        .tomato-bar span {
            font-size: 14px;
            font-weight: 500;
            color: #f0eaff;
            min-width: 44px;
        }
        .tomato-bar i {
            color: #b28aff;
            cursor: pointer;
            transition: 0.2s;
        }
        .tomato-bar i:hover {
            color: #d4c0ff;
            transform: scale(1.1);
        }
        .image-preview {
            max-width: 100%;
            max-height: 180px;
            margin: 6px 0;
            border-radius: 12px;
            border: 1px solid rgba(160, 120, 255, 0.15);
        }
        .todo-sidebar-section {
            margin-top: 10px;
            border-top: 1px solid rgba(160, 120, 255, 0.08);
            padding-top: 8px;
        }
        .todo-sidebar-section h4 {
            font-size: 11px;
            color: #b3a1d4;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .todo-item-sidebar {
            font-size: 11px;
            color: #cbb8f0;
            padding: 2px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .todo-item-sidebar:hover {
            color: #f0eaff;
        }
        .todo-item-sidebar .done {
            text-decoration: line-through;
            color: #6c5890;
        }
        .todo-item-sidebar i {
            font-size: 10px;
            color: #7f6aac;
        }
        .highlight-search {
            background: rgba(247, 201, 72, 0.25);
            color: #f7c948;
            padding: 0 2px;
            border-radius: 2px;
        }
        @media (max-width: 820px) {
            .navbar { flex-direction: column; align-items: stretch; gap: 4px; padding: 8px 12px; }
            .nav-center { justify-content: center; }
            .nav-actions { justify-content: center; }
            .main-layout { flex-direction: column; }
            .note-sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid rgba(160, 120, 255, 0.1); }
            .right-panel { padding: 10px 12px; }
            .app-container { height: 98vh; border-radius: 24px; }
            .editor-toolbar { flex-direction: column; align-items: stretch; gap: 4px; }
            .fixed-actions { bottom: 16px; right: 16px; gap: 8px; }
            .fixed-actions .glass-btn { padding: 6px 12px; font-size: 12px; min-width: 80px; }
            .wallpaper-selector { max-width: 100%; }
        }
        @media (max-width: 480px) {
            .wallpaper-selector { flex-wrap: wrap; gap: 3px; padding: 3px 6px; }
            .wallpaper-dot { width: 14px; height: 14px; }
            .nav-clock-weather { flex-wrap: wrap; gap: 4px; padding: 3px 8px; }
            .nav-clock .date { display: none; }
            .nav-weather .desc { display: none; }
            .modal-box { padding: 20px; }
            .fixed-actions { bottom: 12px; right: 12px; gap: 6px; }
            .fixed-actions .glass-btn { padding: 4px 10px; font-size: 11px; min-width: 60px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <header class="navbar">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-feather-alt"></i></div>
                <div class="logo-text">清云笔记 <small>· 清华黑紫</small></div>
            </div>
            <div class="nav-center">
                <div class="wallpaper-selector" id="wallpaperSelector">
                    <span><i class="fas fa-image"></i></span>
                    <div class="wallpaper-dot active" data-wallpaper="default" style="background: linear-gradient(135deg, #1a1030, #2a1a4a);" title="默认黑紫"></div>
                    <div class="wallpaper-dot" data-wallpaper="maldives" style="background-image: url('https://picsum.photos/seed/maldives/200/200');" title="马尔代夫"></div>
                    <div class="wallpaper-dot" data-wallpaper="california" style="background-image: url('https://picsum.photos/seed/california/200/200');" title="加州阳光"></div>
                    <div class="wallpaper-dot" data-wallpaper="beijing" style="background-image: url('https://picsum.photos/seed/beijing/200/200');" title="北京故宫"></div>
                    <div class="wallpaper-dot" data-wallpaper="shanghai" style="background-image: url('https://picsum.photos/seed/shanghai/200/200');" title="上海陆家嘴"></div>
                    <div class="wallpaper-dot" data-wallpaper="london" style="background-image: url('https://picsum.photos/seed/london/200/200');" title="伦敦金丝雀码头"></div>
                    <div class="wallpaper-dot" data-wallpaper="chengdu" style="background-image: url('https://picsum.photos/seed/chengdu/200/200');" title="成都宽窄巷子"></div>

    <script>
        (function() {
            // ===== 数据 =====
            let notes = [
                { id: '1', title: '清华紫 · 设计系统', body: '黑紫风格核心调色板：\n• 主色: #7a4bff\n• 辅色: #b28aff, #4d2e8a\n• 背景: #0b0710, #160f23\n• 字体: #e6e0f0, #cbb8f0\n\n玻璃质感 backdrop-filter: blur(12px)\n\n[ ] 完成设计系统文档\n[x] 确定主色', updated: '2026-07-05 15:09:37',

                { id: '2', title: '生活&学习', body: '周日（7月5日）去青达里买电脑买了...\n\n[ ] 买电脑\n[ ] 安装开发环境', updated: '2026-07-05 15:09:37',

                    category: '工作', pinned: false },
                { id: '5', title: '26.6.30 零容忍清单和报告', body: '写零容忍清单和报告（安环） 给安...\n\n[x] 完成报告初稿\n[ ] 提交审批', updated: '2026-07-05 15:09:46',
                    category: '工作', pinned: false }
            ];

            let currentNoteId = '1';
            let nextId = 6;
            let currentWallpaper = localStorage.getItem('lastWallpaper') || 'default';
            let imageDataMap = {};
            let currentAIMode = 'summarize'; // summarize | translate | polish

            const appContainer = document.getElementById('appContainer');
            const noteListEl = document.getElementById('noteListContainer');
            const editorTitleInput = document.getElementById('editorTitleInput');
            const editorBody = document.getElementById('editorBody');
            const updateTimeEl = document.getElementById('updateTime');
            const searchInput = document.getElementById('searchInput');
            const addBtn = document.getElementById('addNoteBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const starBtn = document.getElementById('starBtn');
            const pinBtn = document.getElementById('pinBtn');
            const wordCountEl = document.getElementById('wordCount');
            const wallpaperUpload = document.getElementById('wallpaperUpload');
            const fileUpload = document.getElementById('fileUpload');
            const imageUpload = document.getElementById('imageUpload');
            const imagePreviewContainer = document.getElementById('imagePreviewContainer');
            const todoListSidebar = document.getElementById('todoListSidebar');

            const toastEl = document.getElementById('toast');
            let toastTimer = null;
            const aiModal = document.getElementById('aiModal');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const aiResult = document.getElementById('aiResult');
            const aiGenerateBtn = document.getElementById('aiGenerateBtn');
            const aiModalClose = document.getElementById('aiModalClose');
            const aiModalTitle = document.getElementById('aiModalTitle');
            const aiModalDesc = document.getElementById('aiModalDesc');

            const tomatoDisplay = document.getElementById('tomatoDisplay');
            const tomatoToggle = document.getElementById('tomatoToggle');
            const tomatoReset = document.getElementById('tomatoReset');
            let tomatoSeconds = 25 * 60;
            let tomatoInterval = null;
            let tomatoRunning = false;

            function updateTomatoDisplay() {
                const m = Math.floor(tomatoSeconds / 60);
                const s = tomatoSeconds % 60;
                tomatoDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            tomatoToggle.addEventListener('click', function() {
                if (tomatoRunning) {
                    clearInterval(tomatoInterval);
                    tomatoRunning = false;
                    tomatoToggle.className = 'fas fa-play';
                } else {
                    if (tomatoSeconds <= 0) tomatoSeconds = 25 * 60;
                    tomatoRunning = true;
                    tomatoToggle.className = 'fas fa-pause';
                    tomatoInterval = setInterval(() => {
                        tomatoSeconds--;
                        updateTomatoDisplay();
                        if (tomatoSeconds <= 0) {
                            clearInterval(tomatoInterval);
                            tomatoRunning = false;
                            tomatoToggle.className = 'fas fa-play';
                            showToast('⏰ 番茄钟结束！');
                        }
                    }, 1000);
                }
            });
            tomatoReset.addEventListener('click', function() {
                clearInterval(tomatoInterval);
                tomatoRunning = false;
                tomatoToggle.className = 'fas fa-play';
                tomatoSeconds = 25 * 60;
                updateTomatoDisplay();
            });
            updateTomatoDisplay();

            const navClockTime = document.getElementById('navClockTime');
            const navClockDate = document.getElementById('navClockDate');
            const navWeatherTemp = document.getElementById('navWeatherTemp');
            const navWeatherDesc = document.getElementById('navWeatherDesc');

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
            }

            function updateClock() {
                const now = new Date();
                navClockTime.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                navClockDate.textContent = now.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
            }
            setInterval(updateClock, 1000);
            updateClock();

            const weathers = ['晴', '多云', '小雨', '阴', '晴', '多云'];
            let weatherIdx = 0;
            function updateWeather() {
                const w = weathers[weatherIdx % weathers.length];
                weatherIdx++;
                navWeatherDesc.textContent = w;
                const temp = Math.floor(Math.random() * 12) + 20;
                navWeatherTemp.textContent = temp + '°C';
            }
            updateWeather();
            setInterval(updateWeather, 35000);

            // ===== 壁纸 =====
            const wallpapers = [
                { id: 'default', name: '默认黑紫' },
                { id: 'maldives', name: '马尔代夫', url: 'https://picsum.photos/seed/maldives/1200/800' },
                { id: 'california', name: '加州阳光', url: 'https://picsum.photos/seed/california/1200/800' },
                { id: 'beijing', name: '北京故宫', url: 'https://picsum.photos/seed/beijing/1200/800' },
                { id: 'shanghai', name: '上海陆家嘴', url: 'https://picsum.photos/seed/shanghai/1200/800' },
                { id: 'london', name: '伦敦金丝雀码头', url: 'https://picsum.photos/seed/london/1200/800' },
                { id: 'chengdu', name: '成都宽窄巷子', url: 'https://picsum.photos/seed/chengdu/1200/800' },
                { id: 'tsinghua', name: '清华二校门', url: 'https://picsum.photos/seed/tsinghua/1200/800' },
                { id: 'ocean', name: '海底世界', url: 'https://picsum.photos/seed/ocean/1200/800' },
                { id: 'aurora', name: '极光', url: 'https://picsum.photos/seed/aurora/1200/800' },
                { id: 'forest', name: '森林秘境', url: 'https://picsum.photos/seed/forest2/1200/800' },
                { id: 'milkyway', name: '银河', url: 'https://picsum.photos/seed/milkyway/1200/800' },
                { id: 'sakura', name: '樱花', url: 'https://picsum.photos/seed/sakura/1200/800' },
                { id: 'nightcity', name: '城市夜景', url: 'https://picsum.photos/seed/nightcity/1200/800' },
                { id: 'snow', name: '雪景', url: 'https://picsum.photos/seed/snow/1200/800' },
                { id: 'sunset', name: '紫色流星', url: 'https://picsum.photos/seed/purplemeteor/1200/800' },
                { id: 'neon', name: '地球', url: 'https://picsum.photos/seed/earth/1200/800' },
                { id: 'rose', name: '玫瑰花', url: 'https://picsum.photos/seed/rose/1200/800' }
            ];

            function setWallpaper(id, customUrl = null) {
                currentWallpaper = id;
                localStorage.setItem('lastWallpaper', id);
                if (id === 'default') {
                    appContainer.style.backgroundImage = '';
                    appContainer.style.backgroundColor = 'rgba(22, 16, 35, 0.45)';
                } else if (customUrl) {
                    appContainer.style.backgroundImage = `url('${customUrl}')`;
                    appContainer.style.backgroundColor = 'transparent';
                } else {
                    const wp = wallpapers.find(w => w.id === id);
                    if (wp && wp.url) {
                        appContainer.style.backgroundImage = `url('${wp.url}')`;
                        appContainer.style.backgroundColor = 'transparent';
                    }
                }
                document.querySelectorAll('.wallpaper-dot').forEach(d => d.classList.toggle('active', d.dataset.wallpaper === id));
            }

            document.querySelectorAll('.wallpaper-dot').forEach(d => {
                d.addEventListener('click', function() { setWallpaper(this.dataset.wallpaper); });
            });

            wallpaperUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const url = ev.target.result;
                    appContainer.style.backgroundImage = `url('${url}')`;
                    appContainer.style.backgroundColor = 'transparent';
                    const customId = 'custom_' + Date.now();
                    localStorage.setItem('lastWallpaper', customId);
                    currentWallpaper = customId;
                    document.querySelectorAll('.wallpaper-dot').forEach(d => d.classList.remove('active'));
                    showToast('✅ 自定义壁纸已应用');
                };
                reader.readAsDataURL(file);
                this.value = '';
            });

            // ===== 字数 =====
            function updateWordCount() {
                const text = editorBody.value || '';
                const count = text.replace(/\s/g, '').length;
                wordCountEl.textContent = count + ' 字';
                return count;
            }
            editorBody.addEventListener('input', updateWordCount);

            // ===== 存储 =====
            function saveAllData() {
                const data = { notes, currentNoteId, nextId, imageDataMap };
                localStorage.setItem('qingyun_notes_data', JSON.stringify(data));
                const current = notes.find(n => n.id === currentNoteId);
                if (current) {
                    localStorage.setItem('qingyun_current_note', JSON.stringify({ id: currentNoteId, title: current.title,
                        body: current.body }));
                }
                showToast('✅ 数据已保存到本地');
            }

            function loadAllData() {
                const raw = localStorage.getItem('qingyun_notes_data');
                if (raw) {
                    try {
                        const data = JSON.parse(raw);
                        notes = data.notes || notes;
                        currentNoteId = data.currentNoteId || notes[0]?.id || '1';
                        nextId = data.nextId || 6;
                        if (data.imageDataMap) imageDataMap = data.imageDataMap;
                        const currentRaw = localStorage.getItem('qingyun_current_note');
                        if (currentRaw) {
                            const cur = JSON.parse(currentRaw);
                            const note = notes.find(n => n.id === cur.id);
                            if (note) {
                                note.title = cur.title;
                                note.body = cur.body;
                            }
                        }
                        return true;
                    } catch (e) { return false; }
                }
                return false;
            }

            // ===== 导出扩展 =====
            function downloadFile(content, filename, mimeType) {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

            document.getElementById('exportMdBtn').addEventListener('click', function() {
                const note = notes.find(n => n.id === currentNoteId);
                if (!note) { showToast('⚠️ 没有笔记'); return; }
                const content = `# ${note.title}\n\n${note.body}\n\n---\n导出时间: ${new Date().toLocaleString('zh-CN')}`;
                downloadFile(content, `${note.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g,'_')}.md`, 'text/markdown;charset=utf-8');
                showToast('📄 Markdown 导出成功');
            });

            document.getElementById('exportWordBtn').addEventListener('click', function() {
                const note = notes.find(n => n.id === currentNoteId);
                if (!note) { showToast('⚠️ 没有笔记'); return; }
                const html = `<html><head><meta charset="UTF-8"><title>${note.title}</title></head><body><h1>${note.title}</h1><pre style="white-space:pre-wrap;font-family:inherit;">${note.body}</pre><p style="color:#888;">导出时间: ${new Date().toLocaleString('zh-CN')}</p></body></html>`;
                downloadFile(html, `${note.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g,'_')}.doc`, 'application/msword;charset=utf-8');
                showToast('📄 Word 导出成功');
            });

            document.getElementById('exportDataBtn').addEventListener('click', function() {
                const data = { notes, currentNoteId, nextId, wallpaper: currentWallpaper, version: '1.0', imageDataMap };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `清云笔记备份_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📦 导出成功');
            });

            document.getElementById('importDataBtn').addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (data.notes && Array.isArray(data.notes)) {
                                notes = data.notes;
                                currentNoteId = data.currentNoteId || notes[0]?.id || '1';
                                nextId = data.nextId || 6;
                                if (data.imageDataMap) imageDataMap = data.imageDataMap;
                                if (data.wallpaper) setWallpaper(data.wallpaper);
                                renderNoteList(searchInput.value.trim());
                                loadNoteById(currentNoteId);
                                saveAllData();
                                showToast('✅ 导入成功！已恢复 ' + notes.length + ' 条笔记');
                            } else {
                                showToast('❌ 无效的备份文件');
                            }
                        } catch (err) {
                            showToast('❌ 解析失败: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            });

            document.getElementById('exportPdfBtn').addEventListener('click', function() {
                const title = editorTitleInput.value.trim() || '无标题';
                const body = editorBody.value || '';
                const win = window.open('', '_blank', 'width=800,height=600');
                if (!win) { showToast('❌ 请允许弹出窗口'); return; }
                win.document.write(`
                    <html><head><title>${title}</title>
                    <style>
                        body { font-family: 'Inter', sans-serif; padding: 40px; max-width: 700px; margin: 0 auto; background: #0b0710; color: #e6e0f0; }
                        h1 { color: #b28aff; border-bottom: 2px solid #7a4bff; padding-bottom: 12px; }
                        pre { white-space: pre-wrap; font-family: inherit; line-height: 1.8; font-size: 15px; }
                        .meta { color: #7f6aac; font-size: 12px; margin-top: 30px; border-top: 1px solid #2a1a4a; padding-top: 12px; }
                        img { max-width: 100%; margin: 8px 0; border-radius: 8px; }
                    </style>
                    </head><body>
                    <h1>${title}</h1>
                    <pre>${body}</pre>
                    <div class="meta">导出时间: ${new Date().toLocaleString('zh-CN')} · 清云笔记</div>
                    <script>
                        setTimeout(() => { window.print(); }, 300);
                    <\/script>
                    </body></html>
                `);
                win.document.close();
                showToast('📄 PDF 导出窗口已打开');
            });

            document.getElementById('saveLogBtn').addEventListener('click', saveAllData);

            // ===== AI 通用调用 =====
            const DEFAULT_API_KEY = 'sk-此处填入你的DeepSeekKey';

            function openAIModal(mode) {
                currentAIMode = mode;
                const savedKey = localStorage.getItem('deepseek_api_key');
                if (savedKey) apiKeyInput.value = savedKey;
                const body = editorBody.value.trim();
                if (!body && mode !== 'translate') { showToast('⚠️ 当前笔记为空'); return; }

                if (mode === 'summarize') {
                    aiModalTitle.innerHTML = '<i class="fas fa-robot" style="color:#b28aff;"></i> AI 整理要点';
                    aiModalDesc.textContent = 'AI 将提炼当前笔记的核心要点';
                    aiGenerateBtn.textContent = '生成要点';
                } else if (mode === 'translate') {
                    aiModalTitle.innerHTML = '<i class="fas fa-language" style="color:#b28aff;"></i> AI 翻译';
                    aiModalDesc.textContent = '将当前笔记翻译成英文（或中文）';
                    aiGenerateBtn.textContent = '翻译';
                } else if (mode === 'polish') {
                    aiModalTitle.innerHTML = '<i class="fas fa-pen-fancy" style="color:#b28aff;"></i> AI 润色';
                    aiModalDesc.textContent = '优化措辞、语气和表达';
                    aiGenerateBtn.textContent = '润色';
                }
                aiResult.textContent = '⏳ 准备生成……';
                aiModal.classList.add('active');
            }

            document.getElementById('aiSummarizeBtn').addEventListener('click', function() {
                if (!editorBody.value.trim()) { showToast('⚠️ 笔记为空'); return; }
                openAIModal('summarize');
            });
            document.getElementById('aiTranslateBtn').addEventListener('click', function() {
                if (!editorBody.value.trim()) { showToast('⚠️ 笔记为空'); return; }
                openAIModal('translate');
            });
            document.getElementById('aiPolishBtn').addEventListener('click', function() {
                if (!editorBody.value.trim()) { showToast('⚠️ 笔记为空'); return; }
                openAIModal('polish');
            });

            aiModalClose.addEventListener('click', function() { aiModal.classList.remove('active'); });
            aiModal.addEventListener('click', function(e) { if (e.target === this) aiModal.classList.remove('active'); });

            aiGenerateBtn.addEventListener('click', async function() {
                const body = editorBody.value.trim();
                if (!body && currentAIMode !== 'translate') { aiResult.textContent = '⚠️ 笔记内容为空'; return; }
                let apiKey = apiKeyInput.value.trim();
                if (!apiKey) {
                    apiKey = DEFAULT_API_KEY;
                    if (!apiKey || apiKey.includes('填入你的')) {
                        aiResult.textContent = '⚠️ 请填写有效的 DeepSeek API Key';
                        return;
                    }
                }
                localStorage.setItem('deepseek_api_key', apiKey);

                let systemPrompt = '';
                let userPrompt = body;
                if (currentAIMode === 'summarize') {
                    systemPrompt = '你是一个笔记整理助手。请用清晰、简洁的方式提炼以下笔记的核心要点，分条列出，不要有多余废话。';
                } else if (currentAIMode === 'translate') {
                    systemPrompt = '你是一个翻译助手。请将以下笔记内容翻译成英文（如果内容是中文）或中文（如果内容是英文），保持原意和风格。只输出翻译结果。';
                } else if (currentAIMode === 'polish') {
                    systemPrompt = '你是一个文字润色助手。请优化以下笔记的措辞、语气和表达，使其更流畅、专业、清晰，保持原意不变。只输出润色后的内容。';
                }

                aiResult.innerHTML = '<div style="display:flex;align-items:center;gap:8px;"><span class="loading-spinner"></span> AI 正在处理中……</div>';
                aiGenerateBtn.disabled = true;
                try {
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiKey
                        },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: userPrompt }
                            ],
                            max_tokens: 1200,
                            temperature: 0.3
                        })
                    });
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `API 请求失败 (${response.status})`);
                    }
                    const data = await response.json();
                    const result = data.choices?.[0]?.message?.content || '⚠️ 未能生成有效内容';
                    aiResult.textContent = result;
                    // 如果是润色或翻译，可以一键应用到正文
                    if (currentAIMode === 'polish' || currentAIMode === 'translate') {
                        // 显示应用按钮
                        const applyBtn = document.createElement('button');
                        applyBtn.className = 'glass-btn';
                        applyBtn.innerHTML = '<i class="fas fa-check"></i> 应用到正文';
                        applyBtn.style.marginTop = '8px';
                        applyBtn.onclick = function() {
                            editorBody.value = result;
                            saveCurrentNote();
                            updateWordCount();
                            showToast('✅ 已应用');
                            aiModal.classList.remove('active');
                        };
                        aiResult.appendChild(applyBtn);
                    }
                } catch (err) {
                    aiResult.textContent = '❌ 错误: ' + err.message;
                    if (err.message.includes('401') || err.message.includes('api key')) {
                        aiResult.textContent += '\n\n💡 请检查你的 API Key 是否正确';
                    }
                } finally {
                    aiGenerateBtn.disabled = false;
                }
            });

            // ===== 全文检索 =====
            document.getElementById('globalSearchBtn').addEventListener('click', function() {
                const keyword = prompt('🔍 输入搜索关键词（全文检索）');
                if (!keyword) return;
                const results = notes.filter(n => n.title.includes(keyword) || n.body.includes(keyword));
                if (results.length === 0) {
                    showToast('❌ 没有找到包含 "' + keyword + '" 的笔记');
                    return;
                }
                let msg = '找到 ' + results.length + ' 条笔记：';
                results.forEach(n => { msg += '\n📘 ' + n.title; });
                alert(msg);
                // 高亮显示第一个结果
                const first = results[0];
                if (first) {
                    loadNoteById(first.id);
                    // 在正文中高亮关键词（简单处理）
                    const body = editorBody.value;
                    const highlighted = body.replace(new RegExp(keyword, 'gi'), match => `<span class="highlight-search">${match}</span>`);
                    // 由于 textarea 不支持 HTML，用模态框展示
                    const preview = document.createElement('div');
                    preview.style.cssText =
                        'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(22,16,40,0.95);border-radius:28px;padding:30px;max-width:600px;width:90%;z-index:1001;border:1px solid rgba(160,120,255,0.15);max-height:80vh;overflow-y:auto;color:#e6e0f0;';
                    preview.innerHTML = `<h3 style="color:#b28aff;">🔍 搜索结果: ${keyword}</h3><hr style="border-color:rgba(160,120,255,0.1);margin:10px 0;"><div style="line-height:1.8;">${highlighted.replace(/\n/g, '<br>')}</div><br><button class="glass-btn" onclick="this.parentElement.remove()">关闭</button>`;
                    document.body.appendChild(preview);
                    preview.querySelector('button').onclick = function() { preview.remove(); };
                }
                showToast('🔍 找到 ' + results.length + ' 条结果');
            });

            // ===== 待办提取 =====
            function extractTodos(text) {
                const lines = text.split('\n');
                const todos = [];
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('[ ]')) {
                        todos.push({ text: trimmed.replace('[ ]', '').trim(), done: false });
                    } else if (trimmed.startsWith('[x]')) {
                        todos.push({ text: trimmed.replace('[x]', '').trim(), done: true });
                    }
                });
                return todos;
            }

            function renderTodoSidebar() {
                const allTodos = [];
                notes.forEach(n => {
                    const todos = extractTodos(n.body);
                    todos.forEach(t => {
                        allTodos.push({ ...t, noteId: n.id, noteTitle: n.title });
                    });
                });
                if (allTodos.length === 0) {
                    todoListSidebar.innerHTML = '<div style="color:#6c5890;font-size:10px;padding:4px 0;">暂无待办</div>';
                    return;
                }
                let html = '';
                allTodos.forEach(t => {
                    const cls = t.done ? 'done' : '';
                    const icon = t.done ? 'fa-check-circle' : 'fa-circle';
                    html += `<div class="todo-item-sidebar" data-noteid="${t.noteId}">
                        <i class="far ${icon}" style="color:${t.done ? '#6c5890' : '#f7c948'};"></i>
                        <span class="${cls}">${t.text}</span>
                        <span style="font-size:8px;color:#6c5890;margin-left:auto;">${t.noteTitle}</span>
                    </div>`;
                });
                todoListSidebar.innerHTML = html;
                todoListSidebar.querySelectorAll('.todo-item-sidebar').forEach(el => {
                    el.addEventListener('click', function() {
                        const noteId = this.dataset.noteid;
                        if (noteId) loadNoteById(noteId);
                    });
                });
            }

            // ===== 笔记渲染 =====
            function renderNoteList(filter = '') {
                let filtered = notes.filter(n => n.title.includes(filter) || n.body.includes(filter) || n.category.includes(filter));
                filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
                if (filtered.length === 0) {
                    noteListEl.innerHTML = `<div style="color:#6c5890;text-align:center;padding:14px 0;font-size:12px;">没有匹配的笔记</div>`;
                    return;
                }
                let html = '';
                filtered.forEach(n => {
                    const activeClass = (n.id === currentNoteId) ? 'active' : '';
                    const preview = n.body.replace(/\n/g, ' ').substring(0, 40) + (n.body.length > 40 ? '…' : '');
                    const pinIcon = n.pinned ? '<i class="fas fa-thumbtack pin-icon"></i>' : '';
                    const todoCount = extractTodos(n.body).length;
                    const todoBadge = todoCount > 0 ? `<span class="todo-badge">${todoCount}</span>` : '';
                    html += `
                        <div class="note-item ${activeClass}" data-id="${n.id}">
                            <div class="note-title"><span>${pinIcon}📘 ${n.title} ${todoBadge}</span><i class="fas fa-pen-fancy"></i></div>
                            <div class="note-preview">${preview}</div>
                            <div class="note-meta"><span><i class="far fa-calendar-alt"></i> ${n.updated}</span><span><i class="far fa-bookmark"></i> ${n.category}</span></div>
                        </div>
                    `;
                });
                noteListEl.innerHTML = html;
                noteListEl.querySelectorAll('.note-item').forEach(item => {
                    item.addEventListener('click', function() { loadNoteById(this.dataset.id); });
                });
                renderTodoSidebar();
            }

            function loadNoteById(id) {
                const note = notes.find(n => n.id === id);
                if (!note) return;
                currentNoteId = id;
                editorTitleInput.value = note.title;
                editorBody.value = note.body;
                updateTimeEl.innerHTML = `<i class="far fa-clock"></i> ${note.updated}`;
                updateWordCount();
                updateImagePreview(note.body);
                renderNoteList(searchInput.value.trim());
                const activeItem = noteListEl.querySelector(`.note-item.active`);
                if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                localStorage.setItem('qingyun_current_note', JSON.stringify({ id: note.id, title: note.title, body: note.body }));
                pinBtn.style.color = note.pinned ? '#f7c948' : '#9a83c7';
                renderTodoSidebar();
            }

            function updateImagePreview(body) {
                imagePreviewContainer.innerHTML = '';
                if (!body) return;
                const matches = body.match(/!\[([^\]]*)\]\(([^)]+)\)/g);
                if (matches) {
                    matches.forEach(match => {
                        const id = match.match(/\(([^)]+)\)/)[1];
                        if (imageDataMap[id]) {
                            const img = document.createElement('img');
                            img.src = imageDataMap[id];
                            img.className = 'image-preview';
                            imagePreviewContainer.appendChild(img);
                        }
                    });
                }
                // 附件标记
                const attachMatch = body.match(/📎\s*([^\n]+)/g);
                if (attachMatch) {
                    attachMatch.forEach(m => {
                        const name = m.replace('📎 ', '');
                        const span = document.createElement('span');
                        span.style.cssText = 'background:rgba(160,120,255,0.15);padding:2px 10px;border-radius:20px;font-size:11px;color:#cbb8f0;';
                        span.innerHTML = `<i class="fas fa-paperclip"></i> ${name}`;
                        imagePreviewContainer.appendChild(span);
                    });
                }
            }

            function saveCurrentNote() {
                const note = notes.find(n => n.id === currentNoteId);
                if (!note) return;
                const newTitle = editorTitleInput.value.trim() || '无标题';
                const newBody = editorBody.value;
                note.title = newTitle;
                note.body = newBody;
                const now = new Date();
                const timeStr = now.toLocaleString('zh-CN', { hour12: false });
                note.updated = timeStr;
                updateTimeEl.innerHTML = `<i class="far fa-clock"></i> ${timeStr}`;
                updateWordCount();
                updateImagePreview(newBody);
                renderNoteList(searchInput.value.trim());
                localStorage.setItem('qingyun_current_note', JSON.stringify({ id: note.id, title: note.title, body: note.body }));
                const data = { notes, currentNoteId, nextId, imageDataMap };
                localStorage.setItem('qingyun_notes_data', JSON.stringify(data));
                renderTodoSidebar();
            }

            function addNewNote() {
                const now = new Date();
                const timeStr = now.toLocaleString('zh-CN', { hour12: false });
                const newNote = { id: String(nextId++), title: '新笔记', body: '在这里写下你的想法……\n\n[ ] 待办事项', updated: timeStr,
                    category: '未分类', pinned: false };
                notes.unshift(newNote);
                currentNoteId = newNote.id;
                searchInput.value = '';
                renderNoteList('');
                loadNoteById(currentNoteId);
                saveAllData();
                showToast('📝 新建笔记');
            }

            function deleteCurrentNote() {
                if (notes.length <= 1) { showToast('⚠️ 至少保留一条笔记'); return; }
                const index = notes.findIndex(n => n.id === currentNoteId);
                if (index === -1) return;
                notes.splice(index, 1);
                currentNoteId = notes[0].id;
                renderNoteList(searchInput.value.trim());
                loadNoteById(currentNoteId);
                saveAllData();
                showToast('🗑️ 已删除');
            }

            function togglePin(noteId) {
                const note = notes.find(n => n.id === noteId);
                if (!note) return;
                note.pinned = !note.pinned;
                renderNoteList(searchInput.value.trim());
                loadNoteById(currentNoteId);
                saveAllData();
                showToast(note.pinned ? '📌 已置顶' : '📍 取消置顶');
            }

            pinBtn.addEventListener('click', function() {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) togglePin(currentNoteId);
            });

            // ===== 附件 =====
            fileUpload.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files.length) {
                    let msg = '📎 已上传附件: ';
                    let list = [];
                    for (let f of files) {
                        msg += f.name + ' ';
                        list.push(f.name);
                    }
                    imagePreviewContainer.innerHTML = list.map(name => 
                        `<span style="background:rgba(160,120,255,0.15);padding:2px 10px;border-radius:20px;font-size:11px;color:#cbb8f0;"><i class="fas fa-paperclip"></i> ${name}</span>`
                    ).join('');
                    // 插入到正文
                    let insert = '\n📎 ' + list.join(', ') + '\n';
                    const cursor = editorBody.selectionStart;
                    const text = editorBody.value;
                    editorBody.value = text.substring(0, cursor) + insert + text.substring(cursor);
                    saveCurrentNote();
                    showToast(msg);
                }
                this.value = '';
            });

            imageUpload.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files.length) {
                    for (let f of files) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const dataUrl = ev.target.result;
                            const imgId = 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                            imageDataMap[imgId] = dataUrl;
                            const mark = `![${f.name}](${imgId})`;
                            const cursor = editorBody.selectionStart;
                            const text = editorBody.value;
                            editorBody.value = text.substring(0, cursor) + mark + text.substring(cursor);
                            saveCurrentNote();
                            updateWordCount();
                            const img = document.createElement('img');
                            img.src = dataUrl;
                            img.className = 'image-preview';
                            imagePreviewContainer.appendChild(img);
                            showToast('🖼️ 已插入图片: ' + f.name);
                        };
                        reader.readAsDataURL(f);
                    }
                }
                this.value = '';
            });

            // ===== 事件绑定 =====
            editorTitleInput.addEventListener('input', saveCurrentNote);
            editorBody.addEventListener('input', saveCurrentNote);
            addBtn.addEventListener('click', addNewNote);
            deleteBtn.addEventListener('click', deleteCurrentNote);

            searchInput.addEventListener('input', function(e) {
                const keyword = e.target.value.trim();
                renderNoteList(keyword);
                const visible = noteListEl.querySelectorAll('.note-item');
                if (visible.length > 0) {
                    const firstId = visible[0].dataset.id;
                    if (firstId && !notes.find(n => n.id === currentNoteId && (n.title.includes(keyword) || n.body
                            .includes(keyword) || n.category.includes(keyword)))) {
                        loadNoteById(firstId);
                    }
                } else {
                    editorTitleInput.value = '';
                    editorBody.value = '';
                    updateTimeEl.innerHTML = `<i class="far fa-clock"></i> 无笔记`;
                    updateWordCount();
                    imagePreviewContainer.innerHTML = '';
                }
            });

            starBtn.addEventListener('click', function() {
                this.classList.toggle('fas');
                this.classList.toggle('far');
                this.style.color = this.classList.contains('fas') ? '#f7c948' : '#9a83c7';
                showToast(this.classList.contains('fas') ? '⭐ 已收藏' : '☆ 取消收藏');
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveCurrentNote();
                    saveAllData();
                    showToast('💾 已保存');
                }
            });

            // ===== 初始化 =====
            const loaded = loadAllData();
            renderNoteList('');
            loadNoteById(currentNoteId);
            starBtn.classList.add('far');
            starBtn.style.color = '#9a83c7';

            const lastWp = localStorage.getItem('lastWallpaper');
            if (lastWp && lastWp.startsWith('custom_')) {
                setWallpaper('default');
                showToast('🖼️ 自定义壁纸需重新上传');
            } else {
                setWallpaper(lastWp || 'default');
            }

            if (!loaded) {
                saveAllData();
                showToast('✨ 欢迎使用清云笔记');
            } else {
                showToast('📂 已恢复 ' + notes.length + ' 条笔记');
            }

            setInterval(() => {
                saveCurrentNote();
                const data = { notes, currentNoteId, nextId, imageDataMap };
                localStorage.setItem('qingyun_notes_data', JSON.stringify(data));
            }, 30000);

            window.__notes = notes;
        })();
    </script>
</body>
</html>
