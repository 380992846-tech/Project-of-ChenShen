<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>波士顿 · 查尔斯河畔漫游指南</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0710;
            color: #e6e0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app-container {
            width: 1440px;
            max-width: 100%;
            min-height: 920px;
            max-height: 98vh;
            background: rgba(22, 16, 35, 0.3);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 40px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(160, 120, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-image 0.7s ease;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: rgba(10, 6, 20, 0.3);
        }
        .app-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 6, 20, 0.12);
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 0;
        }
        .app-container>* {
            position: relative;
            z-index: 1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px;
            border-bottom: 1px solid rgba(180, 140, 255, 0.08);
            background: rgba(12, 8, 22, 0.15);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            background: linear-gradient(145deg, #4a7a9a, #2a5a7a);
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            box-shadow: 0 6px 14px rgba(50, 100, 150, 0.4);
        }
        .logo-text {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #8ac0d0, #4a7a9a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-text small {
            font-weight: 400;
            font-size: 9px;
            color: #6a8a9a;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            margin-left: 4px;
        }

        .tag-bar {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            padding: 2px 4px;
            background: rgba(16, 10, 30, 0.15);
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.05);
        }
        .tag-btn {
            background: transparent;
            border: none;
            padding: 3px 10px;
            border-radius: 30px;
            color: #9480c0;
            font-size: 10px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }
        .tag-btn i {
            font-size: 10px;
        }
        .tag-btn:hover {
            color: #d4c0ff;
            background: rgba(130, 70, 255, 0.08);
        }
        .tag-btn.active {
            background: rgba(130, 70, 255, 0.15);
            color: #f0eaff;
            border: 1px solid rgba(160, 120, 255, 0.08);
        }
        .tag-btn.portal-btn {
            background: rgba(247, 201, 72, 0.08);
            border: 1px solid rgba(247, 201, 72, 0.1);
            color: #f7c948;
        }
        .tag-btn.portal-btn:hover {
            background: rgba(247, 201, 72, 0.15);
        }
        .tag-btn.portal-btn i {
            color: #f7c948;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-clock-weather {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(30, 20, 55, 0.2);
            padding: 2px 8px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.05);
            font-size: 10px;
        }
        .nav-clock .time {
            font-weight: 600;
            color: #f0eaff;
            font-size: 12px;
        }
        .nav-clock .date {
            font-size: 8px;
            color: #b3a1d4;
        }
        .nav-weather .temp {
            font-size: 12px;
            font-weight: 500;
            color: #f0eaff;
        }
        .nav-weather .desc {
            font-size: 8px;
            color: #b3a1d4;
        }
        .avatar {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #4a7a9a, #1a3a5a);
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 9px;
            color: #fff;
            border: 1px solid #4a7a9a;
        }

        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            padding: 8px 12px 8px 12px;
            gap: 10px;
            overflow: hidden;
        }

        .card-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
            align-content: start;
            overflow-y: auto;
            padding: 4px 4px 8px 4px;
        }
        .card-grid::-webkit-scrollbar {
            width: 3px;
        }
        .card-grid::-webkit-scrollbar-thumb {
            background: #4e3a78;
            border-radius: 10px;
        }

        .glass-card {
            background: rgba(22, 16, 40, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 18px 16px 14px 16px;
            border: 1px solid rgba(160, 120, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            min-height: 140px;
            position: relative;
        }
        .glass-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(74, 122, 154, 0.4);
            box-shadow: 0 0 30px rgba(74, 122, 154, 0.12), 0 8px 30px rgba(0, 0, 0, 0.3);
            background: rgba(30, 40, 55, 0.3);
        }
        .glass-card:active {
            transform: scale(0.97);
        }

        .glass-card .card-emoji {
            font-size: 32px;
            margin-bottom: 2px;
            line-height: 1;
        }
        .glass-card .card-name {
            font-size: 18px;
            font-weight: 600;
            color: #f0eaff;
            line-height: 1.2;
            margin-bottom: 2px;
            word-break: break-word;
        }
        .glass-card .card-tag {
            font-size: 10px;
            color: #8ac0d0;
            background: rgba(74, 122, 154, 0.08);
            padding: 1px 10px;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-bottom: 4px;
        }
        .glass-card .card-desc {
            font-size: 13px;
            color: #c0d0d8;
            line-height: 1.5;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .glass-card .card-meta {
            font-size: 9px;
            color: #6a8a9a;
            margin-top: 6px;
            border-top: 1px solid rgba(160, 120, 255, 0.04);
            padding-top: 4px;
            display: flex;
            justify-content: space-between;
        }
        .glass-card .card-color-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 24px 24px 0 0;
            background: #4a7a9a;
        }
        .glass-card .card-badge {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 9px;
            background: rgba(74, 122, 154, 0.1);
            border-radius: 30px;
            padding: 0 8px;
            color: #8ac0d0;
            border: 1px solid rgba(74, 122, 154, 0.05);
        }

        .detail-panel {
            width: 280px;
            flex-shrink: 0;
            background: rgba(16, 10, 30, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 14px 16px;
            border: 1px solid rgba(160, 120, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            max-height: 100%;
        }
        .detail-panel::-webkit-scrollbar {
            width: 3px;
        }
        .detail-panel::-webkit-scrollbar-thumb {
            background: #4e3a78;
            border-radius: 10px;
        }

        .detail-panel .panel-title {
            font-size: 13px;
            color: #cbb8f0;
            font-weight: 500;
            margin-bottom: 2px;
        }
        .detail-panel .detail-emoji {
            font-size: 40px;
            text-align: center;
            padding: 4px 0;
        }
        .detail-panel .detail-name {
            font-size: 22px;
            font-weight: 600;
            color: #f0eaff;
            text-align: center;
        }
        .detail-panel .detail-tag {
            font-size: 11px;
            color: #8ac0d0;
            background: rgba(74, 122, 154, 0.08);
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            align-self: center;
            margin: 2px 0;
        }
        .detail-panel .detail-desc {
            font-size: 14px;
            color: #c0d0d8;
            line-height: 1.8;
            padding: 8px 0;
            border-top: 1px solid rgba(160, 120, 255, 0.04);
            border-bottom: 1px solid rgba(160, 120, 255, 0.04);
        }
        .detail-panel .detail-story {
            font-size: 13px;
            color: #ddd2f0;
            line-height: 1.8;
            padding: 6px 0;
            font-style: italic;
            background: rgba(74, 122, 154, 0.03);
            border-radius: 12px;
            padding: 10px 14px;
        }
        .detail-panel .detail-story::before {
            content: '📖 ';
            color: #4a7a9a;
        }

        .wallpaper-selector {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            padding: 4px 6px;
            background: rgba(16, 10, 30, 0.2);
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.05);
            margin-top: 4px;
            align-items: center;
        }
        .wp-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(200, 180, 255, 0.1);
            cursor: pointer;
            transition: 0.2s;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .wp-dot:hover {
            transform: scale(1.1);
            border-color: #4a7a9a;
        }
        .wp-dot.active {
            border-color: #f7c948;
            box-shadow: 0 0 12px rgba(247, 201, 72, 0.2);
        }
        .wp-dot.upload-dot {
            background: rgba(160, 120, 255, 0.1);
            border-color: rgba(160, 120, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #9480c0;
        }
        .wp-dot.upload-dot:hover {
            background: rgba(160, 120, 255, 0.2);
        }

        .bgm-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #6c5890;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid rgba(160, 120, 255, 0.05);
            transition: 0.2s;
            background: rgba(16, 10, 30, 0.15);
            margin-top: 4px;
        }
        .bgm-toggle:hover {
            border-color: rgba(160, 120, 255, 0.2);
            color: #b3a1d4;
        }
        .bgm-toggle i {
            font-size: 12px;
            color: #88aaff;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 20, 60, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 255, 0.12);
            color: #e6def5;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .toast.show {
            opacity: 1;
        }

        .cat-speak {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 20, 55, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid rgba(247, 201, 72, 0.15);
            color: #f7c948;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .cat-speak.show {
            opacity: 1;
        }

        @media (max-width: 820px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                gap: 3px;
                padding: 4px 10px;
            }
            .tag-bar {
                justify-content: center;
            }
            .main-layout {
                flex-direction: column;
                padding: 6px 8px;
                gap: 6px;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                max-height: 40vh;
            }
            .detail-panel {
                width: 100%;
                max-height: 240px;
            }
            .app-container {
                min-height: auto;
                max-height: 98vh;
                border-radius: 24px;
            }
        }
        @media (max-width: 480px) {
            .tag-btn {
                font-size: 8px;
                padding: 2px 6px;
            }
            .tag-btn i {
                font-size: 8px;
            }
            .logo-text {
                font-size: 12px;
            }
            .glass-card .card-name {
                font-size: 16px;
            }
            .glass-card .card-desc {
                font-size: 11px;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
            .detail-panel {
                padding: 10px 12px;
                max-height: 200px;
            }
            .nav-clock .date {
                display: none;
            }
            .nav-weather .desc {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">

        <header class="navbar">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-sailboat"></i></div>
                <div class="logo-text">波士顿 · 查尔斯河畔 <small>漫游指南</small></div>
            </div>
            <div class="tag-bar">
                <button class="tag-btn active" data-tag="all"><i class="fas fa-th"></i> 全部</button>
                <button class="tag-btn" data-tag="学术"><i class="fas fa-graduation-cap"></i> 学术</button>
                <button class="tag-btn" data-tag="美食"><i class="fas fa-utensils"></i> 美食</button>
                <button class="tag-btn" data-tag="地标"><i class="fas fa-landmark"></i> 地标</button>
                <button class="tag-btn portal-btn" id="portalBtn"><i class="fas fa-arrow-right"></i> 传送门</button>
            </div>
            <div class="nav-right">
                <div class="nav-clock-weather">
                    <div class="nav-clock"><span class="time" id="navClockTime">--:--</span><span class="date" id="navClockDate">--/--</span></div>
                    <div class="nav-weather"><span class="temp" id="navWeatherTemp">--°C</span><span class="desc" id="navWeatherDesc">--</span></div>
                </div>
                <div class="avatar">⛵</div>
            </div>
        </header>

        <div class="cat-speak" id="catSpeak">🐱 喵~</div>

        <div class="main-layout">

            <div class="card-grid" id="cardGrid"></div>

            <div class="detail-panel" id="detailPanel">
                <div class="panel-title"><i class="fas fa-map-pin"></i> 地点详情</div>
                <div class="detail-emoji" id="detailEmoji">⛵</div>
                <div class="detail-name" id="detailName">波士顿</div>
                <div class="detail-tag" id="detailTag">地标</div>
                <div class="detail-desc" id="detailDesc">点击一张卡片，看看陈深在波士顿的故事。</div>
                <div class="detail-story" id="detailStory">📍 陈深在这里留下了足迹……</div>

                <div style="margin-top:8px; border-top:1px solid rgba(160,120,255,0.04); padding-top:6px;">
                    <div style="font-size:10px; color:#6c5890;"><i class="fas fa-image"></i> 壁纸</div>
                    <div class="wallpaper-selector" id="wallpaperSelector">
                        <div class="wp-dot active" data-wallpaper="boston" style="background: url(https://images.unsplash.com/photo-1542051841857-5f9007f7f5e6?w=200&q=80);" title="波士顿河畔"></div>
                        <div class="wp-dot" data-wallpaper="autumn" style="background: url(https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=200&q=80);" title="秋日"></div>
                        <div class="wp-dot" data-wallpaper="ocean" style="background: url(https://images.unsplash.com/photo-1505228395891-9a51e7e86bf6?w=200&q=80);" title="海洋"></div>
                        <div class="wp-dot" data-wallpaper="snowmountain" style="background: url(https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=200&q=80);" title="日照金山"></div>
                        <div class="wp-dot upload-dot" id="uploadWallpaperBtn" title="上传自定义壁纸"><i class="fas fa-plus"></i></div>
                        <input type="file" id="wallpaperUpload" accept="image/*" style="display:none;">
                    </div>
                    <div style="font-size:9px; color:#6c5890; margin-top:2px;">
                        <span id="wallpaperLabel">波士顿河畔</span>
                        <span style="float:right;"><i class="fas fa-music" id="bgmIcon"></i> BGM</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <audio id="bgm" loop style="display:none;">
        <source src="https://www.bensound.com/bensound-music/bensound-pianomoment.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            // ============================================================
            //  波士顿 · 查尔斯河畔 地标卡片
            // ============================================================
            const bostonCards = [{
                id: 'charles',
                name: '查尔斯河',
                emoji: '⛵',
                tag: '地标',
                color: '#3a7a9a',
                desc: '查尔斯河，波士顿的灵魂，河面上帆影点点。',
                story: '陈深在查尔斯河边坐了一整个下午。\n“这里像清华的紫操，但多了一条河。” 他说。\n他看见有人在划船，有人在跑步，有人在发呆——他也成了其中之一。'
            }, {
                id: 'mit',
                name: 'MIT',
                emoji: '🏛️',
                tag: '学术',
                color: '#4a6a8a',
                desc: '麻省理工学院，理工科学生心中的圣殿。',
                story: '陈深站在MIT的走廊里，看着满墙的公式和奖杯。\n“这里的人真的不一样。” 他想。\n他在MIT的书店里买了一本《Structure and Interpretation of Computer Programs》，回酒店翻了整整一夜。'
            }, {
                id: 'harvard',
                name: '哈佛大学',
                emoji: '📚',
                tag: '学术',
                color: '#6a4a3a',
                desc: '哈佛大学，红砖墙、绿草地、老图书馆。',
                story: '陈深在哈佛的草地上躺了一下午，看着云从图书馆的尖顶上飘过。\n“原来哈佛的学生也会躺着发呆。” 他笑了。\n他在校门口的咖啡馆里写了一张明信片，寄回了清华。'
            }, {
                id: 'freedomtrail',
                name: '自由之路',
                emoji: '🪨',
                tag: '地标',
                color: '#7a6a5a',
                desc: '自由之路，波士顿的历史从脚下延伸。',
                story: '陈深沿着自由之路走了一整天，从波士顿公园到邦克山纪念碑。\n“每一步都是历史。” 他说。\n他在老州议会大厦前停下，想象着几百年前这里发生的故事。'
            }, {
                id: 'quincy',
                name: '昆西市场',
                emoji: '🛍️',
                tag: '美食',
                color: '#8a6a4a',
                desc: '昆西市场，波士顿的美食中心，热闹非凡。',
                story: '陈深在昆西市场吃了龙虾卷、蛤蜊浓汤和波士顿奶油派。\n“这里的食物和清华食堂完全不一样。” 他说。\n他坐在市场外面的长椅上，看着人来人往，觉得这个世界很大。'
            }, {
                id: 'newbury',
                name: 'Newbury Street',
                emoji: '🛒',
                tag: '地标',
                color: '#6a7a8a',
                desc: 'Newbury Street，波士顿最优雅的购物街。',
                story: '陈深在Newbury Street上走了两个来回，什么也没买。\n“我只是想看看波士顿的秋天长什么样。” 他说。\n街上的枫叶落了一地，他捡了一片夹在日记本里。'
            }, {
                id: 'publicgarden',
                name: '波士顿公共花园',
                emoji: '🌳',
                tag: '地标',
                color: '#5a8a5a',
                desc: '波士顿公共花园，天鹅船在湖上缓缓滑行。',
                story: '陈深在公共花园里喂了鸭子，坐了天鹅船。\n“这里的鸭子比清华的猫还悠闲。” 他说。\n他在长椅上坐了很久，看日落把湖面染成金色。'
            }, {
                id: 'bpl',
                name: '波士顿公共图书馆',
                emoji: '📖',
                tag: '学术',
                color: '#6a5a4a',
                desc: '波士顿公共图书馆，百年历史，穹顶辉煌。',
                story: '陈深在波士顿公共图书馆里看了一下午的书。\n“这里的阅读室像教堂一样安静。” 他说。\n他在笔记本上写下：“图书馆是最好的避风港，无论在北京还是波士顿。”'
            }, {
                id: 'fenway',
                name: '芬威球场',
                emoji: '⚾',
                tag: '地标',
                color: '#5a6a4a',
                desc: '芬威球场，波士顿红袜队的主场，棒球迷的朝圣地。',
                story: '陈深在芬威球场看了一场红袜队的比赛。\n“虽然我不懂棒球，但这里的气氛太棒了。” 他说。\n他买了一个热狗，和旁边的大叔一起喊“Go Sox!”'
            }, {
                id: 'oyster',
                name: 'Union Oyster House',
                emoji: '🦪',
                tag: '美食',
                color: '#7a5a3a',
                desc: 'Union Oyster House，美国最古老的餐厅，生蚝一绝。',
                story: '陈深在Union Oyster House吃了人生中第一只生蚝。\n“一口下去，好像尝到了大海的味道。” 他说。\n餐厅的墙上挂着两百年的老照片，他觉得自己像是在历史里吃晚餐。'
            }, {
                id: 'harbor',
                name: '波士顿港',
                emoji: '🚢',
                tag: '地标',
                color: '#4a7a8a',
                desc: '波士顿港，海风、帆船、远方。',
                story: '陈深在波士顿港边站了很久。\n“这里的风和大海，和北京完全不一样。” 他说。\n他看着远处的帆船慢慢消失在地平线上，心里涌起一种说不清的情绪。'
            }, {
                id: 'isabella',
                name: '伊莎贝拉嘉纳艺术博物馆',
                emoji: '🎨',
                tag: '地标',
                color: '#8a6a7a',
                desc: '伊莎贝拉嘉纳艺术博物馆，藏在一个私家花园里。',
                story: '陈深在伊莎贝拉嘉纳博物馆里迷了路。\n“这里的每个房间都像一个梦。” 他说。\n他在中庭的花园里坐了一会儿，觉得艺术和阳光是同一件事。'
            }, {
                id: 'portal',
                name: '🌀 传送门',
                emoji: '🌀',
                tag: '地标',
                color: '#7a5ab0',
                desc: '通往所有地标的随机传送门。',
                story: '“点我，去一个你还没去过的地方。”\n陈深说：“波士顿的每个角落，都值得去一次。”'
            }];

            // ============================================================
            //  渲染
            // ============================================================
            let currentTag = 'all';
            let selectedId = null;
            const cardGrid = document.getElementById('cardGrid');
            const detailEmoji = document.getElementById('detailEmoji');
            const detailName = document.getElementById('detailName');
            const detailTag = document.getElementById('detailTag');
            const detailDesc = document.getElementById('detailDesc');
            const detailStory = document.getElementById('detailStory');

            function renderCards(tag) {
                const filtered = tag === 'all' ? bostonCards : bostonCards.filter(c => c.tag === tag);
                if (filtered.length === 0) {
                    cardGrid.innerHTML =
                        `<div style="grid-column:1/-1; text-align:center; color:#6c5890; padding:40px 0;">📍 这个分类还没有地标</div>`;
                    return;
                }
                let html = '';
                filtered.forEach(card => {
                    const active = card.id === selectedId ? 'active' : '';
                    html += `
                        <div class="glass-card ${active}" data-id="${card.id}" style="border-color: ${active ? 'rgba(74,122,154,0.4)' : 'rgba(160,120,255,0.08)'};">
                            <div class="card-color-bar" style="background:${card.color || '#4a7a9a'};"></div>
                            <div class="card-badge">${card.tag}</div>
                            <div class="card-emoji">${card.emoji}</div>
                            <div class="card-name">${card.name}</div>
                            <div class="card-tag">${card.tag}</div>
                            <div class="card-desc">${card.desc}</div>
                            <div class="card-meta"><span>📍 ${card.tag}</span><span>点击查看故事</span></div>
                        </div>
                    `;
                });
                cardGrid.innerHTML = html;

                cardGrid.querySelectorAll('.glass-card').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        if (id === 'portal') {
                            const random = bostonCards.filter(c => c.id !== 'portal');
                            const pick = random[Math.floor(Math.random() * random.length)];
                            selectCard(pick.id);
                            showToast(`🌀 传送门带你到了 ${pick.name}`);
                            catSpeakMsg(`喵！我们到了 ${pick.name}~`);
                            return;
                        }
                        selectCard(id);
                    });
                });

                if (selectedId) {
                    const found = filtered.find(c => c.id === selectedId);
                    if (found) {
                        cardGrid.querySelectorAll('.glass-card').forEach(el => {
                            el.classList.toggle('active', el.dataset.id === selectedId);
                            if (el.dataset.id === selectedId) {
                                el.style.borderColor = 'rgba(74,122,154,0.4)';
                            } else {
                                el.style.borderColor = 'rgba(160,120,255,0.08)';
                            }
                        });
                    } else {
                        selectedId = null;
                        clearDetail();
                    }
                }
            }

            function selectCard(id) {
                const card = bostonCards.find(c => c.id === id);
                if (!card) return;
                selectedId = id;
                detailEmoji.textContent = card.emoji;
                detailName.textContent = card.name;
                detailTag.textContent = card.tag;
                detailDesc.textContent = card.desc;
                detailStory.textContent = card.story || '📍 陈深在这里留下了足迹……';
                renderCards(currentTag);
                showToast(`📍 ${card.name}`);
            }

            function clearDetail() {
                detailEmoji.textContent = '⛵';
                detailName.textContent = '波士顿';
                detailTag.textContent = '地标';
                detailDesc.textContent = '点击一张卡片，看看陈深在波士顿的故事。';
                detailStory.textContent = '📍 陈深在这里留下了足迹……';
            }

            // ============================================================
            //  标签切换
            // ============================================================
            document.querySelectorAll('.tag-btn[data-tag]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tag = this.dataset.tag;
                    currentTag = tag;
                    document.querySelectorAll('.tag-btn[data-tag]').forEach(b => b.classList.toggle('active', b
                        .dataset.tag === tag));
                    if (selectedId) {
                        const card = bostonCards.find(c => c.id === selectedId);
                        if (card && tag !== 'all' && card.tag !== tag) {
                            selectedId = null;
                            clearDetail();
                        }
                    }
                    renderCards(tag);
                    showToast(`🏷️ 分类: ${tag === 'all' ? '全部' : tag}`);
                });
            });

            // ============================================================
            //  传送门
            // ============================================================
            document.getElementById('portalBtn').addEventListener('click', function() {
                const random = bostonCards.filter(c => c.id !== 'portal');
                const pick = random[Math.floor(Math.random() * random.length)];
                selectCard(pick.id);
                showToast(`🌀 传送门带你到了 ${pick.name}`);
                catSpeakMsg(`喵！我们到了 ${pick.name}~`);
            });

            // ============================================================
            //  Toast & 猫咪
            // ============================================================
            const toastEl = document.getElementById('toast');
            const catSpeak = document.getElementById('catSpeak');
            let toastTimer = null;
            let catSpeakTimer = null;

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
            }

            function catSpeakMsg(msg) {
                catSpeak.textContent = '🐱 ' + msg;
                catSpeak.classList.add('show');
                clearTimeout(catSpeakTimer);
                catSpeakTimer = setTimeout(() => catSpeak.classList.remove('show'), 3000);
            }

            // ============================================================
            //  壁纸
            // ============================================================
            const appContainer = document.getElementById('appContainer');
            const wallpaperMap = {
                boston: 'url(https://images.unsplash.com/photo-1542051841857-5f9007f7f5e6?w=1600&q=80)',
                autumn: 'url(https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1600&q=80)',
                ocean: 'url(https://images.unsplash.com/photo-1505228395891-9a51e7e86bf6?w=1600&q=80)',
                snowmountain: 'url(https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80)'
            };
            const wallpaperNames = { boston: '波士顿河畔', autumn: '秋日', ocean: '海洋', snowmountain: '日照金山' };
            let currentWallpaper = 'boston';
            let customWallpaper = null;

            function applyWallpaper() {
                if (customWallpaper) {
                    appContainer.style.backgroundImage = `url(${customWallpaper})`;
                } else if (wallpaperMap[currentWallpaper]) {
                    appContainer.style.backgroundImage = wallpaperMap[currentWallpaper];
                } else {
                    appContainer.style.backgroundImage = 'none';
                    appContainer.style.backgroundColor = 'rgba(10,6,20,0.3)';
                }
                appContainer.style.backgroundSize = 'cover';
                appContainer.style.backgroundPosition = 'center';
            }

            function setWallpaper(wp) {
                currentWallpaper = wp;
                customWallpaper = null;
                document.getElementById('wallpaperLabel').textContent = wallpaperNames[wp] || wp;
                document.querySelectorAll('.wp-dot:not(.upload-dot)').forEach(el => {
                    el.classList.toggle('active', el.dataset.wallpaper === wp);
                });
                applyWallpaper();
                localStorage.setItem('qingyun_wallpaper', wp);
                showToast(`🖼️ 壁纸: ${wallpaperNames[wp]}`);
            }

            document.querySelectorAll('.wp-dot:not(.upload-dot)').forEach(el => {
                el.addEventListener('click', function() { setWallpaper(this.dataset.wallpaper); });
            });

            document.getElementById('uploadWallpaperBtn').addEventListener('click', function() {
                document.getElementById('wallpaperUpload').click();
            });
            document.getElementById('wallpaperUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    customWallpaper = ev.target.result;
                    currentWallpaper = 'custom';
                    document.getElementById('wallpaperLabel').textContent = '自定义';
                    document.querySelectorAll('.wp-dot').forEach(el => el.classList.remove('active'));
                    document.getElementById('uploadWallpaperBtn').classList.add('active');
                    applyWallpaper();
                    localStorage.setItem('qingyun_custom_wallpaper', customWallpaper);
                    showToast('🖼️ 自定义壁纸已应用');
                };
                reader.readAsDataURL(file);
                this.value = '';
            });

            const savedWp = localStorage.getItem('qingyun_wallpaper');
            if (savedWp && wallpaperMap[savedWp]) {
                currentWallpaper = savedWp;
                document.querySelectorAll('.wp-dot:not(.upload-dot)').forEach(el => {
                    el.classList.toggle('active', el.dataset.wallpaper === currentWallpaper);
                });
                document.getElementById('wallpaperLabel').textContent = wallpaperNames[currentWallpaper] || currentWallpaper;
            }
            const savedCustom = localStorage.getItem('qingyun_custom_wallpaper');
            if (savedCustom) {
                customWallpaper = savedCustom;
                currentWallpaper = 'custom';
                document.getElementById('wallpaperLabel').textContent = '自定义';
                document.getElementById('uploadWallpaperBtn').classList.add('active');
            }
            applyWallpaper();

            // ============================================================
            //  BGM
            // ============================================================
            const bgm = document.getElementById('bgm');
            const bgmIcon = document.getElementById('bgmIcon');
            let bgmPlaying = true;

            function tryPlayBgm() {
                bgm.volume = 0.25;
                bgm.play().catch(() => {
                    document.addEventListener('click', function playOnClick() {
                        bgm.play().catch(() => {});
                        document.removeEventListener('click', playOnClick);
                    }, { once: true });
                });
            }
            setTimeout(tryPlayBgm, 500);

            document.getElementById('bgmIcon')?.addEventListener('click', function(e) {
                e.stopPropagation();
                if (bgmPlaying) {
                    bgm.pause();
                    bgmPlaying = false;
                    this.className = 'fas fa-music-slash';
                    showToast('🔇 BGM 已暂停');
                } else {
                    bgm.play().catch(() => {});
                    bgmPlaying = true;
                    this.className = 'fas fa-music';
                    showToast('🎵 BGM 已恢复');
                }
            });

            // ============================================================
            //  时钟
            // ============================================================
            const clockTime = document.getElementById('navClockTime');
            const clockDate = document.getElementById('navClockDate');
            const weatherTemp = document.getElementById('navWeatherTemp');
            const weatherDesc = document.getElementById('navWeatherDesc');

            function updateClock() {
                const now = new Date();
                clockTime.textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
                clockDate.textContent = now.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
            }
            setInterval(updateClock, 1000);
            updateClock();

            const wList = ['晴', '多云', '阴', '小雨', '晴'];
            let wi = 0;

            function updateW() {
                const w = wList[wi % wList.length];
                wi++;
                weatherDesc.textContent = w;
                weatherTemp.textContent = (12 + Math.floor(Math.random() * 15)) + '°C';
            }
            updateW();
            setInterval(updateW, 30000);

            // ============================================================
            //  键盘快捷键
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'p' || e.key === 'P') {
                    document.getElementById('portalBtn').click();
                }
                if (e.key === 'r' || e.key === 'R') {
                    selectedId = null;
                    clearDetail();
                    renderCards(currentTag);
                    showToast('🔄 重置视图');
                }
                const num = parseInt(e.key);
                if (num >= 1 && num <= 9) {
                    const idx = num - 1;
                    const cards = currentTag === 'all' ? bostonCards : bostonCards.filter(c => c.tag === currentTag);
                    if (cards[idx]) {
                        selectCard(cards[idx].id);
                    }
                }
            });

            // ============================================================
            //  启动
            // ============================================================
            const first = bostonCards.find(c => c.id !== 'portal');
            if (first) selectCard(first.id);
            renderCards('all');

            setTimeout(() => {
                catSpeakMsg('🐱 欢迎来到波士顿！点击卡片探索陈深在查尔斯河畔的故事~');
            }, 800);

            console.log('⛵ 波士顿 · 查尔斯河畔漫游指南 已加载');
            console.log('📍 共 13 个地标，点击卡片查看陈深的故事');
            console.log('⌨️  1-9 快速跳转 | P 传送门 | R 重置');
            console.log('🎵 BGM 已开启，点击音符切换');
        })();
    </script>
</body>
</html>
