<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Park Hyatt · 柏悦之境</title>
    <!-- Font Awesome (简约图标) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局重置 & 高冷暗黑·原木奢华 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0e0c0a;  /* 深炭黑底 */
            color: #d9d0c5;             /* 原木浅灰 */
            font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* 原木纹理点缀 (极简) */
        .wood-vein {
            position: relative;
        }
        .wood-vein::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #b7a58b 0%, #8f7a5c 40%, #b7a58b 80%);
            opacity: 0.25;
        }

        /* 容器 */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ===== 顶部导航 (5大TAG) ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 0 18px;
            border-bottom: 1px solid rgba(183, 165, 139, 0.15);
            flex-wrap: wrap;
            row-gap: 14px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #eae0d3;
            text-transform: uppercase;
            background: linear-gradient(135deg, #eae0d3 0%, #b7a58b 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(183, 165, 139, 0.08);
        }
        .logo i {
            font-size: 1.2rem;
            margin-right: 8px;
            -webkit-text-fill-color: #b7a58b;
            color: #b7a58b;
            opacity: 0.7;
        }

        .nav-tags {
            display: flex;
            gap: 2.8rem;
            flex-wrap: wrap;
        }

        .nav-tag {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #cbc0b2;
            cursor: pointer;
            transition: 0.25s ease;
            position: relative;
            padding: 6px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-tag:hover,
        .nav-tag.active {
            color: #f0e6d8;
            border-bottom-color: #b7a58b;
        }

        .nav-tag i {
            margin-right: 8px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* 订房按钮 (奢华原木感) */
        .btn-book {
            background: transparent;
            border: 1px solid #b7a58b;
            color: #eae0d3;
            padding: 12px 36px;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            transition: 0.3s;
            cursor: pointer;
            background: rgba(183, 165, 139, 0.04);
            backdrop-filter: blur(2px);
            border-radius: 0;
            box-shadow: 0 0 12px rgba(183, 165, 139, 0.06);
        }

        .btn-book:hover {
            background: #b7a58b;
            color: #0e0c0a;
            border-color: #b7a58b;
            box-shadow: 0 8px 30px rgba(183, 165, 139, 0.15);
        }

        .btn-book i {
            margin-right: 12px;
        }

        /* ===== HERO 暗黑·原木奢华 ===== */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 65vh;
            padding: 60px 0 40px;
            background: radial-gradient(circle at 20% 30%, #1f1a16 0%, #0e0c0a 80%);
            border-bottom: 1px solid rgba(183, 165, 139, 0.08);
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none" /><path d="M10 10 L 90 10 L 90 90 L 10 90 Z" stroke="%23b7a58b" stroke-width="0.5" opacity="0.05" fill="none"/><path d="M20 20 L 80 20 L 80 80 L 20 80 Z" stroke="%23b7a58b" stroke-width="0.3" opacity="0.03"/></svg>');
            background-size: 120px 120px;
            pointer-events: none;
        }

        .hero-content {
            max-width: 720px;
            position: relative;
            z-index: 2;
        }

        .hero-sub {
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #b7a58b;
            margin-bottom: 18px;
            font-weight: 300;
            opacity: 0.7;
        }

        .hero-title {
            font-size: 4.2rem;
            font-weight: 200;
            line-height: 1.1;
            letter-spacing: 4px;
            color: #f0e6d8;
            margin-bottom: 28px;
        }

        .hero-title span {
            display: block;
            font-weight: 300;
            color: #b7a58b;
            font-size: 2.4rem;
            letter-spacing: 8px;
            margin-top: 10px;
            opacity: 0.6;
        }

        .hero-desc {
            font-size: 1rem;
            font-weight: 300;
            color: #cbc0b2;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.8;
            letter-spacing: 0.4px;
        }

        .hero-desc i {
            color: #b7a58b;
            margin-right: 6px;
        }

        /* ===== 全球酒店卡片 (柏悦介绍) ===== */
        .section-title {
            font-size: 1.6rem;
            font-weight: 200;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #eae0d3;
            padding: 70px 0 30px;
            border-bottom: 1px solid rgba(183, 165, 139, 0.1);
            margin-bottom: 40px;
        }

        .section-title i {
            color: #b7a58b;
            margin-right: 18px;
            font-size: 1.2rem;
        }

        .hotel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px 30px;
            padding-bottom: 60px;
        }

        .hotel-card {
            background: rgba(26, 22, 18, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(183, 165, 139, 0.08);
            padding: 32px 24px 28px;
            transition: 0.35s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .hotel-card:hover {
            transform: translateY(-6px);
            border-color: rgba(183, 165, 139, 0.25);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            background: rgba(30, 25, 20, 0.7);
        }

        .hotel-card .card-icon {
            font-size: 2.2rem;
            color: #b7a58b;
            margin-bottom: 14px;
            opacity: 0.7;
        }

        .hotel-card h3 {
            font-weight: 300;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #f0e6d8;
            margin-bottom: 4px;
        }

        .hotel-card .location {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b7a58b;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        .hotel-card .detail-row {
            font-size: 0.8rem;
            color: #cbc0b2;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hotel-card .detail-row i {
            color: #b7a58b;
            width: 18px;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .hotel-card p {
            font-weight: 300;
            font-size: 0.9rem;
            color: #cbc0b2;
            line-height: 1.7;
            margin: 12px 0 16px;
            flex: 1;
        }

        .hotel-card .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .hotel-card .highlight-tag {
            display: inline-block;
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #eae0d3;
            border: 1px solid #b7a58b;
            padding: 4px 16px;
            background: rgba(183, 165, 139, 0.04);
            border-radius: 0;
        }

        .hotel-card .highlight-tag i {
            margin-right: 6px;
            font-size: 0.6rem;
        }

        /* ===== 订房模块 ===== */
        .booking-section {
            background: #14110e;
            padding: 60px 0 70px;
            border-top: 1px solid rgba(183, 165, 139, 0.08);
            border-bottom: 1px solid rgba(183, 165, 139, 0.08);
            margin: 10px 0 20px;
        }

        .booking-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 30px 50px;
            justify-content: space-between;
        }

        .booking-field {
            flex: 1 1 180px;
            min-width: 150px;
        }

        .booking-field label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #b7a58b;
            margin-bottom: 6px;
            font-weight: 300;
        }

        .booking-field input,
        .booking-field select {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(183, 165, 139, 0.25);
            padding: 12px 4px 8px;
            color: #f0e6d8;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            transition: 0.2s;
            outline: none;
            font-family: inherit;
        }

        .booking-field input:focus,
        .booking-field select:focus {
            border-bottom-color: #b7a58b;
            background: rgba(183, 165, 139, 0.02);
        }

        .booking-field input::placeholder {
            color: #7f7568;
            font-weight: 200;
            letter-spacing: 0.3px;
        }

        .booking-field select option {
            background: #1a1612;
            color: #d9d0c5;
        }

        .btn-book-primary {
            background: #b7a58b;
            border: none;
            color: #0e0c0a;
            padding: 16px 48px;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
            transition: 0.25s;
            cursor: pointer;
            border-radius: 0;
            box-shadow: 0 4px 20px rgba(183, 165, 139, 0.1);
            font-family: inherit;
            margin-top: 6px;
        }

        .btn-book-primary:hover {
            background: #d0c2b0;
            box-shadow: 0 8px 32px rgba(183, 165, 139, 0.25);
            transform: scale(1.01);
        }

        /* ===== FOOTER 原木细纹 ===== */
        .footer {
            padding: 50px 0 40px;
            border-top: 1px solid rgba(183, 165, 139, 0.06);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
            color: #7f7568;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
        }

        .footer-links {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #a09687;
            text-decoration: none;
            transition: 0.2s;
            border-bottom: 1px solid transparent;
        }

        .footer-links a:hover {
            color: #eae0d3;
            border-bottom-color: #b7a58b;
        }

        .footer-copy {
            opacity: 0.5;
        }

        /* ===== 响应式 ===== */
        @media screen and (max-width: 820px) {
            .container { padding: 0 24px; }
            .navbar { flex-direction: column; align-items: flex-start; gap: 18px; }
            .nav-tags { gap: 1.4rem; }
            .hero-title { font-size: 2.8rem; }
            .hero-title span { font-size: 1.6rem; }
            .booking-wrap { flex-direction: column; align-items: stretch; }
            .btn-book-primary { width: 100%; text-align: center; }
        }

        @media screen and (max-width: 480px) {
            .nav-tags { gap: 0.8rem; }
            .nav-tag { font-size: 0.7rem; letter-spacing: 1px; }
            .hero-title { font-size: 2.2rem; }
            .btn-book { padding: 10px 24px; font-size: 0.7rem; }
        }

        /* ===== 简约滚动条 ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0e0c0a; }
        ::-webkit-scrollbar-thumb { background: #b7a58b; border-radius: 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ====== 顶部导航 (5大TAG) ====== -->
        <header class="navbar wood-vein">
            <div class="logo">
                <i class="fas fa-tree"></i> Park Hyatt
            </div>
            <div class="nav-tags">
                <span class="nav-tag active"><i class="fas fa-hotel"></i> 酒店</span>
                <span class="nav-tag"><i class="fas fa-utensils"></i> 餐饮</span>
                <span class="nav-tag"><i class="fas fa-spa"></i> 水疗</span>
                <span class="nav-tag"><i class="fas fa-ring"></i> 婚礼</span>
                <span class="nav-tag"><i class="fas fa-users"></i> 会议</span>
            </div>
            <button class="btn-book" id="scrollToBooking"><i class="fas fa-calendar-check"></i> 立即订房</button>
        </header>

        <!-- ====== HERO ====== -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-sub"><i class="fas fa-minus" style="margin-right:12px;"></i> 柏悦 · 隐世之境</div>
                <h1 class="hero-title">
                    高冷 · 原木 · 奢华
                    <span>PARK HYATT</span>
                </h1>
                <p class="hero-desc">
                    <i class="fas fa-leaf"></i> 全球凯悦柏悦酒店 · 静谧于繁华，极简于至臻。
                    每一处皆为艺术，每一次入住皆为私享。
                </p>
                <div style="width:80px; height:1px; background: linear-gradient(90deg, #b7a58b, transparent); margin: 20px 0 10px;"></div>
            </div>
        </section>

        <!-- ====== 全球柏悦酒店介绍 (卡片) ====== -->
        <div class="section-title">
            <i class="fas fa-globe-asia"></i> 全球 · 柏悦之选
        </div>
        <div class="hotel-grid" id="hotelGrid">
            <!-- 卡片数据通过 JS 动态渲染，便于维护 -->
        </div>

        <!-- ====== 订房模块 ====== -->
        <div class="booking-section" id="bookingSection">
            <div class="booking-wrap">
                <div class="booking-field">
                    <label for="hotelSelect"><i class="fas fa-hotel"></i> 选择酒店</label>
                    <select id="hotelSelect">
                        <!-- 由 JS 动态填充 -->
                    </select>
                </div>
                <div class="booking-field">
                    <label for="checkin"><i class="fas fa-calendar-alt"></i> 入住</label>
                    <input type="date" id="checkin" value="2026-07-15" min="2026-07-01">
                </div>
                <div class="booking-field">
                    <label for="checkout"><i class="fas fa-calendar-alt"></i> 退房</label>
                    <input type="date" id="checkout" value="2026-07-18" min="2026-07-02">
                </div>
                <div class="booking-field">
                    <label for="guests"><i class="fas fa-user"></i> 住客</label>
                    <select id="guests">
                        <option value="1">1 位成人</option>
                        <option value="2" selected>2 位成人</option>
                        <option value="3">3 位成人</option>
                        <option value="4">4 位成人</option>
                    </select>
                </div>
                <button class="btn-book-primary" id="bookNowBtn"><i class="fas fa-key"></i> 查询空房</button>
            </div>
            <div style="margin-top:28px; height:1px; background: linear-gradient(90deg, #b7a58b 10%, transparent 90%);"></div>
            <p style="margin-top:18px; font-size:0.7rem; letter-spacing:2px; color:#7f7568; text-align:right; opacity:0.6;">
                <i class="fas fa-lock" style="margin-right:6px;"></i> 柏悦专属 · 私享预订
            </p>
        </div>

        <!-- ====== FOOTER ====== -->
        <footer class="footer wood-vein">
            <div class="footer-links">
                <a href="#">关于柏悦</a>
                <a href="#">全球酒店</a>
                <a href="#">会员礼遇</a>
                <a href="#">新闻中心</a>
                <a href="#">联系</a>
            </div>
            <div class="footer-copy">
                <i class="fas fa-tree" style="margin-right:8px;"></i> 2026 Park Hyatt · 高冷暗黑·原木奢华
            </div>
        </footer>
    </div>

    <!-- ====== JS：数据驱动 8家酒店 ====== -->
    <script>
        (function() {
            // ----- 酒店数据 (8家) -----
            const hotels = [
                {
                    id: 'beijing',
                    name: '北京柏悦',
                    location: '中国 · 北京',
                    icon: 'fa-city',
                    address: '朝阳区建国门外大街1号',
                    phone: '+86 10 6507 8888',
                    dining: '大堂酒廊 · 锦庭中餐厅',
                    news: '2026 艺术季启幕',
                    desc: '位于CBD核心，俯瞰紫禁城与现代天际线。原木与铜质交织，演绎京城雅韵。'
                },
                {
                    id: 'shanghai',
                    name: '上海柏悦',
                    location: '中国 · 上海',
                    icon: 'fa-building',
                    address: '浦东新区世纪大道100号',
                    phone: '+86 21 6888 1234',
                    dining: '世纪100餐厅 · 悦轩',
                    news: '云端下午茶新品发布',
                    desc: '环球金融中心79-93层，云端之上的私密府邸，极简原木与摩登融合。'
                },
                {
                    id: 'jakarta',
                    name: '雅加达柏悦',
                    location: '印度尼西亚 · 雅加达',
                    icon: 'fa-umbrella-beach',
                    address: 'Jl. M.H. Thamrin No. 1',
                    phone: '+62 21 2992 8888',
                    dining: 'Cocktail Bar · 印尼风味餐厅',
                    news: '全新水疗中心开业',
                    desc: '位于城市心脏，殖民建筑与现代设计对话，原木与热带植物营造静谧绿洲。'
                },
                {
                    id: 'tokyo',
                    name: '东京柏悦',
                    location: '日本 · 新宿',
                    icon: 'fa-city',
                    address: '3-7-1-2 Nishi-Shinjuku',
                    phone: '+81 3 5322 1234',
                    dining: 'New York Grill · 和食',
                    news: '丹下健三设计展',
                    desc: '丹下健三设计，空中大堂俯瞰富士山。和风原木与极简主义交融。'
                },
                {
                    id: 'paris',
                    name: '巴黎柏悦',
                    location: '法国 · 旺多姆',
                    icon: 'fa-crown',
                    address: '5 Rue de la Paix',
                    phone: '+33 1 58 71 12 34',
                    dining: 'Les Orchidées · 酒吧',
                    news: '路易十六风格修复',
                    desc: '和平街上的宫殿，路易十六风格，原木镶板与暗金细节。'
                },
                {
                    id: 'sydney',
                    name: '悉尼柏悦',

                    icon: 'fa-water',
                    address: '7 Hickson Rd, The Rocks',
                    phone: '+61 2 9256 1234',
                    dining: 'The Dining Room · 码头酒吧',
                    news: 'Vivid Sydney 灯光节',
                    desc: '歌剧院与海港大桥尽收眼底，砂岩与深色原木构筑海岸奢华。'
                },
                {
                    id: 'kyoto',
                    name: '京都柏悦',
                    location: '日本 · 东山',
                    icon: 'fa-pagelines',
                    address: '353 Kiyoi-cho, Higashiyama-ku',
                    phone: '+81 75 533 1234',
                    dining: 'Kyoto Bistro · 茶室',
                    news: '庭园夜樱特别企划',
                    desc: '二年坂旁，茶室与庭院，原木障子，四季流转的侘寂之美。'
                },
                {
                    id: 'maldives',
                    name: '马尔代夫柏悦',
                    location: '马尔代夫 · 哈达哈',
                    icon: 'fa-sun',
                    address: 'Hadahaa Island, Gaafu Alifu Atoll',
                    phone: '+960 682 1234',
                    dining: 'The Island Grill · 水上酒吧',
                    news: '私人环礁潜水体验',
                    desc: '私人环礁，水上别墅，原木与白沙，暗夜星空下的极致高冷。'
                }
            ];

            // ----- 渲染酒店卡片 -----
            const grid = document.getElementById('hotelGrid');
            if (grid) {
                grid.innerHTML = hotels.map(h => `
                    <div class="hotel-card">
                        <div class="card-icon"><i class="fas ${h.icon}"></i></div>
                        <h3>${h.name}</h3>
                        <div class="location">${h.location}</div>
                        <div class="detail-row"><i class="fas fa-map-pin"></i> ${h.address}</div>
                        <div class="detail-row"><i class="fas fa-phone-alt"></i> ${h.phone}</div>
                        <div class="detail-row"><i class="fas fa-utensils"></i> ${h.dining}</div>
                        <p>${h.desc}</p>
                        <div class="tag-group">
                            <span class="highlight-tag"><i class="fas fa-newspaper"></i> ${h.news}</span>
                            <span class="highlight-tag"><i class="fas fa-hotel"></i> 柏悦</span>
                        </div>
                    </div>
                `).join('');
            }

            // ----- 填充订房下拉选择 -----
            const select = document.getElementById('hotelSelect');
            if (select) {
                select.innerHTML = hotels.map(h => 
                    `<option value="${h.id}">${h.name}</option>`
                ).join('');
            }

            // ----- 导航tag切换 active -----
            const tags = document.querySelectorAll('.nav-tag');
            tags.forEach(tag => {
                tag.addEventListener('click', function(e) {
                    tags.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    console.log(`[Park Hyatt] 导航: ${this.innerText.trim()}`);
                });
            });

            // ----- 订房按钮滚动 -----
            const scrollBtn = document.getElementById('scrollToBooking');
            const bookingSection = document.getElementById('bookingSection');
            if (scrollBtn && bookingSection) {
                scrollBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    bookingSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }

            // ----- 查询空房 -----
            const bookNowBtn = document.getElementById('bookNowBtn');
            if (bookNowBtn) {
                bookNowBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const hotelSelect = document.getElementById('hotelSelect');
                    const checkin = document.getElementById('checkin');
                    const checkout = document.getElementById('checkout');
                    const guests = document.getElementById('guests');
                    const hotelName = hotelSelect.options[hotelSelect.selectedIndex]?.text || '柏悦';
                    const guestText = guests.options[guests.selectedIndex]?.text || '2 位成人';
                    alert(`🔍 查询空房\n\n🏨 ${hotelName}\n📅 入住: ${checkin.value}  → 退房: ${checkout.value}\n👤 ${guestText}\n\n柏悦专属客服将为您提供最优房态。`);
                });
            }

            // ----- 日期逻辑 -----
            const checkinInput = document.getElementById('checkin');
            const checkoutInput = document.getElementById('checkout');
            if (checkinInput && checkoutInput) {
                checkinInput.addEventListener('change', function() {
                    if (checkoutInput.value && checkoutInput.value <= this.value) {
                        const newDate = new Date(this.value);
                        newDate.setDate(newDate.getDate() + 2);
                        checkoutInput.value = newDate.toISOString().split('T')[0];
                    }
                });
            }

            console.log('🏨 Park Hyatt · 8家柏悦已加载 (北京/上海/雅加达等)');
        })();
    </script>
</body>
</html>
