<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.splash-screen {
position: fixed;
inset: 0;
z-index: 9999;
background: radial-gradient(ellipse at center, #1a0a2a 0%, #0b0710 100%);

flex-direction: column;
align-items: center;
justify-content: center;

}
.splash-screen.hide {
opacity: 0;
transform: scale(1.05);
pointer-events: none;
}
.splash-screen .logo-glow {
font-size: 72px;
margin-bottom: 12px;
animation: pulseGold 2s ease-in-out infinite;
filter: drop-shadow(0 0 40px rgba(247, 201, 72, 0.3));
}
@keyframes pulseGold {
0%, 100% { transform: scale(1); filter: drop-shadow(0 0 40px rgba(247, 201, 72, 0.2)); }
50% { transform: scale(1.05); filter: drop-shadow(0 0 80px rgba(247, 201, 72, 0.4)); }
}
.splash-screen h1 {
font-size: 38px;
font-weight: 300;
letter-spacing: 8px;
background: linear-gradient(to right, #f7c948, #d9caff, #f7c948);

background-clip: text;
color: transparent;
animation: shimmerGold 3s linear infinite;
margin-bottom: 8px;
}
@keyframes shimmerGold {
0% { background-position: 0% center; }
100% { background-position: 200% center; }
}
.splash-screen .sub {
font-size: 16px;
color: #b3a1d4;

opacity: 0.7;
}
.splash-screen .enter-btn {
margin-top: 28px;
background: rgba(247, 201, 72, 0.08);
border: 1px solid rgba(247, 201, 72, 0.15);
border-radius: 60px;
padding: 10px 40px;
font-size: 14px;
color: #f7c948;

transition: 0.4s;

}
.splash-screen .enter-btn:hover {

border-color: #f7c948;
box-shadow: 0 0 40px rgba(247, 201, 72, 0.15);
transform: scale(1.02);
}
.splash-screen .sparkles {
position: absolute;
inset: 0;
pointer-events: none;
overflow: hidden;
}
.splash-screen .sparkle {
position: absolute;
width: 4px;
height: 4px;
background: #f7c948;
border-radius: 50%;
animation: floatSparkle 6s infinite linear;
opacity: 0;
}
@keyframes floatSparkle {
0% { opacity: 0; transform: translateY(0) scale(0); }
20% { opacity: 0.8; transform: translateY(-20px) scale(1); }
80% { opacity: 0.8; transform: translateY(-80px) scale(1); }
100% { opacity: 0; transform: translateY(-120px) scale(0); }
}

.glass-card {
background: rgba(22, 16, 40, 0.2);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border-radius: 24px;
padding: 18px 16px 14px 16px;
border: 1px solid rgba(160, 120, 255, 0.06);

transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

flex-direction: column;
min-height: 130px;
position: relative;
transform-style: preserve-3d;
perspective: 600px;
}
.glass-card:hover {
transform: translateY(-4px) scale(1.02);
border-color: rgba(247, 201, 72, 0.3);
box-shadow: 0 0 30px rgba(247, 201, 72, 0.15), 0 8px 30px rgba(0,0,0,0.3);
background: rgba(30, 22, 50, 0.25);
}
.glass-card.glow-pop {
animation: glowPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes glowPop {
0% { transform: scale(1); box-shadow: 0 0 0 rgba(247,201,72,0); border-color: rgba(160,120,255,0.06); }
30% { transform: scale(1.08); box-shadow: 0 0 60px rgba(247,201,72,0.4), 0 0 120px rgba(247,201,72,0.15); border-color: #f7c948; }
100% { transform: scale(1); box-shadow: 0 0 20px rgba(247,201,72,0.1); border-color: rgba(247,201,72,0.2); }
}
.glass-card::after {
content: '';
position: absolute;
inset: -1px;
border-radius: 24px;
padding: 1px;
background: conic-gradient(from 0deg, transparent, rgba(247,201,72,0.15), transparent, rgba(247,201,72,0.15), transparent);
-webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
-webkit-mask-composite: xor;
mask-composite: exclude;
opacity: 0;
transition: opacity 0.5s ease;
pointer-events: none;
}
.glass-card:hover::after { opacity: 1; }
.glass-card .card-emoji { font-size: 28px; margin-bottom: 2px; line-height: 1; }
.glass-card .card-name { font-size: 22px; font-weight: 600; color: #f0eaff; line-height: 1.2; margin-bottom: 2px; word-break: break-word; }
.glass-card .card-tag { font-size: 11px; color: #b28aff; background: rgba(130,70,255,0.08); padding: 1px 10px; border-radius: 30px; display: inline-block; align-self: flex-start; margin-bottom: 4px; }
.glass-card .card-desc { font-size: 14px; color: #c8b8e0; line-height: 1.5; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.glass-card .card-meta { font-size: 9px; color: #6c5890; margin-top: 6px; border-top: 1px solid rgba(160,120,255,0.04); padding-top: 4px; display: flex; justify-content: space-between; }
.glass-card .card-color-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 24px 24px 0 0; background: #b28aff; }
.glass-card .delete-card { position: absolute; top: 6px; right: 8px; color: #6c5890; font-size: 11px; cursor: pointer; opacity: 0.3; transition: 0.2s; background: none; border: none; z-index: 2; }
.glass-card .delete-card:hover { opacity: 1; color: #f78b8b; }
.glass-card.egg-card .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; min-height: 120px; }
.glass-card.egg-card.flipped .card-inner { transform: rotateY(180deg); }
.glass-card.egg-card .card-front, .glass-card.egg-card .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; top: 0; left: 0; padding: 10px; }
.glass-card.egg-card .card-back { transform: rotateY(180deg); background: rgba(247,201,72,0.05); border-radius: 20px; }
.glass-card.egg-card .card-back .egg-reveal { font-size: 14px; color: #f7c948; text-align: center; line-height: 1.6; }
.glass-card.egg-card .card-back .egg-reveal i { font-size: 24px; display: block; margin-bottom: 4px; }
.egg-badge { position: absolute; top: 6px; left: 8px; font-size: 10px; background: rgba(247,201,72,0.12); border-radius: 30px; padding: 0 8px; color: #f7c948; z-index: 2; }

// ===== 工具 =====
function showToast(msg) {
toastEl.textContent = msg;
toastEl.classList.add('show');
clearTimeout(toastTimer);
toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}
function catSpeakMsg(msg) {
catSpeak.textContent = '🐱 ' + msg;
catSpeak.classList.add('show');
clearTimeout(catSpeakTimer);
catSpeakTimer = setTimeout(() => catSpeak.classList.remove('show'), 3000);
}
function showMemory(emoji) {
const text = photoMemories[emoji];
if (!text) return;
memoryEmoji.textContent = emoji;
memoryText.textContent = text;
memoryToast.classList.add('show');
clearTimeout(memoryTimer);
memoryTimer = setTimeout(() => {
memoryToast.classList.remove('show');
}, 5000);
}
function getSceneCards(tag) { return allCards[tag] || []; }
// ===== 渲染卡片 =====
function renderCards(tag) {
if (isAtticMode) return;
const scene = sceneData[tag];
if (!scene) return;
const cards = getSceneCards(tag);
applyWallpaper();
if (cards.length === 0) {
cardGrid.innerHTML = `<div class="add-card" onclick="window.addNewCard()"><i class="fas fa-plus"></i></div>`;
return;
}
let html = '';
cards.forEach(card => {
const active = card.id === currentCardId ? 'active' : '';
const isEgg = card.isEgg || false;
const eggClass = isEgg ? 'egg-card' : '';
const emoji = card.emoji || '📦';
const isSpeak = card.speak ? true : false;
html += `
<div class="glass-card ${eggClass} ${active}" data-id="${card.id}" data-speak="${isSpeak ? card.speak : ''}" style="border-color: ${active ? 'rgba(160,120,255,0.2)' : 'rgba(160,120,255,0.06)'};">
<div class="card-color-bar" style="background:${card.color || '#b28aff'};"></div>
<button class="delete-card" data-id="${card.id}"><i class="fas fa-times-circle"></i></button>
${isEgg ? `<div class="egg-badge">🥚 彩蛋</div>` : ''}
${isSpeak ? `<div style="position:absolute;bottom:6px;right:8px;font-size:14px;color:#f7c948;opacity:0.5;">🔊</div>` : ''}
<div class="card-inner">
<div class="card-front">
<div class="card-emoji">${emoji}</div>
<div class="card-name">${card.name}</div>
<div class="card-tag">${card.tag || '未分类'}</div>
<div class="card-desc">${card.desc || ''}</div>
<div class="card-meta"><span>${card.tag || ' '}</span><span>${card.updated || ''}</span></div>
</div>
${isEgg ? `
<div class="card-back">
<div class="egg-reveal"><i class="fas fa-gift"></i>${card.eggReveal || '🎉 惊喜！'}</div>
</div>` : ''}
</div>
</div>
`;
});
html += `<div class="add-card" onclick="window.addNewCard()"><i class="fas fa-plus"></i></div>`;
cardGrid.innerHTML = html;
cardGrid.querySelectorAll('.glass-card').forEach(el => {
el.addEventListener('click', function(e) {
if (e.target.closest('.delete-card')) return;
const id = this.dataset.id;
if (!id) return;
// 发光变大特效
this.classList.remove('glow-pop');
void this.offsetWidth;
this.classList.add('glow-pop');
const card = getSceneCards(tag).find(c => c.id === id);
if (card && card.isEgg) {
this.classList.toggle('flipped');
return;
}
if (card && card.speak) {
catSpeakMsg(card.speak);
}
loadCard(tag, id);
});
});
cardGrid.querySelectorAll('.delete-card').forEach(el => {
el.addEventListener('click', function(e) {
e.stopPropagation();
const id = this.dataset.id;
if (id) deleteCardById(tag, id);
});
});
if (currentCardId && cards.some(c => c.id === currentCardId)) {
loadCard(tag, currentCardId);
} else if (cards.length > 0) {
loadCard(tag, cards[0].id);
} else {
clearDetail();
}
}
function loadCard(tag, id) {
const cards = getSceneCards(tag);
const card = cards.find(c => c.id === id);
if (!card) return;
currentCardId = id;
cardNameInput.value = card.name;
cardEmojiInput.value = card.emoji || '';
cardTagInput.value = card.tag || '';
cardDescInput.value = card.desc || '';
cardColorInput.value = card.color || '#b28aff';
renderCards(tag);
cardGrid.querySelectorAll('.glass-card').forEach(el => {
el.classList.toggle('active', el.dataset.id === id);
});
}
function clearDetail() {
cardNameInput.value = '';
cardEmojiInput.value = '';
cardTagInput.value = '';
cardDescInput.value = '';
cardColorInput.value = '#b28aff';
currentCardId = null;
}
function saveCurrentCard() {
if (!currentCardId) { showToast('⚠️ 请先选择一张卡片'); return; }
const cards = getSceneCards(currentTag);
const card = cards.find(c => c.id === currentCardId);
if (!card) return;
card.name = cardNameInput.value.trim() || '未命名';
card.emoji = cardEmojiInput.value.trim() || '📦';
card.tag = cardTagInput.value.trim() || '未分类';
card.desc = cardDescInput.value.trim();
card.color = cardColorInput.value;
card.updated = new Date().toLocaleString('zh-CN', { hour12: false });
renderCards(currentTag);
showToast('✅ 已保存');
autoSave();
}
function addNewCard() {
const cards = getSceneCards(currentTag);
const newCard = {
id: String(nextId++),
name: '新卡片',
emoji: '📦',
tag: '未分类',
desc: '点击编辑添加描述……',
color: '#b28aff',
updated: new Date().toLocaleString('zh-CN', { hour12: false })
};
cards.push(newCard);
currentCardId = newCard.id;
renderCards(currentTag);
loadCard(currentTag, currentCardId);
showToast('🪄 添加了新卡片');
autoSave();
}
function deleteCardById(tag, id) {
const cards = getSceneCards(tag);
if (cards.length <= 1) { showToast('⚠️ 至少保留一张'); return; }
const idx = cards.findIndex(c => c.id === id);
if (idx === -1) return;
cards.splice(idx, 1);
if (currentCardId === id) {
currentCardId = cards[0]?.id || null;
}
renderCards(tag);
if (currentCardId) loadCard(tag, currentCardId);
else clearDetail();
showToast('🗑️ 已删除');
autoSave();
}
function deleteCurrentCard() {
if (currentCardId) deleteCardById(currentTag, currentCardId);
else showToast('⚠️ 请选择一张卡片');
}
// ===== 阁楼 =====
function renderCorkboard() {
if (corkboardNotes.length === 0) {
corkboard.innerHTML = `<div style="color:#6c5890; font-size:12px; padding:20px; text-align:center; width:100%;">📌 软木板空空的，写点什么钉上来吧</div>`;
return;
}
let html = '';
corkboardNotes.forEach((note, idx) => {
html += `
<div class="pin-note">
<button class="pin-delete" data-idx="${idx}"><i class="fas fa-times"></i></button>
${note.text}
<span class="note-time">${note.time || ''}</span>
</div>
`;
});
corkboard.innerHTML = html;
corkboard.querySelectorAll('.pin-delete').forEach(el => {
el.addEventListener('click', function() {
const idx = parseInt(this.dataset.idx);
corkboardNotes.splice(idx, 1);
renderCorkboard();
saveCorkboard();
showToast('📌 纸条已取下');
});
});
}
function pinNote() {
const text = noteInput.value.trim();
if (!text) { showToast('✏️ 写点什么再钉吧'); return; }
corkboardNotes.push({
text: text,
time: new Date().toLocaleString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' })
});
noteInput.value = '';
renderCorkboard();
saveCorkboard();
showToast('📌 钉好了！');
}
function saveCorkboard() {
localStorage.setItem('corkboard_notes', JSON.stringify(corkboardNotes));
}
function loadCorkboard() {
try {
const data = localStorage.getItem('corkboard_notes');
if (data) corkboardNotes = JSON.parse(data);
} catch(e) {}
}
// ===== 日记 =====
function renderDiary() {
if (diaryEntries.length === 0) {
diaryEntriesEl.innerHTML = '<div style="color:#6c5890; font-size:10px; padding:4px 0;">还没有日记，写下今天的心情吧</div>';
return;
}
let html = '';
diaryEntries.slice(-5).reverse().forEach(entry => {
html += `<div class="diary-entry">${entry}</div>`;
});
diaryEntriesEl.innerHTML = html;
}
function saveDiary() {
const text = diaryInput.value.trim();
if (!text) { showToast('📝 写点什么再保存吧'); return; }
const entry = new Date().toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' ' + text;
diaryEntries.push(entry);
diaryInput.value = '';
renderDiary();
localStorage.setItem('diary_entries', JSON.stringify(diaryEntries));
showToast('📖 日记已保存');
}
function loadDiary() {
try {
const data = localStorage.getItem('diary_entries');
if (data) diaryEntries = JSON.parse(data);
} catch(e) {}
}
// ===== 照片墙 =====
function renderPhotoWall() {
const emojis = Object.keys(photoMemories);
let html = '';
emojis.forEach(emoji => {
html += `<div class="photo" data-emoji="${emoji}">${emoji}</div>`;
});
photoWall.innerHTML = html;
photoWall.querySelectorAll('.photo').forEach(el => {
el.addEventListener('click', function() {
const emoji = this.dataset.emoji;
showMemory(emoji);
// 点击动画
this.style.transform = 'scale(0.9)';
setTimeout(() => {
this.style.transform = '';
}, 200);
});
});
}
// ===== 传送门 =====
function openPortal() {
const tags = Object.keys(sceneData).filter(t => t !== 'portal');
if (isAtticMode) {
showToast('🌀 从阁楼下来再传送吧~');
return;
}
const target = tags[Math.floor(Math.random() * tags.length)];
showToast(`✨ 传送门开启 → ${sceneData[target].name}`);
setTimeout(() => { switchScene(target); }, 300);
}
// ===== 切换场景 =====
function switchScene(tag) {
if (tag === 'attic') {
isAtticMode = true;
cardGrid.classList.add('hidden');
atticContainer.classList.add('active');
tagBtns.forEach(btn => {
btn.classList.toggle('active', btn.dataset.tag === tag);
});
renderCorkboard();
renderDiary();
renderPhotoWall();
showToast('🪜 爬上阁楼 · 吱呀吱呀');
return;
}
isAtticMode = false;
cardGrid.classList.remove('hidden');
atticContainer.classList.remove('active');
currentTag = tag;
tagBtns.forEach(btn => {
btn.classList.toggle('active', btn.dataset.tag === tag);
});
const scene = sceneData[tag];
if (scene) {
const cards = getSceneCards(tag);
if (cards.length > 0) {
currentCardId = cards[0].id;
} else {
currentCardId = null;
clearDetail();
}
renderCards(tag);
if (currentCardId) loadCard(tag, currentCardId);
showToast(`🚪 进入 ${scene.name}`);
}
autoSave();
}
// ===== 壁纸 =====
function applyWallpaper() {
if (customWallpaper) {
appContainer.style.backgroundImage = `url(${customWallpaper})`;
} else if (wallpaperMap[currentWallpaper]) {
appContainer.style.backgroundImage = wallpaperMap[currentWallpaper];
} else {
appContainer.style.backgroundImage = 'none';
appContainer.style.backgroundColor = 'rgba(10,6,20,0.3)';
}
appContainer.style.backgroundSize = 'cover';
appContainer.style.backgroundPosition = 'center';
}
function setWallpaper(wp) {
currentWallpaper = wp;
customWallpaper = null;
wallpaperLabel.textContent = wallpaperNames[wp] || wp;
document.querySelectorAll('.wp-dot:not(.upload-dot)').forEach(el => {
el.classList.toggle('active', el.dataset.wallpaper === wp);
});
applyWallpaper();
localStorage.setItem('qingyun_wallpaper', wp);
showToast(`🖼️ 壁纸: ${wallpaperNames[wp]}`);
}
// ===== 存储 =====
function autoSave() {
try {
const data = { allCards, currentTag, currentCardId, nextId };
localStorage.setItem('qingyun_card_data', JSON.stringify(data));
} catch(e) {}
}
function loadData() {
try {
const raw = localStorage.getItem('qingyun_card_data');
if (raw) {
const data = JSON.parse(raw);
if (data.allCards) {
Object.keys(data.allCards).forEach(key => {
if (allCards[key]) allCards[key] = data.allCards[key];
});
}
if (data.currentTag) currentTag = data.currentTag;
if (data.currentCardId) currentCardId = data.currentCardId;
if (data.nextId) nextId = data.nextId;
return true;
}
} catch(e) {}
return false;
}
// ===== 事件 =====
tagBtns.forEach(btn => {
btn.addEventListener('click', function() {
switchScene(this.dataset.tag);
});
});
saveBtn.addEventListener('click', saveCurrentCard);
deleteBtn.addEventListener('click', deleteCurrentCard);
portalGoBtn.addEventListener('click', openPortal);
pinNoteBtn.addEventListener('click', pinNote);
noteInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') pinNote(); });
clearCorkboardBtn.addEventListener('click', function() {
if (confirm('清空所有纸条？')) {
corkboardNotes = [];
renderCorkboard();
saveCorkboard();
showToast('🧹 软木板清空了');
}
});
saveDiaryBtn.addEventListener('click', saveDiary);
document.querySelectorAll('.wp-dot:not(.upload-dot)').forEach(el => {
el.addEventListener('click', function() { setWallpaper(this.dataset.wallpaper); });
});
document.getElementById('uploadWallpaperBtn').addEventListener('click', function() {
document.getElementById('wallpaperUpload').click();
});
document.getElementById('wallpaperUpload').addEventListener('change', function(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(ev) {
customWallpaper = ev.target.result;
currentWallpaper = 'custom';
wallpaperLabel.textContent = '自定义';
document.querySelectorAll('.wp-dot').forEach(el => el.classList.remove('active'));
document.getElementById('uploadWallpaperBtn').classList.add('active');
applyWallpaper();
localStorage.setItem('qingyun_custom_wallpaper', customWallpaper);
showToast('🖼️ 自定义壁纸已应用');
};
reader.readAsDataURL(file);
this.value = '';
});
const savedCustom = localStorage.getItem('qingyun_custom_wallpaper');
if (savedCustom) {
customWallpaper = savedCustom;
currentWallpaper = 'custom';
wallpaperLabel.textContent = '自定义';
document.getElementById('uploadWallpaperBtn').classList.add('active');
applyWallpaper();
}
document.addEventListener('keydown', function(e) {
if ((e.ctrlKey || e.metaKey) && e.key === 's') {
e.preventDefault();
if (isAtticMode) {
if (document.activeElement === noteInput) pinNote();
else if (document.activeElement === diaryInput) saveDiary();
else showToast('💾 在阁楼可以钉纸条或保存日记');
} else {
saveCurrentCard();
autoSave();
showToast('💾 已保存');
}
}
if (e.key === 'p' || e.key === 'P') openPortal();
const num = parseInt(e.key);
if (num >= 1 && num <= 9) {
const tags = Object.keys(sceneData);
const tagList = [...tags.slice(0, 8), 'attic'];
if (tagList[num - 1]) switchScene(tagList[num - 1]);
}
});
// ===== 时钟天气 =====
const clockTime = document.getElementById('navClockTime');
const clockDate = document.getElementById('navClockDate');
const weatherTemp = document.getElementById('navWeatherTemp');
const weatherDesc = document.getElementById('navWeatherDesc');
function updateClock() {
const now = new Date();
clockTime.textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
clockDate.textContent = now.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();
const wList = ['晴', '多云', '阴', '小雨', '晴'];
let wi = 0;
function updateW() {
const w = wList[wi % wList.length];
wi++;
weatherDesc.textContent = w;
weatherTemp.textContent = (20 + Math.floor(Math.random() * 12)) + '°C';
}
updateW();
setInterval(updateW, 30000);
// ===== 暴露 =====
window.addNewCard = addNewCard;
// ===== 初始化 =====
loadData();
loadCorkboard();
loadDiary();
if (!sceneData[currentTag]) currentTag = 'home';
if (!allCards[currentTag]) allCards[currentTag] = [];
const cards = getSceneCards(currentTag);
if (cards.length > 0 && !cards.some(c => c.id === currentCardId)) {
currentCardId = cards[0].id;
}
const savedWp = localStorage.getItem('qingyun_wallpaper');
if (savedWp && wallpaperMap[savedWp]) {
currentWallpaper = savedWp;
}
document.querySelectorAll('.wp-dot:not(.upload-dot)').forEach(el => {
el.classList.toggle('active', el.dataset.wallpaper === currentWallpaper);
});
wallpaperLabel.textContent = wallpaperNames[currentWallpaper] || currentWallpaper;
renderCards(currentTag);
if (currentCardId) loadCard(currentTag, currentCardId);
else clearDetail();
tagBtns.forEach(btn => {
btn.classList.toggle('active', btn.dataset.tag === currentTag);
});
// 预渲染照片墙
renderPhotoWall();
// 如果欢迎屏还没消失（用户可能手动关闭），确保它消失
setTimeout(() => {
if (splashScreen.style.display !== 'none') {
splashScreen.classList.add('hide');
setTimeout(() => {
splashScreen.style.display = 'none';
}, 1200);
}
}, 8000);
console.log('🌍 清云小世界 · 阁楼已开放 🪜');
console.log('📸 点击照片墙上的emoji，回忆会浮现');
console.log('✨ 点击卡片会发光并变大');
console.log('🚪 快捷键: 1-9 切换场景 | P 传送门 | Ctrl+S 保存');
setInterval(() => { autoSave(); }, 30000);
window.switchScene = switchScene;
window.openPortal = openPortal;
})();
</script>
</body>
</html>
