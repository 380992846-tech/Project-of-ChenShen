# docker-compose.yml
version: '3.8'

services:
  # 元数据集群 - etcd
  metadata-0:
    image: quay.io/coreos/etcd:v3.5.12
    command: etcd --name metadata-0 --data-dir /etcd-data --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379 --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://0.0.0.0:2380 --initial-cluster metadata-0=http://0.0.0.0:2380,metadata-1=http://metadata-1:2380,metadata-2=http://metadata-2:2380,metadata-3=http://metadata-3:2380,metadata-4=http://metadata-4:2380 --initial-cluster-token etcd-cluster --initial-cluster-state new
    ports:
      - "2379:2379"
      - "2380:2380"

  metadata-1:
    image: quay.io/coreos/etcd:v3.5.12
    command: etcd --name metadata-1 --data-dir /etcd-data --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379 --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://0.0.0.0:2380 --initial-cluster metadata-0=http://metadata-0:2380,metadata-1=http://0.0.0.0:2380,metadata-2=http://metadata-2:2380,metadata-3=http://metadata-3:2380,metadata-4=http://metadata-4:2380 --initial-cluster-token etcd-cluster --initial-cluster-state new

  metadata-2:
    image: quay.io/coreos/etcd:v3.5.12
    command: etcd --name metadata-2 --data-dir /etcd-data --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379 --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://0.0.0.0:2380 --initial-cluster metadata-0=http://metadata-0:2380,metadata-1=http://metadata-1:2380,metadata-2=http://0.0.0.0:2380,metadata-3=http://metadata-3:2380,metadata-4=http://metadata-4:2380 --initial-cluster-token etcd-cluster --initial-cluster-state new

  metadata-3:
    image: quay.io/coreos/etcd:v3.5.12
    command: etcd --name metadata-3 --data-dir /etcd-data --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379 --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://0.0.0.0:2380 --initial-cluster metadata-0=http://metadata-0:2380,metadata-1=http://metadata-1:2380,metadata-2=http://metadata-2:2380,metadata-3=http://0.0.0.0:2380,metadata-4=http://metadata-4:2380 --initial-cluster-token etcd-cluster --initial-cluster-state new

  metadata-4:
    image: quay.io/coreos/etcd:v3.5.12
    command: etcd --name metadata-4 --data-dir /etcd-data --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379 --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://0.0.0.0:2380 --initial-cluster metadata-0=http://metadata-0:2380,metadata-1=http://metadata-1:2380,metadata-2=http://metadata-2:2380,metadata-3=http://metadata-3:2380,metadata-4=http://0.0.0.0:2380 --initial-cluster-token etcd-cluster --initial-cluster-state new

  # 路由层
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    ports:
      - "8080:8080"
    environment:
      - METADATA_ENDPOINTS=metadata-0:2379,metadata-1:2379,metadata-2:2379,metadata-3:2379,metadata-4:2379
    depends_on:
      - metadata-0
      - metadata-1
      - metadata-2
      - metadata-3
      - metadata-4

  # 监控
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
