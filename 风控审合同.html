<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法律风控小助手 · 流光紫境</title>

    <!-- PDF.js 核心库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js">
    </script>

    <style>
        /* ============================================================
           清华紫黑 · 流光渐变 · 毛玻璃特效
           ============================================================ */

        /* ---------- 全局 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: #0a0618;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* ---------- 流光动态背景 ---------- */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(106, 27, 154, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(156, 77, 204, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                #0a0618;
            overflow: hidden;
        }

        /* 流光线条 - 动态旋转 */
        .bg-canvas::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    rgba(106, 27, 154, 0.08) 60deg,
                    rgba(156, 77, 204, 0.12) 120deg,
                    rgba(124, 58, 237, 0.08) 180deg,
                    rgba(106, 27, 154, 0.15) 240deg,
                    rgba(156, 77, 204, 0.08) 300deg,
                    transparent 360deg);
            animation: spinBg 30s linear infinite;
            transform-origin: center;
        }

        @keyframes spinBg {
            0% {
                transform: rotate(0deg) scale(1.2);
            }
            100% {
                transform: rotate(360deg) scale(1.2);
            }
        }

        /* 浮动光晕 */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        .glow-orb.orb1 {
            width: 500px;
            height: 500px;
            background: rgba(106, 27, 154, 0.25);
            top: -100px;
            left: -100px;
            animation-duration: 14s;
        }

        .glow-orb.orb2 {
            width: 400px;
            height: 400px;
            background: rgba(156, 77, 204, 0.2);
            bottom: -80px;
            right: -80px;
            animation-duration: 18s;
            animation-delay: 2s;
        }

        .glow-orb.orb3 {
            width: 300px;
            height: 300px;
            background: rgba(124, 58, 237, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 20s;
            animation-delay: 4s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, -20px) scale(1.05);
            }
        }

        /* ---------- 主容器 ---------- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            width: 100%;
        }

        /* ---------- 头部 ---------- */
        .header {
            background: rgba(22, 21, 40, 0.55);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(106, 27, 154, 0.25);
            border-radius: 24px 24px 0 0;
            padding: 22px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 4px 60px rgba(106, 27, 154, 0.12);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6A1B9A, #9c4dcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 40px rgba(106, 27, 154, 0.35);
            position: relative;
            overflow: hidden;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.15) 100%);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #f0ecff;
            letter-spacing: 0.5px;
        }

        .logo-text span {
            background: linear-gradient(135deg, #c084fc, #9c4dcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            background: rgba(106, 27, 154, 0.2);
            border: 1px solid rgba(106, 27, 154, 0.25);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.78rem;
            color: #b8a8d8;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ed573;
            display: inline-block;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        /* ---------- 主卡片 ---------- */
        .main-card {
            background: rgba(22, 21, 40, 0.6);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border: 1px solid rgba(106, 27, 154, 0.2);
            border-top: none;
            border-radius: 0 0 24px 24px;
            padding: 32px 34px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        /* ---------- 上传区域 ---------- */
        .upload-area {
            border: 2px dashed rgba(106, 27, 154, 0.25);
            border-radius: 18px;
            padding: 44px 20px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            background: rgba(106, 27, 154, 0.04);
        }

        .upload-area:hover {
            border-color: rgba(156, 77, 204, 0.5);
            background: rgba(106, 27, 154, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(106, 27, 154, 0.08);
        }

        .upload-area.dragover {
            border-color: #9c4dcc;
            background: rgba(106, 27, 154, 0.14);
            box-shadow: 0 0 60px rgba(106, 27, 154, 0.15);
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 52px;
            margin-bottom: 12px;
            display: block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .upload-area h3 {
            color: #f0ecff;
            font-size: 1.15rem;
            font-weight: 500;
        }

        .upload-area p {
            color: #8a7aa8;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ---------- 文件信息 ---------- */
        .file-info {
            display: none;
            background: rgba(106, 27, 154, 0.08);
            border: 1px solid rgba(106, 27, 154, 0.2);
            border-radius: 14px;
            padding: 14px 22px;
            margin-top: 18px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            animation: slideUp 0.4s ease;
        }

        .file-info.show {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-name {
            color: #f0ecff;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-name .ext {
            background: rgba(106, 27, 154, 0.2);
            padding: 2px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            color: #9c4dcc;
            font-weight: 600;
        }

        .file-name small {
            color: #8a7aa8;
            font-weight: 400;
            font-size: 0.8rem;
        }

        .btn-remove {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.2);
            color: #ff6b81;
            padding: 6px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        .btn-remove:hover {
            background: rgba(255, 71, 87, 0.2);
            border-color: #ff4757;
            color: #ff4757;
        }

        /* ---------- 配置区域 ---------- */
        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid rgba(106, 27, 154, 0.12);
        }

        .config-row label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.82rem;
            color: #8a7aa8;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .config-row label.full {
            grid-column: 1 / -1;
        }

        .config-row input,
        .config-row select {
            background: rgba(11, 10, 22, 0.6);
            border: 1px solid rgba(106, 27, 154, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #f0ecff;
            font-size: 0.95rem;
            transition: all 0.3s;
            outline: none;
            backdrop-filter: blur(4px);
        }

        .config-row input:focus,
        .config-row select:focus {
            border-color: #9c4dcc;
            box-shadow: 0 0 30px rgba(106, 27, 154, 0.15), inset 0 0 20px rgba(106, 27, 154, 0.04);
            background: rgba(11, 10, 22, 0.8);
        }

        .config-row input::placeholder {
            color: #4a4460;
        }

        .config-row select option {
            background: #161528;
            color: #f0ecff;
        }

        /* ---------- 操作按钮 ---------- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 22px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6A1B9A, #9c4dcc);
            border: none;
            color: #fff;
            padding: 14px 40px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 40px rgba(106, 27, 154, 0.3);
            flex: 1;
            min-width: 160px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.1) 100%);
            pointer-events: none;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    rgba(255, 255, 255, 0.05) 60deg,
                    transparent 120deg,
                    rgba(255, 255, 255, 0.05) 180deg,
                    transparent 240deg,
                    rgba(255, 255, 255, 0.05) 300deg,
                    transparent 360deg);
            animation: shimmerBtn 6s linear infinite;
            pointer-events: none;
        }

        @keyframes shimmerBtn {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 60px rgba(106, 27, 154, 0.45);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(106, 27, 154, 0.15);
            color: #8a7aa8;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            border-color: rgba(106, 27, 154, 0.3);
            color: #f0ecff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* ---------- 状态 ---------- */
        .status {
            margin-top: 18px;
            padding: 14px 20px;
            border-radius: 14px;
            background: rgba(106, 27, 154, 0.06);
            border: 1px solid rgba(106, 27, 154, 0.08);
            color: #8a7aa8;
            display: none;
            font-size: 0.95rem;
            animation: slideUp 0.3s ease;
        }

        .status.show {
            display: block;
        }
        .status.loading {
            border-color: rgba(106, 27, 154, 0.3);
            color: #c084fc;
            background: rgba(106, 27, 154, 0.08);
        }
        .status.done {
            border-color: rgba(46, 213, 115, 0.3);
            color: #2ed573;
            background: rgba(46, 213, 115, 0.06);
        }
        .status.error {
            border-color: rgba(255, 71, 87, 0.3);
            color: #ff6b81;
            background: rgba(255, 71, 87, 0.06);
        }

        /* ---------- 结果区域 ---------- */
        .result-area {
            display: none;
            margin-top: 32px;
            border-top: 1px solid rgba(106, 27, 154, 0.12);
            padding-top: 28px;
            animation: slideUp 0.5s ease;
        }

        .result-area.show {
            display: block;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .result-header h2 {
            font-size: 1.3rem;
            color: #f0ecff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .risk-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .risk-stat {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(106, 27, 154, 0.08);
            border-radius: 14px;
            padding: 16px 18px;
            text-align: center;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .risk-stat:hover {
            border-color: rgba(106, 27, 154, 0.15);
            transform: translateY(-2px);
        }

        .risk-stat .num {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .risk-stat .label {
            font-size: 0.8rem;
            color: #8a7aa8;
            margin-top: 2px;
        }

        .risk-stat.high .num {
            color: #ff4757;
            text-shadow: 0 0 40px rgba(255, 71, 87, 0.2);
        }
        .risk-stat.medium .num {
            color: #ffa502;
            text-shadow: 0 0 40px rgba(255, 165, 2, 0.2);
        }
        .risk-stat.low .num {
            color: #2ed573;
            text-shadow: 0 0 40px rgba(46, 213, 115, 0.2);
        }

        .analysis-content {
            background: rgba(11, 10, 22, 0.5);
            border: 1px solid rgba(106, 27, 154, 0.08);
            border-radius: 16px;
            padding: 24px 28px;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.9;
            max-height: 600px;
            overflow-y: auto;
            color: #d4cee0;
            backdrop-filter: blur(4px);
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }

        .analysis-content .risk-high {
            color: #ff4757;
            font-weight: 600;
        }
        .analysis-content .risk-medium {
            color: #ffa502;
            font-weight: 600;
        }
        .analysis-content .risk-low {
            color: #2ed573;
            font-weight: 600;
        }

        /* ---------- 底部 ---------- */
        .footer {
            text-align: center;
            padding: 24px 0 8px;
            color: #5a4a78;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #7a5a9a;
            text-decoration: none;
        }

        /* ---------- 滚动条 ---------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(11, 10, 22, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #6A1B9A, #9c4dcc);
            border-radius: 6px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 16px 20px;
                flex-direction: column;
                align-items: flex-start;
            }
            .main-card {
                padding: 20px 16px;
            }
            .config-row {
                grid-template-columns: 1fr;
            }
            .config-row label.full {
                grid-column: 1;
            }
            .actions {
                flex-direction: column;
            }
            .btn-primary {
                width: 100%;
            }
            .risk-summary {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 10px;
            }
            .risk-stat .num {
                font-size: 1.6rem;
            }
            .logo-text {
                font-size: 18px;
            }
            .upload-area {
                padding: 30px 16px;
            }
            .upload-icon {
                font-size: 38px;
            }
        }

        @media (max-width: 480px) {
            .risk-summary {
                grid-template-columns: 1fr;
            }
            .analysis-content {
                padding: 16px 18px;
                font-size: 0.88rem;
            }
            .header {
                border-radius: 16px 16px 0 0;
            }
            .main-card {
                border-radius: 0 0 16px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 流光背景 ===== -->
    <div class="bg-canvas"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="glow-orb orb3"></div>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⚖️</div>
                <div class="logo-text">法律风控 · <span>小助手</span></div>
            </div>
            <div class="badge">
                <span class="dot"></span>
                本地处理 · 数据不上云
            </div>
        </div>

        <!-- ===== 主卡片 ===== -->
        <div class="main-card">

            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <span class="upload-icon">📄</span>
                <h3>点击或拖拽上传 PDF 合同</h3>
                <p>支持 .pdf 格式 · 文件仅在本地浏览器中处理</p>
                <input type="file" id="fileInput" accept=".pdf">
            </div>

            <!-- 文件信息 -->
            <div class="file-info" id="fileInfo">
                <span class="file-name" id="fileName">
                    合同.pdf
                    <span class="ext">PDF</span>
                    <small>已加载</small>
                </span>
                <button class="btn-remove" id="btnRemove">✕ 移除</button>
            </div>

            <!-- API 配置 -->
            <div class="config-row">
                <label class="full">
                    🔑 API Key
                    <input type="password" id="apiKey" placeholder="sk-... 请输入你的 DeepSeek API Key">
                </label>
                <label>
                    📊 审查深度
                    <select id="depthSelect">
                        <option value="quick">快速扫描</option>
                        <option value="standard" selected>标准审查</option>
                        <option value="deep">深度分析</option>
                    </select>
                </label>
                <label>
                    🌐 模型
                    <select id="modelSelect">
                        <option value="deepseek-chat">DeepSeek Chat</option>
                    </select>
                </label>
            </div>

            <!-- 操作按钮 -->
            <div class="actions">
                <button class="btn-primary" id="btnAnalyze">✨ 开始风控分析</button>
                <button class="btn-secondary" id="btnClear">清空结果</button>
            </div>

            <!-- 状态 -->
            <div class="status" id="status"></div>

            <!-- ===== 结果区域 ===== -->
            <div class="result-area" id="resultArea">
                <div class="result-header">
                    <h2>📊 风险审查报告</h2>
                </div>

                <div class="risk-summary" id="riskSummary">
                    <div class="risk-stat high">
                        <div class="num" id="highCount">0</div>
                        <div class="label">🔴 高风险</div>
                    </div>
                    <div class="risk-stat medium">
                        <div class="num" id="mediumCount">0</div>
                        <div class="label">🟡 中风险</div>
                    </div>
                    <div class="risk-stat low">
                        <div class="num" id="lowCount">0</div>
                        <div class="label">🟢 低风险 / 建议</div>
                    </div>
                </div>

                <div class="analysis-content" id="analysisContent">
                    分析结果将在这里显示...
                </div>
            </div>

        </div>

        <div class="footer">
            ⚖️ 法律风控小助手 · 基于 DeepSeek RAG 技术 · 数据本地处理 · 流光紫境
        </div>
    </div>

    <!-- ================================================================
    JavaScript 逻辑
    ================================================================ -->
    <script>
        // ---------- PDF.js ----------
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // ---------- DOM ----------
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const btnRemove = document.getElementById('btnRemove');
        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('modelSelect');
        const depthSelect = document.getElementById('depthSelect');
        const btnAnalyze = document.getElementById('btnAnalyze');
        const btnClear = document.getElementById('btnClear');
        const status = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        const analysisContent = document.getElementById('analysisContent');
        const highCount = document.getElementById('highCount');
        const mediumCount = document.getElementById('mediumCount');
        const lowCount = document.getElementById('lowCount');

        // ---------- 状态 ----------
        let pdfText = '';
        let currentFile = null;

        // ---------- 工具 ----------
        function setStatus(msg, type = '') {
            status.textContent = msg;
            status.className = 'status show ' + type;
        }

        function hideStatus() {
            status.className = 'status';
        }

        function showResult(text) {
            resultArea.classList.add('show');
            analysisContent.textContent = text;
            const high = (text.match(/🔴|高风险|严重|重大/g) || []).length;
            const medium = (text.match(/🟡|中风险|一般/g) || []).length;
            const low = (text.match(/🟢|低风险|建议|优化/g) || []).length;
            highCount.textContent = high || 0;
            mediumCount.textContent = medium || 0;
            lowCount.textContent = low || 0;
        }

        function clearResult() {
            resultArea.classList.remove('show');
            analysisContent.textContent = '分析结果将在这里显示...';
            highCount.textContent = '0';
            mediumCount.textContent = '0';
            lowCount.textContent = '0';
            hideStatus();
        }

        // ---------- PDF 提取 ----------
        async function extractPDFText(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                fullText += content.items.map(item => item.str).join(' ') + '\n';
            }
            return fullText;
        }

        // ---------- 文件加载 ----------
        async function loadFile(file) {
            try {
                setStatus('📖 正在解析 PDF ...', 'loading');
                pdfText = await extractPDFText(file);
                currentFile = file;
                const ext = file.name.split('.').pop().toUpperCase();
                fileName.innerHTML = `
                        ${file.name}
                        <span class="ext">${ext}</span>
                        <small>(${pdfText.length} 字符)</small>
                    `;
                fileInfo.classList.add('show');
                setStatus('✅ PDF 加载成功，共 ' + pdfText.length + ' 字符', 'done');
                setTimeout(hideStatus, 2000);
            } catch (err) {
                setStatus('❌ PDF 解析失败: ' + err.message, 'error');
                console.error(err);
            }
        }

        fileInput.addEventListener('change', function(e) {
            if (this.files[0]) loadFile(this.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', async (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                await loadFile(file);
            } else {
                setStatus('⚠️ 请上传 PDF 文件', 'error');
            }
        });

        btnRemove.addEventListener('click', () => {
            pdfText = '';
            currentFile = null;
            fileInfo.classList.remove('show');
            fileInput.value = '';
            clearResult();
            setStatus('📄 已移除文件', '');
            setTimeout(hideStatus, 1500);
        });

        // ---------- API 调用 ----------
        async function callRiskAnalysis(text, apiKey, depth) {
            const depthMap = {
                'quick': '快速扫描，重点识别明显的高风险条款',
                'standard': '标准审查，识别高、中、低风险，给出修改建议',
                'deep': '深度分析，逐条审阅，引用法律依据，给出具体修改方案'
            };

            const systemPrompt = `你是一位资深法律风控专家，擅长审查各类商业合同、协议、法律文件。

            请对用户提供的合同文本进行风险审查，按以下格式输出：

            【风险等级说明】
            🔴 高风险：可能导致重大经济损失、法律责任或核心权利丧失的条款
            🟡 中风险：存在模糊地带、可能引发争议或存在潜在法律漏洞的条款
            🟢 低风险 / 建议：措辞可优化、表述不清晰、建议完善的条款

            【审查报告】
            1. 逐条列出风险点，标注风险等级（🔴/🟡/🟢）
            2. 每个风险点附上具体条款引用或位置说明
            3. 给出修改建议或优化方案
            4. 如有法律依据，请引用相关法律法规

            【总体评价】
            给出整体风险评级（高/中/低）和核心建议。

            【审查深度】${depthMap[depth] || '标准审查'}

            请用专业、客观、严谨的语言输出。`;

            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: `请审查以下合同文本：\n\n${text.slice(0, 15000)}` }
                    ],
                    temperature: 0.3,
                    max_tokens: 4096
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        // ---------- 主按钮 ----------
        btnAnalyze.addEventListener('click', async function() {
            if (!pdfText) {
                setStatus('⚠️ 请先上传一份 PDF 合同', 'error');
                return;
            }

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                setStatus('⚠️ 请输入你的 DeepSeek API Key', 'error');
                return;
            }

            const depth = depthSelect.value;

            btnAnalyze.disabled = true;
            btnAnalyze.textContent = '⏳ 分析中 ...';

            setStatus('⚖️ 正在审查合同条款，请稍候 ...', 'loading');

            try {
                const result = await callRiskAnalysis(pdfText, apiKey, depth);
                showResult(result);
                setStatus('✅ 审查完成！', 'done');
                setTimeout(hideStatus, 2000);
            } catch (err) {
                setStatus('❌ 分析失败: ' + err.message, 'error');
                console.error(err);
            } finally {
                btnAnalyze.disabled = false;
                btnAnalyze.textContent = '✨ 开始风控分析';
            }
        });

        // ---------- 清空 ----------
        btnClear.addEventListener('click', clearResult);

        // ---------- 本地存储 ----------
        (function() {
            const saved = localStorage.getItem('legal_api_key');
            if (saved) apiKeyInput.value = saved;
            apiKeyInput.addEventListener('change', () => {
                localStorage.setItem('legal_api_key', apiKeyInput.value);
            });
        })();

        // ---------- 快捷键 ----------
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                btnAnalyze.click();
            }
        });

        console.log('⚖️ 法律风控小助手 · 流光紫境版已加载');
        console.log('📌 上传 PDF → 输入 API Key → 分析');
        console.log('⌨️  Ctrl+Enter 快速分析');
    </script>

</body>
</html>
