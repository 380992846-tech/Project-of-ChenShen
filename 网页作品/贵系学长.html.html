<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, touch-action=manipulation">
  <title>贵系学长 · 二次元立绘</title>
  <style>
    :root {
      --bg: #010118;
      --accent: #4da8da;
      --accent2: #ff66cc;
      --glass-bg: rgba(10, 20, 40, 0.75);
      --glass-border: rgba(255, 255, 255, 0.25);
      --text: rgba(255, 255, 255, 0.9);
      --glow: 0 0 20px rgba(77, 168, 218, 0.5);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif;
      cursor: pointer;
      background: #010118;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
    }

    #info {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 10px;
      color: var(--text);
      background: var(--glass-bg);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      z-index: 20;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      max-width: calc(100vw - 70px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #instruction {
      position: absolute;
      bottom: calc(100px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: var(--text);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 10px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.4);
      animation: gentlePulse 2.5s ease-in-out infinite;
      font-weight: 500;
      letter-spacing: 0.3px;
      max-width: 90vw;
    }

    @keyframes gentlePulse {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }

    #click-effect {
      position: absolute;
      pointer-events: none;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(100, 200, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ripple 1s ease-out forwards;
      z-index: 100;
    }
    @keyframes ripple {
      0% { width: 25px; height: 25px; opacity: 1; border-width: 2.5px; }
      100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
    }

    #target-indicator {
      position: absolute;
      pointer-events: none;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, rgba(200,230,255,0.9) 0%, rgba(100,180,255,0.5) 50%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 99;
      animation: targetPulse 1.5s ease-in-out infinite;
    }
    @keyframes targetPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.6); opacity: 0.3; }
    }

    #music-toggle {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(10, 20, 40, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      padding: 0;
      line-height: 1;
    }
    #music-toggle.playing {
      box-shadow: 0 0 15px rgba(100, 180, 255, 0.55);
      border-color: rgba(100, 200, 255, 0.85);
    }

    #chat-bubble {
      position: fixed;
      pointer-events: auto;
      z-index: 50;
      opacity: 0;
      transform: translate(-50%, -100%) scale(0.85);
      transition: opacity 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      max-width: min(280px, 75vw);
      min-width: 60px;
      text-align: center;
      filter: drop-shadow(0 0 15px rgba(77, 168, 218, 0.5));
    }
    #chat-bubble.visible {
      opacity: 1;
      transform: translate(-50%, -100%) scale(1);
    }
    #chat-bubble.pulse-bubble {
      animation: bubblePop 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    @keyframes bubblePop {
      0% { transform: translate(-50%, -100%) scale(1); }
      40% { transform: translate(-50%, -100%) scale(1.1); }
      100% { transform: translate(-50%, -100%) scale(1); }
    }
    .bubble-inner {
      background: rgba(8, 22, 48, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(130, 200, 255, 0.5);
      border-radius: 18px;
      padding: 10px 14px;
      color: #e0f0ff;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0.3px;
      box-shadow: 0 0 30px rgba(60, 150, 220, 0.3), inset 0 0 25px rgba(30, 100, 180, 0.06);
      position: relative;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-inner::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid rgba(8, 22, 48, 0.9);
      filter: drop-shadow(0 2px 3px rgba(60, 150, 220, 0.25));
    }
    .bubble-inner.thinking {
      color: #8cc8ee;
      font-style: italic;
      animation: thinkingDots 1.5s ease-in-out infinite;
    }
    @keyframes thinkingDots {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    #history-panel {
      position: fixed;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      z-index: 55;
      background: rgba(8, 20, 42, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(130, 200, 255, 0.4);
      border-radius: 16px;
      width: min(300px, 80vw);
      max-height: 50vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(60, 150, 220, 0.2);
      transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(-20px);
    }
    #history-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    #history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(130, 200, 255, 0.25);
      flex-shrink: 0;
    }
    #history-header span {
      color: #b8ddff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #history-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      transition: all 0.2s;
    }
    #history-close:active {
      background: rgba(255,255,255,0.25);
      transform: scale(0.9);
    }
    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #history-list::-webkit-scrollbar {
      width: 3px;
    }
    #history-list::-webkit-scrollbar-thumb {
      background: rgba(130,200,255,0.3);
      border-radius: 3px;
    }
    .history-item {
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.45;
      letter-spacing: 0.2px;
      animation: fadeInUp 0.3s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-item.user {
      background: rgba(50, 130, 200, 0.25);
      border: 1px solid rgba(100, 180, 255, 0.3);
      color: #c8e4ff;
      align-self: flex-end;
      margin-left: 20px;
      border-bottom-right-radius: 3px;
    }
    .history-item.assistant {
      background: rgba(30, 40, 70, 0.5);
      border: 1px solid rgba(130, 200, 255, 0.2);
      color: #d0e8ff;
      align-self: flex-start;
      margin-right: 20px;
      border-bottom-left-radius: 3px;
    }
    .history-item .role-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.6;
      margin-bottom: 3px;
    }
    #history-empty {
      text-align: center;
      color: rgba(180, 210, 240, 0.5);
      font-size: 11px;
      padding: 20px 10px;
    }

    #chat-bar {
      position: fixed;
      bottom: calc(12px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 20, 40, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 28px;
      padding: 5px 6px 5px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(60, 140, 210, 0.18);
      transition: all 0.3s ease;
      width: min(420px, 92vw);
    }
    #chat-bar:focus-within {
      border-color: rgba(130, 200, 255, 0.65);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 28px rgba(60, 150, 220, 0.35);
    }
    #chat-input {
      background: transparent;
      border: none;
      outline: none;
      color: #e0f0ff;
      font-size: 14px;
      font-family: inherit;
      flex: 1;
      min-width: 0;
      letter-spacing: 0.4px;
      caret-color: #7cc8ff;
      padding: 6px 0;
    }
    #chat-input::placeholder {
      color: rgba(180, 210, 240, 0.45);
      font-size: 12px;
    }
    #chat-input:disabled {
      opacity: 0.5;
    }
    .chat-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      flex-shrink: 0;
      padding: 0;
      line-height: 1;
      font-size: 15px;
      background: rgba(50, 130, 200, 0.45);
      border: 1px solid rgba(150, 210, 255, 0.4);
      color: #fff;
      box-shadow: 0 0 12px rgba(60, 150, 220, 0.2);
    }
    .chat-btn:active {
      transform: scale(0.9);
      transition: transform 0.1s ease;
    }
    #send-btn.loading {
      animation: btnGlow 1s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.7;
    }
    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(60, 150, 220, 0.2); }
      50% { box-shadow: 0 0 28px rgba(120, 210, 255, 0.7); }
    }
    #history-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      box-shadow: none;
    }
    #history-btn:active {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.1);
    }
    #settings-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      box-shadow: none;
    }
    #settings-btn:active {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.1);
    }
    #avatar-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      box-shadow: none;
    }
    #avatar-btn:active {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.1);
    }

    #settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #settings-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    #settings-panel {
      background: rgba(12, 25, 50, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(130, 200, 255, 0.4);
      border-radius: 18px;
      padding: 22px 18px 18px;
      width: min(380px, 90vw);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 45px rgba(60, 150, 220, 0.2);
      color: #d0e8ff;
      text-align: center;
    }
    #settings-panel h3 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #b8ddff;
    }
    #settings-panel p {
      margin: 0 0 14px;
      font-size: 11px;
      opacity: 0.65;
      line-height: 1.5;
    }
    #settings-panel a {
      color: #7cc8ff;
      text-decoration: underline;
      cursor: pointer;
    }
    #api-key-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      color: #e0f0ff;
      font-size: 13px;
      font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
      letter-spacing: 0.4px;
      outline: none;
      transition: border-color 0.3s;
      caret-color: #7cc8ff;
    }
    #api-key-input:focus {
      border-color: rgba(130, 200, 255, 0.65);
      box-shadow: 0 0 12px rgba(60, 150, 220, 0.25);
    }
    #api-key-input::placeholder {
      color: rgba(180, 210, 240, 0.35);
      font-family: inherit;
    }
    #settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: center;
    }
    #settings-actions button {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      letter-spacing: 0.4px;
      transition: all 0.25s ease;
      font-weight: 500;
    }
    #settings-save {
      background: rgba(50, 140, 210, 0.65);
      color: #fff;
      border-color: rgba(130, 200, 255, 0.55);
    }
    #settings-save:active {
      background: rgba(70, 170, 240, 0.8);
      box-shadow: 0 0 18px rgba(80, 180, 255, 0.45);
    }
    #settings-cancel {
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
    }
    #settings-cancel:active {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    #settings-status {
      font-size: 10px;
      margin-top: 8px;
      min-height: 14px;
      color: #8cc8ee;
      transition: color 0.3s;
    }
    #settings-status.error { color: #ff6b8a; }
    #settings-status.success { color: #6be0a0; }

    @media (min-width: 768px) {
      #info { font-size: 14px; padding: 10px 20px; left: 16px; }
      #instruction { font-size: 12px; padding: 8px 22px; bottom: calc(110px + var(--safe-bottom)); }
      #music-toggle { width: 40px; height: 40px; font-size: 18px; top: 16px; right: 16px; }
      #chat-bubble { max-width: 320px; }
      .bubble-inner { font-size: 13px; padding: 12px 16px; border-radius: 20px; }
      .bubble-inner::after { bottom: -9px; border-left-width: 9px; border-right-width: 9px; border-top-width: 11px; }
      #chat-bar { border-radius: 30px; padding: 5px 8px 5px 16px; }
      .chat-btn { width: 36px; height: 36px; font-size: 16px; }
      #chat-input { font-size: 15px; }
      #chat-input::placeholder { font-size: 13px; }
      #history-panel { width: 320px; max-height: 55vh; left: 16px; }
    }

    @media (max-width: 380px) {
      #info { font-size: 10px; padding: 6px 12px; }
      #chat-bar { gap: 5px; padding: 4px 5px 4px 10px; border-radius: 24px; }
      .chat-btn { width: 30px; height: 30px; font-size: 13px; }
      #chat-input { font-size: 13px; }
      #chat-input::placeholder { font-size: 10px; }
      #history-panel { width: 85vw; max-height: 40vh; left: 4px; }
      .history-item { font-size: 10px; padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div id="info">🧑‍💻 贵系学长 · 漂浮在代码海洋</div>
  <div id="instruction">👆 点击移动 · 点击学长聊天 · 底部对话</div>

  <button id="music-toggle" title="键盘声">🔇</button>

  <div id="chat-bubble">
    <div class="bubble-inner" id="bubble-text"></div>
  </div>

  <div id="history-panel">
    <div id="history-header">
      <span>💬 对话记录</span>
      <button id="history-close">✕</button>
    </div>
    <div id="history-list">
      <div id="history-empty">还没有对话，和学长聊聊吧～</div>
    </div>
  </div>

  <!-- 隐藏的上传控件 -->
  <input type="file" id="avatar-upload" accept="image/*" style="display:none;">

  <div id="chat-bar">
    <button id="settings-btn" title="设置API Key" class="chat-btn">⚙️</button>
    <input type="text" id="chat-input" placeholder="和贵系学长说点什么..." maxlength="500" autocomplete="off" enterkeyhint="send">
    <button id="history-btn" title="历史记录" class="chat-btn">💬</button>
    <button id="avatar-btn" title="换学长头像" class="chat-btn">🖼️</button>
    <button id="send-btn" title="发送" class="chat-btn">➤</button>
  </div>

  <div id="settings-overlay">
    <div id="settings-panel">
      <h3>🧑‍💻 设置 DeepSeek API Key</h3>
      <p>学长需要API Key才能和你对话。Key仅存储在本地浏览器中。<br>
        <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">👉 获取DeepSeek API Key</a>
      </p>
      <input type="text" id="api-key-input" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off">
      <div id="settings-status"></div>
      <div id="settings-actions">
        <button id="settings-cancel">取消</button>
        <button id="settings-save">💾 保存</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ============================================================
    // 0. 音频系统
    // ============================================================
    let audioCtx = null;
    let isPlaying = false;
    let noiseNodes = [];
    let gainNode = null;
    let filterNode = null;
    const musicButton = document.getElementById('music-toggle');

    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        setupAmbientSound();
      } catch (e) {
        console.warn("无法创建音频上下文:", e);
        musicButton.style.display = 'none';
      }
    }

    function setupAmbientSound() {
      if (!audioCtx) return;
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0.08;
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 600;
      filterNode.Q.value = 0.5;
      gainNode.connect(filterNode);
      filterNode.connect(audioCtx.destination);
      createNoiseLayer(0.3, 300, 0.6);
      createNoiseLayer(0.4, 700, 0.35);
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.value = 0.12;
      lfoGain.gain.value = 0.02;
      lfo.connect(lfoGain);
      lfoGain.connect(gainNode.gain);
      lfo.start();
      noiseNodes.push({ osc: lfo, gain: lfoGain });
    }

    function createNoiseLayer(volume, filterFreq, q) {
      if (!audioCtx) return;
      const bufferSize = 2 * audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;
      const bandpass = audioCtx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.value = filterFreq;
      bandpass.Q.value = q;
      const layerGain = audioCtx.createGain();
      layerGain.gain.value = volume;
      noise.connect(bandpass);
      bandpass.connect(layerGain);
      layerGain.connect(gainNode);
      noise.start(0);
      noiseNodes.push({ source: noise, gain: layerGain, filter: bandpass });
    }

      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 600 + Math.random() * 400;
      oscGain.gain.setValueAtTime(0, now);
      oscGain.gain.linearRampToValueAtTime(0.06, now + 0.01);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

      currentAbortController = new AbortController();
      const timeoutId = setTimeout(() => { if (currentAbortController) currentAbortController.abort(); }, 30000);

      try {
        const response = await fetch(DEEPSEEK_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({ model: 'deepseek-chat', messages: chatMessages, stream: false, max_tokens: 300, temperature: 0.8 }),
          signal: currentAbortController.signal,
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const assistantMessage = data.choices?.[0]?.message?.content || '（学长沉默了...）';

          saveHistory();

        currentAbortController = null;
        chatInput.disabled = false;
        sendBtn.classList.remove('loading');
        sendBtn.textContent = '➤';
        chatInput.focus();
      }
    }

    const glowRing = new THREE.Mesh(
      new THREE.RingGeometry(0.7, 0.9, 32),
      new THREE.MeshBasicMaterial({ color: 0x3399ff, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
    );
    glowRing.position.z = -0.2;
    avatarGroup.add(glowRing);

    // 漂浮的粒子光圈 (围绕头像，增加科技感)
    const auraParticles = new THREE.BufferGeometry();
    const auraCount = 40;
    const auraPos = new Float32Array(auraCount * 3);
    for (let i = 0; i < auraCount; i++) {
      const angle = (i / auraCount) * Math.PI * 2;
      const rad = 1.3;
      auraPos[i*3] = Math.cos(angle) * rad;
      auraPos[i*3+1] = Math.sin(angle) * rad * 0.4; // 扁圆形
      auraPos[i*3+2] = 0;
    }
    auraParticles.setAttribute('position', new THREE.BufferAttribute(auraPos, 3));
    const auraParticleMat = new THREE.PointsMaterial({
      color: 0x66ddff,
      size: 0.05,
      transparent: true,
      blending: THREE.AdditiveBlending
    });
    const auraPoints = new THREE.Points(auraParticles, auraParticleMat);
    avatarGroup.add(auraPoints);

    avatarGroup.position.set(3.5, 3.8, 2.5);
    avatarGroup.rotation.set(0, -0.4, 0);

    // 🔥 核心功能：用户更换帅脸头像
    const AVATAR_STORAGE_KEY = 'or_custom_avatar_data';
    let customAvatarTexture = null;

    // 尝试读取本地存储的图片
    try {
      const savedData = localStorage.getItem(AVATAR_STORAGE_KEY);
      if (savedData) {
        const img = new Image();
        img.onload = () => {
          const tex = new THREE.Texture(img);
          tex.needsUpdate = true;
          applyAvatarTexture(tex);
        };
        img.src = savedData;
      }
    } catch (e) { /* ignore */ }

    function applyAvatarTexture(texture) {
      if (customAvatarTexture) customAvatarTexture.dispose();
      customAvatarTexture = texture;
      if (spriteMaterial) {
        spriteMaterial.map = texture;
        spriteMaterial.needsUpdate = true;
        // 调整比例适应图片
        const aspect = texture.image.width / texture.image.height;
        if (aspect > 1) {
          avatarSprite.scale.set(2.0 * aspect, 2.0, 1);
        } else {
          avatarSprite.scale.set(2.0, 2.0 / aspect, 1);
        }
        // 缩放限制
        if(avatarSprite.scale.x > 3.5) avatarSprite.scale.x = 3.5;
        if(avatarSprite.scale.y > 3.5) avatarSprite.scale.y = 3.5;
      }
    }

    // 处理上传
    avatarBtn.addEventListener('click', () => {
      avatarUpload.click();
    });

    avatarUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const tex = new THREE.Texture(img);
          tex.needsUpdate = true;
          applyAvatarTexture(tex);
          // 保存到本地
          try {
            localStorage.setItem(AVATAR_STORAGE_KEY, event.target.result);
          } catch (e) { /* 缓存满了就不存了 */ }
          avatarUpload.value = ''; // 清空以便重复上传
          
          // 触发一个脉动特效
          triggerOrcaPulse();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ============================================================
    // 4. 浮游数据包
    // ============================================================
    const freeFishGroup = new THREE.Group(); scene.add(freeFishGroup);
    const fishData = [];
    function createDataPacket(colorHex) {
      const g = new THREE.Group();
      const bm = new THREE.MeshPhongMaterial({ color: colorHex, emissive: new THREE.Color(colorHex), emissiveIntensity: 0.5, shininess: 30, transparent: true, opacity: 0.7 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.1), bm);
      g.add(body);
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.15 }));
      g.add(glow);
      return g;
    }
    const dataColors = [0xffaa33,0x33cc99,0xff6699,0x66aaff,0xffcc44,0xaa66ff,0x44ddbb,0xff8877,0x7799ff,0x99ee66];
    for (let i=0;i<12;i++) {
      const packet = createDataPacket(dataColors[i % dataColors.length]);
      const angle=(i/12)*Math.PI*2, radius=2.8+Math.random()*3.2;
      packet.position.set(Math.cos(angle)*radius, 3.0+Math.random()*2.5, Math.sin(angle)*radius);
      freeFishGroup.add(packet);
      fishData.push({ mesh:packet, baseY:packet.position.y, speed:0.3+Math.random()*0.7, phase:Math.random()*Math.PI*2, radius, angle, verticalAmp:0.3+Math.random()*0.6 });
    }

    // ============================================================
    // 5. 交互系统
    // ============================================================
    const targetRing = new THREE.Mesh(new THREE.TorusGeometry(0.35,0.05,16,32), new THREE.MeshBasicMaterial({ color:0x88ccff, transparent:true, opacity:0.9 }));
    targetRing.visible=false; scene.add(targetRing);
    const targetDot = new THREE.Mesh(new THREE.SphereGeometry(0.14,16,16), new THREE.MeshBasicMaterial({ color:0xaaddff, transparent:true, opacity:0.9 }));
    targetDot.visible=false; scene.add(targetDot);
    const trailLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color:0x4488cc, transparent:true, opacity:0.5 }));
    trailLine.visible=false; scene.add(trailLine);

    const raycaster = new THREE.Raycaster();
    let targetPosition = new THREE.Vector3(0,3.8,0), hasTarget = false;
    const screenIndicator = document.createElement('div'); screenIndicator.id='target-indicator'; screenIndicator.style.display='none'; document.body.appendChild(screenIndicator);

    function createClickEffect(cx,cy) {
      const e = document.createElement('div'); e.id='click-effect'; e.style.left=cx+'px'; e.style.top=cy+'px';
      document.body.appendChild(e); setTimeout(()=>e.remove(),1000);
    }
    function updateTrailLine() { trailLine.geometry.setFromPoints([avatarGroup.position.clone(), targetPosition.clone()]); }
    function updateScreenIndicator() {
      if (!hasTarget) { screenIndicator.style.display='none'; return; }
      const tp = targetPosition.clone().project(camera);
      const x=(tp.x*0.5+0.5)*window.innerWidth, y=(-tp.y*0.5+0.5)*window.innerHeight;
      screenIndicator.style.display = (tp.z>1||x<-50||x>window.innerWidth+50||y<-50||y>window.innerHeight+50) ? 'none' : 'block';
      if (screenIndicator.style.display==='block') { screenIndicator.style.left=x+'px'; screenIndicator.style.top=y+'px'; }
    }
    function isClickOnAvatar(intersects) {
      if (!intersects.length) return false;
      let obj = intersects[0].object;
      while (obj) { if (obj===avatarGroup) return true; obj=obj.parent; }
      return false;
    }

    let orcaPulseAnim = null;
    function triggerOrcaPulse() {
      const startScale = avatarGroup.scale.clone(), startTime = performance.now();
      if (orcaPulseAnim) avatarGroup.scale.copy(startScale);
      orcaPulseAnim = function(now) {
        const progress = Math.min((now-startTime)/300, 1);
        avatarGroup.scale.setScalar(1+0.12*(1-progress)*Math.cos(progress*Math.PI*2));
        if (progress>=1) { avatarGroup.scale.copy(startScale); orcaPulseAnim=null; return false; }
        return true;
      };
    }

    function handleClick(cx,cy) {
      const mouse = new THREE.Vector2((cx/window.innerWidth)*2-1, -(cy/window.innerHeight)*2+1);
      createClickEffect(cx,cy);
      raycaster.setFromCamera(mouse, camera);
      if (isClickOnAvatar(raycaster.intersectObject(avatarGroup,true))) { playKeyClick(); triggerOrcaPulse(); return; }
      raycaster.setFromCamera(mouse, camera);
      const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -3.5);
      const intersection = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(plane, intersection)) {
        const maxRange=7.5;
        targetPosition.set(Math.max(-maxRange,Math.min(maxRange,intersection.x)), 3.0+Math.random()*1.6, Math.max(-maxRange,Math.min(maxRange,intersection.z)));
        hasTarget=true; targetRing.position.copy(targetPosition); targetRing.position.y+=0.08;
        targetRing.visible=true; targetDot.position.copy(targetPosition); targetDot.visible=true;
        updateTrailLine(); trailLine.visible=true;
      }
    }

    window.addEventListener('click', (e) => {
      if (e.target===musicButton||e.target.closest('#chat-bar')||e.target.closest('#settings-overlay')||e.target.closest('#chat-bubble')||e.target.closest('#history-panel')||e.target===historyBtn) return;
      handleClick(e.clientX, e.clientY);
    });
    window.addEventListener('touchstart', (e) => {
      if (e.target===musicButton||e.target.closest('#chat-bar')||e.target.closest('#settings-overlay')||e.target.closest('#chat-bubble')||e.target.closest('#history-panel')||e.target===historyBtn) return;
      if (e.touches.length===1) { e.preventDefault(); handleClick(e.touches[0].clientX, e.touches[0].clientY); }
    }, { passive: false });

    function updateBubblePosition() {
      if (!chatBubble.classList.contains('visible')) return;
      const headWorld = new THREE.Vector3(0, 0, 0).applyMatrix4(avatarGroup.matrixWorld);
      const hs = headWorld.clone().project(camera);
      if (hs.z>1) { chatBubble.style.opacity='0'; return; }
      chatBubble.style.opacity='';
      const x=(hs.x*0.5+0.5)*window.innerWidth, y=(-hs.y*0.5+0.5)*window.innerHeight-65;
      chatBubble.style.left=x+'px'; chatBubble.style.top=y+'px';
    }

    // ============================================================
    // 6. 动画循环
    // ============================================================
    let elapsedTime = 0;
    function animate(now) {
      requestAnimationFrame(animate);
      elapsedTime = now * 0.001;
      if (orcaPulseAnim) orcaPulseAnim(now);

      const breathe = Math.sin(elapsedTime*0.6)*0.25+0.1;
      for (let i=0;i<cityMaterials.length;i++) cityMaterials[i].emissiveIntensity = cityBaseEmissiveIntensities[i]*(breathe/0.4);
      colorLight.position.x=3.5*Math.sin(elapsedTime*0.7); colorLight.position.z=3.5*Math.cos(elapsedTime*0.5);
      colorLight.intensity=0.7+Math.sin(elapsedTime*1.8)*0.3;
      ring1.rotation.z+=0.005; ring2.rotation.x+=0.003; ring2.rotation.y+=0.004; ring3.rotation.y+=0.006; ring3.rotation.x+=0.002;
      particlesField.rotation.y+=0.0005; stars.rotation.y-=0.00025;

      // 学长移动
      if (hasTarget) {
        const toTarget = new THREE.Vector3().subVectors(targetPosition, avatarGroup.position);
        const dist = toTarget.length();
        if (dist<0.55) { hasTarget=false; targetRing.visible=false; targetDot.visible=false; trailLine.visible=false; screenIndicator.style.display='none'; }
        else {
          const dir = toTarget.normalize();
          const speed = 0.042*Math.min(dist*0.6,1.9);
          avatarGroup.position.add(dir.clone().multiplyScalar(speed));
          avatarGroup.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(-1,0,0), dir), 0.08);
          updateTrailLine(); updateScreenIndicator();
        }
      } else {
        const rx=2.2, rz=1.6;
        const tx=Math.sin(elapsedTime*0.5)*rx, tz=Math.cos(elapsedTime*0.9)*rz*0.9, ty=3.2+Math.sin(elapsedTime*0.7)*0.7;
        const s=0.035;
        avatarGroup.position.x+=(tx-avatarGroup.position.x)*s; avatarGroup.position.z+=(tz-avatarGroup.position.z)*s; avatarGroup.position.y+=(ty-avatarGroup.position.y)*s;
        const md = new THREE.Vector3(Math.sin((elapsedTime+0.1)*0.5)*rx-avatarGroup.position.x, 0, Math.cos((elapsedTime+0.1)*0.9)*rz*0.9-avatarGroup.position.z).normalize();
        if (md.length()>0.1) avatarGroup.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(-1,0,0), md), 0.05);
      }

      // 立绘环绕粒子旋转
      auraPoints.rotation.z += 0.02;

      // 数据包浮动
      fishData.forEach(d=>{
        d.angle+=0.008*d.speed;
        const cr=d.radius+Math.sin(elapsedTime*0.7+d.phase)*0.8;
        const tx=avatarGroup.position.x+Math.cos(d.angle)*cr, tz=avatarGroup.position.z+Math.sin(d.angle)*cr, ty=d.baseY+Math.sin(elapsedTime*1.3+d.phase)*d.verticalAmp;
        d.mesh.position.x+=(tx-d.mesh.position.x)*0.04; d.mesh.position.z+=(tz-d.mesh.position.z)*0.04; d.mesh.position.y+=(ty-d.mesh.position.y)*0.04;
        const md=new THREE.Vector3(tx-d.mesh.position.x,0,tz-d.mesh.position.z).normalize();
        if (md.length()>0.1) d.mesh.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(-1,0,0),md),0.1);
        d.mesh.rotation.x += 0.02;
        d.mesh.rotation.y += 0.03;
      });

      if (targetRing.visible) { targetRing.rotation.z+=0.05; targetRing.rotation.x+=0.02; targetRing.scale.setScalar(1+Math.sin(elapsedTime*4)*0.15); targetDot.scale.setScalar(0.8+Math.sin(elapsedTime*5)*0.35); }
      updateBubblePosition();
      controls.target.lerp(new THREE.Vector3(avatarGroup.position.x, avatarGroup.position.y, avatarGroup.position.z), 0.05);
      controls.update();
      effectComposer.render();
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      effectComposer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('🧑‍💻 贵系学长已就绪，亮度已调低，现在帅得很自然！');
  </script>
</body>
</html>
