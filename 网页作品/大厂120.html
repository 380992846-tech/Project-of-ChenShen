<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大厂面试 · 120题 · 紫黑玻璃</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        body { min-height: 100vh; background: #0b0710; display: flex; justify-content: center; padding: 1.5rem 1rem; }
        .glass-container {
            max-width: 1600px; width: 100%;
            background: rgba(30, 18, 48, 0.45); backdrop-filter: blur(16px) saturate(180%);
            border-radius: 3rem; padding: 1.8rem 2rem;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(180,130,255,0.25);
            border: 1px solid rgba(160,120,255,0.15);
        }
        .header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            margin-bottom: 1.5rem; border-bottom: 1px solid rgba(180,130,255,0.2); padding-bottom: 0.8rem;
        }
        .title-group h1 {
            font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(135deg, #e0d0ff, #b28aff 60%, #9f7aff);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .title-group h1 i { font-size: 2rem; color: #b28aff; filter: drop-shadow(0 0 8px #a07cff); }
        .subtitle { color: rgba(210,185,255,0.7); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .stats-badge {
            background: rgba(120,80,200,0.25); backdrop-filter: blur(4px); padding: 0.4rem 1.2rem;
            border-radius: 60px; border: 1px solid rgba(180,130,255,0.3); color: #d4c0ff; font-weight: 500;
            box-shadow: 0 0 20px rgba(130,80,255,0.15); white-space: nowrap; font-size: 0.9rem;
        }
        .main-layout { display: flex; gap: 1.5rem; margin-top: 0.3rem; }

        /* 左侧 HR */
        .left-hr { flex: 0 0 300px; min-width: 240px; display: flex; flex-direction: column; gap: 1rem; }
        .hr-chat {
            background: rgba(22,12,40,0.55); backdrop-filter: blur(12px); border-radius: 2rem;
            padding: 1.2rem 1rem; border: 1px solid rgba(160,120,255,0.2);
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.6);
        }
        .hr-chat h3 { color: #d4c0ff; font-weight: 500; font-size: 1rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(160,120,255,0.15); padding-bottom: 0.5rem; margin-bottom: 0.7rem; }
        .hr-chat h3 i { color: #b28aff; }
        .chat-box { display: flex; flex-direction: column; gap: 8px; }
        .chat-input-group { display: flex; gap: 6px; }
        .chat-input-group input {
            flex: 1; background: rgba(10,5,25,0.6); border: 1px solid rgba(160,120,255,0.25);
            border-radius: 40px; padding: 0.5rem 1rem; color: #ede6ff; font-size: 0.85rem; outline: none;
        }
        .chat-input-group input::placeholder { color: rgba(180,160,220,0.5); }
        .chat-input-group input:focus { border-color: #a885ff; box-shadow: 0 0 16px rgba(140,100,255,0.2); }
        .chat-input-group button {
            background: rgba(130,80,255,0.3); border: 1px solid rgba(160,120,255,0.3);
            border-radius: 40px; padding: 0 1.2rem; color: #ede6ff; font-weight: 500; cursor: pointer;
            transition: 0.2s; white-space: nowrap;
        }
        .chat-input-group button:hover { background: rgba(150,100,255,0.4); border-color: #b28aff; }
        .chat-messages {
            background: rgba(10,5,20,0.3); border-radius: 1.4rem; padding: 0.6rem 0.9rem;
            min-height: 70px; max-height: 180px; overflow-y: auto; border: 1px solid rgba(160,120,255,0.1);
        }
        .chat-msg { color: #d4c6f5; font-size: 0.82rem; line-height: 1.5; padding: 0.15rem 0; border-bottom: 1px solid rgba(160,120,255,0.05); }
        .chat-msg i { margin-right: 6px; color: #a885ff; width: 1.2rem; }
        .chat-msg.hr i { color: #c6adff; }
        .api-status { font-size: 0.7rem; color: #7a6a9a; margin-top: 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .api-status:hover { color: #b09ad9; }

        /* 中间 */
        .middle-questions { flex: 2.8; min-width: 0; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 0.8rem; }
        .filter-tag {
            background: rgba(50,30,80,0.4); backdrop-filter: blur(4px); padding: 0.25rem 1rem;
            border-radius: 40px; border: 1px solid rgba(170,140,255,0.2); color: #cdbcff;
            font-size: 0.78rem; font-weight: 450; cursor: pointer; transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .filter-tag i { margin-right: 5px; color: #a885ff; }
        .filter-tag.active, .filter-tag:hover { background: rgba(130,80,255,0.35); border-color: #a07cff; box-shadow: 0 0 20px rgba(140,100,255,0.3); color: #f0ebff; }

        .question-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 1rem; max-height: 580px; overflow-y: auto; padding-right: 4px;
        }
        .question-card {
            background: rgba(22,12,40,0.55); backdrop-filter: blur(12px); border-radius: 1.6rem;
            padding: 1rem 1.1rem 0.9rem; border: 1px solid rgba(160,120,255,0.2);
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.7); transition: all 0.2s;
        }
        .question-card:hover { transform: translateY(-3px); border-color: rgba(180,130,255,0.5); background: rgba(30,18,52,0.7); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
        .q-number { font-size: 0.65rem; font-weight: 600; color: #b69eff; background: rgba(100,70,180,0.3); padding: 0.1rem 0.8rem; border-radius: 40px; border: 1px solid rgba(150,120,255,0.2); }
        .q-tag { font-size: 0.6rem; background: rgba(180,130,255,0.15); padding: 0.1rem 0.6rem; border-radius: 30px; color: #cbb5ff; border: 1px solid rgba(150,110,255,0.15); }
        .question-text { font-size: 0.92rem; font-weight: 500; line-height: 1.4; color: #ede6ff; margin: 0.2rem 0 0.3rem; }
        .question-text i { color: #b28aff; margin-right: 5px; opacity: 0.6; }
        .answer-content {
            color: #d4c6f5; font-size: 0.85rem; line-height: 1.7; padding: 0.4rem 0.7rem;
            background: rgba(20,10,38,0.3); border-radius: 12px; margin-top: 0.3rem;
            border-left: 2px solid rgba(160,120,255,0.3);
        }
        .answer-content i { color: #b28aff; margin-right: 5px; }
        .code-block {
            background: #0a0518; border-radius: 10px; padding: 0.4rem 0.7rem; margin-top: 0.3rem;
            font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #d0c0f0;
            border: 1px solid rgba(160,120,255,0.15); overflow-x: auto; white-space: pre-wrap;
        }

        /* 右侧 */
        .right-info { flex: 1.3; min-width: 250px; display: flex; flex-direction: column; gap: 1rem; }
        .info-card {
            background: rgba(22,12,40,0.5); backdrop-filter: blur(12px); border-radius: 2rem;
            padding: 1rem 1rem 0.8rem; border: 1px solid rgba(160,120,255,0.2);
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.6);
        }
        .info-card h3 { color: #d4c0ff; font-weight: 500; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(160,120,255,0.15); padding-bottom: 0.3rem; margin-bottom: 0.5rem; }
        .info-card h3 i { color: #b28aff; }

        .company-list { max-height: 200px; overflow-y: auto; padding-right: 4px; }
        .company-item {
            background: rgba(10,5,20,0.3); border-radius: 1.2rem; padding: 0.4rem 0.8rem;
            margin-bottom: 0.4rem; border-left: 3px solid #a07cff; cursor: pointer;
            transition: 0.2s;
        }
        .company-item:hover { background: rgba(40,25,70,0.5); }
        .company-item strong { color: #e0d0ff; font-size: 0.85rem; }
        .company-item .brief { color: #cdbcff; font-size: 0.68rem; line-height: 1.4; margin-top: 2px; }
        .company-item .brief i { color: #a885ff; width: 1rem; }

        .insight-box {
            background: rgba(10,5,20,0.4); border-radius: 1.2rem; padding: 0.6rem 0.9rem;
            font-size: 0.78rem; color: #d9ccf5; border-left: 3px solid #b28aff; margin-top: 0.2rem;
            line-height: 1.7; max-height: 320px; overflow-y: auto;
        }
        .insight-box i { color: #a885ff; margin-right: 4px; }
        .insight-box strong { color: #e0d0ff; }

        /* 模态框 - API Key */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: rgba(30,18,48,0.95); backdrop-filter: blur(20px);
            border-radius: 2.5rem; padding: 2.5rem 2.8rem; max-width: 480px; width: 90%;
            border: 1px solid rgba(180,130,255,0.3); box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }
        .modal h2 { color: #e0d0ff; font-weight: 600; font-size: 1.5rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 12px; }
        .modal h2 i { color: #b28aff; }
        .modal p { color: #b09ad9; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.2rem; }
        .modal input {
            width: 100%; padding: 0.8rem 1.2rem; border-radius: 40px;
            background: rgba(10,5,25,0.6); border: 1px solid rgba(160,120,255,0.25);
            color: #ede6ff; font-size: 0.95rem; outline: none; margin-bottom: 1.2rem;
        }
        .modal input:focus { border-color: #a885ff; box-shadow: 0 0 20px rgba(140,100,255,0.2); }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-actions button {
            padding: 0.6rem 2rem; border-radius: 40px; border: none; font-weight: 500;
            cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .btn-cancel { background: rgba(80,60,120,0.3); color: #b09ad9; border: 1px solid rgba(160,120,255,0.2); }
        .btn-cancel:hover { background: rgba(80,60,120,0.5); }
        .btn-save { background: rgba(130,80,255,0.4); color: #f0ebff; border: 1px solid rgba(180,130,255,0.3); }
        .btn-save:hover { background: rgba(150,100,255,0.5); box-shadow: 0 0 30px rgba(140,100,255,0.2); }
        .modal .hint { font-size: 0.75rem; color: #6a5a8a; margin-top: -0.5rem; margin-bottom: 1rem; }

        ::-webkit-scrollbar { width: 4px; background: #1c112c; }
        ::-webkit-scrollbar-thumb { background: #6f4d9e; border-radius: 20px; }

        @media (max-width: 1200px) { .main-layout { flex-wrap: wrap; } .left-hr { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; } .left-hr .hr-chat { flex: 1; min-width: 220px; } .right-info { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; } .right-info .info-card { flex: 1; min-width: 200px; } }
        @media (max-width: 700px) { .glass-container { padding: 1rem 0.8rem; } .title-group h1 { font-size: 1.8rem; } .question-grid { grid-template-columns: 1fr; } .modal { padding: 1.8rem 1.5rem; } }
    </style>
</head>
<body>
<div class="glass-container">
    <div class="header">
        <div class="title-group">
            <h1><i class="fas fa-code"></i> 面试·120题</h1>
            <div class="subtitle">
                <i class="fas fa-graduation-cap"></i> 紫黑 · 含20道代码题
                <span style="margin-left:6px; opacity:0.4;">|</span>
                <i class="fas fa-user-tie" style="margin-left:4px;"></i> HR 助手
            </div>
        </div>
        <div class="stats-badge"><i class="fas fa-list-ul"></i> 120 题 · 答案直显</div>
    </div>

    <div class="main-layout">
        <!-- 左侧 HR -->
        <div class="left-hr">
            <div class="hr-chat">
                <h3><i class="fas fa-comment-dots"></i> HR 智能问答</h3>
                <div class="chat-box">
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-msg hr"><i class="fas fa-user-tie"></i> 你好！我是HR助手，请提问～</div>
                    </div>
                    <div class="chat-input-group">
                        <input type="text" id="chatInput" placeholder="e.g. 薪资怎么谈？" />
                        <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    <div class="api-status" id="apiStatus">
                        <i class="fas fa-circle" style="color:#ff6b6b; font-size:0.5rem;"></i>
                        <span>未设置 API Key</span>
                        <i class="fas fa-cog" style="margin-left:auto; opacity:0.6;"></i>
                    </div>
                </div>
            </div>
            <div style="background:rgba(22,12,40,0.3); border-radius:1.4rem; padding:0.4rem 0.8rem; border:1px solid rgba(160,120,255,0.1); color:#b09ad9; font-size:0.7rem;">
                <i class="fas fa-lightbulb" style="color:#a885ff;"></i> 双击标题展开/收起所有答案
            </div>
        </div>

        <!-- 中间 题目 -->
        <div class="middle-questions">
            <div class="filter-bar" id="filterBar">
                <span class="filter-tag active" data-filter="all"><i class="fas fa-layer-group"></i> 全部</span>
                <span class="filter-tag" data-filter="算法"><i class="fas fa-code"></i> 算法</span>
                <span class="filter-tag" data-filter="系统设计"><i class="fas fa-database"></i> 系统设计</span>
                <span class="filter-tag" data-filter="基础"><i class="fas fa-microchip"></i> 基础</span>
                <span class="filter-tag" data-filter="代码题"><i class="fas fa-terminal"></i> 代码题</span>
            </div>
            <div class="question-grid" id="questionGrid"></div>
        </div>

        <!-- 右侧 公司+面经+贵系 -->
        <div class="right-info">
            <div class="info-card">
                <h3><i class="fas fa-building"></i> 15家 · 点击看面经</h3>
                <div class="company-list" id="companyList"></div>
            </div>
            <div class="info-card">
                <h3><i class="fas fa-user-graduate"></i> 贵系指南 · 面经</h3>
                <div class="insight-box" id="insightBox">
                    <i class="fas fa-quote-left"></i> 点击左侧公司名称查看详细面经<br>
                    <span style="color:#7a6a9a; font-size:0.75rem;">下方为贵系（清华计算机）专属内容</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- API Key 模态框 -->
<div class="modal-overlay" id="apiModal">
    <div class="modal">
        <h2><i class="fas fa-key"></i> 设置 DeepSeek API Key</h2>
        <p>学长需要 API Key 才能和你对话。Key 仅存储在本地浏览器中。</p>
        <input type="password" id="apiKeyInput" placeholder="sk-... 输入你的 DeepSeek API Key" />
        <div class="hint">
            <i class="fas fa-info-circle"></i> 获取 DeepSeek API Key：
            <a href="https://platform.deepseek.com/api_keys" target="_blank" style="color:#b28aff;">platform.deepseek.com</a>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelApiBtn">取消</button>
            <button class="btn-save" id="saveApiBtn">保存</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== 扩写答案辅助函数 (4倍) =====
        function expandAnswer(baseAnswer, tag) {
            const expansions = {
                '基础': ' 在计算机科学中，这是一个核心概念，理解它对于编写高质量代码和系统设计至关重要。实际开发中，我们经常需要权衡各种因素，比如性能、可读性和可维护性。面试官通常会追问底层实现原理和适用场景，因此建议结合具体案例深入理解。',
                '算法': ' 算法是程序员的“内功”，掌握好算法不仅能通过面试，更能提升解决复杂问题的能力。建议多练习LeetCode，理解不同解法的时间复杂度和空间复杂度，并能够分析各种边界条件。面试中常要求手写代码，注意代码规范和清晰度。',
                '系统设计': ' 系统设计是区分高级工程师的关键能力。在设计系统时，需要综合考虑可用性、可扩展性、数据一致性、延迟和成本等因素。建议多阅读技术博客和论文，了解业界最佳实践，例如微服务架构、分布式缓存、消息队列等。',
                '网络': ' 网络知识是后端开发的基石。从TCP/IP协议栈到HTTP/HTTPS，再到负载均衡和CDN，每个环节都有深入的技术细节。面试中常考察网络协议的工作原理、常见问题排查和性能优化方法。',
                '数据库': ' 数据库是大多数应用的核心存储层。除了掌握SQL语法，更需要理解索引优化、事务隔离级别、锁机制、分库分表等进阶主题。面试中常通过实际场景考察数据库设计和调优能力。',
                '代码题': ' 代码题是面试中的重头戏，不仅考察算法思维，还考察编码习惯和调试能力。建议在练习时多写注释，考虑边界情况，并能够用测试用例验证代码正确性。面试中如果思路卡壳，可以尝试和面试官沟通思路。'
            };
            const extra = expansions[tag] || ' 这是一个重要的面试考点，建议深入理解其原理和应用场景，并能够用清晰的逻辑向面试官阐述。';
            return baseAnswer + ' ' + extra + ' 此外，可以结合项目经验谈谈实际使用中的体会和踩过的坑，这样能让回答更有说服力。';
        }

        // ===== 120 道题 (无智力题tag) =====
        const rawQuestions = [
            { q: 'HTTPS 的握手过程？', a: 'TCP三次握手 + TLS四次握手：Client Hello、Server Hello、证书验证、密钥交换、完成。', tag: '基础' },
            { q: 'Redis 持久化方式？', a: 'RDB快照与AOF日志，可混合使用。', tag: '基础' },
            { q: '进程与线程的区别？', a: '进程资源隔离，线程共享内存；线程轻量，进程更重。', tag: '基础' },
            { q: 'TCP 和 UDP 的区别？', a: 'TCP可靠有序，UDP不可靠但快速。', tag: '网络' },
            { q: '死锁是什么？如何避免？', a: '循环等待资源，破坏四大条件之一。', tag: '基础' },
            { q: 'MySQL 索引底层？', a: 'B+树，叶子存数据，非叶子存索引。', tag: '数据库' },
            { q: 'JVM 内存模型？', a: '堆、栈、方法区、PC、本地方法栈。', tag: '基础' },
            { q: 'Spring IOC 和 AOP？', a: 'IOC控制反转，AOP面向切面。', tag: '基础' },
            { q: 'CAP 定理？', a: '一致性、可用性、分区容错三选二。', tag: '系统设计' },
            { q: '一致性哈希？', a: '哈希环解决动态扩缩容数据迁移。', tag: '系统设计' },
            { q: 'Linux 查看端口？', a: 'netstat -tulpn 或 lsof -i :端口', tag: '基础' },
            { q: 'volatile 作用？', a: '可见性，禁止重排序，不保证原子性。', tag: '基础' },
            { q: 'RESTful API？', a: 'HTTP方法操作资源，无状态。', tag: '系统设计' },
            { q: '事务 ACID？', a: '原子性、一致性、隔离性、持久性。', tag: '数据库' },
            { q: '微服务优缺点？', a: '独立部署，但分布式复杂。', tag: '系统设计' },
            { q: 'DNS 解析？', a: '本地缓存→DNS服务器→根→顶级→权威。', tag: '网络' },
            { q: '秒杀系统设计？', a: '限流、缓存、MQ异步、分库分表。', tag: '系统设计' },
            { q: '排序时间复杂度？', a: '快排/归并 O(n log n)，冒泡 O(n²)。', tag: '算法' },
            { q: '线程池参数？', a: 'core, max, keepAlive, queue, handler。', tag: '基础' },
            { q: 'Nginx 反向代理？', a: '转发请求，负载均衡，SSL。', tag: '系统设计' },
            { q: 'JWT 是什么？', a: 'JSON Web Token，无状态认证。', tag: '基础' },

            { q: '判断回文链表', a: '快慢指针找中点，反转后半部分比较。', tag: '代码题', code: 'def isPalindrome(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next; fast = fast.next.next\n    prev = None\n    while slow:\n        nxt = slow.next; slow.next = prev; prev = slow; slow = nxt\n    while prev and head:\n        if prev.val != head.val: return False\n        prev = prev.next; head = head.next\n    return True' },
            { q: '最大子数组和 (Kadane)', a: '动态规划，dp[i] = max(nums[i], dp[i-1]+nums[i])', tag: '代码题', code: 'def maxSubArray(nums):\n    dp = [0]*len(nums)\n    dp[0] = nums[0]\n    for i in range(1,len(nums)):\n        dp[i] = max(nums[i], dp[i-1]+nums[i])\n    return max(dp)' },
            { q: '爬楼梯 (斐波那契)', a: 'dp[i] = dp[i-1] + dp[i-2]', tag: '代码题', code: 'def climbStairs(n):\n    if n <= 2: return n\n    a,b = 1,2\n    for _ in range(3,n+1):\n        a,b = b, a+b\n    return b' },
            { q: '合并两个有序链表', a: '递归或迭代', tag: '代码题', code: 'def mergeTwoLists(l1,l2):\n    if not l1 or not l2: return l1 or l2\n    if l1.val < l2.val:\n        l1.next = mergeTwoLists(l1.next, l2)\n        return l1\n    else:\n        l2.next = mergeTwoLists(l1, l2.next)\n        return l2' },
            { q: '二叉树最大深度', a: '递归 max(left, right)+1', tag: '代码题', code: 'def maxDepth(root):\n    if not root: return 0\n    return 1 + max(maxDepth(root.left), maxDepth(root.right))' },
            { q: '有效的括号', a: '栈匹配', tag: '代码题', code: 'def isValid(s):\n    stack = []\n    d = {")":"(", "]":"[", "}":"{"}\n    for c in s:\n        if c in d:\n            if not stack or stack.pop() != d[c]: return False\n        else: stack.append(c)\n    return not stack' },

            { q: '多数元素 (Boyer-Moore)', a: '抵消法', tag: '代码题', code: 'def majorityElement(nums):\n    count = 0; candidate = None\n    for num in nums:\n        if count == 0: candidate = num\n        count += 1 if num == candidate else -1\n    return candidate' },

            { q: '买卖股票最佳时机', a: '一次遍历，维护最小价格', tag: '代码题', code: 'def maxProfit(prices):\n    min_price = float(\'inf\')\n    max_profit = 0\n    for p in prices:\n        if p < min_price: min_price = p\n        elif p - min_price > max_profit: max_profit = p - min_price\n    return max_profit' },

            { q: '最长公共前缀', a: '纵向扫描', tag: '代码题', code: 'def longestCommonPrefix(strs):\n    if not strs: return ""\n    for i in range(len(strs[0])):\n        c = strs[0][i]\n        for s in strs[1:]:\n            if i >= len(s) or s[i] != c: return strs[0][:i]\n    return strs[0]' },
            { q: '删除链表倒数第N个节点', a: '快慢指针', tag: '代码题', code: 'def removeNthFromEnd(head, n):\n    dummy = ListNode(0, head)\n    fast = slow = dummy\n    for _ in range(n+1): fast = fast.next\n    while fast:\n        fast = fast.next\n        slow = slow.next\n    slow.next = slow.next.next\n    return dummy.next' },
            { q: '三数之和 (排序+双指针)', a: '固定一个，双指针扫描', tag: '代码题', code: 'def threeSum(nums):\n    nums.sort(); res=[]\n    for i in range(len(nums)-2):\n        if i>0 and nums[i]==nums[i-1]: continue\n        l,r=i+1,len(nums)-1\n        while l<r:\n            s=nums[i]+nums[l]+nums[r]\n            if s<0: l+=1\n            elif s>0: r-=1\n            else: res.append([nums[i],nums[l],nums[r]]); l+=1; r-=1\n    return res' },

        // 扩写答案 (4倍)
        const expandedQuestions = rawQuestions.map(item => {
            const expanded = expandAnswer(item.a, item.tag);
            return { ...item, a: expanded };
        });

        let allQuestions = expandedQuestions.slice(0, 120);
        for (let i = allQuestions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
        }
        allQuestions = allQuestions.map((item, idx) => ({ ...item, id: idx + 1 }));

        // 渲染题目
        const grid = document.getElementById('questionGrid');
        function renderQuestions(filter = 'all') {
            grid.innerHTML = '';
            const filtered = filter === 'all' ? allQuestions : allQuestions.filter(item => item.tag === filter);
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="color:#b09ad9; text-align:center; padding:2rem;">暂无该分类题目</div>';
                return;
            }
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'question-card';
                const header = document.createElement('div');
                header.className = 'card-header';
                const numSpan = document.createElement('span');
                numSpan.className = 'q-number';
                numSpan.innerHTML = `<i class="fas fa-hashtag"></i> ${item.id}`;
                const tagSpan = document.createElement('span');
                tagSpan.className = 'q-tag';
                tagSpan.innerHTML = `<i class="fas fa-tag"></i> ${item.tag}`;
                header.appendChild(numSpan); header.appendChild(tagSpan);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `<i class="fas fa-question-circle"></i> ${item.q}`;

                const answer = document.createElement('div');
                answer.className = 'answer-content';
                if (item.code) {
                    answer.innerHTML = `<i class="fas fa-lightbulb"></i> ${item.a}<div class="code-block">${item.code}</div>`;
                } else {
                    answer.innerHTML = `<i class="fas fa-lightbulb"></i> ${item.a}`;
                }
                card.appendChild(header); card.appendChild(qText); card.appendChild(answer);
                grid.appendChild(card);
            });
        }
        renderQuestions('all');

        // 分类筛选
        const filterTags = document.querySelectorAll('.filter-tag');
        filterTags.forEach(tag => {
            tag.addEventListener('click', function() {
                filterTags.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderQuestions(this.dataset.filter);
            });
        });

        // ===== HR API (DeepSeek) =====
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiStatus = document.getElementById('apiStatus');
        const apiModal = document.getElementById('apiModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveApiBtn = document.getElementById('saveApiBtn');
        const cancelApiBtn = document.getElementById('cancelApiBtn');

        let apiKey = localStorage.getItem('deepseek_api_key') || '';

        function updateApiStatus() {
            if (apiKey) {
                apiStatus.innerHTML = `
                    <i class="fas fa-circle" style="color:#4caf50; font-size:0.5rem;"></i>
                    <span>API 已就绪</span>
                    <i class="fas fa-cog" style="margin-left:auto; opacity:0.6;"></i>
                `;
            } else {
                apiStatus.innerHTML = `
                    <i class="fas fa-circle" style="color:#ff6b6b; font-size:0.5rem;"></i>
                    <span>未设置 API Key</span>
                    <i class="fas fa-cog" style="margin-left:auto; opacity:0.6;"></i>
                `;
            }
        }
        updateApiStatus();

        apiStatus.addEventListener('click', () => {
            apiKeyInput.value = apiKey || '';
            apiModal.classList.add('active');
        });

        saveApiBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                apiKey = key;
                localStorage.setItem('deepseek_api_key', key);
                updateApiStatus();
                apiModal.classList.remove('active');
                addMessage('✅ API Key 已保存，现在可以提问了！', true);
            } else {
                alert('请输入有效的 API Key');
            }
        });

        cancelApiBtn.addEventListener('click', () => {
            apiModal.classList.remove('active');
        });

        apiModal.addEventListener('click', (e) => {
            if (e.target === apiModal) apiModal.classList.remove('active');
        });

        async function callDeepSeekAPI(question) {
            if (!apiKey) {
                return '⚠️ 请先设置 DeepSeek API Key（点击状态栏设置）';
            }
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是一位资深的大厂HR面试官，回答面试相关问题，专业、亲切、有洞察。' },
                            { role: 'user', content: question }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                insightBox.innerHTML = `
                    <i class="fas fa-quote-left"></i> <strong>${c.name}</strong><br>
                    ${c.experience.replace(/\n/g, '<br>')}
                    <hr style="border-color:rgba(160,120,255,0.2); margin:8px 0;">
                    ${guiXiContent.guide}
                    <hr style="border-color:rgba(160,120,255,0.2); margin:8px 0;">
                    ${guiXiContent.tradition}
                    <hr style="border-color:rgba(160,120,255,0.2); margin:8px 0;">
                    ${guiXiContent.origin}
                    <hr style="border-color:rgba(160,120,255,0.2); margin:8px 0;">
                    ${guiXiContent.courses}
                `;
            });
            companyContainer.appendChild(div);
        });

        // 默认显示贵系全部内容
        insightBox.innerHTML = `
            <i class="fas fa-quote-left"></i> 点击左侧公司名称查看详细面经<br><br>
            ${guiXiContent.guide}
            <hr style="border-color:rgba(160,120,255,0.2); margin:8px 0;">
            ${guiXiContent.tradition}
            <hr style="border-color:rgba(160,120,255,0.2); margin:8px 0;">
            ${guiXiContent.origin}
            <hr style="border-color:rgba(160,120,255,0.2); margin:8px 0;">
            ${guiXiContent.courses}
        `;

        // 双击标题展开/收起
        const titleH1 = document.querySelector('.title-group h1');
        let allOpen = true;
        titleH1.addEventListener('dblclick', function() {
            const allAnswers = document.querySelectorAll('.answer-content');
            allOpen = !allOpen;
            allAnswers.forEach(el => el.style.display = allOpen ? 'block' : 'none');
        });
        document.querySelectorAll('.answer-content').forEach(el => el.style.display = 'block');

        console.log('✅ 面试题库加载完成，共 ' + allQuestions.length + ' 题');
    })();
</script>
</body>
</html>
