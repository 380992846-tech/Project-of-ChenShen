<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大厂面试 · 清华紫黑 · 120题</title>
  <!-- Font Awesome 6 免费 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0710;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .glass-container {
      max-width: 1600px;
      width: 100%;
      background: rgba(30, 18, 48, 0.45);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 3.5rem;
      padding: 2.2rem 2.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(180, 130, 255, 0.25);
      border: 1px solid rgba(160, 120, 255, 0.15);
      position: relative;
    }

    /* 头部 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid rgba(180, 130, 255, 0.2);
      padding-bottom: 1rem;
    }

    .title-group h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e0d0ff 0%, #b28aff 60%, #9f7aff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(150, 100, 255, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .title-group h1 i { font-size: 2.4rem; color: #b28aff; filter: drop-shadow(0 0 8px #a07cff); }
    .subtitle { color: rgba(210, 185, 255, 0.7); font-weight: 400; font-size: 1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .stats-badge {
      background: rgba(120, 80, 200, 0.25);
      backdrop-filter: blur(4px);
      padding: 0.5rem 1.6rem;
      border-radius: 60px;
      border: 1px solid rgba(180, 130, 255, 0.3);
      color: #d4c0ff;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 0 20px rgba(130, 80, 255, 0.15);
      white-space: nowrap;
    }

    /* 主布局：左列 (HR) + 中列 (题目) + 右列 (公司+心得) */
    .main-layout {
      display: flex;
      gap: 1.8rem;
      margin-top: 0.3rem;
    }

    /* 左侧 HR 助手 */
    .left-hr {
      flex: 0 0 280px;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .hr-chat {
      background: rgba(22, 12, 40, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.4rem 1.2rem;
      border: 1px solid rgba(160, 120, 255, 0.2);
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
    }

    .hr-chat h3 {
      color: #d4c0ff;
      font-weight: 500;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(160, 120, 255, 0.15);
      padding-bottom: 0.5rem;
    }
    .hr-chat h3 i { color: #b28aff; }

    .chat-box { display: flex; flex-direction: column; gap: 10px; }
    .chat-input-group { display: flex; gap: 6px; }
    .chat-input-group input {
      flex: 1;
      background: rgba(10, 5, 25, 0.6);
      border: 1px solid rgba(160, 120, 255, 0.25);
      border-radius: 40px;
      padding: 0.6rem 1rem;
      color: #ede6ff;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    .chat-input-group input::placeholder { color: rgba(180, 160, 220, 0.5); }
    .chat-input-group input:focus { border-color: #a885ff; box-shadow: 0 0 16px rgba(140, 100, 255, 0.2); }
    .chat-input-group button {
      background: rgba(130, 80, 255, 0.3);
      border: 1px solid rgba(160, 120, 255, 0.3);
      border-radius: 40px;
      padding: 0 1.2rem;
      color: #ede6ff;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .chat-input-group button:hover { background: rgba(150, 100, 255, 0.4); border-color: #b28aff; box-shadow: 0 0 20px rgba(140, 100, 255, 0.3); }

    .chat-messages {
      background: rgba(10, 5, 20, 0.3);
      border-radius: 1.4rem;
      padding: 0.7rem 1rem;
      min-height: 80px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid rgba(160, 120, 255, 0.1);
    }
    .chat-msg { color: #d4c6f5; font-size: 0.85rem; line-height: 1.6; padding: 0.2rem 0; border-bottom: 1px solid rgba(160, 120, 255, 0.05); }
    .chat-msg i { margin-right: 8px; color: #a885ff; width: 1.2rem; }
    .chat-msg.hr i { color: #c6adff; }

    /* 中间：题目 */
    .middle-questions {
      flex: 2.8;
      min-width: 0;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 1.2rem;
    }
    .filter-tag {
      background: rgba(50, 30, 80, 0.4);
      backdrop-filter: blur(4px);
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(170, 140, 255, 0.2);
      color: #cdbcff;
      font-size: 0.85rem;
      font-weight: 450;
      transition: all 0.2s;
      cursor: default;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .filter-tag i { margin-right: 6px; color: #a885ff; }
    .filter-tag.active { background: rgba(130, 80, 255, 0.35); border-color: #a07cff; box-shadow: 0 0 20px rgba(140, 100, 255, 0.3); color: #f0ebff; }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
      max-height: 620px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .question-card {
      background: rgba(22, 12, 40, 0.55);
      backdrop-filter: blur(12px) saturate(150%);
      border-radius: 1.8rem;
      padding: 1.2rem 1.2rem 1rem;
      border: 1px solid rgba(160, 120, 255, 0.2);
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(200, 170, 255, 0.15);
      transition: all 0.2s ease;
    }
    .question-card:hover { transform: translateY(-3px); border-color: rgba(180, 130, 255, 0.5); background: rgba(30, 18, 52, 0.7); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .q-number { font-size: 0.7rem; font-weight: 600; color: #b69eff; background: rgba(100, 70, 180, 0.3); padding: 0.1rem 0.9rem; border-radius: 40px; border: 1px solid rgba(150, 120, 255, 0.2); }
    .q-tag { font-size: 0.65rem; background: rgba(180, 130, 255, 0.15); padding: 0.1rem 0.7rem; border-radius: 30px; color: #cbb5ff; border: 1px solid rgba(150, 110, 255, 0.15); }

    .question-text { font-size: 0.95rem; font-weight: 500; line-height: 1.5; color: #ede6ff; margin: 0.2rem 0 0.4rem; }
    .question-text i { color: #b28aff; margin-right: 6px; opacity: 0.6; }

    .answer-content {
      color: #d4c6f5;
      font-size: 0.88rem;
      line-height: 1.6;
      padding: 0.5rem 0.8rem;
      background: rgba(20, 10, 38, 0.3);
      border-radius: 14px;
      margin-top: 0.4rem;
      border-left: 2px solid rgba(160, 120, 255, 0.3);
    }
    .answer-content i { color: #b28aff; margin-right: 6px; }

    /* 右侧：公司 + 心得 */
    .right-info {
      flex: 1.2;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .info-card {
      background: rgba(22, 12, 40, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.2rem 1.2rem 1rem;
      border: 1px solid rgba(160, 120, 255, 0.2);
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
    }
    .info-card h3 {
      color: #d4c0ff;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(160, 120, 255, 0.15);
      padding-bottom: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .info-card h3 i { color: #b28aff; }

    .company-list { display: flex; flex-direction: column; gap: 0.6rem; max-height: 340px; overflow-y: auto; padding-right: 4px; }
    .company-item {
      background: rgba(10, 5, 20, 0.3);
      border-radius: 1.2rem;
      padding: 0.6rem 0.9rem;
      border-left: 3px solid #a07cff;
    }
    .company-item strong { color: #e0d0ff; font-size: 0.9rem; }
    .company-item .brief { color: #cdbcff; font-size: 0.75rem; line-height: 1.5; margin-top: 2px; }
    .company-item .brief i { color: #a885ff; width: 1.2rem; }

    .insight-box {
      background: rgba(10, 5, 20, 0.4);
      border-radius: 1.2rem;
      padding: 0.7rem 1rem;
      font-size: 0.8rem;
      color: #d9ccf5;
      border-left: 3px solid #b28aff;
      margin-top: 0.3rem;
      line-height: 1.7;
    }

    ::-webkit-scrollbar { width: 4px; background: #1c112c; }
    ::-webkit-scrollbar-thumb { background: #6f4d9e; border-radius: 20px; }

    @media (max-width: 1200px) {
      .main-layout { flex-wrap: wrap; }
      .left-hr { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; }
      .left-hr .hr-chat { flex: 1; min-width: 240px; }
      .right-info { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; }
      .right-info .info-card { flex: 1; min-width: 200px; }
    }
    @media (max-width: 700px) {
      .glass-container { padding: 1.2rem 0.8rem; }
      .title-group h1 { font-size: 2rem; }
      .question-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="glass-container">
  <!-- 头部：标题 + HR助手整合 -->
  <div class="header">
    <div class="title-group">
      <h1><i class="fas fa-code"></i> 面试·120题</h1>
      <div class="subtitle">
        <i class="fas fa-graduation-cap"></i> 清华紫黑 · 大厂真题
        <span style="margin-left: 8px; opacity:0.4;">|</span>
        <i class="fas fa-user-tie" style="margin-left: 6px;"></i> HR 助手
        <span style="margin-left: 8px; opacity:0.4;">|</span>
        <i class="fas fa-building"></i> 15家
      </div>
    </div>
    <div class="stats-badge"><i class="fas fa-list-ul"></i> 120 题 · 答案直显</div>
  </div>

  <!-- 主布局 -->
  <div class="main-layout">
    <!-- 左侧：HR 助手 -->
    <div class="left-hr">
      <div class="hr-chat">
        <h3><i class="fas fa-comment-dots"></i> HR 智能问答</h3>
        <div class="chat-box">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-msg hr"><i class="fas fa-user-tie"></i> 你好！我是大厂HR，有面试问题尽管问我～</div>
          </div>
          <div class="chat-input-group">
            <input type="text" id="chatInput" placeholder="例如：薪资怎么谈？" />
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
      <!-- 小彩蛋：快速入口提示 -->
      <div style="background:rgba(22,12,40,0.3); border-radius:1.4rem; padding:0.6rem 1rem; border:1px solid rgba(160,120,255,0.1); color:#b09ad9; font-size:0.75rem;">
        <i class="fas fa-lightbulb" style="color:#a885ff;"></i> 双击标题可展开/收起所有答案
      </div>
    </div>

    <!-- 中间：题目 120 道 -->
    <div class="middle-questions">
      <div class="filter-bar">
        <span class="filter-tag active"><i class="fas fa-layer-group"></i> 全部</span>
        <span class="filter-tag"><i class="fas fa-code"></i> 算法</span>
        <span class="filter-tag"><i class="fas fa-database"></i> 系统设计</span>
        <span class="filter-tag"><i class="fas fa-microchip"></i> 基础</span>
        <span class="filter-tag"><i class="fas fa-puzzle-piece"></i> 智力题</span>
      </div>
      <div class="question-grid" id="questionGrid"></div>
    </div>

    <!-- 右侧：15家公司 + 学长心得 -->
    <div class="right-info">
      <div class="info-card">
        <h3><i class="fas fa-building"></i> 清华人偏爱的 15 家</h3>
        <div class="company-list" id="companyList"></div>
      </div>
      <div class="info-card">
        <h3><i class="fas fa-user-graduate"></i> 学长面试心得</h3>
        <div class="insight-box">
          <i class="fas fa-quote-left" style="color:#a885ff; margin-right:6px;"></i> 
          “算法是敲门砖，项目深挖是核心。多复盘简历上的每个细节，用STAR法则讲好故事。 
          清华人优势在基础扎实，但也要展现工程落地能力。心态放平，面试是双向选择。”
        </div>
        <div style="margin-top:8px; background:rgba(10,5,20,0.3); border-radius:1.2rem; padding:0.6rem 0.9rem; font-size:0.75rem; color:#b09ad9;">
          <i class="fas fa-check-circle" style="color:#a885ff;"></i> 来自 3 位学长姐的实战总结
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- 扩展至 120 道 (无重复) ----------
    const baseQuestions = [
      { q: 'HTTPS 的握手过程？', a: 'TCP三次握手 + TLS四次握手：Client Hello、Server Hello、证书验证、密钥交换、完成。' },
      { q: 'Redis 持久化方式？', a: 'RDB快照与AOF日志，可混合使用。' },
      { q: '进程与线程的区别？', a: '进程资源隔离，线程共享内存；线程轻量，进程更重。' },
      { q: 'TCP 和 UDP 的区别？', a: 'TCP可靠有序，UDP不可靠但快速。' },
      { q: '死锁是什么？如何避免？', a: '循环等待资源，破坏四大条件之一。' },
      { q: 'MySQL 索引底层？', a: 'B+树，叶子存数据，非叶子存索引。' },
      { q: 'JVM 内存模型？', a: '堆、栈、方法区、PC、本地方法栈。' },
      { q: 'Spring IOC 和 AOP？', a: 'IOC控制反转，AOP面向切面。' },

      { q: 'Linux 查看端口？', a: 'netstat -tulpn 或 lsof -i :端口' },
      { q: 'volatile 作用？', a: '可见性，禁止重排序，不保证原子性。' },
      { q: 'RESTful API？', a: 'HTTP方法操作资源，无状态。' },
      { q: '事务 ACID？', a: '原子性、一致性、隔离性、持久性。' },
      { q: '微服务优缺点？', a: '独立部署，但分布式复杂。' },
      { q: 'DNS 解析？', a: '本地缓存→DNS服务器→根→顶级→权威。' },
      { q: '秒杀系统设计？', a: '限流、缓存、MQ异步、分库分表。' },

      { q: 'JWT 是什么？', a: 'JSON Web Token，无状态认证。' },

      { q: 'Cookie vs Session？', a: 'Cookie客户端，Session服务端。' },
      { q: '链表有环判断？', a: '快慢指针，相遇则有环。' },
      { q: 'SQL 优化？', a: '索引、避免*、分页、EXPLAIN。' },
      { q: 'Docker 是什么？', a: '容器化，镜像部署。' },
      { q: 'K8s 核心组件？', a: 'API Server, etcd, Scheduler, Controller, Kubelet, Proxy。' },
      { q: '缓存穿透解决？', a: '布隆过滤器，空对象缓存。' },
      { q: 'Dubbo 是什么？', a: 'RPC框架，服务治理。' },

    function addMessage(text, isHR = true) {
      const msg = document.createElement('div');
      msg.className = `chat-msg ${isHR ? 'hr' : ''}`;
      const icon = isHR ? '<i class="fas fa-user-tie"></i>' : '<i class="fas fa-user"></i>';
      msg.innerHTML = `${icon} ${text}`;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleAsk() {
      const question = chatInput.value.trim();
      if (!question) return;
      addMessage(question, false);
      chatInput.value = '';
      const reply = hrReplies[Math.floor(Math.random() * hrReplies.length)];
      setTimeout(() => addMessage(reply, true), 400 + Math.random() * 400);
    }

    sendBtn.addEventListener('click', handleAsk);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAsk(); });
