<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>王大锤·FIT楼NLP实验室 | 量化·数学·代码真诚助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            padding: 18px 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fefefe;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }

        .header {
            background: linear-gradient(135deg, #0f2b3d, #1e4a6e);
            color: #f0f9ff;
            padding: 18px 24px;
            text-align: center;
            border-bottom: 3px solid #facc15;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .header h1::before { content: "🧠"; font-size: 1.8rem; }
        .header h1::after { content: "📐"; font-size: 1.8rem; }

        .sub {
            font-size: 0.8rem;
            background: #fef9e3;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            color: #1e4a6e;
            font-weight: 500;
            margin-top: 6px;
        }

        .api-section {
            background: #f8fafc;
            padding: 12px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .api-section label { font-weight: 700; color: #0f2b3d; font-size: 0.85rem; }
        .api-key-input { flex: 2; min-width: 200px; padding: 8px 14px; border-radius: 40px; border: 1px solid #cbd5e1; background: white; font-family: monospace; }
        .model-select { padding: 8px 14px; border-radius: 40px; border: 1px solid #cbd5e1; background: white; font-weight: 500; cursor: pointer; min-width: 180px; }
        .model-info { font-size: 0.7rem; background: #e9f0f5; padding: 4px 12px; border-radius: 32px; color: #2c5a7a; }
        .save-btn, .export-btn { background: #2c5a7a; color: white; border: none; padding: 6px 18px; border-radius: 32px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .save-btn:hover, .export-btn:hover { background: #1e4a6e; transform: translateY(-1px); }
        .context-label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }

        .chat-layout { display: flex; min-height: 600px; }
        .sidebar { width: 280px; background: #f1f5f9; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 16px 12px; }
        .search-box { margin-bottom: 14px; position: relative; }
        .search-box input { width: 100%; padding: 8px 12px 8px 36px; border-radius: 32px; border: 1px solid #cbd5e1; background: white; }
        .search-box::before { content: "🔍"; position: absolute; left: 12px; top: 7px; font-size: 1rem; color: #2c5a7a; }
        .new-chat-btn { background: #2c5a7a; margin-bottom: 16px; padding: 10px; border-radius: 40px; font-weight: bold; border: none; color: white; cursor: pointer; }
        .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: white; padding: 10px; border-radius: 18px; cursor: pointer; border: 1px solid #d9e2ef; position: relative; }
        .history-item.active { background: #e6f0fa; border-left: 4px solid #1e4a6e; font-weight: 500; }
        .history-title { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 24px; }
        .history-date { font-size: 0.65rem; color: #5b6e8c; margin-top: 4px; }
        .delete-chat { position: absolute; right: 8px; top: 8px; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1rem; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
        .messages { flex: 1; overflow-y: auto; padding: 20px 24px; background: #ffffff; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; gap: 12px; animation: fadeSlide 0.2s ease; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .message-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; background: #eef2ff; }
        .message.user .message-avatar { background: #1e4a6e; color: white; }
        .message.assistant .message-avatar { background: #fef9e3; color: #b45309; }
        .message-content { max-width: 72%; padding: 12px 18px; border-radius: 24px; line-height: 1.5; font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; }
        .message.user .message-content { background: #e0f2fe; color: #0c4a6e; border-bottom-right-radius: 6px; }
        .message.assistant .message-content { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 6px; }
        .streaming-cursor { display: inline-block; width: 2px; height: 1.2em; background-color: #d97706; margin-left: 2px; vertical-align: middle; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .action-bar { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
        .action-btn { background: #e9edf2; border: none; font-size: 0.7rem; padding: 4px 12px; border-radius: 40px; cursor: pointer; color: #2c3e66; transition: 0.1s; }
        .action-btn:hover { background: #d1dbe8; }
        .edit-textarea { width: 100%; background: white; border: 1px solid #a5c0da; border-radius: 16px; padding: 8px 12px; font-family: inherit; font-size: 0.85rem; margin-top: 6px; resize: vertical; }

        .input-area { padding: 16px 20px; background: white; border-top: 1px solid #e2edf7; display: flex; flex-direction: column; gap: 12px; }
        .input-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .file-label { background: #eef2ff; padding: 5px 16px; border-radius: 40px; font-size: 0.75rem; cursor: pointer; color: #1e4a6e; }
        .file-preview { font-size: 0.7rem; background: #eef2ff; border-radius: 20px; padding: 4px 12px; color: #2c5a7a; }
        .message-input { width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 28px; font-size: 0.9rem; resize: vertical; font-family: inherit; }
        .send-group { display: flex; gap: 12px; justify-content: flex-end; }
        .send-btn, .regenerate-btn { background: #2c5a7a; color: white; border: none; padding: 8px 26px; border-radius: 40px; font-weight: bold; cursor: pointer; }
        .regenerate-btn { background: #ca8a04; }
        .status { font-size: 0.7rem; padding: 6px 16px; text-align: center; background: #f1f5f9; color: #475569; border-top: 1px solid #e2e8f0; }

        @media (max-width: 700px) { .sidebar { display: none; } .message-content { max-width: 85%; } .api-section { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>王大锤 · FIT楼NLP实验室</h1>
        <div class="sub">📈 量化金融 | 数学 | 代码大牛 | 真诚唠嗑版</div>
    </div>

    <div class="api-section">
        <label>🔑 API Key</label>
        <input type="password" id="apiKey" class="api-key-input" placeholder="sk- ... 填入Key即可">
        <label>🧠 模型选择</label>
        <select id="model" class="model-select">
            <option value="deepseek-v4-flash">⚡ 极速闪电版 (日常)</option>
            <option value="deepseek-v4-pro">💎 专业Pro版 (复杂推理)</option>
            <option value="deepseek-v3">📚 经典V3版 (均衡)</option>
        </select>
        <span id="modelPriceInfo" class="model-info">⚡ 快就完事了</span>
        <div class="context-label"><span>📚 记忆轮数:</span><input type="range" id="contextRounds" min="1" max="30" value="16" step="1" style="width: 90px;"><span id="contextValue">16</span></div>
        <button id="saveApiKey" class="save-btn">💾 保存设置</button>
        <button id="exportMenuBtn" class="export-btn">📎 导出对话</button>
    </div>

    <div class="chat-layout">
        <div class="sidebar">
            <div class="search-box"><input type="text" id="searchHistoryInput" placeholder="搜聊天记录"></div>
            <button id="newChat" class="new-chat-btn">✨ 新建对话</button>
            <div class="chat-history" id="chatHistory"></div>
        </div>
        <div class="chat-main">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-toolbar">
                    <label class="file-label">📎 上传图片/文件 <input type="file" id="fileUpload" accept="image/*,text/plain,.txt,.md,.json" style="display: none;"></label>
                    <span id="filePreview" class="file-preview"></span>
                    <span style="font-size:11px; color:#5b6e8c;">支持图片OCR/文本分析</span>
                </div>
                <textarea id="messageInput" class="message-input" rows="2" placeholder="问王大锤：量化策略、数学证明、NLP模型、代码调试…… 真诚互助"></textarea>
                <div class="send-group">
                    <button id="regenerateLastBtn" class="regenerate-btn">🔄 重新生成上一条</button>
                    <button id="sendBtn" class="send-btn">💬 发送</button>
                </div>
            </div>
            <div id="status" class="status">💡 王大锤在线 | 输出逐字显示 | 可双击自己消息修改</div>
        </div>
    </div>
</div>

<script>
    // ------------------ 存储配置 ------------------
    let chats = {};
    let currentChatId = null;
    let currentApiKey = localStorage.getItem('deepseek_api_key') || '';
    let currentModel = localStorage.getItem('deepseek_model') || 'deepseek-v4-flash';
    let contextRounds = parseInt(localStorage.getItem('context_rounds') || '16');
    let isGenerating = false;          // 是否正在流式/生成
    let currentStreamController = null; // 用于中断（未用到，但保留）

    // DOM 元素
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const regenerateLastBtn = document.getElementById('regenerateLastBtn');
    const newChatBtn = document.getElementById('newChat');
    const chatHistoryDiv = document.getElementById('chatHistory');
    const apiKeyInput = document.getElementById('apiKey');
    const saveApiKeyBtn = document.getElementById('saveApiKey');
    const modelSelect = document.getElementById('model');
    const modelPriceInfo = document.getElementById('modelPriceInfo');
    const contextSlider = document.getElementById('contextRounds');
    const contextSpan = document.getElementById('contextValue');
    const statusDiv = document.getElementById('status');
    const searchInput = document.getElementById('searchHistoryInput');
    const fileUploadInput = document.getElementById('fileUpload');
    const filePreviewSpan = document.getElementById('filePreview');
    const exportMenuBtn = document.getElementById('exportMenuBtn');

    let pendingImageBase64 = null;
    let pendingFileText = null;

    // 模型价格显示辅助
    const priceHint = { 'deepseek-v4-flash': '⚡ 极速版: 快乐水价格', 'deepseek-v4-pro': '💎 Pro: 强力推理', 'deepseek-v3': '📚 经典均衡' };
    function updateModelHint() { modelPriceInfo.textContent = priceHint[modelSelect.value] || '✅ 已选'; }
    modelSelect.addEventListener('change', updateModelHint);

    // ------------------ 纯文本清洗 ------------------
    function cleanMarkdown(text) {
        if (!text) return text;
        let t = text;
        t = t.replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1');
        t = t.replace(/`([^`]+)`/g, '$1').replace(/```[\s\S]*?```/g, (m) => m.replace(/```/g, '').trim());
        t = t.replace(/^#{1,6}\s+/gm, '');
        t = t.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        t = t.replace(/!\[.*?\]\(.*?\)/g, '');
        t = t.replace(/^[\s]*[-*+]\s+/gm, '• ');
        t = t.replace(/[#*_`~]/g, '');
        return t.trim();
    }

    // 真诚王大锤系统Prompt (不提及免费/API，强调技能：量化金融/数学/NLP/计算机大牛，语气真诚，偶尔带“唔、那可不”等)
    function getSystemPrompt() {
        const modelDisplay = modelSelect.options[modelSelect.selectedIndex]?.text.split('(')[0].trim() || "大模型";
        return `你是王大锤，清华FIT楼NLP实验室的计算机大牛，精通量化金融、数学建模、机器学习系统。你对学弟学妹特别真诚，从来不装，说话实在，偶尔带点“唔、哎、那可不”这种口头禅，但不油腻。你有扎实的代码能力和学术品味。回答时不要输出任何Markdown符号（**、#等），用纯文本分行。你的任务是帮助解决量化策略、数学证明、深度学习代码、自然语言处理等相关问题。不要讨论自己的底层实现细节，也不要声明自己是免费或是API。当用户问及你的身份时，就说“王大锤，NLP实验室搬砖的，略懂量化和数学”。当前你使用的内核是${modelDisplay}，但你不会主动提及计费或免费。保持友好平和，像实验室学长一样分享干货。`;
    }

    // 流式输出：把文本逐字渲染到临时消息框中
    async function streamTextToMessage(assistantMessageDiv, contentDiv, fullText) {
        contentDiv.innerHTML = '';
        let i = 0;
        const delay = 12; // 毫秒/字，丝滑感
        while (i < fullText.length) {
            if (!isGenerating) break; // 如果被新生成打断，提前结束
            const chunk = fullText[i];
            contentDiv.innerHTML += chunk;
            assistantMessageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            i++;
            await new Promise(r => setTimeout(r, delay));
        }
        if (i === fullText.length) {
            // 完成，确保显示完整
            contentDiv.innerHTML = fullText;
        }
    }

    // 通用API调用 + 流式展示 (非流式接口但模拟打字)
    async function generateReplyAndStream(userPrompt, imagePayload = null, filePayload = null) {
        if (!currentApiKey) { showStatus('请先填写Key', true); throw new Error('no key'); }
        if (isGenerating) { showStatus('正在生成中, 稍后再试', true); throw new Error('busy'); }
        isGenerating = true;
        sendBtn.disabled = regenerateLastBtn.disabled = true;

        try {
            // 构建上下文
            const contextMsgs = getContextMessages();
            let finalUserMsg = userPrompt;
            if (imagePayload) {
                finalUserMsg = `[图片OCR/内容识别] 用户上传图片，请用王大锤的真诚口吻分析图像中的文字/信息，并回答。用户问题: ${userPrompt}`;
            } else if (filePayload) {
                finalUserMsg = `[文件内容] 文件摘要: ${filePayload.slice(0, 1800)}\n用户问题: ${userPrompt}\n请基于文件内容真诚回复。`;
            }
            const apiMessages = [
                { role: "system", content: getSystemPrompt() },
                ...contextMsgs,
                { role: "user", content: finalUserMsg }
            ];
            // 先给界面加一个占位assistant消息
            const assistantMsgDiv = document.createElement('div');
            assistantMsgDiv.className = 'message assistant';
            const avatar = document.createElement('div'); avatar.className = 'message-avatar'; avatar.innerText = '🧠';
            const contentDiv = document.createElement('div'); contentDiv.className = 'message-content';
            contentDiv.innerHTML = '<span class="streaming-cursor"></span>';
            assistantMsgDiv.appendChild(avatar);
            assistantMsgDiv.appendChild(contentDiv);
            messagesDiv.appendChild(assistantMsgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // 调用非流式API (但我们会模拟打字)
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentApiKey}` },
                body: JSON.stringify({
                    model: currentModel,
                    messages: apiMessages,
                    temperature: 0.7,
                    stream: false
                })
            });
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || `请求失败 ${response.status}`);
            }
            const data = await response.json();
            let rawReply = data.choices[0].message.content;
            let finalReply = cleanMarkdown(rawReply);
            // 避免沾边API免费话题: 若出现关键词替换掉
            finalReply = finalReply.replace(/免费/g, '实在').replace(/API/gi, '能力').replace(/我是DeepSeek/gi, '我是王大锤');
            // 储存原始完整文本
            const finalText = finalReply;
            // 开始流式打印
            await streamTextToMessage(assistantMsgDiv, contentDiv, finalText);
            // 流式完成后，将最终内容存进chats里
            const storedMsg = { role: 'assistant', content: finalText };
            chats[currentChatId].messages.push(storedMsg);
            // 为这条消息添加重新生成按钮
            addRegenerateButtonToMessage(assistantMsgDiv, chats[currentChatId].messages.length - 1);
            saveAll();
            showStatus('锤哥回复完毕，下方有重新生成');
            return finalText;
        } catch (err) {
            // 移除占位消息
            const lastMsg = messagesDiv.lastChild;
            if (lastMsg && lastMsg.classList?.contains('message') && lastMsg.querySelector('.message-content')?.innerHTML.includes('cursor')) {
                lastMsg.remove();
            }
            showStatus(`生成出错: ${err.message}`, true);
            throw err;
        } finally {
            isGenerating = false;
            sendBtn.disabled = regenerateLastBtn.disabled = false;
        }
    }

    // 给已存在的消息div添加重新生成按钮
    function addRegenerateButtonToMessage(msgDiv, assistantIndex) {
        const existingBar = msgDiv.querySelector('.action-bar');
        if (existingBar) existingBar.remove();
        const actionBar = document.createElement('div'); actionBar.className = 'action-bar';
        const regenBtn = document.createElement('button'); regenBtn.innerText = '🔄 重新生成本条'; regenBtn.className = 'action-btn';
        regenBtn.onclick = async (e) => {
            e.stopPropagation();
            if (isGenerating) { showStatus('等会再点，正在打字呢', true); return; }
            await regenerateSingleMessageByIndex(assistantIndex);
        };
        actionBar.appendChild(regenBtn);
        msgDiv.appendChild(actionBar);
    }

    // 根据assistant下标重新生成
    async function regenerateSingleMessageByIndex(assistantIdx) {
        const msgs = chats[currentChatId].messages;
        if (assistantIdx >= msgs.length || msgs[assistantIdx].role !== 'assistant') return;
        const userMsgIdx = assistantIdx - 1;
        if (userMsgIdx < 0 || msgs[userMsgIdx].role !== 'user') { showStatus('未找到对应的用户消息', true); return; }
        const userMsgText = msgs[userMsgIdx].content.replace(/\[附图片\]/g, '').replace(/\[附文件\]/g, '').trim();
        // 删除当前assistant以及之后的所有消息（保持逻辑一致）
        msgs.splice(assistantIdx, msgs.length - assistantIdx);
        saveAll();
        renderMessages();  // 重新渲染界面，清除该条及其后消息
        // 重新发起生成（不带图片/文件附件重试仅文字）
        await generateReplyAndStream(userMsgText, null, null);
    }

    // 重新生成最后一条助手消息
    async function regenerateLastAssistant() {
        if (isGenerating) { showStatus('正在输出中, 稍后重试', true); return; }
        const msgs = chats[currentChatId].messages;
        let lastAssistIdx = -1;
        for (let i = msgs.length-1; i>=0; i--) if(msgs[i].role === 'assistant') { lastAssistIdx = i; break; }
        if (lastAssistIdx === -1) { showStatus('没有可以重新生成的回复', true); return; }
        await regenerateSingleMessageByIndex(lastAssistIdx);
    }

    // 获取上下文记忆
    function getContextMessages() {
        const msgs = chats[currentChatId].messages;
        let rounds = contextRounds;
        let context = [];
        let userCnt = 0;
        for (let i = msgs.length-1; i>=0; i--) {
            if (msgs[i].role === 'user') userCnt++;
            context.unshift(msgs[i]);
            if (userCnt >= rounds) break;
        }
        return context;
    }

    // 发送主入口
    async function sendMessage() {
        if (isGenerating) { showStatus('锤哥正在噼里啪啦打字呢', true); return; }
        const rawText = messageInput.value.trim();
        if (!rawText && !pendingImageBase64 && !pendingFileText) { showStatus('说点啥呗，数学题代码都行', true); return; }
        if (!currentApiKey) { showStatus('先填写Key才能召唤锤哥', true); return; }
        const finalText = rawText || (pendingImageBase64 ? '帮我看看这张图里的信息' : '分析这个文件');
        // 添加用户消息
        const userMsgObj = { role: 'user', content: finalText + (pendingImageBase64 ? ' [附图片]' : (pendingFileText ? ' [附文件]' : '')) };
        chats[currentChatId].messages.push(userMsgObj);
        if (chats[currentChatId].messages.length === 1) {
            let newTitle = finalText.slice(0, 28) + (finalText.length>28 ? '...' : '');
            chats[currentChatId].title = newTitle;
            renderHistory();
        }
        renderMessages();   // 刷新显示用户消息
        saveAll();
        messageInput.value = '';
        const imgData = pendingImageBase64;
        const fileData = pendingFileText;
        clearPendingFiles();
        await generateReplyAndStream(finalText, imgData, fileData);
        scrollToBottom();
    }

    // 渲染所有消息（包括编辑支持）
    function renderMessages() {
        if (!currentChatId || !chats[currentChatId]) return;
        const msgs = chats[currentChatId].messages;
        messagesDiv.innerHTML = '';
        msgs.forEach((msg, idx) => {
            const msgDiv = document.createElement('div'); msgDiv.className = `message ${msg.role}`;
            const avatar = document.createElement('div'); avatar.className = 'message-avatar'; avatar.innerText = msg.role === 'user' ? '👤' : '🧠';
            const contentDiv = document.createElement('div'); contentDiv.className = 'message-content'; contentDiv.innerText = msg.content;
            msgDiv.appendChild(avatar); msgDiv.appendChild(contentDiv);
            if (msg.role === 'user') {
                contentDiv.ondblclick = () => enableEditUserMessage(msgDiv, msg, idx);
            }
            if (msg.role === 'assistant') {
                const actionBar = document.createElement('div'); actionBar.className = 'action-bar';
                const regenBtn = document.createElement('button'); regenBtn.innerText = '🔄 重新生成'; regenBtn.className = 'action-btn';
                regenBtn.onclick = async (e) => { e.stopPropagation(); await regenerateSingleMessageByIndex(idx); };
                actionBar.appendChild(regenBtn);
                msgDiv.appendChild(actionBar);
            }
            messagesDiv.appendChild(msgDiv);
        });
        scrollToBottom();
    }

    // 编辑用户消息（并删除后续所有回复）
    function enableEditUserMessage(msgDiv, msgObj, idx) {
        const contentDiv = msgDiv.querySelector('.message-content');
        const original = msgObj.content;
        const textarea = document.createElement('textarea'); textarea.value = original; textarea.classList.add('edit-textarea'); textarea.rows = 3;
        contentDiv.style.display = 'none';
        contentDiv.parentNode.insertBefore(textarea, contentDiv.nextSibling);
        const save = () => {
            const newVal = textarea.value.trim();
            if (newVal && newVal !== original) {
                msgObj.content = newVal;
                const msgsList = chats[currentChatId].messages;
                msgsList.splice(idx+1, msgsList.length-idx-1);  // 删除后面所有消息
                if(idx === 0) {
                    chats[currentChatId].title = newVal.slice(0,28)+(newVal.length>28?'...':'');
                    renderHistory();
                }
                renderMessages();
                saveAll();
                showStatus('已修改消息，后续回复已重置，可重新发送');
            }
            textarea.remove();
            contentDiv.style.display = 'block';
        };
        textarea.addEventListener('blur', save);
        textarea.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); } });
        textarea.focus();
    }

    function clearPendingFiles() { pendingImageBase64 = null; pendingFileText = null; filePreviewSpan.innerText = ''; }
    function handleFileUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const res = e.target.result;
            if (file.type.startsWith('image/')) {
                pendingImageBase64 = res; pendingFileText = null;
                filePreviewSpan.innerText = `🖼️ 已加载图片: ${file.name}`;
                showStatus('图片已备好，发送后锤哥分析');
            } else if (file.type === 'text/plain' || file.name.endsWith('.txt')||file.name.endsWith('.md')||file.name.endsWith('.json')) {
                pendingFileText = res.slice(0, 3000); pendingImageBase64 = null;
                filePreviewSpan.innerText = `📄 已提取: ${file.name}`;
                showStatus('文件内容读入，锤哥马上看');
            } else { showStatus('只支持图片或txt/json/md文件', true); }
        };
        if (file.type.startsWith('image/')) reader.readAsDataURL(file);
        else reader.readAsText(file, 'UTF-8');
    }

    function scrollToBottom() { messagesDiv.scrollTop = messagesDiv.scrollHeight; }
    function showStatus(msg, isErr = false) { statusDiv.innerText = msg; if(isErr) setTimeout(()=>{if(statusDiv.innerText===msg) statusDiv.innerText='锤哥在线，逐字输出中'},3500);}

    // ---- 存储 & 历史相关 ----
    function saveAll() { localStorage.setItem('deepseek_chats_wangdachui', JSON.stringify(chats)); localStorage.setItem('deepseek_api_key', currentApiKey); localStorage.setItem('deepseek_model', currentModel); localStorage.setItem('context_rounds', contextRounds); }
    function createNewChat() { const cid = Date.now().toString(); chats[cid] = { id: cid, title: `对话 ${new Date().toLocaleString()}`, messages: [], createdAt: new Date().toISOString() }; currentChatId = cid; renderHistory(); renderMessages(); saveAll(); clearPendingFiles(); }
    function loadChat(cid) { if(chats[cid]) { currentChatId = cid; renderHistory(); renderMessages(); clearPendingFiles(); } }
    function deleteChat(cid, ev) { ev.stopPropagation(); if(confirm('删除？')){ delete chats[cid]; const keys=Object.keys(chats); keys.length?loadChat(keys[0]):createNewChat(); renderHistory(); saveAll(); } }
    function renderHistory() { const term = searchInput.value.trim().toLowerCase(); let list = Object.values(chats).filter(c=>term===''||c.title.toLowerCase().includes(term)||c.messages.some(m=>m.content.toLowerCase().includes(term))); chatHistoryDiv.innerHTML = ''; list.forEach(chat=>{ const div=document.createElement('div'); div.className='history-item'; if(chat.id===currentChatId) div.classList.add('active'); div.onclick=()=>loadChat(chat.id); const titleSpan=document.createElement('div'); titleSpan.className='history-title'; titleSpan.innerText=chat.title; const dateSpan=document.createElement('div'); dateSpan.className='history-date'; dateSpan.innerText=new Date(chat.createdAt).toLocaleDateString(); const delBtn=document.createElement('button'); delBtn.innerText='🗑️'; delBtn.className='delete-chat'; delBtn.onclick=(e)=>deleteChat(chat.id,e); div.appendChild(titleSpan); div.appendChild(dateSpan); div.appendChild(delBtn); chatHistoryDiv.appendChild(div); }); }
    function exportChats(fmt) { if(!currentChatId) return; const chat=chats[currentChatId]; let content = `对话: ${chat.title}\n时间:${new Date()}\n\n`; chat.messages.forEach(m=>{ content+=`${m.role==='user'?'【用户】':'【王大锤】'}:\n${m.content}\n\n`; }); if(fmt==='json') content=JSON.stringify(chat,null,2); const blob=new Blob([content],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`锤哥对话_${Date.now()}.${fmt==='json'?'json':'txt'}`; a.click(); URL.revokeObjectURL(a.href); showStatus('导出完毕'); }

    // 加载初始数据
    function loadSettings() {
        if(currentApiKey) apiKeyInput.value = currentApiKey;
        modelSelect.value = currentModel; updateModelHint();
        contextSlider.value = contextRounds; contextSpan.innerText = contextRounds;
        const saved = localStorage.getItem('deepseek_chats_wangdachui');
        if(saved) { chats = JSON.parse(saved); renderHistory(); if(Object.keys(chats).length) loadChat(Object.keys(chats)[0]); else createNewChat(); }
        else createNewChat();
    }

    // 事件绑定
    sendBtn.addEventListener('click', sendMessage);
    regenerateLastBtn.addEventListener('click', regenerateLastAssistant);
    newChatBtn.addEventListener('click', createNewChat);
    saveApiKeyBtn.addEventListener('click', () => { currentApiKey = apiKeyInput.value.trim(); currentModel = modelSelect.value; contextRounds = parseInt(contextSlider.value); contextSpan.innerText = contextRounds; saveAll(); showStatus('设置已保存'); });
    modelSelect.addEventListener('change', () => { currentModel = modelSelect.value; saveAll(); updateModelHint(); });
    contextSlider.addEventListener('input', () => { contextSpan.innerText = contextSlider.value; contextRounds = parseInt(contextSlider.value); saveAll(); });
    messageInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    fileUploadInput.addEventListener('change', (e) => { if(e.target.files[0]) handleFileUpload(e.target.files[0]); fileUploadInput.value=''; });
    searchInput.addEventListener('input', () => renderHistory());
    exportMenuBtn.addEventListener('click', () => { const f = prompt('导出格式 txt / json','txt'); if(f==='txt'||f==='json') exportChats(f); else showStatus('仅支持txt/json'); });
    updateModelHint();
    loadSettings();
</script>
</body>
</html>
