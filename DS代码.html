<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek · 算法工坊</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f0f2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px 36px 40px;
            box-shadow: 0 24px 56px rgba(0, 10, 30, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e6e9f2;
            padding-bottom: 18px;
        }

        .header i {
            font-size: 2.2rem;
            color: #2a3b6b;
            background: rgba(42, 59, 107, 0.08);
            padding: 10px 14px;
            border-radius: 28px;
        }

        .header h1 {
            font-weight: 650;
            font-size: 2.0rem;
            color: #1a2744;
            letter-spacing: 0.5px;
        }

        .header .badge {
            margin-left: auto;
            background: #eef1f9;
            padding: 6px 20px;
            border-radius: 60px;
            color: #2a3b6b;
            border: 1px solid #d2dae8;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 双列布局 */
        .grid-2col {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 28px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .grid-2col {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* 左侧面板 */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-box {
            background: #f8faff;
            border-radius: 28px;
            padding: 18px 22px 22px;
            border: 1px solid #e6ebf5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .section-box .section-title {
            font-weight: 600;
            color: #1f2b44;
            margin-bottom: 14px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-box .section-title i {
            color: #2a3b6b;
            font-size: 1.1rem;
            width: 22px;
        }

        /* API 密钥 */
        .api-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .api-row input {
            flex: 2 1 220px;
            padding: 12px 18px;
            border: 1px solid #d0d9e8;
            border-radius: 60px;
            font-size: 0.95rem;
            background: #ffffff;
            outline: none;
            transition: 0.2s;
        }

        .api-row input:focus {
            border-color: #2a3b6b;
            box-shadow: 0 0 0 3px rgba(42, 59, 107, 0.12);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #2a3b6b;
            color: #2a3b6b;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline:hover {
            background: #2a3b6b;
            color: white;
        }

        /* 下拉选择 */
        .select-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 18px;
        }

        .select-group .field {
            flex: 1 0 140px;
            min-width: 120px;
        }

        .select-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #3d4f72;
            margin-bottom: 4px;
        }

        .select-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d0d9e8;
            border-radius: 60px;
            background: white;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .select-group select:focus {
            border-color: #2a3b6b;
        }

        /* 题目列表 (滚动) */
        .question-list {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #e6ebf5;
            border-radius: 20px;
            padding: 6px 4px;
            background: white;
        }

        .question-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            border-bottom: 1px solid #f0f3fa;
        }

        .question-item:hover {
            background: #edf2fc;
        }

        .question-item.active {
            background: #dce4f5;
            font-weight: 500;
        }

        .question-item .q-tag {
            font-size: 0.65rem;
            background: #2a3b6b;
            color: white;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 600;
        }

        .question-item .q-name {
            flex: 1;
            font-size: 0.9rem;
            color: #1a2744;
        }

        .question-item .q-diff {
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 40px;
            background: #eef1f9;
            color: #3d4f72;
        }

        .question-item .q-diff.hard { background: #fde8e8; color: #b13e3e; }

        .no-result {
            color: #8a9bb8;
            text-align: center;
            padding: 30px 10px;
        }

        /* 右侧面板：答案 & 功能 */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .answer-box {
            background: #f8faff;
            border-radius: 28px;
            padding: 18px 22px 22px;
            border: 1px solid #e6ebf5;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .answer-box .section-title {
            font-weight: 600;
            color: #1f2b44;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .answer-box .section-title i {
            color: #2a3b6b;
        }

        .answer-content {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 20px;
            min-height: 180px;
            max-height: 340px;
            overflow-y: auto;
            border: 1px solid #e6ebf5;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #1a2744;
            flex: 1;
        }

        .answer-content.placeholder {
            color: #8a9bb8;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            flex: 1 0 auto;
        }

        .btn-primary {
            background: #2a3b6b;
            color: white;
            box-shadow: 0 8px 18px rgba(42, 59, 107, 0.20);
        }

        .btn-primary:hover {
            background: #1a2744;
            transform: scale(1.01);
        }

        .btn-secondary {
            background: #eef1f9;
            color: #1a2744;
            border: 1px solid #d2dae8;
        }

        .btn-secondary:hover {
            background: #ffffff;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #d0d9e8;
            border-top: 3px solid #2a3b6b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-tip {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: #3d4f72;
            margin-top: 10px;
            padding: 0 4px;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            color: #6a7d9e;
            border-top: 1px solid #e6ebf5;
            padding-top: 22px;
            font-size: 0.85rem;
        }

        /* 滚动条 */
        .question-list::-webkit-scrollbar, .answer-content::-webkit-scrollbar {
            width: 6px;
        }
        .question-list::-webkit-scrollbar-track {
            background: #f0f3fa;
            border-radius: 10px;
        }
        .question-list::-webkit-scrollbar-thumb {
            background: #c8d2e5;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 头部 -->
    <div class="header">
        <i class="fas fa-code"></i>
        <h1>DeepSeek · 算法工坊</h1>
        <div class="badge"><i class="fas fa-robot"></i> API 智能解题</div>
    </div>

    <!-- 主网格 -->
    <div class="grid-2col">
        <!-- 左侧 -->
        <div class="left-panel">
            <!-- API 密钥 -->
            <div class="section-box">
                <div class="section-title"><i class="fas fa-key"></i> API 配置</div>
                <div class="api-row">
                    <input type="password" id="apiKeyInput" placeholder="sk-... 输入 DeepSeek API Key" />
                    <button class="btn-outline" id="saveKeyBtn"><i class="fas fa-save"></i> 保存</button>
                </div>
            </div>

            <!-- 语言 & 功能 -->
            <div class="section-box">
                <div class="section-title"><i class="fas fa-sliders-h"></i> 编译语言 & 实用功能</div>
                <div class="select-group">
                    <div class="field">
                        <label><i class="fas fa-code"></i> 语言</label>
                        <select id="langSelect">
                            <option value="python">Python 3</option>
                            <option value="java">Java 17</option>
                            <option value="cpp">C++ 17</option>
                        </select>
                    </div>
                    <div class="field">
                        <label><i class="fas fa-magic"></i> 实用功能</label>
                        <select id="functionSelect">
                            <option value="explain">📖 详细解释</option>
                            <option value="optimize">⚡ 优化建议</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-secondary" id="runCodeBtn" style="flex:1;"><i class="fas fa-play"></i> 运行代码 (模拟)</button>
                    <button class="btn btn-secondary" id="copyAnswerBtn" style="flex:1;"><i class="fas fa-copy"></i> 复制答案</button>
                </div>
            </div>

            <!-- 题库 -->
            <div class="section-box" style="flex:1;">
                <div class="section-title"><i class="fas fa-list-ul"></i> 算法题库 <span style="font-weight:400; font-size:0.8rem; color:#6a7d9e; margin-left:8px;">点击题目生成答案</span></div>
                <div class="select-group" style="margin-bottom: 12px;">
                    <div class="field">
                        <label>📚 题库来源</label>
                        <select id="questionSource">
                            <option value="all">全部 (40题)</option>
                            <option value="company">大厂经典 (20题)</option>
                            <option value="leetcode">LeetCode Hard (20题)</option>
                        </select>
                    </div>
                </div>
                <div class="question-list" id="questionList">
                    <!-- 动态渲染 -->
                    <div class="no-result">加载题目中...</div>
                </div>
            </div>
        </div>

        <!-- 右侧：答案 -->
        <div class="right-panel">
            <div class="answer-box">
                <div class="section-title"><i class="fas fa-lightbulb"></i> 生成答案</div>
                <div class="answer-content placeholder" id="answerContent">
                    <i class="fas fa-robot" style="font-size:2.4rem; opacity:0.3;"></i>
                    <span>选择题目，点击「生成答案」</span>
                </div>
                <div class="action-bar">
                    <button class="btn btn-primary" id="generateAnswerBtn"><i class="fas fa-wand-magic-sparkles"></i> 生成答案</button>
                    <button class="btn btn-secondary" id="clearAnswerBtn"><i class="fas fa-rotate-left"></i> 清空</button>
                </div>
                <div class="status-tip">
                    <span id="statusText"><i class="fas fa-circle-info"></i> 就绪</span>
                    <div class="spinner" id="loadingSpinner"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <i class="fas fa-shield-alt"></i> 密钥本地存储 · 点击题目 + 生成答案 · 支持 Python / Java / C++
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ---------- 题库数据 (20 大厂 + 20 LeetCode Hard, 不重复) ----------
        const companyProblems = [
            { id: 'c1', name: '两数之和 (三数之和变种)', diff: 'Medium', tag: '大厂' },
            { id: 'c2', name: 'LRU 缓存机制', diff: 'Hard', tag: '大厂' },
            { id: 'c3', name: '反转链表 (K个一组)', diff: 'Hard', tag: '大厂' },
            { id: 'c4', name: '寻找中位数 (两个有序数组)', diff: 'Hard', tag: '大厂' },
            { id: 'c5', name: '最大子数组和 (环形)', diff: 'Medium', tag: '大厂' },
            { id: 'c6', name: '字符串解码 (嵌套括号)', diff: 'Medium', tag: '大厂' },
            { id: 'c7', name: '岛屿数量 (DFS/BFS)', diff: 'Medium', tag: '大厂' },
            { id: 'c8', name: '合并K个排序链表', diff: 'Hard', tag: '大厂' },
            { id: 'c9', name: '滑动窗口最大值', diff: 'Hard', tag: '大厂' },
            { id: 'c10', name: '搜索旋转排序数组', diff: 'Medium', tag: '大厂' },
            { id: 'c11', name: '全排列 (去重)', diff: 'Medium', tag: '大厂' },
            { id: 'c12', name: '二叉树最大路径和', diff: 'Hard', tag: '大厂' },
            { id: 'c13', name: '接雨水 (双指针)', diff: 'Hard', tag: '大厂' },
            { id: 'c14', name: '跳跃游戏 II', diff: 'Medium', tag: '大厂' },
            { id: 'c15', name: '无重复字符最长子串', diff: 'Medium', tag: '大厂' },
            { id: 'c16', name: '链表环检测 (II)', diff: 'Medium', tag: '大厂' },
            { id: 'c17', name: '有效括号 (多种括号)', diff: 'Medium', tag: '大厂' },
            { id: 'c18', name: '合并区间', diff: 'Medium', tag: '大厂' },
            { id: 'c19', name: '不同路径 (障碍物)', diff: 'Medium', tag: '大厂' },
            { id: 'c20', name: '单词搜索 (回溯)', diff: 'Hard', tag: '大厂' }
        ];

        const leetcodeHard = [
            { id: 'l1', name: '正则表达式匹配', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l2', name: '合并K个升序链表', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l3', name: '缺失的第一个正数', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l4', name: '串联所有单词的子串', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l5', name: '最长有效括号', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l6', name: '解数独', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l7', name: 'N皇后 II', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l8', name: '最小覆盖子串', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l9', name: '买卖股票的最佳时机 IV', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l10', name: '最大矩形', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l11', name: '二叉树中的最大路径和', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l12', name: '单词接龙 II', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l13', name: '戳气球', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l14', name: '分割数组的最大值', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l15', name: 'Frog Jump (青蛙过河)', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l16', name: 'LFU 缓存', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l17', name: '滑动窗口最大值 (优化)', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l18', name: '子序列宽度之和', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l19', name: '骑士拨号器', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l20', name: '最小化数组中的最大值', diff: 'Hard', tag: 'LeetCode' }
        ];

        // 合并总题库 (去重：按id去重，但id不同，保证不重复)
        const allQuestions = [...companyProblems, ...leetcodeHard];

        // DOM 引用
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const langSelect = document.getElementById('langSelect');
        const functionSelect = document.getElementById('functionSelect');
        const questionSource = document.getElementById('questionSource');
        const questionListEl = document.getElementById('questionList');
        const answerContent = document.getElementById('answerContent');
        const generateBtn = document.getElementById('generateAnswerBtn');
        const clearBtn = document.getElementById('clearAnswerBtn');
        const runCodeBtn = document.getElementById('runCodeBtn');
        const copyBtn = document.getElementById('copyAnswerBtn');
        const statusText = document.getElementById('statusText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // 状态
        let currentQuestions = [...allQuestions];
        let selectedQuestionId = null; // 当前选中的题目id

        // ---------- 渲染题库 ----------
        function renderQuestions(list) {
            if (!list || list.length === 0) {
                questionListEl.innerHTML = `<div class="no-result">暂无题目</div>`;
                return;
            }
            let html = '';
            list.forEach(q => {
                const active = (q.id === selectedQuestionId) ? 'active' : '';
                const diffClass = q.diff.toLowerCase() === 'hard' ? 'hard' : '';
                html += `
                    <div class="question-item ${active}" data-id="${q.id}">
                        <span class="q-tag">${q.tag}</span>
                        <span class="q-name">${q.name}</span>
                        <span class="q-diff ${diffClass}">${q.diff}</span>
                    </div>
                `;
            });
            questionListEl.innerHTML = html;

            // 绑定点击事件
            document.querySelectorAll('.question-item').forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.dataset.id;
                    selectedQuestionId = id;
                    // 高亮
                    document.querySelectorAll('.question-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    setStatus(`已选: ${this.querySelector('.q-name').textContent}`, '#1a2744');
                    // 清空答案
                    setAnswerPlaceholder('选择题目后点击「生成答案」');
                });
            });
        }

        // 根据来源过滤
        function filterQuestions(source) {
            if (source === 'company') {
                currentQuestions = [...companyProblems];
            } else if (source === 'leetcode') {
                currentQuestions = [...leetcodeHard];
            } else {
                currentQuestions = [...allQuestions];
            }
            // 保持选中状态清除
            selectedQuestionId = null;
            renderQuestions(currentQuestions);
            setAnswerPlaceholder('选择题目后点击「生成答案」');
        }

        // 设置答案占位
        function setAnswerPlaceholder(text) {
            answerContent.className = 'answer-content placeholder';
            answerContent.innerHTML = `
                <i class="fas fa-robot" style="font-size:2.4rem; opacity:0.3;"></i>
                <span>${text}</span>
            `;
        }

        // 设置答案内容
        function setAnswerContent(text) {
            answerContent.className = 'answer-content';
            answerContent.textContent = text;
        }

        // 状态
        function setStatus(msg, color = '#3d4f72') {
            statusText.innerHTML = `<i class="fas fa-circle-info"></i> ${msg}`;
            statusText.style.color = color;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loadingSpinner.style.display = 'inline-block';
                generateBtn.disabled = true;
                setStatus('⏳ 生成中...', '#2a3b6b');
            } else {
                loadingSpinner.style.display = 'none';
                generateBtn.disabled = false;
            }
        }

        // ---------- API 调用 (DeepSeek 文本) ----------
        async function callDeepSeek(prompt, apiKey) {
            const url = 'https://api.deepseek.com/v1/chat/completions';
            const body = {
                model: 'deepseek-chat',
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.7,
                max_tokens: 2000
            };
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(body)
            });
            if (!response.ok) {
                let errMsg = `API 请求失败 (${response.status})`;
                try {
                    const errData = await response.json();
                    errMsg = errData?.error?.message || errMsg;
                } catch (_) {}
                throw new Error(errMsg);
            }
            const data = await response.json();
            if (data.choices && data.choices.length > 0) {
                return data.choices[0].message.content;
            } else {
                throw new Error('API 返回格式异常');
            }
        }

        // ---------- 生成答案 ----------
        async function handleGenerate() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                setStatus('❌ 请先输入并保存 API 密钥', '#b13e3e');
                return;
            }
            // 保存
            localStorage.setItem('deepseek_api_key', apiKey);

            // 获取当前选中题目
            if (!selectedQuestionId) {
                setStatus('⚠️ 请先点击选择一道题目', '#b85a2b');
                return;
            }
            const question = currentQuestions.find(q => q.id === selectedQuestionId);
            if (!question) {
                setStatus('❌ 未找到题目', '#b13e3e');
                return;
            }

            const lang = langSelect.value;
            const func = functionSelect.value; // 'explain' or 'optimize'
            const langMap = { python: 'Python 3', java: 'Java 17', cpp: 'C++ 17' };
            const funcMap = { explain: '详细解释解题思路', optimize: '给出优化建议和复杂度分析' };

            // 构建 prompt
            const prompt = `
        题目: ${question.name} (难度: ${question.diff})
        请用 ${langMap[lang]} 语言给出解答代码，并附带 ${funcMap[func]}。
        要求: 代码清晰，包含注释，直接输出答案。
        `;

            setLoading(true);
            setAnswerPlaceholder('⏳ 正在生成...');
            try {
                const result = await callDeepSeek(prompt, apiKey);
                setAnswerContent(result);
                setStatus('✅ 生成成功', '#1e7b4c');
            } catch (error) {
                setStatus(`❌ 错误: ${error.message}`, '#b13e3e');
                setAnswerPlaceholder(`生成失败: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        // ---------- 事件绑定 ----------
        // 保存密钥
        saveKeyBtn.addEventListener('click', function() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('deepseek_api_key', key);
                setStatus('✅ API 密钥已保存', '#1e7b4c');
            } else {
                localStorage.removeItem('deepseek_api_key');
                setStatus('⚠️ 密钥已清除', '#b85a2b');
            }
        });

        // 来源切换
        questionSource.addEventListener('change', function() {
            filterQuestions(this.value);
        });

        // 生成答案
        generateBtn.addEventListener('click', handleGenerate);

        // 清空答案
        clearBtn.addEventListener('click', function() {
            setAnswerPlaceholder('已清空，选择题目重新生成');
            setStatus('🔄 已清空', '#3d4f72');
        });

        // 运行代码 (模拟)
        runCodeBtn.addEventListener('click', function() {
            setStatus('⚡ 模拟运行: 代码已编译 (仅演示)', '#2a3b6b');
            const content = answerContent.textContent || '暂无代码';
            alert(`[模拟运行]\n语言: ${langSelect.options[langSelect.selectedIndex].text}\n\n代码片段:\n${content.substring(0, 300)}...`);
        });

        // 复制答案
        copyBtn.addEventListener('click', function() {
            const text = answerContent.textContent || '';
            if (!text || answerContent.classList.contains('placeholder')) {
                setStatus('⚠️ 没有可复制的内容', '#b85a2b');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                setStatus('✅ 已复制到剪贴板', '#1e7b4c');
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                setStatus('✅ 已复制', '#1e7b4c');
            });
        });

        // 回车保存密钥
        apiKeyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveKeyBtn.click();
            }
        });

        // ---------- 初始化 ----------
        // 恢复密钥
        const savedKey = localStorage.getItem('deepseek_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        // 渲染全部题目
        filterQuestions('all');
        setStatus('🔑 就绪，选择题目生成答案', '#3d4f72');

        // 额外：如果点击题目时自动清空旧答案？ 已在点击时清空占位
        console.log('DeepSeek 算法工坊已启动');
    })();
</script>
</body>
</html>
