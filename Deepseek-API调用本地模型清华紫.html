<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>清华二校门小DeepSeek | 紫气东来智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #2b0f3a 0%, #4b1d6e 100%);
            min-height: 100vh;
            padding: 24px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 248, 255, 0.96);
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(156, 39, 176, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #4a148c, #6a1b9a);
            color: #fff8e7;
            padding: 20px 32px;
            text-align: center;
            border-bottom: 3px solid #ffd966;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .header h1::before {
            content: "🏛️";
            font-size: 2rem;
        }

        .header h1::after {
            content: "🤖";
            font-size: 2rem;
        }

        .sub {
            font-size: 0.85rem;
            margin-top: 8px;
            opacity: 0.9;
            background: #ffecb3;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            color: #4a1d6d;
            font-weight: 500;
        }

        .api-section {
            background: #faf3ff;
            padding: 14px 28px;
            border-bottom: 1px solid #e2c8ff;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .api-section label {
            font-weight: 700;
            color: #4a1d6d;
        }

        .api-key-input {
            flex: 2;
            min-width: 220px;
            padding: 10px 14px;
            border: 1.5px solid #cdb5e8;
            border-radius: 32px;
            font-family: monospace;
            background: white;
        }

        .api-key-input:focus {
            border-color: #9c27b0;
            outline: none;
            box-shadow: 0 0 0 2px rgba(156,39,176,0.2);
        }

        .model-select, .context-slider {
            padding: 8px 14px;
            border-radius: 32px;
            border: 1.5px solid #cdb5e8;
            background: white;
            font-weight: 500;
        }

        .save-btn, .export-btn {
            background: #6a1b9a;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 32px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .save-btn:hover, .export-btn:hover, .new-chat-btn:hover {
            background: #8e24aa;
            transform: translateY(-1px);
        }

        .context-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .chat-layout {
            display: flex;
            min-height: 620px;
        }

        .sidebar {
            width: 300px;
            background: #fff5fd;
            border-right: 1px solid #e9d4ff;
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
        }

        .search-box {
            margin-bottom: 18px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 40px;
            border: 1px solid #d9c2f0;
            background: white;
            font-size: 0.9rem;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 8px;
            font-size: 1rem;
            color: #8e24aa;
        }

        .new-chat-btn {
            background: #8e24aa;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            border: none;
            color: white;
            cursor: pointer;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: white;
            padding: 12px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid #eeddff;
        }

        .history-item.active {
            background: #e9d4ff;
            border-left: 5px solid #6a1b9a;
            font-weight: 500;
        }

        .history-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-date {
            font-size: 0.7rem;
            color: #7b5a96;
            margin-top: 6px;
        }

        .delete-chat {
            float: right;
            background: none;
            border: none;
            color: #b873c9;
            cursor: pointer;
            font-size: 1rem;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            background: #fefcff;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: fadeSlide 0.25s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: #f0e6ff;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #6a1b9a;
            color: white;
        }

        .message.assistant .message-avatar {
            background: #ffecb3;
            color: #6a1b9a;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 24px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-content {
            background: #e1b9ff;
            color: #2c0b3a;
            border-bottom-right-radius: 6px;
        }

        .message.assistant .message-content {
            background: #f4eafc;
            color: #1f1a2e;
            border-bottom-left-radius: 6px;
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            justify-content: flex-end;
        }

        .action-btn {
            background: #ede7f6;
            border: none;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 50px;
            cursor: pointer;
            color: #4a1d6d;
        }

        .action-btn:hover {
            background: #d5c4f0;
        }

        .input-area {
            padding: 18px 24px;
            background: white;
            border-top: 1px solid #eeddff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-label {
            background: #e9e0f5;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 500;
        }

        .file-label:hover {
            background: #d6c2f0;
        }

        .message-input {
            width: 100%;
            padding: 12px 18px;
            border: 1.5px solid #e2cef5;
            border-radius: 32px;
            font-size: 0.9rem;
            resize: vertical;
            font-family: inherit;
        }

        .send-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .send-btn, .regenerate-btn {
            background: #8e24aa;
            color: white;
            border: none;
            padding: 10px 26px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .regenerate-btn {
            background: #ab47bc;
        }

        .status {
            font-size: 0.7rem;
            padding: 6px 20px;
            text-align: center;
            background: #f9f1ff;
            color: #8e5ea6;
        }

        @media (max-width: 780px) {
            .sidebar {
                display: none;
            }
            .message-content {
                max-width: 85%;
            }
        }

        .file-preview {
            font-size: 0.7rem;
            color: #6a1b9a;
            background: #f3eaff;
            border-radius: 20px;
            padding: 4px 12px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>清华二校门小DeepSeek</h1>
        <div class="sub">紫荆智能 | 纯文本回复 | 长记忆 · 文件理解</div>
    </div>

    <div class="api-section">
        <label>🔑 API Key</label>
        <input type="password" id="apiKey" class="api-key-input" placeholder="sk-... 填写你的DeepSeek Key">
        <label>🧠 模型</label>
        <select id="model" class="model-select">
            <option value="deepseek-chat">DeepSeek-Chat (通用)</option>
            <option value="deepseek-coder">DeepSeek-Coder (代码)</option>
        </select>
        <div class="context-label">
            <span>📚 记忆轮数:</span>
            <input type="range" id="contextRounds" min="1" max="30" value="16" step="1" style="width: 100px;">
            <span id="contextValue">16</span>
        </div>
        <button id="saveApiKey" class="save-btn">💜 保存设置</button>
        <button id="exportMenuBtn" class="export-btn">📎 导出对话</button>
    </div>

    <div class="chat-layout">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="searchHistoryInput" placeholder="搜索历史对话...">
            </div>
            <button id="newChat" class="new-chat-btn">✨ 新建对话</button>
            <div class="chat-history" id="chatHistory"></div>
        </div>

        <div class="chat-main">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-toolbar">
                    <label class="file-label">📎 上传图片/文件 <input type="file" id="fileUpload" accept="image/*,text/plain,.txt,.md,.json" style="display: none;"></label>
                    <span id="filePreview" class="file-preview"></span>
                    <span style="font-size:12px; color:#825e9e;">支持图片+文本，回复自动去除格式符号</span>
                </div>
                <textarea id="messageInput" class="message-input" rows="2" placeholder="输入你的问题... Shift+Enter换行，Enter发送"></textarea>
                <div class="send-group">
                    <button id="regenerateBtn" class="regenerate-btn">🔄 重新生成</button>
                    <button id="sendBtn" class="send-btn">💜 发送</button>
                </div>
            </div>
            <div id="status" class="status">就绪 | 回复已自动去除 星号、井号等格式符号</div>
        </div>
    </div>
</div>

<script>
    // ---------- 数据模型 ----------
    let chats = {};
    let currentChatId = null;
    let currentApiKey = localStorage.getItem('deepseek_api_key') || '';
    let currentModel = localStorage.getItem('deepseek_model') || 'deepseek-chat';
    let contextRounds = parseInt(localStorage.getItem('context_rounds') || '16');
    let isWaiting = false;
    let lastUserMessage = "";

    // DOM
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const regenerateBtn = document.getElementById('regenerateBtn');
    const newChatBtn = document.getElementById('newChat');
    const chatHistoryDiv = document.getElementById('chatHistory');
    const apiKeyInput = document.getElementById('apiKey');
    const saveApiKeyBtn = document.getElementById('saveApiKey');
    const modelSelect = document.getElementById('model');
    const contextSlider = document.getElementById('contextRounds');
    const contextSpan = document.getElementById('contextValue');
    const statusDiv = document.getElementById('status');
    const searchInput = document.getElementById('searchHistoryInput');
    const fileUploadInput = document.getElementById('fileUpload');
    const filePreviewSpan = document.getElementById('filePreview');
    const exportMenuBtn = document.getElementById('exportMenuBtn');

    let pendingFileData = null;

    // 核心函数：去除所有 Markdown 格式符号
    function removeMarkdownFormatting(text) {
        if (!text) return text;
        let cleaned = text;
        // 去除标题标记 # ## ### 等（行首的#加空格）
        cleaned = cleaned.replace(/^#{1,6}\s+/gm, '');
        // 去除粗体 **text** 或 __text__
        cleaned = cleaned.replace(/\*\*(.+?)\*\*/g, '$1');
        cleaned = cleaned.replace(/__(.+?)__/g, '$1');
        // 去除斜体 *text* 或 _text_ (但不影响作为乘号的单个星号)
        cleaned = cleaned.replace(/\*([^\s*][^*]*[^\s*])\*/g, '$1');
        cleaned = cleaned.replace(/_([^\s_][^_]*[^\s_])_/g, '$1');
        // 去除行内代码 `code`
        cleaned = cleaned.replace(/`([^`]+)`/g, '$1');
        // 去除代码块 ``` ... ```
        cleaned = cleaned.replace(/```[\s\S]*?```/g, (match) => {
            // 提取代码块内的文字，去掉外层的```
            const inner = match.replace(/```\w*\n?/g, '').replace(/```$/, '');
            return inner.trim();
        });
        // 去除链接 [text](url) -> 保留text
        cleaned = cleaned.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        // 去除图片 ![alt](url)
        cleaned = cleaned.replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1');
        // 去除列表标记 - 和 * 开头
        cleaned = cleaned.replace(/^[\s]*[-*+]\s+/gm, '• ');
        // 去除分割线 --- 或 ***
        cleaned = cleaned.replace(/^[\-*]{3,}\s*$/gm, '');
        // 去除多余的空行合并
        cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
        // 去除残留的单个星号或井号
        cleaned = cleaned.replace(/^\*\s+/gm, '• ');
        cleaned = cleaned.replace(/[#*_`~]/g, '');
        return cleaned.trim();
    }

    function showStatus(msg, isError = false) {
        statusDiv.innerHTML = msg;
        if (isError) setTimeout(() => { if(statusDiv.innerHTML === msg) statusDiv.innerHTML = '就绪'; }, 4000);
        else setTimeout(() => { if(statusDiv.innerHTML === msg) statusDiv.innerHTML = '清华小DeepSeek 纯文本模式'; }, 3000);
    }

    function loadSettings() {
        if (currentApiKey) apiKeyInput.value = currentApiKey;
        modelSelect.value = currentModel;
        contextSlider.value = contextRounds;
        contextSpan.innerText = contextRounds;
        const savedChats = localStorage.getItem('deepseek_chats_enhanced_v2');
        if (savedChats) {
            chats = JSON.parse(savedChats);
            renderHistoryList();
            if (Object.keys(chats).length > 0) {
                loadChat(Object.keys(chats)[0]);
            } else {
                createNewChat();
            }
        } else {
            createNewChat();
        }
    }

    function saveAllData() {
        localStorage.setItem('deepseek_chats_enhanced_v2', JSON.stringify(chats));
        localStorage.setItem('deepseek_api_key', currentApiKey);
        localStorage.setItem('deepseek_model', currentModel);
        localStorage.setItem('context_rounds', contextRounds);
    }

    function createNewChat() {
        const chatId = Date.now().toString();
        const now = new Date();
        const title = `新对话 ${now.toLocaleString()}`;
        chats[chatId] = {
            id: chatId,
            title: title,
            messages: [],
            createdAt: now.toISOString()
        };
        currentChatId = chatId;
        renderHistoryList();
        renderMessages();
        saveAllData();
        lastUserMessage = "";
        pendingFileData = null;
        filePreviewSpan.innerText = '';
    }

    function loadChat(chatId) {
        if (!chats[chatId]) return;
        currentChatId = chatId;
        renderHistoryList();
        renderMessages();
        lastUserMessage = "";
        pendingFileData = null;
        filePreviewSpan.innerText = '';
    }

    function deleteChat(chatId, ev) {
        ev.stopPropagation();
        if (confirm('删除对话？')) {
            delete chats[chatId];
            const keys = Object.keys(chats);
            if (keys.length) loadChat(keys[0]);
            else createNewChat();
            renderHistoryList();
            saveAllData();
        }
    }

    function renderHistoryList() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        let chatArray = Object.values(chats);
        if (searchTerm) {
            chatArray = chatArray.filter(chat => chat.title.toLowerCase().includes(searchTerm) || 
                chat.messages.some(m => m.content.toLowerCase().includes(searchTerm)));
        }
        chatHistoryDiv.innerHTML = '';
        chatArray.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'history-item';
            if (chat.id === currentChatId) div.classList.add('active');
            div.onclick = () => loadChat(chat.id);
            const titleSpan = document.createElement('div');
            titleSpan.className = 'history-title';
            titleSpan.innerText = chat.title;
            const dateSpan = document.createElement('div');
            dateSpan.className = 'history-date';
            dateSpan.innerText = new Date(chat.createdAt).toLocaleDateString();
            const delBtn = document.createElement('button');
            delBtn.innerText = '🗑️';
            delBtn.className = 'delete-chat';
            delBtn.onclick = (e) => deleteChat(chat.id, e);
            div.appendChild(titleSpan);
            div.appendChild(dateSpan);
            div.appendChild(delBtn);
            chatHistoryDiv.appendChild(div);
        });
    }

    function renderMessages() {
        if (!currentChatId || !chats[currentChatId]) return;
        const msgs = chats[currentChatId].messages;
        messagesDiv.innerHTML = '';
        msgs.forEach((msg, idx) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.role}`;
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerText = msg.role === 'user' ? '👤' : '🏛️';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerText = msg.content;
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(contentDiv);
            if (msg.role === 'assistant' && idx === msgs.length-1 && msgs.length>0) {
                const actionBar = document.createElement('div');
                actionBar.className = 'action-bar';
                const regenLocal = document.createElement('button');
                regenLocal.innerText = '🔄 重新生成';
                regenLocal.className = 'action-btn';
                regenLocal.onclick = (e) => {
                    e.stopPropagation();
                    regenerateLastMessage();
                };
                actionBar.appendChild(regenLocal);
                msgDiv.appendChild(actionBar);
            }
            messagesDiv.appendChild(msgDiv);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function getContextMessages() {
        const msgs = chats[currentChatId].messages;
        const maxRounds = contextRounds;
        if (msgs.length === 0) return [];
        let context = [];
        let userTurnCount = 0;
        for(let i=msgs.length-1; i>=0; i--) {
            if(msgs[i].role === 'user') userTurnCount++;
            context.unshift(msgs[i]);
            if(userTurnCount >= maxRounds) break;
        }
        return context;
    }

    // 调用 API 并自动清理格式
    async function callDeepSeekAPI(userMessageText, imageBase64 = null) {
        if (!currentApiKey) throw new Error('请先设置API Key');
        let context = getContextMessages();
        let userContent = userMessageText;
        if (imageBase64) {
            userContent = `[用户上传了图片数据，请描述图片内容并结合用户问题]\n用户文字: ${userMessageText}`;
        }
        const newUserMsg = { role: 'user', content: userContent };
        const apiMessages = [...context.map(m => ({ role: m.role, content: m.content })), newUserMsg];
        
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${currentApiKey}`
            },
            body: JSON.stringify({
                model: currentModel,
                messages: apiMessages,
                temperature: 0.7,
                stream: false
            })
        });
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || `API错误 ${response.status}`);
        }
        const data = await response.json();
        let rawReply = data.choices[0].message.content;
        // 关键：去除所有 Markdown 格式符号
        const cleanReply = removeMarkdownFormatting(rawReply);
        return cleanReply;
    }

    async function sendMessage(isRegenerate = false) {
        if (isWaiting) return;
        if (!currentApiKey) { showStatus('请填写 DeepSeek API Key', true); return; }
        let userRaw = messageInput.value.trim();
        if (!isRegenerate && !userRaw && !pendingFileData) { showStatus('输入内容或上传文件', true); return; }
        if(isRegenerate && lastUserMessage === "") { showStatus('没有可重新生成的消息', true); return; }
        
        isWaiting = true;
        sendBtn.disabled = true;
        regenerateBtn.disabled = true;
        
        try {
            if (!isRegenerate) {
                const finalUserText = userRaw || (pendingFileData ? "请分析上传的文件/图片" : "");
                const imageData = pendingFileData ? pendingFileData.base64 : null;
                lastUserMessage = finalUserText;
                const userMsgObj = { role: 'user', content: finalUserText + (imageData ? " [附图片]" : "") };
                chats[currentChatId].messages.push(userMsgObj);
                if (chats[currentChatId].messages.length === 1 && finalUserText.length>0) {
                    let newTitle = finalUserText.slice(0, 28);
                    if(finalUserText.length>28) newTitle+='...';
                    chats[currentChatId].title = newTitle;
                    renderHistoryList();
                }
                renderMessages();
                saveAllData();
                messageInput.value = '';
                pendingFileData = null;
                filePreviewSpan.innerText = '';
                showStatus('小DeepSeek 思考中 (自动去除格式符号)...');
                
                const assistantReply = await callDeepSeekAPI(finalUserText, imageData);
                const assistantMsg = { role: 'assistant', content: assistantReply };
                chats[currentChatId].messages.push(assistantMsg);
                renderMessages();
                saveAllData();
                showStatus('回复完成，已移除 星号/井号 等格式');
            } 
            else {
                const msgs = chats[currentChatId].messages;
                if (msgs.length && msgs[msgs.length-1].role === 'assistant') {
                    msgs.pop();
                }
                const lastUserMsgObj = msgs[msgs.length-1];
                if(!lastUserMsgObj || lastUserMsgObj.role !== 'user') throw new Error('无法重新生成');
                const userPrompt = lastUserMsgObj.content.replace(/\[附图片\]/g, '').trim();
                showStatus('重新生成中，将去除格式符号...');
                const newReply = await callDeepSeekAPI(userPrompt, null);
                const newAssistantMsg = { role: 'assistant', content: newReply };
                chats[currentChatId].messages.push(newAssistantMsg);
                renderMessages();
                saveAllData();
                showStatus('重新生成完成，无格式符号');
            }
        } catch(err) {
            showStatus(`错误: ${err.message}`, true);
            if(!isRegenerate && chats[currentChatId].messages[chats[currentChatId].messages.length-1]?.role === 'user') {
                chats[currentChatId].messages.pop();
                renderMessages();
            }
        } finally {
            isWaiting = false;
            sendBtn.disabled = false;
            regenerateBtn.disabled = false;
            if(!isRegenerate) lastUserMessage = messageInput.value.trim() || lastUserMessage;
        }
    }

    async function regenerateLastMessage() {
        if(isWaiting) return;
        await sendMessage(true);
    }

    function handleFileUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const result = e.target.result;
            if (file.type.startsWith('image/')) {
                pendingFileData = { base64: result, type: 'image' };
                filePreviewSpan.innerText = `已加载图片: ${file.name}`;
                showStatus('图片已就绪，可附加文字发送');
            } else if (file.type === 'text/plain' || file.name.endsWith('.txt') || file.name.endsWith('.md') || file.name.endsWith('.json')) {
                const textContent = result;
                pendingFileData = { base64: null, textContent: textContent.slice(0, 3000) };
                filePreviewSpan.innerText = `文件已提取: ${file.name}`;
                messageInput.value = `文件内容摘要：\n${textContent.slice(0, 1500)}\n\n请问关于此文件有什么问题？`;
                showStatus('文件内容已读入');
            } else {
                showStatus('仅支持图片或txt/md/json文件', true);
            }
        };
        if (file.type.startsWith('image/')) reader.readAsDataURL(file);
        else reader.readAsText(file, 'UTF-8');
    }

    function exportChats(format) {
        if (!currentChatId || !chats[currentChatId]) return;
        const chat = chats[currentChatId];
        let content = '';
        const title = chat.title;
        const date = new Date().toISOString();
        if(format === 'json') {
            content = JSON.stringify(chat, null, 2);
        } else if(format === 'markdown') {
            content = `# ${title}\n导出时间: ${date}\n\n`;
            chat.messages.forEach(m => {
                content += `**${m.role === 'user' ? '用户' : '清华小DeepSeek'}**:\n${m.content}\n\n`;
            });
        } else {
            content = `对话: ${title}\n导出时间: ${date}\n\n`;
            chat.messages.forEach(m => {
                content += `${m.role === 'user' ? '【用户】' : '【AI助手】'}:\n${m.content}\n\n`;
            });
        }
        const blob = new Blob([content], {type: 'text/plain'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `deepseek_${title.slice(0,20)}.${format === 'json' ? 'json' : (format === 'markdown' ? 'md' : 'txt')}`;
        link.click();
        URL.revokeObjectURL(link.href);
        showStatus(`导出成功 ${format}`);
    }

    sendBtn.addEventListener('click', () => sendMessage(false));
    regenerateBtn.addEventListener('click', () => regenerateLastMessage());
    newChatBtn.addEventListener('click', createNewChat);
    saveApiKeyBtn.addEventListener('click', () => {
        currentApiKey = apiKeyInput.value.trim();
        currentModel = modelSelect.value;
        contextRounds = parseInt(contextSlider.value);
        contextSpan.innerText = contextRounds;
        saveAllData();
        showStatus('设置已保存');
    });
    modelSelect.addEventListener('change', () => { currentModel = modelSelect.value; saveAllData(); });
    contextSlider.addEventListener('input', () => { contextSpan.innerText = contextSlider.value; contextRounds = parseInt(contextSlider.value); saveAllData(); });
    messageInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(false); } });
    fileUploadInput.addEventListener('change', (e) => { if(e.target.files[0]) handleFileUpload(e.target.files[0]); fileUploadInput.value = ''; });
    searchInput.addEventListener('input', () => renderHistoryList());
    exportMenuBtn.addEventListener('click', () => {
        const choice = prompt('导出格式: txt / json / markdown', 'txt');
        if(choice === 'txt' || choice === 'json' || choice === 'markdown') exportChats(choice);
        else showStatus('格式不支持', true);
    });

    loadSettings();
</script>
</body>
</html>
