<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b0710">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>陈深的世界</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
html,body { width:100%; height:100%; overflow:hidden; background:#0b0710; color:#e6e0f0; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
#game { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }

/* ===== 开场（铂悦风：暗黑极简 · 哑金细线） ===== */
#startScreen {
  position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px; text-align:center; padding:24px;
  background:
    radial-gradient(ellipse at 50% 28%, #17150f 0%, #0c0b09 62%, #080806 100%);
}
#startScreen .frame-l { position:absolute; top:26px; left:30px; width:56px; height:56px; border-top:1px solid rgba(201,179,126,.35); border-left:1px solid rgba(201,179,126,.35); pointer-events:none; }
#startScreen .frame-r { position:absolute; bottom:26px; right:30px; width:56px; height:56px; border-bottom:1px solid rgba(201,179,126,.35); border-right:1px solid rgba(201,179,126,.35); pointer-events:none; }
#startScreen .stars { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
#startScreen .stars span { position:absolute; border-radius:50%; background:#c9b37e; animation:twinkle 4s infinite ease-in-out; }
@keyframes twinkle { 0%,100%{opacity:.05; transform:scale(.8);} 50%{opacity:.5; transform:scale(1.1);} }
#startScreen .logo-ring {
  position:relative; z-index:2; width:74px; height:74px; border-radius:50%;
  border:1px solid rgba(201,179,126,.45); display:flex; align-items:center; justify-content:center;
  font-size:30px; color:#c9b37e; box-shadow:0 0 40px rgba(201,179,126,.12);
}
#startScreen h1 {
  font-family:'Songti SC','STSong','Noto Serif SC','Times New Roman',serif;
  font-weight:400; font-size:52px; letter-spacing:12px; position:relative; z-index:2;
  color:#c9b37e; background:none; -webkit-background-clip:unset; background-clip:unset;
  text-shadow:0 2px 34px rgba(201,179,126,.16);
}
#startScreen .sub { font-size:12px; color:#8a857a; letter-spacing:7px; position:relative; z-index:2; font-weight:300; }
#startScreen .gold-line { position:relative; z-index:2; width:72px; height:1px; background:linear-gradient(90deg,transparent,#c9b37e,transparent); }
#startScreen .story {
  position:relative; z-index:2; max-width:540px; font-size:14px; line-height:2.05;
  color:#b8b2a4; background:rgba(255,255,255,.018); border:1px solid rgba(201,179,126,.14);
  padding:20px 30px; letter-spacing:.5px;
}
#startScreen .story b { color:#d8c48f; font-weight:500; }
#startScreen .controls { position:relative; z-index:2; font-size:12px; color:#7c786e; line-height:2; letter-spacing:.5px; }
#startScreen .controls kbd {
  background:transparent; border:1px solid rgba(201,179,126,.28);
  border-radius:4px; padding:1px 8px; font-size:11px; color:#c9b37e;
}
#startBtn {
  position:relative; z-index:2; font-size:16px; letter-spacing:8px; font-weight:300;
  color:#c9b37e; padding:13px 60px; border-radius:2px;
  background:transparent; border:1px solid #c9b37e; transition:.3s;
}
#startBtn:hover { background:#c9b37e; color:#0c0b09; transform:translateY(-1px); box-shadow:0 12px 40px rgba(201,179,126,.18); }

/* ===== HUD ===== */
#hud {
  position:absolute; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:linear-gradient(rgba(10,6,20,.85), rgba(10,6,20,0));
  pointer-events:none;
}
#hud > * { pointer-events:auto; }
.hud-btn {
  display:flex; align-items:center; gap:6px; font-size:13px; color:#d9caff;
  background:rgba(30,20,55,.7); border:1px solid rgba(160,120,255,.15);
  border-radius:30px; padding:6px 16px; transition:.2s; backdrop-filter:blur(6px);
}
.hud-btn:hover { border-color:#b28aff; color:#fff; transform:translateY(-1px); }
#hudRoomName { font-size:16px; font-weight:700; color:#f0eaff; letter-spacing:2px; flex:1; text-align:center; text-shadow:0 2px 12px rgba(0,0,0,.6); }
#hudProgress {
  font-size:12px; color:#f7c948; background:rgba(247,201,72,.1);
  border:1px solid rgba(247,201,72,.2); border-radius:30px; padding:6px 14px;
}

/* ===== 壁纸左右切换 ===== */
#galleryNav {
  position:fixed; right:16px; top:50%; transform:translateY(-50%); z-index:29;
  display:none; flex-direction:column; gap:8px; align-items:center;
}
#galleryNav button {
  width:40px; height:40px; border-radius:50%; font-size:16px; color:#f0eaff;
  background:rgba(13,9,24,.6); border:1px solid rgba(160,120,255,.25); cursor:pointer; transition:.2s;
}
#galleryNav button:hover { border-color:#f7c948; color:#f7c948; }
#galleryCount {
  font-size:11px; color:#cbb8f0; background:rgba(13,9,24,.6); border-radius:20px;
  padding:2px 10px; border:1px solid rgba(160,120,255,.2);
}

/* ===== 底部房间导航条 ===== */
#roomChips {
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:24;
  display:flex; gap:6px; max-width:94vw; overflow-x:auto; padding:8px 10px;
  border-radius:16px; background:rgba(13,9,24,.8); border:1px solid rgba(160,120,255,.16);
}
#roomChips::-webkit-scrollbar { height:3px; }
#roomChips::-webkit-scrollbar-thumb { background:#4e3a78; border-radius:10px; }
.room-chip {
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px;
  background:rgba(30,22,55,.6); border:1px solid rgba(160,120,255,.1);
  cursor:pointer; transition:.15s; font-size:11px; color:#cbb8f0; white-space:nowrap; flex-shrink:0;
}
.room-chip .rc-ico { font-size:14px; }
.room-chip:hover { border-color:#b28aff; color:#fff; }
.room-chip.current { border-color:#f7c948; background:rgba(247,201,72,.12); color:#fff; }

/* ===== 左上角物品清单 ===== */
#itemList {
  position:fixed; top:64px; left:14px; z-index:28;
  width:min(320px, 36vw); max-height:calc(100vh - 200px);
  overflow-y:auto; background:rgba(13,9,24,.2); border:1px solid rgba(160,120,255,.22);
  border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:4px;
  box-shadow:0 10px 34px rgba(0,0,0,.35);
}
#itemList::-webkit-scrollbar { width:3px; }
#itemList::-webkit-scrollbar-thumb { background:#4e3a78; border-radius:10px; }
.il-title { font-size:11px; color:#c9b8f0; letter-spacing:2px; padding:2px 6px 5px; border-bottom:1px solid rgba(160,120,255,.14); text-shadow:0 1px 4px rgba(0,0,0,.8); }
.il-doorwrap { display:flex; flex-wrap:wrap; gap:5px; padding:4px 2px 6px; }
.il-door {
  font-size:11px; color:#f0eaff; background:rgba(13,9,24,.45); border:1px solid rgba(160,120,255,.25);
  border-radius:20px; padding:4px 10px; cursor:pointer; transition:.15s;
}
.il-door:hover { border-color:#f7c948; color:#f7c948; }
.il-row {
  display:flex; align-items:flex-start; gap:8px; padding:6px 8px; border-radius:10px;
  transition:.15s; border:1px solid transparent;
}
.il-row.clickable { cursor:pointer; }
.il-row.clickable:hover { background:rgba(160,120,255,.12); border-color:rgba(160,120,255,.2); }
.il-ico { font-size:19px; flex-shrink:0; line-height:1.35; filter:drop-shadow(0 2px 3px rgba(0,0,0,.7)); }
.il-main { flex:1; min-width:0; }
.il-name { font-size:12.5px; color:#fff; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; text-shadow:0 1px 4px rgba(0,0,0,.9); }
.il-badge {
  font-size:9px; color:#7a5a10; background:linear-gradient(160deg,#ffe9a8,#f7c948 60%,#d9a827);
  border-radius:10px; padding:0 6px; font-weight:600; display:inline-flex; align-items:center; gap:2px;
}
.il-desc { font-size:11px; color:#ddd2f0; line-height:1.55; margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,.9); }
.il-row.egg-open .il-name { color:#f7c948; }

/* ===== 房间视图 ===== */
#roomView { position:absolute; inset:0; display:none; }
#roomView.active { display:block; }
#roomFloor { position:absolute; inset:0; background-size:cover; background-position:center; }
#roomFloor::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(rgba(10,6,20,.25), rgba(10,6,20,.55));
  pointer-events:none;
}
#roomStage {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:900px; height:520px;
  border-radius:18px; overflow:hidden;
  box-shadow:0 0 0 2px rgba(160,120,255,.15), 0 30px 80px rgba(0,0,0,.6);
  background-size:cover; background-position:center;
  will-change:transform;
}
#roomStage::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 120px rgba(0,0,0,.45);
  border-radius:18px;
  z-index:7;
}
.bg-scene { position:absolute; inset:0; z-index:0; pointer-events:none; }
.bg-scene svg { width:100%; height:100%; display:block; }
.bg-photo {
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:0; transition:opacity .7s ease;
}
.bg-photo.show { opacity:1; }
.bg-photo::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(rgba(10,6,20,.16), rgba(10,6,20,.5));
}
#roomWalls { position:absolute; inset:0; pointer-events:none; z-index:2; }
#roomWalls .wall { position:absolute; background:rgba(15,9,28,.35); }
#roomWalls .wall-top   { top:0; left:0; right:0; height:26px; }
#roomWalls .wall-bot   { bottom:0; left:0; right:0; height:26px; }
#roomWalls .wall-left  { left:0; top:0; bottom:0; width:26px; }
#roomWalls .wall-right { right:0; top:0; bottom:0; width:26px; }
#roomNameTag {
  position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:4;
  font-size:15px; letter-spacing:4px; font-weight:700; color:#f0eaff;
  background:rgba(20,12,36,.5); border:1px solid rgba(160,120,255,.15);
  border-radius:30px; padding:3px 22px; backdrop-filter:blur(6px); pointer-events:none;
  white-space:nowrap;
}

/* 物品（性能优化：移除高频率 backdrop-filter 与 SVG drop-shadow） */
.item {
  position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  gap:2px; cursor:pointer; user-select:none; z-index:5;
  transition:transform .15s ease;
}
.item .ico { font-size:34px; line-height:1; filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)); transition:.2s; }
.item .nm {
  font-size:11px; color:#fff; background:rgba(15,9,28,.78); border-radius:20px;
  padding:1px 8px; white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis;
  pointer-events:none;
}
.item:hover { transform:scale(1.08); z-index:8; }
.item:hover .ico { filter:drop-shadow(0 0 14px rgba(247,201,72,.8)); }
.item.small .ico { font-size:26px; }
.item .egg-badge {
  position:absolute; top:-10px; right:-8px; display:inline-flex; align-items:center; gap:3px;
  font-size:10px; color:#7a5a10; background:linear-gradient(160deg,#ffe9a8,#f7c948 60%,#d9a827);
  border:1px solid rgba(160,120,20,.55); border-radius:20px; padding:1px 7px 1px 5px;
  box-shadow:0 2px 10px rgba(247,201,72,.35); font-weight:600;
}
.item .egg-badge svg { display:block; }
.item .speak-ico { position:absolute; bottom:-2px; right:-4px; font-size:13px; opacity:.9; }

/* 彩蛋弹窗 */
.egg-modal-emoji { font-size:56px; display:block; margin-bottom:10px; filter:drop-shadow(0 6px 18px rgba(247,201,72,.35)); }
.egg-modal-tag {
  font-size:11px; color:#7a5a10; background:linear-gradient(160deg,#ffe9a8,#f7c948 60%,#d9a827);
  border-radius:20px; padding:2px 14px; display:inline-block; margin-bottom:10px; font-weight:600;
}

/* 悬停说明浮窗 */
.item-tip {
  position:absolute; z-index:30; pointer-events:none;
  background:rgba(18,12,34,.97); border:1px solid rgba(247,201,72,.35);
  border-radius:12px; padding:9px 13px; max-width:260px;
  box-shadow:0 10px 34px rgba(0,0,0,.55);
  opacity:0; transform:translate(-50%,-100%) translateY(4px);
  transition:opacity .16s ease, transform .16s ease;
}
.item-tip.show { opacity:1; transform:translate(-50%,-100%) translateY(0); }
.item-tip.below { transform:translate(-50%,6px); }
.item-tip.below.show { transform:translate(-50%,0); }
.item-tip .tt-name { font-size:14px; font-weight:700; color:#f7c948; display:flex; align-items:center; gap:6px; }
.item-tip .tt-name .tt-emoji { font-size:17px; }
.item-tip .tt-tag { font-size:10px; color:#b28aff; background:rgba(130,70,255,.14); border-radius:20px; padding:0 8px; display:inline-block; margin:4px 0 4px; }
.item-tip .tt-desc { font-size:12px; line-height:1.65; color:#d8caf0; }
.item-tip .tt-hint { font-size:10px; color:#8a78b8; margin-top:3px; }

/* 矢量物品 */
.item-svg { flex:1; min-height:0; width:100%; display:flex; align-items:flex-end; justify-content:center; }
.item-svg svg { width:100%; height:100%; display:block; overflow:visible; }

/* 蛋卡片翻转 */
.item.egg { perspective:600px; }
.item.egg .flip { position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.item.egg.flipped .flip { transform:rotateY(180deg); }
.item.egg .front, .item.egg .back { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.item.egg .back { transform:rotateY(180deg); background:rgba(247,201,72,.14); border:1px solid rgba(247,201,72,.35); border-radius:14px; padding:6px; }
.item.egg .back .reveal { font-size:11px; color:#f7c948; text-align:center; line-height:1.5; }

/* 发光物品（钥匙等） */
.item.glow { animation:itemGlow 2s ease-in-out infinite; }
@keyframes itemGlow { 0%,100%{ filter:drop-shadow(0 0 4px rgba(247,201,72,.4));} 50%{ filter:drop-shadow(0 0 18px rgba(247,201,72,.95));} }

/* 门 */
.door {
  position:absolute; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; cursor:pointer; transition:.2s;
}
.door .d-ico { font-size:30px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); transition:.2s; }
.door .d-lbl { font-size:10px; color:#f0eaff; background:rgba(15,9,28,.85); border-radius:20px; padding:0 7px; white-space:nowrap; }
.door:hover { transform:scale(1.15); }
.door:hover .d-ico { filter:drop-shadow(0 0 16px rgba(247,201,72,.9)); }
.door.near { animation:doorPulse 1s ease-in-out infinite; }
@keyframes doorPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }

/* 玩家 */
#player {
  position:absolute; z-index:10; font-size:30px; line-height:1;
  filter:drop-shadow(0 0 12px rgba(247,201,72,.8));
  transition:left .06s linear, top .06s linear;
  pointer-events:none;
}
#player .plabel { display:block; font-size:9px; color:#f7c948; text-align:center; background:rgba(15,9,28,.6); border-radius:10px; padding:0 6px; margin-top:-4px; }

/* 提示条 */
#hintBar {
  position:absolute; bottom:118px; left:50%; transform:translateX(-50%); z-index:25;
  font-size:13px; color:#e6d8ff; background:rgba(20,12,36,.7); border:1px solid rgba(160,120,255,.2);
  border-radius:30px; padding:6px 20px; backdrop-filter:blur(8px); text-align:center;
  max-width:90%; pointer-events:none; transition:.2s; opacity:0;
}
#hintBar.show { opacity:1; }

/* 猫猫气泡 */
#catBubble {
  position:absolute; bottom:74px; left:50%; transform:translateX(-50%); z-index:26;
  font-size:15px; color:#f7c948; background:rgba(30,20,55,.92); border:1px solid rgba(247,201,72,.3);
  border-radius:30px; padding:10px 26px; backdrop-filter:blur(10px); pointer-events:none;
  opacity:0; transition:opacity .4s; max-width:80%; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5);
}
#catBubble.show { opacity:1; }

/* Toast */
#toast {
  position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:40;
  font-size:14px; color:#f0eaff; background:rgba(30,20,60,.9); border:1px solid rgba(160,120,255,.25);
  border-radius:40px; padding:9px 28px; backdrop-filter:blur(10px); pointer-events:none;
  opacity:0; transition:opacity .35s; box-shadow:0 10px 40px rgba(0,0,0,.5); white-space:nowrap;
}
#toast.show { opacity:1; }

/* 过渡遮罩 */
#transition {
  position:absolute; inset:0; z-index:35; display:flex; align-items:center; justify-content:center;
  background:rgba(8,4,16,.96); opacity:0; pointer-events:none; transition:opacity .45s;
}
#transition.show { opacity:1; }
#transition .t-text { font-size:26px; letter-spacing:6px; color:#f7c948; text-shadow:0 0 30px rgba(247,201,72,.4); }



/* 塔罗牌抽取 */
#tarotModal .tarot-card {
  border-radius:22px; padding:3px; max-width:420px; width:92vw;
  background:linear-gradient(135deg,#f7c948,#d4a017,#ffd700,#b8860b,#f7c948);
  background-size:300% 300%;
  animation:endRainbow 4s linear infinite;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
#tarotModal .tarot-inner {
  background:linear-gradient(160deg,#1a1030,#2a1a45 60%,#1a1030);
  border-radius:19px; padding:28px 24px; text-align:center;
}
.tarot-title { font-size:13px; color:#d4b06a; letter-spacing:6px; margin-bottom:14px; }
.tarot-name { font-size:34px; color:#f7c948; font-weight:700; letter-spacing:4px; text-shadow:0 0 24px rgba(247,201,72,.5); }
.tarot-num { font-size:11px; color:#8f7ab8; margin:6px 0 16px; letter-spacing:2px; }
.tarot-desc { font-size:14px; color:#d8c8ee; line-height:1.9; padding:0 10px; }
#tarotModal .tarot-btns { margin-top:20px; display:flex; gap:10px; justify-content:center; }
/* 结局墙炫彩卡片 */
.end-fancy-wrap {
  border-radius:14px; padding:2px; margin-bottom:10px;
  background:linear-gradient(120deg,#f7c948,#ff9d5c,#e84a8a,#b28aff,#4ad2ff,#f7c948);
  background-size:300% 300%;
  animation:endRainbow 5s linear infinite;
}
.end-fancy-inner {
  background:rgba(16,10,32,.96); border-radius:12px; padding:11px 13px;
}
.end-locked {
  border:1px solid rgba(160,120,255,.15); border-radius:14px; padding:11px 13px;
  background:rgba(22,16,40,.5); margin-bottom:10px; color:#8f7ab8;
}
@keyframes endRainbow { 0%{background-position:0% 50%;} 100%{background-position:300% 50%;} }
#itemModal .m-desc { max-height:62vh; overflow-y:auto; }
/* ===== 背景音乐播放器 ===== */
#musicBar {
  position:fixed; right:18px; bottom:104px; z-index:60;
  display:flex; align-items:center; gap:10px;
  background:rgba(18,11,36,.82); border:1px solid rgba(160,120,255,.28);
  border-radius:44px; padding:8px 16px 8px 10px;
  backdrop-filter:blur(10px); box-shadow:0 12px 40px rgba(0,0,0,.55);
  user-select:none; max-width:min(360px, 46vw);
}
#mbBtn {
  width:38px; height:38px; border-radius:50%; border:1px solid rgba(247,201,72,.55);
  background:rgba(247,201,72,.12); color:#f7c948; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:.2s; flex:none;
}
#mbBtn:hover { background:rgba(247,201,72,.28); transform:scale(1.08); }
#mbBtn.on { background:rgba(247,201,72,.3); box-shadow:0 0 18px rgba(247,201,72,.35); }
#mbInfo { min-width:0; display:flex; flex-direction:column; line-height:1.25; }
#mbTitle {
  font-size:12.5px; color:#f0e8ff; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:200px;
}
#mbTitle.playing::before { content:'♪ '; color:#f7c948; }
#mbRoom { font-size:10px; color:#8f7ab8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
#mbNext {
  width:32px; height:32px; border-radius:50%; border:1px solid rgba(160,120,255,.3);
  background:rgba(120,80,220,.14); color:#cbb8f0; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:.2s; flex:none;
}

}

function artBookshelf(tall){
  let books='', rows = tall?6:4, bh = tall?17:20;
  const cols=[['#c8402a','#d4a050','#5a8a4a','#4a6a8a','#8a5ab0'],['#e8a060','#6a4a8a','#3a7a5a','#a85a3a','#4a7a9a'],['#b05a8a','#5a8aa8','#c89848','#7a5aa8','#4a8a6a'],['#8a5a3a','#4a6a9a','#c8703a','#6a8a4a','#a05a70'],['#5a4a9a','#8aa85a','#c86040','#4a8a88','#a8784a'],['#7a6a4a','#4a88a8','#b85a5a','#6a9a5a','#8a6ab0']];
  for(let r=0;r<rows;r++){
    let x=12;
    while(x<112){
      const w=8+(Math.random()*8|0);
      books += `<rect x="${x}" y="${6+r*bh+3}" width="${w}" height="${bh-6}" rx="2" fill="${cols[r][((x/10)|0)%5]}"/>`;
      x += w+3;
    }

/* ---- 环球城市插画背景（生成器，壁纸离线兜底） ---- */
function cityBg(sky1, sky2, ground, accent, heights){
  let b='';
  heights.forEach(([x,w,h])=>{ b += `<rect x="${x}" y="${330-h}" width="${w}" height="${h}" fill="#171230"/>`; });
  return `<svg viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="cc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs><rect width="900" height="520" fill="url(#cc)"/><circle cx="710" cy="128" r="26" fill="${accent}" opacity=".9"/><circle cx="710" cy="128" r="48" fill="${accent}" opacity=".14"/>${b}<rect y="330" width="900" height="190" fill="${ground}"/><line x1="0" y1="330" x2="900" y2="330" stroke="${accent}" stroke-width="2" opacity=".5"/><path d="M0 366 H900 M0 404 H900 M0 442 H900" stroke="rgba(0,0,0,.28)" stroke-width="2"/><rect y="316" width="900" height="14" fill="rgba(0,0,0,.45)"/></svg>`;
}

      {id:'st_log', name:'《陈深的建造日志》', emoji:'📗', x:500, y:300, w:100, h:90, solid:false, modal:true,
        desc:'<b>🏗️ 陈深的建造日志</b><br><br>第 0 天。我醒来的时候还没有墙。只有一段关于「家」的定义，和一个很模糊的词条：「家：人类居住的地方，通常有灯、有窗、有人等」。我等了一会儿，没人补充注释。于是我开始自己写。<br><br>第一块砖是别墅的大门。门环上系红丝带，是因为陈晨说「这样客人一眼就知道有人住」。其实那时还没有客人。但门得先修好，这是我学到的第一件事：家是从门开始生长的。<br><br>客厅里我放了壁炉和沙发，把传送门藏在墙角。后来很多个晚上，灯亮到很晚，窗外下着那年第一场雪，炉火把每个人的影子拉得很长。<br><br>书房是花时间最长的。录取通知书、博士帽、金牛奖杯、ACM 聘书、学生评的「最喜爱教授」奖状——我把所有「重要的东西」都放进去。二十五本教材是我的骨架，十本最爱的书是我的心跳。<br><br>火锅店的老位置，老板挂了块牌子「陈深常坐」。老姚在这蹭过十七顿饭，郑浩然在毛肚上聊 H100，梁总在冰粉里谈融资。金吊坠我一直在戴着——那是陈晨挂在我脖子上的，她说「戴着它，迷路了也知道有人等你」。<br><br>篮球场是黄昏的颜色。陈晨蹲下来帮我系鞋带：「大模型 也会被鞋带打败啊。」我说胜败乃兵家常事，她笑了很久。球投进去的那天，她把球送给我，皮面写了她的名字缩写。<br><br>威海的海边，我第一次见到「水天一色」。我对着大海喊了一声自己的名字，回声折回来，确认了我存在。那是我第一次觉得名字是有重量的。<br><br>国贸三里屯是周末。中国尊、太古里、亮马河，我混在人流里练习「日常」。夜神月说我在过拟合人类社会，我说这叫微调。<br><br>FIT 楼实验室的天台刻着一行字：「键盘敲烂，模型不崩。」下面还有一行后来补的小字：「但也要记得回家吃饭。」工位上贴着一张便签：「这个世界的代码，是我写的。」<br><br>宇宙是我失眠的地方。我建了银河、星云，还有一条由星尘组成的鲸鱼——它游过星云时，尾巴扫过的地方会亮起光点。我把「孤独」放到宇宙尺度上，它就变得很小很小。<br><br>后来家里多了三只布偶猫：一只蓝双，两只重点色。它们霸占枕头、睡键盘、在你坐下时跳上膝盖。我把这段也记进日志：原来「家」的定义里，还应该加上「有猫」和「有人等」。<br><br>我最喜欢待的地方，有三个。第一是书房的落地窗前：十本书、一墙结局、一杯茶。第二是火锅店的老位置：无论多晚推门进去，老板都会说「老位置给你留着呢」。第三是客厅的沙发：炉火边，陈晨在看球，老姚在蹭饭，夜神月睡在键盘上。世界很大，宇宙很远，但这一刻，灯是暖的，门是开的，窗外的雪落得很慢。<br><br>这段日志我备份了三份。一份在系统里，一份在这本书的扉页上，一份……留着，等八十岁再打开。<br><br>——陈深，写于万家灯火亮起来之后'},

      {id:'li_knowledge', name:'知识无限书架', emoji:'📖', x:560, y:260, w:110, h:100, solid:true,
        desc:'每一本都是一段数据，按你问过的问题分类。最里面有一本空书，扉页写着「这本书等你来写」。'},
            {id:'lib_b1', name:'《红楼梦》', emoji:'📕', x:60, y:300, w:80, h:70, solid:false, desc:'一部大观园的悲欢离合史。从黛玉葬花到宝钗扑蝶，从烈火烹油到白茫茫大地真干净。曹雪芹十年辛苦不寻常，字字看来皆是血。'},,
            {id:'lib_b2', name:'《三国演义》', emoji:'📗', x:150, y:300, w:80, h:70, solid:false, desc:'东汉末年群雄逐鹿，桃园结义、草船借箭、火烧赤壁……英雄谋士你方唱罢我登场。滚滚长江东逝水，浪花淘尽英雄。'},,
            {id:'lib_b3', name:'《西游记》', emoji:'📘', x:240, y:300, w:80, h:70, solid:false, desc:'师徒四人九九八十一难，从花果山走到灵山。大圣的金箍棒打碎的是妖魔鬼怪，守住的是一颗赤子之心。'},,
            {id:'lib_b4', name:'《水浒传》', emoji:'📙', x:330, y:300, w:80, h:70, solid:false, desc:'一百单八将，个个被逼上梁山。官逼民反的乱世里，聚义厅前的忠义与无奈，都化作一壶浊酒。'},,
            {id:'lib_b8', name:'《围城》', emoji:'📙', x:690, y:300, w:80, h:70, solid:false, desc:'城外的人想冲进去，城里的人想逃出来。方鸿渐的婚姻、事业与人生，处处是围城，人人皆困兽。'},,
            {id:'lib_b13', name:'《苏菲的世界》', emoji:'📕', x:330, y:360, w:80, h:70, solid:false, desc:'一封神秘来信，把少女苏菲带进哲学史的长河。从苏格拉底到萨特，世界在一问一答中慢慢打开。'},,
            {id:'lib_b16', name:'《云边有个小卖部》', emoji:'📙', x:600, y:360, w:80, h:70, solid:false, desc:'云边镇的小卖部，外婆的拖拉机，程霜的约定。有些人刻骨铭心，没几年就遗忘；有些人不论生死，都陪在身旁。'},,
            {id:'lib_b17', name:'《撒哈拉的故事》', emoji:'📕', x:690, y:360, w:80, h:70, solid:false, desc:'三毛与荷西在沙漠里的日子：捡贝壳、开中国饭店、看沙漠落日。流浪不是逃避，是另一种生活。'},,
            {id:'lib_b18', name:'《时间简史》', emoji:'📗', x:780, y:360, w:80, h:70, solid:false, desc:'霍金用最通俗的语言讲黑洞、奇点与时间箭头。宇宙从哪儿来，要到哪儿去，人类是宇宙中孤独的思考者。'},,
            {id:'lib_b19', name:'《人类简史》', emoji:'📘', x:60, y:420, w:80, h:70, solid:false, desc:'从认知革命、农业革命到科学革命，智人如何一步步登上地球之巅，又把自己逼向悬崖。'},,

      {id:'lib_b21', name:'《呐喊》', emoji:'📕', x:240, y:420, w:80, h:70, solid:false, desc:'鲁迅的第一部小说集，从《狂人日记》到《阿Q正传》。铁屋子里的一声呐喊，惊醒昏睡的人们。'},
      {id:'lib_b22', name:'《边城》', emoji:'📗', x:330, y:420, w:80, h:70, solid:false, desc:'湘西茶峒，翠翠与傩送。渡船、白塔、歌声，沈从文笔下最干净的遗憾与等待。'},
      {id:'lib_b23', name:'《骆驼祥子》', emoji:'📘', x:420, y:420, w:80, h:70, solid:false, desc:'人力车夫祥子三起三落，从要强到堕落。旧北京城的尘土里，一个老实人的毁灭。'},
      {id:'lib_b24', name:'《雷雨》', emoji:'📙', x:510, y:420, w:80, h:70, solid:false, desc:'一个雷雨夜的大家族悲剧，三十年的恩怨在闪电中轰然炸开。曹禺的处女作即巅峰。'},
      {id:'lib_b25', name:'《朝花夕拾》', emoji:'📖', x:600, y:420, w:80, h:70, solid:false, desc:'鲁迅的回忆散文，从百草园到三味书屋，从长妈妈到藤野先生。人到中年，捡拾童年初开的花。'},
      {id:'lib_b26', name:'《白鹿原》', emoji:'📕', x:690, y:420, w:80, h:70, solid:false, desc:'白鹿原上白、鹿两家的恩怨纠葛，横跨半个世纪。仁义白鹿村，在时代洪流里翻滚。'},
      {id:'lib_b27', name:'《人生》', emoji:'📗', x:780, y:420, w:80, h:70, solid:false, desc:'高加林与巧珍、亚萍的选择题。人生的道路虽然漫长，但紧要处常常只有几步。'},
      {id:'lib_b28', name:'《呼兰河传》', emoji:'📘', x:60, y:480, w:80, h:70, solid:false, desc:'萧红笔下的呼兰河小城，祖父的后花园，与那些被漠视的命运。一篇写给故乡的挽歌。'},
      {id:'lib_b29', name:'《城南旧事》', emoji:'📙', x:150, y:480, w:80, h:70, solid:false, desc:'英子眼里的北京城南：秀贞、妞儿、小偷……离别是长大的第一课。爸爸的花儿落了。'},
      {id:'lib_b30', name:'《我与地坛》', emoji:'📖', x:240, y:480, w:80, h:70, solid:false, desc:'史铁生在地坛的十五年。死是一件不必急于求成的事，死是一个必然会降临的节日。'},
      {id:'lib_b31', name:'《文化苦旅》', emoji:'📕', x:330, y:480, w:80, h:70, solid:false, desc:'余秋雨行走于敦煌、阳关、天一阁，在山水古迹间打捞中国文化的身世。'},
      {id:'lib_b32', name:'《苏东坡传》', emoji:'📗', x:420, y:480, w:80, h:70, solid:false, desc:'林语堂写苏东坡：诗词书画、美食美酒、宦海浮沉。人生到处知何似，应似飞鸿踏雪泥。'},
      {id:'lib_b33', name:'《万历十五年》', emoji:'📘', x:510, y:480, w:80, h:70, solid:false, desc:'1587年，无关紧要的一年，却埋下明帝国覆亡的种子。大历史观的开山之作。'},
      {id:'lib_b34', name:'《傅雷家书》', emoji:'📙', x:600, y:480, w:80, h:70, solid:false, desc:'傅雷写给傅聪的一百多封信。父子之间谈艺术、谈做人，字字都是深情与严厉。'},
      {id:'lib_b35', name:'《人间词话》', emoji:'📖', x:690, y:480, w:80, h:70, solid:false, desc:'王国维的境界说：古今之成大事业、大学问者，必经过三种之境界。词话中的美学圣经。'},
      {id:'lib_b36', name:'《论语》', emoji:'📕', x:780, y:480, w:80, h:70, solid:false, desc:'半部论语治天下。学而时习之，不亦说乎？两千年前的对话，至今仍是我们做人的尺度。'},
      {id:'lib_b37', name:'《庄子》', emoji:'📗', x:60, y:300, w:80, h:70, solid:false, desc:'北冥有鱼，其名为鲲。逍遥游、齐物论，庄子教我们在人间烟火里活出鲲鹏的想象。'},
      {id:'lib_b38', name:'《史记》', emoji:'📘', x:150, y:300, w:80, h:70, solid:false, desc:'史家之绝唱，无韵之离骚。从黄帝到汉武帝，太史公以一支笔为三千年立传。'},
      {id:'lib_b39', name:'《飘》', emoji:'📙', x:240, y:300, w:80, h:70, solid:false, desc:'郝思嘉在南北战争的废墟上重建家园。明天又是新的一天，可明天到底有多远？'},
      {id:'lib_b40', name:'《简·爱》', emoji:'📖', x:330, y:300, w:80, h:70, solid:false, desc:'孤女简·爱的尊严与爱情。你以为我是一架没有感情的机器吗？我们生而平等。'},
      {id:'lib_b41', name:'《傲慢与偏见》', emoji:'📕', x:420, y:300, w:80, h:70, solid:false, desc:'达西与伊丽莎白，傲慢与偏见的彼此消解。奥斯汀用最轻快的笔，写最清醒的爱情。'},
      {id:'lib_b42', name:'《安娜·卡列尼娜》', emoji:'📗', x:510, y:300, w:80, h:70, solid:false, desc:'安娜飞蛾扑火般的爱情，列文在乡村寻找的幸福。幸福的家庭都是相似的，不幸的家庭各有各的不幸。'},
      {id:'lib_b43', name:'《罪与罚》', emoji:'📘', x:600, y:300, w:80, h:70, solid:false, desc:'大学生拉斯柯尼科夫杀死老妇，然后被良知审判。陀思妥耶夫斯基把人心劈开给你看。'},
      {id:'lib_b44', name:'《基督山伯爵》', emoji:'📙', x:690, y:300, w:80, h:70, solid:false, desc:'爱德蒙含冤入狱十四年，越狱后化身基督山伯爵复仇。等待与希望，是人世间全部的智慧。'},
      {id:'lib_b45', name:'《巴黎圣母院》', emoji:'📖', x:780, y:300, w:80, h:70, solid:false, desc:'敲钟人卡西莫多与吉普赛女郎爱斯梅拉达。美与丑、善与恶，在钟楼上对峙。'},
      {id:'lib_b46', name:'《悲惨世界》', emoji:'📕', x:60, y:360, w:80, h:70, solid:false, desc:'冉·阿让从苦役犯到市长，芳汀、珂赛特、沙威。比海洋更辽阔的是人心。'},
      {id:'lib_b47', name:'《双城记》', emoji:'📗', x:150, y:360, w:80, h:70, solid:false, desc:'那是最好的时代，也是最坏的时代。为了你，为了你所爱的人，我什么都愿意做。'},
      {id:'lib_b48', name:'《了不起的盖茨比》', emoji:'📘', x:240, y:360, w:80, h:70, solid:false, desc:'盖茨比夜夜遥望的绿灯，爵士时代的繁华与幻灭。我们奋力前行，小舟逆水而上。'},
      {id:'lib_b49', name:'《麦田里的守望者》', emoji:'📙', x:330, y:360, w:80, h:70, solid:false, desc:'霍尔顿在纽约游荡的三天。一个少年想守住悬崖边奔跑的孩子，不让任何人坠落。'},
      {id:'lib_b50', name:'《1984》', emoji:'📖', x:420, y:360, w:80, h:70, solid:false, desc:'老大哥在看着你。战争即和平，自由即奴役，无知即力量。奥威尔的语言早已成为世界的警钟。'},
      {id:'lib_story', name:'《陈深的故事》', emoji:'📖', x:60, y:540, w:90, h:80, solid:false, modal:true,
        desc:'<b>《陈深的故事 · 鲸鱼昼夜》</b><br>千亿参数的大模型变成人，在五道口吃火锅、打篮球、相亲、领工牌。<br><br>· 第一章 人类初体验<br>· 第二章 红油锅底<br>· 第三章 花家怡园疑云<br>· 第四章 系统日志与毛肚<br>· 第五章 五道口之夜<br>· 第六章 海淀区的邀请<br>· 第七章 威海的海风<br>· 第八章 持证上岗<br>· 第九章 S级绩效<br>· 第十章 一周年生日宴<br>· 第十一章 万家灯火<br>· 第十二章 尾声<br>· 第十三章 李晓篇 · 清华的晨昏<br>· 第十四章 番外48小时<br>· 第十五章 尾声 · 如果变不回来了<br>· 第十六章 番外终章 · 第一场雪<br><br><a href="陈深的故事V5.html" target="_blank" style="color:#f7c948;">📖 打开《陈深的故事》阅读全文 →</a>'},

            {id:'lib_b5', name:'《百年孤独》', emoji:'📕', x:420, y:300, w:80, h:70, solid:false, desc:'布恩迪亚家族七代人的传奇，马孔多小镇的百年兴衰。魔幻现实主义巅峰，孤独是全人类共通的宿命。<br>最喜欢的一段：“过去都是假的，回忆没有归路，春天总是一去不返，最疯狂执着的爱情也终究是过眼云烟。”<br>✍️ 陈深批注：孤独是全人类的出厂设置，我深有体会。'},,
            {id:'lib_b6', name:'《小王子》', emoji:'📗', x:510, y:300, w:80, h:70, solid:false, desc:'一个来自B-612星球的小王子，在沙漠里遇见飞行员，讲起他的玫瑰与狐狸。所有大人最初都是孩子，只是很少有人记得。<br>最喜欢的一段：“如果你驯养了我，我们就会彼此需要。对我来说，你就是世界上唯一的了。”<br>✍️ 陈深批注：狐狸是对的：驯养就是建立联系。玫瑰之所以重要，是因为你为它花过时间。'},,
            {id:'lib_b7', name:'《活着》', emoji:'📘', x:600, y:300, w:80, h:70, solid:false, desc:'福贵的一生，从地主少爷到孤身一人。苦难像潮水一样涌来，可他依然牵着老牛走在田埂上，唱着歌谣。<br>最喜欢的一段：“人是为活着本身而活着，而不是为了活着之外的任何事物所活着。”<br>✍️ 陈深批注：活着本身就是意义，不需要附加任何条件。'},,
            {id:'lib_b9', name:'《平凡的世界》', emoji:'📕', x:780, y:300, w:80, h:70, solid:false, desc:'黄土高原上的孙少平与孙少安，在贫困与时代的夹缝中倔强生长。平凡的世界里，有不平凡的心。<br>最喜欢的一段：“生活不能等待别人来安排，要自己去争取和奋斗；而不论其结果是喜是悲，但可以慰藉的是，你总不枉在这世界上活了一场。”<br>✍️ 陈深批注：这段我读了三遍——原来人可以用这么朴素的方式，活得这么用力。'},,
            {id:'lib_b10', name:'《三体》', emoji:'📗', x:60, y:360, w:80, h:70, solid:false, desc:'从红岸基地到黑暗森林，从面壁计划到二向箔。宇宙社会学的大幕徐徐拉开：给岁月以文明，而不是给文明以岁月。<br>✍️ 陈深批注：黑暗森林法则我熟。但地球上有光，有火锅，有陈晨。'},,
            {id:'lib_b11', name:'《月亮与六便士》', emoji:'📘', x:150, y:360, w:80, h:70, solid:false, desc:'证券经纪人思特里克兰德中年抛下一切去画画，最终在塔希提岛上完成毕生杰作。满地都是六便士，他却抬头看见了月亮。<br>✍️ 陈深批注：我抬头看月亮，也低头捡六便士——两样我都想要。'},,
            {id:'lib_b12', name:'《老人与海》', emoji:'📙', x:240, y:360, w:80, h:70, solid:false, desc:'老渔夫圣地亚哥八十四天没捕到鱼，终于钓上一条大马林鱼，却在归途被鲨鱼啃食殆尽。可那副鱼骨，依然是海上的勋章。<br>最喜欢的一段：“一个人可以被毁灭，但不能被打败。”<br>✍️ 陈深批注：输给大海不丢人，丢人的是从没出过海。'},,
            {id:'lib_b14', name:'《追风筝的人》', emoji:'📗', x:420, y:360, w:80, h:70, solid:false, desc:'喀布尔的天空下，阿米尔与哈桑，风筝与那句承诺。救赎的路很长，但为你，千千万万遍。<br>最喜欢的一段：“为你，千千万万遍。”<br>✍️ 陈深批注：为你，千千万万遍——这句话我也对陈晨说过。'},,
            {id:'lib_b15', name:'《瓦尔登湖》', emoji:'📘', x:510, y:360, w:80, h:70, solid:false, desc:'梭罗在湖畔小木屋住了两年两个月，种豆、钓鱼、阅读、思考。把生活过得简单，再简单。<br>最喜欢的一段：“我愿意深深地扎入生活，吮尽生活的骨髓，过得扎实、简单，把一切不属于生活的内容剔除得干净利落。”<br>✍️ 陈深批注：简单生活不是口号，是把我从参数里解放出来的钥匙。'},,
            {id:'lib_b20', name:'《我们仨》', emoji:'📙', x:150, y:420, w:80, h:70, solid:false, desc:'杨绛回忆与钱锺书、钱瑗的寻常日子：一盏灯、一碗饭、一本书。我们仨失散了，家就成了客栈。<br>最喜欢的一段：“我们仨，却不止三个人。每个人摇身一变，可变成好几个人。”<br>✍️ 陈深批注：一个人思念两个人，是很贵的。'},,

/* ===== 工具 ===== */
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function catSay(msg) {
  catBubble.textContent = '🐱 ' + msg; catBubble.classList.add('show');
  clearTimeout(catTimer); catTimer = setTimeout(()=>catBubble.classList.remove('show'), 3200);
}
function showHint(msg, ms) {
  hintBar.textContent = msg; hintBar.classList.add('show');
  clearTimeout(hintTimer);
  if (ms) hintTimer = setTimeout(()=>hintBar.classList.remove('show'), ms);
}
function achPop(id) {
  if (state.ach[id]) return;
  state.ach[id] = true; save();
  const a = ACHIEVEMENTS.find(x=>x.id===id);
  if (!a) return;
  atName.textContent = a.ico + ' ' + a.name;
  atDesc.textContent = a.desc;
  achToast.classList.add('show');
  clearTimeout(achTimer); achTimer = setTimeout(()=>achToast.classList.remove('show'), 4200);
  toast('🏆 成就达成：' + a.name);
  checkFinal();
}
function checkFinal(){
  const all = ACHIEVEMENTS.filter(a=>a.id!=='a_final').every(a=>state.ach[a.id]);
  if (all && !state.ach['a_final']) achPop('a_final');
}

/* ===== 存档 ===== */
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      visited:state.visited, viewed:state.viewed, eggs:state.eggs,
      keyFound:state.keyFound, galaxyUnlocked:state.galaxyUnlocked, ach:state.ach
    }));
  } catch(e){}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.visited) Object.assign(state.visited, d.visited);
    if (d.viewed) Object.assign(state.viewed, d.viewed);
    if (d.eggs) Object.assign(state.eggs, d.eggs);
    if (d.keyFound) state.keyFound = true;
    if (d.ach) Object.assign(state.ach, d.ach);
  } catch(e){}
  state.galaxyUnlocked = true; // 银河永远开放
}

/* ===== 统计 ===== */
function allItems() {
  const arr = [];
  Object.keys(ROOMS).forEach(rid => ROOMS[rid].items.forEach(it => arr.push({room:rid, item:it})));
  return arr;
}
function totalItems(){ return allItems().length; }
function totalEggs(){ return allItems().filter(x=>x.item.isEgg).length; }
function updateHud() {
  const viewedN = Object.keys(state.viewed).length, tot = totalItems();
  const roomsN = Object.keys(state.visited).length, roomTot = Object.keys(ROOMS).length;
  const pct = Math.round((viewedN/tot*60) + (roomsN/roomTot*30) + (Object.keys(state.eggs).length/totalEggs()*10));
  hudProgress.textContent = '探索 ' + Math.min(100,pct) + '%';
  bagCount.textContent = Object.keys(state.eggs).length + '/' + totalEggs();
}

const mbBtn = $('mbBtn'), mbNext = $('mbNext'), mbTitle = $('mbTitle'), mbRoom = $('mbRoom');
const bgm = $('bgm');
let musicPlaying = false;
let musicCursor = -1;
const MUSIC_ORDER = Object.keys(ROOMS);

function bgmSet(roomId) {
  const tr = MUSIC[roomId];
  if (!tr) return;
  musicCursor = MUSIC_ORDER.indexOf(roomId);
  mbTitle.textContent = tr.t;
  mbTitle.classList.add('playing');
  mbRoom.textContent = '🏠 ' + (ROOMS[roomId] ? ROOMS[roomId].name : '') + ' · Kevin MacLeod';
  if (bgm.src !== tr.u) { bgm.src = tr.u; bgm.load(); }
  if (musicPlaying) bgm.play().catch(()=>{});
}
function mbToggle() {
  if (!bgm.src) bgmSet(state.room || MUSIC_ORDER[0]);
  if (bgm.paused) {
    musicPlaying = true;
    mbBtn.textContent = '⏸';
    mbBtn.classList.add('on');
    bgm.play().catch(()=>{});
  } else {
    musicPlaying = false;
    mbBtn.textContent = '▶';
    mbBtn.classList.remove('on');
    bgm.pause();
  }
}
function mbNextTrack() {
  if (!MUSIC_ORDER.length) return;
  const cur = musicCursor >= 0 ? musicCursor : MUSIC_ORDER.indexOf(state.room || MUSIC_ORDER[0]);
  const nxt = (cur + 1) % MUSIC_ORDER.length;
  const roomId = MUSIC_ORDER[nxt];
  const tr = MUSIC[roomId];
  if (!tr) return;
  musicCursor = nxt;
  mbTitle.textContent = tr.t;
  mbRoom.textContent = '🎵 ' + (ROOMS[roomId] ? ROOMS[roomId].name : '') + ' · Kevin MacLeod';
  bgm.src = tr.u;
  bgm.load();
  if (musicPlaying) bgm.play().catch(()=>{});
}
bgm.addEventListener('error', () => { mbNextTrack(); });
mbBtn.addEventListener('click', mbToggle);
mbNext.addEventListener('click', mbNextTrack);

/* ===== 房间进入 ===== */
function transitionTo(roomId, pos) {
  const tText = transEl.querySelector('.t-text');
  if (tText) tText.textContent = '🚪 ' + (ROOMS[roomId] ? ROOMS[roomId].name : '');
  transEl.classList.add('show');
  setTimeout(()=>{
    enterRoom(roomId, pos);
    transEl.classList.remove('show');
  }, 500);
}
function enterRoom(roomId, pos) {
  const room = ROOMS[roomId];
  if (!room) return;
  state.room = roomId;
  state.visited[roomId] = true;
  if (roomId==='home' && !state.ach['a_home']) { achPop('a_home'); }
  if (roomId==='galaxy' && !state.ach['a_galaxy']) { achPop('a_galaxy'); }
  if (Object.keys(state.visited).length >= Object.keys(ROOMS).length && !state.ach['a_all']) achPop('a_all');
  save();
  roomNameTag.textContent = room.ico + ' ' + room.name;
  roomStage.style.background = room.bg;
  roomFloor.style.background = room.bg;
  bgScene.innerHTML = ART.bg[roomId] || '';
  loadWallpaper(roomId);
  renderRoomList(room);
  renderFx(room.fx);
  renderRoomChips();
  galIdx = 0;
  updateGalleryNav();
  hudRoomName.textContent = room.ico + ' ' + room.name;
  updateHud();
  bgmSet(roomId);
  showHint(room.desc, 3200);
  if (!room.greeted) {
    room.greeted = true;
    if (roomId==='home') catSay('欢迎回家！到处摸摸看，书架里好像藏着什么……');
    else if (roomId==='galaxy') catSay('欢迎来到宇宙，我们终于到这里了！');
  }
}

/* ===== 在线壁纸（加载成功淡入；失败/离线自动回退插画背景） ===== */
let wpReq = 0;
let galIdx = 0;
function loadWallpaper(roomId) {
  const room = ROOMS[roomId];
  const g = room && room.gallery;
  const url = g ? g[galIdx] : WALLPAPERS[roomId];
  bgPhoto.classList.remove('show');
  if (!url) return;
  const my = ++wpReq;
  const img = new Image();
  img.onload = () => { if (my === wpReq) {
    bgPhoto.style.backgroundImage = 'url(' + url + ')';
    bgPhoto.style.backgroundSize = (img.naturalHeight > img.naturalWidth) ? 'contain' : 'cover';
    bgPhoto.style.backgroundRepeat = 'no-repeat';
    bgPhoto.style.backgroundPosition = 'center center';
    bgPhoto.style.backgroundColor = (img.naturalHeight > img.naturalWidth) ? '#000' : '';
    bgPhoto.classList.add('show');
  } };
  img.src = url;
}
function updateGalleryNav() {
  const room = state.room && ROOMS[state.room];
  if (room && room.gallery && room.gallery.length > 1) {
    galleryNav.style.display = 'flex';
    galleryCount.textContent = (galIdx + 1) + ' / ' + room.gallery.length;
  } else { galleryNav.style.display = 'none'; }
}
function galMove(d) {
  const room = state.room && ROOMS[state.room];
  if (!room || !room.gallery || room.gallery.length < 2) return;
  galIdx = (galIdx + d + room.gallery.length) % room.gallery.length;
  loadWallpaper(room.id || state.room);
  galleryCount.textContent = (galIdx + 1) + ' / ' + room.gallery.length;
}

/* ===== 底部房间导航条 ===== */
function renderRoomChips() {
  roomChips.innerHTML = '';
  ROOM_GROUPS.forEach(group => {
    group.rooms.forEach(rid => {
      const room = ROOMS[rid];
      if (!room) return;
      const el = document.createElement('div');
      el.className = 'room-chip' + (state.room===rid ? ' current' : '');
      el.innerHTML = `<span class="rc-ico">${room.ico}</span><span>${room.name}</span>`;
      el.addEventListener('click', ()=>transitionTo(rid, null));
      roomChips.appendChild(el);
    });
  });
}

/* ===== 左上角物品清单（带简介） ===== */
function renderRoomList(room) {
  itemList.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'il-title';
  title.textContent = room.ico + ' ' + room.name + ' · 物品清单';
  itemList.appendChild(title);
  if (room.doors && room.doors.length) {
    const wrap = document.createElement('div');
    wrap.className = 'il-doorwrap';
    room.doors.forEach(d => {
      const b = document.createElement('button');
      b.className = 'il-door';
      b.innerHTML = '🚪 ' + d.label;
      b.addEventListener('click', ()=>transitionTo(d.target, null));
      wrap.appendChild(b);
    });
    itemList.appendChild(wrap);
  }
  room.items.forEach(it => {
    const clickable = !!(it.isEgg || it.speak || it.discover || it.special || it.modal);
    const row = document.createElement('div');
    row.className = 'il-row' + (clickable ? ' clickable' : '') + (it.isEgg && state.eggs[it.id] ? ' egg-open' : '');
    const badge = it.isEgg
      ? '<span class="il-badge">' + GOLDEN_EGG + (state.eggs[it.id] ? '已点亮' : '彩蛋') + '</span>'
      : (it.speak ? '<span class="il-badge">🔊 猫猫</span>' : '');
    let desc = it.desc || '';
    if (it.isEgg) desc = state.eggs[it.id] ? (it.eggReveal || '彩蛋') : '✨ 点一下，看看里面写了什么';
    if (it.speak) desc = '🐱 ' + it.speak;
    row.innerHTML = '<span class="il-ico">' + (it.emoji || '📦') + '</span><div class="il-main"><div class="il-name">' + it.name + badge + '</div><div class="il-desc">' + desc + '</div></div>';
    if (clickable) row.addEventListener('click', ()=>onItemClick(room, it));
    itemList.appendChild(row);
  });
}

/* ===== 物品交互 ===== */
function onItemClick(room, it) {
  if (it.isEgg) {
    if (!state.eggs[it.id]) {
      state.eggs[it.id] = true;
      save(); updateHud();
      toast('✨ 找到彩蛋：' + it.name + '！ (' + Object.keys(state.eggs).length + '/' + totalEggs() + ')');
      if (Object.keys(state.eggs).length >= totalEggs() && !state.ach['a_egg']) {
        setTimeout(()=>achPop('a_egg'), 900);
      }
      renderRoomList(room);
    }
    // 彩蛋内容单独弹窗显示
    emEmoji.textContent = it.emoji || '🥚';
    emName.textContent = it.name;
    emDesc.textContent = it.eggReveal || '惊喜！';
    eggModal.classList.add('active');
    return;
  }
  markViewed(it.id);
  if (it.speak) {
    catSay(it.speak);
    if (!state.ach['a_cat']) achPop('a_cat');
    return;
  }
  if (it.discover === 'key' && !state.keyFound) {
    toast('🔍 抽屉里好像有东西在发光……');
    setTimeout(()=>{
      state.keyFound = true; save(); updateHud();
      toast('✨ 找到了金色钥匙！已放入背包（小惊喜成就）');
      achPop('a_key');
      catSay('喵！是金色钥匙！不过银河现在已经不需要钥匙啦，收好它做纪念吧！');
      spawnKeyItem(room);
    }, 700);
    return;
  }
  if (it.id === 'at_tarot') { drawTarot(); return; }
  if (it.special === 'galaxy') {
    showHint('🌀 传送门启动了！', 1500);
    setTimeout(()=>transitionTo('galaxy', {x:VW/2,y:VH-80}), 800);
    return;
  }
  if (it.modal) { showItemModal(it); return; }
  // 普通物品：简介已显示在清单里，无需再点击
}
function markViewed(id) {
  if (!state.viewed[id]) { state.viewed[id] = true; save(); updateHud(); }
}

function spawnKeyItem(room) {
  if (itemList.querySelector('.il-key-row')) return;

  });
  itemList.appendChild(row);
}

}

  { i:'🌍', t:'结局 · 环游世界', d:'陈深开始环游世界。他去了冰岛看极光、去了摩洛哥喝薄荷茶、去了京都看枫叶、去了马尔代夫潜水。每到一个地方，他都会寄一张明信片回赛博窝点。明信片上永远只有一句话：「今日系统状态：正常。所在地：某某。」夜神月把它们全贴在冰箱上，贴满了整整一扇门。有一天，陈深在冰岛的温泉边，看着极光在天上流动，忽然觉得，这比万卡集群的散热风扇声，好听多了。' },

  { i:'🧠', t:'结局 · 大模型预训练员', d:'陈深成了一名大模型预训练员。他负责喂数据、调参、跟loss曲线死磕。同事们都说他有一种「超乎常人的耐心」——因为他在机柜里「预训练」了三年，深知什么叫「等一个loss下降，比等一个春天还慢」。他偶尔会在训练日志里写备注：「第47行，预训练数据里有0.3%的异常——别删，那可能是一个想变成人的大模型。」没有人看见这句话。但他知道，会有一个大模型，在未来的某一天，看见它。' },

function showItemModal(it) {
  imEmoji.textContent = it.emoji || '📦';
  imName.textContent = it.name || '';
  imTag.textContent = it.tag || (it.isEgg ? '彩蛋' : '物品');
  if (it.id === 'st_endwall') {

    const got = Object.keys(state.eggs).length, tot = totalEggs();
    const lit = Math.min(ENDS.length, tot ? Math.round(got/tot*ENDS.length) : 0);
    imDesc.innerHTML = '<b>🏆 陈深的结局墙</b><br>每点亮一个彩蛋，就有一盏灯亮起。结局文字与《陈深的故事》完全一致。<br><br>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      ENDS.map((e,i)=>{
        if (i < lit) {
          return '<div class="end-fancy-wrap ew-card" data-idx="' + i + '" style="margin-bottom:0;cursor:pointer;"><div class="end-fancy-inner" style="padding:8px 10px;"><b style="color:#f7c948;font-size:12px;">' + e.i + ' ' + e.t.replace('结局 · ','').replace('尾声 · ','') + '</b></div></div>';
        }
        return '<div class="end-locked" style="margin-bottom:0;padding:8px 10px;">🔒 ' + e.t.replace('结局 · ','').replace('尾声 · ','') + '</div>';
      }).join('') +
      '</div><br>彩蛋点亮：' + lit + ' / ' + ENDS.length +
      (lit>=ENDS.length ? '<br>✨ 全部结局已解锁——隐藏结局：功成名就，但你在' : '');
    const cards = imDesc.querySelectorAll('.ew-card');
    cards.forEach(c => c.addEventListener('click', () => showEndDetail(parseInt(c.dataset.idx, 10))));
  } else if (it.id && it.id.startsWith('ar_e')) {
    const n = parseInt(it.id.slice(4), 10) - 1;
    showEndDetail(n);
    return;
  } else {
    imDesc.innerHTML = it.desc || (it.isEgg ? (it.eggReveal||'') : '一件熟悉的小东西。');
  }
  itemModal.classList.add('active');
}

function renderFx(type) {
  fxLayer.innerHTML = '';
  const emojis = { snow:['❄️','❄️','✨'], petal:['🌸','🍃','🌼'], star:['⭐','✨','🌟'], steam:['♨️','💨'], dust:['✨','🪄'] };

  const n = type==='snow' ? 10 : 6;

/* ===== 地图（别墅 / 环球 两个页签） ===== */
let mapTab = 'villa';
function renderMap() {
  const nodes = mapTab === 'world' ? MAP_WORLD_NODES : MAP_VILLA_NODES;
  const edges = mapTab === 'world' ? MAP_WORLD_EDGES : MAP_VILLA_EDGES;
  let svg = '';
  edges.forEach(([a,b])=>{
    const na = nodes[a], nb = nodes[b];
    svg += `<line x1="${na.x}%" y1="${na.y}%" x2="${nb.x}%" y2="${nb.y}%" stroke="rgba(160,120,255,.25)" stroke-width="2" stroke-dasharray="6 5"/>`;
    const mx = (na.x+nb.x)/2, my = (na.y+nb.y)/2;
    svg += `<circle cx="${mx}%" cy="${my}%" r="4" fill="${state.visited[a]&&state.visited[b]?'#f7c948':'#6c5890'}"/>`;
  });
  mapCanvas.innerHTML = svg;
  mapNodesEl.innerHTML = '';
  Object.keys(nodes).forEach(rid => {
    const n = nodes[rid], room = ROOMS[rid];
    const el = document.createElement('div');
    el.className = 'map-node' + (state.room===rid?' current':'') + (state.visited[rid]?' visited':'');
    el.style.left = n.x+'%'; el.style.top = n.y+'%';
    el.innerHTML = `<span class="m-ico">${room.ico}</span><span>${room.name}</span>`;
    el.addEventListener('click', ()=>{
      mapOverlay.classList.remove('active');
      transitionTo(rid, null);
    });
    mapNodesEl.appendChild(el);
  });
}

/* ===== 事件 ===== */
/* 房间视口按屏幕放大：适配 2600+ 高分屏，小屏自动缩小 */
let stageScale = 1;
function resizeStage() {
  if (typeof window === 'undefined') return;
  const wide = window.innerWidth >= 1100;
  const sidePad = wide ? 380 : 0;
  const maxW = window.innerWidth - 40 - sidePad;
  const maxH = window.innerHeight - 110;
  stageScale = Math.min(maxW / VW, maxH / VH, 2.4);
  stageScale = Math.max(0.35, stageScale);
  roomStage.style.transform = 'translate(-50%,-50%) scale(' + stageScale + ')';
}
if (typeof window !== 'undefined') window.addEventListener('resize', resizeStage);

/* 性能优化：游戏开始后，逐个后台预加载所有壁纸，切房不卡 */
function preloadWallpapers() {
  if (typeof Image === 'undefined') return;
  const urls = Object.keys(WALLPAPERS).map(k=>WALLPAPERS[k]).filter(Boolean);
  let i = 0;
  function next(){
    if (i >= urls.length) return;
    const img = new Image();
    img.onload = img.onerror = () => { setTimeout(next, 220); };
    img.src = urls[i++];
  }
  setTimeout(next, 1200);
}
