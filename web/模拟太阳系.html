<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>清华计算机系 · 太阳系粒子宇宙 | 创意科技视界</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }

        /* 优雅加载动画 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030518;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            font-size: 1.5rem;
            letter-spacing: 2px;
            backdrop-filter: blur(8px);
            transition: opacity 1.5s ease;
            pointer-events: none;
            font-weight: 300;
        }

        .loader-text {
            background: linear-gradient(135deg, #ffcc88, #ff884d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; letter-spacing: 2px; text-shadow: 0 0 0px rgba(255,160,0,0); }
            50% { opacity: 1; letter-spacing: 6px; text-shadow: 0 0 15px rgba(255,100,0,0.8); }
            100% { opacity: 0.5; letter-spacing: 2px; text-shadow: 0 0 0px rgba(255,160,0,0); }
        }

        /* UI 面板: 底部署名与标题 */
        .info-panel {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            font-family: 'Segoe UI', 'Poppins', monospace;
        }

        .main-title {
            font-size: clamp(1rem, 4vw, 1.8rem);
            font-weight: 500;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff3cf, #ffd78c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,100,0,0.4);
            margin-bottom: 8px;
        }

        .power-signature {
            font-size: clamp(0.75rem, 3.5vw, 1.2rem);
            font-weight: 400;
            background: rgba(5, 10, 25, 0.75);
            backdrop-filter: blur(12px);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255, 140, 50, 0.6);
            box-shadow: 0 0 20px rgba(255,80,20,0.3);
            color: #fff0dd;
            letter-spacing: 1px;
            pointer-events: auto;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .power-signature:hover {
            background: rgba(30, 40, 70, 0.9);
            border-color: #ffaa66;
            box-shadow: 0 0 28px rgba(255,100,0,0.7);
            transform: scale(1.02);
        }
        .power-signature strong {
            font-weight: 600;
            background: linear-gradient(135deg, #ffcc88, #ff9966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subnote {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 20;
            font-size: 12px;
            color: rgba(255,220,170,0.7);
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            font-family: monospace;
        }

        .interact-hint {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 20;
            font-size: 11px;
            color: rgba(255,200,120,0.6);
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            font-family: monospace;
        }

        @media (max-width: 600px) {
            .power-signature { padding: 5px 16px; }
            .subnote { top: 12px; right: 12px; font-size: 8px; }
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="loader-text">✨ 星际启航 · 清华计算机系 ✨</div>
</div>

<div class="info-panel">
    <div class="main-title">☀️ SOLAR SYSTEM • 粒子星轨 ☀️</div>
    <div class="power-signature" id="powerLink">
        ⚡ Powered by <strong>清华大学计算机科学与技术系</strong> ⚡
    </div>
</div>
<div class="subnote">TSINGHUA CS · 宇宙拓荒</div>
<div class="interact-hint">🪐 鼠标拖动旋转视角 | 滚轮缩放 🪐</div>

<!-- 导入 Three.js 核心模块 -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    
    // --- 初始化场景: 深邃宇宙色调 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010218);
    scene.fog = new THREE.FogExp2(0x010218, 0.0015); // 轻微星雾

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 22);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    // 后期特效 Bloom 增加恒星光辉
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.4, 0.85);
    bloomPass.threshold = 0.08;
    bloomPass.strength = 0.95;
    bloomPass.radius = 0.6;
    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);

    // --- 轨道控制 (允许自动旋转，增强沉浸)---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.zoomSpeed = 1.2;
    controls.rotateSpeed = 0.8;
    controls.target.set(0, 0, 0);
    
    let autoRotateFlag = true;
    controls.autoRotate = autoRotateFlag;
    controls.addEventListener('start', () => {
        if (autoRotateFlag) controls.autoRotate = false;
    });
    controls.addEventListener('end', () => {
        if (autoRotateFlag) {
            setTimeout(() => { if (!controls.autoRotate && autoRotateFlag) controls.autoRotate = true; }, 3000);
        }
    });
    
    // ================= 太阳系核心构建 =================
    // 1. 太阳 (炽热发光体)
    const sunGeometry = new THREE.SphereGeometry(1.8, 128, 128);
    const sunMaterial = new THREE.MeshStandardMaterial({
        color: 0xff5500,
        emissive: 0xff4411,
        emissiveIntensity: 1.2,
        metalness: 0.1,
        roughness: 0.4
    });
    const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sunMesh);
    
    // 太阳光晕: 额外叠加发光粒子层
    const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.2, side: THREE.BackSide });
    const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(2.0, 32, 32), sunGlowMat);
    scene.add(sunGlow);
    
    // 点光源模拟阳光
    const sunLight = new THREE.PointLight(0xff8844, 2.5, 40);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    const ambientLight = new THREE.AmbientLight(0x111122);
    scene.add(ambientLight);
    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.4);
    fillLight.position.set(1, 2, 1);
    scene.add(fillLight);
    
    // 2. 行星数据: 名称, 颜色, 半径(视觉), 距离(轨道半径), 速度, 是否光环
    const planetsData = [
        { name: '水星', color: 0xbc9a6c, radius: 0.22, distance: 2.8, speed: 0.025, ring: false },
        { name: '金星', color: 0xe6b856, radius: 0.28, distance: 3.7, speed: 0.018, ring: false },
        { name: '地球', color: 0x4ca3ff, radius: 0.32, distance: 4.6, speed: 0.015, ring: false },
        { name: '火星', color: 0xcc6644, radius: 0.28, distance: 5.6, speed: 0.012, ring: false },
        { name: '木星', color: 0xd8a27a, radius: 0.58, distance: 7.2, speed: 0.007, ring: false },
        { name: '土星', color: 0xe8cfaa, radius: 0.52, distance: 8.6, speed: 0.0055, ring: true },
        { name: '天王星', color: 0xb0e0e6, radius: 0.44, distance: 10.2, speed: 0.004, ring: false },
        { name: '海王星', color: 0x3b6eff, radius: 0.44, distance: 11.8, speed: 0.0032, ring: false }
    ];
    
    const planets = [];      // 存储行星网格
    const orbits = [];       // 存储轨道线
    const planetAngles = planetsData.map(() => Math.random() * Math.PI * 2);
    
    // 创建行星及轨道
    planetsData.forEach((data, idx) => {
        // 行星球体
        const geometry = new THREE.SphereGeometry(data.radius, 64, 64);
        const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.3, roughness: 0.5, emissive: 0x221100, emissiveIntensity: 0.1 });
        const planet = new THREE.Mesh(geometry, material);
        planet.userData = { distance: data.distance, speed: data.speed, angle: planetAngles[idx], radius: data.radius };
        scene.add(planet);
        
        // 为土星增加简单光环装饰 (环)
        if (data.ring) {
            const ringGeo = new THREE.TorusGeometry(data.radius * 1.28, 0.12, 32, 100);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xcbbf91, emissive: 0x442200, emissiveIntensity: 0.2, transparent: true });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2.2;
            ring.rotation.z = 0.3;
            planet.add(ring);
        }
        
        // 轨道线 (圆环)
        const orbitPoints = [];
        const orbitRadius = data.distance;
        const segments = 128;
        for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const x = Math.cos(angle) * orbitRadius;
            const z = Math.sin(angle) * orbitRadius;
            orbitPoints.push(new THREE.Vector3(x, 0, z));
        }
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.35 });
        const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
        scene.add(orbitLine);
        orbits.push(orbitLine);
        
        planets.push(planet);
    });
    
    // 额外增加小行星带 (粒子带 模拟火星木星之间)
    const asteroidCount = 4500;
    const asteroidGeo = new THREE.BufferGeometry();
    const asteroidPositions = new Float32Array(asteroidCount * 3);
    const asteroidColors = new Float32Array(asteroidCount * 3);
    for (let i = 0; i < asteroidCount; i++) {
        const r = 6.5 + Math.random() * 1.5;
        const angle = Math.random() * Math.PI * 2;
        const yOff = (Math.random() - 0.5) * 0.8;
        const x = Math.cos(angle) * r;
        const z = Math.sin(angle) * r;
        asteroidPositions[i*3] = x;
        asteroidPositions[i*3+1] = yOff;
        asteroidPositions[i*3+2] = z;
        const col = new THREE.Color().setHSL(0.10 + Math.random()*0.1, 0.8, 0.5);
        asteroidColors[i*3] = col.r;
        asteroidColors[i*3+1] = col.g;
        asteroidColors[i*3+2] = col.b;
    }
    asteroidGeo.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));
    asteroidGeo.setAttribute('color', new THREE.BufferAttribute(asteroidColors, 3));
    const asteroidMat = new THREE.PointsMaterial({ size: 0.045, vertexColors: true, blending: THREE.AdditiveBlending });
    const asteroidField = new THREE.Points(asteroidGeo, asteroidMat);
    scene.add(asteroidField);
    
    // ========== 粒子太阳系: 旋转粒子星云围绕轨道 ==========
    // 创意重点: 大量动态粒子围绕太阳旋转，模仿星尘轨迹，增强太阳系科技感
    const starDustCount = 8000;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(starDustCount * 3);
    const dustColorsArr = new Float32Array(starDustCount * 3);
    
    for (let i = 0; i < starDustCount; i++) {
        // 分布在半径 2.0 到 14 之间，并且偏向于轨道平面附近的带状区域
        const radius = 2.0 + Math.random() * 12;
        const angleRad = Math.random() * Math.PI * 2;
        const verticalFactor = Math.sin(angleRad * 3) * 0.4; // 轻微波动，形成星流美感
        const yOffset = (Math.random() - 0.5) * 1.2 + verticalFactor * 0.6;
        const x = Math.cos(angleRad) * radius;
        const z = Math.sin(angleRad) * radius;
        dustPositions[i*3] = x;
        dustPositions[i*3+1] = yOffset;
        dustPositions[i*3+2] = z;
        
        // 粒子颜色: 根据距离太阳远近: 暖色近，冷色远
        const t = (radius - 2) / 12;
        const hue = 0.10 + t * 0.5; // 0.1橙黄 -> 0.6蓝紫
        const color = new THREE.Color().setHSL(hue, 1.0, 0.6);
        dustColorsArr[i*3] = color.r;
        dustColorsArr[i*3+1] = color.g;
        dustColorsArr[i*3+2] = color.b;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColorsArr, 3));
    const dustMat = new THREE.PointsMaterial({ size: 0.055, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
    const starDustField = new THREE.Points(dustGeo, dustMat);
    scene.add(starDustField);
    
    // 额外增加高光粒子流: 螺旋粒子环, 增加动感
    const spiralCount = 2200;
    const spiralGeo = new THREE.BufferGeometry();
    const spiralPos = new Float32Array(spiralCount * 3);
    const spiralCol = new Float32Array(spiralCount * 3);
    for (let i = 0; i < spiralCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const rad = 3.2 + Math.random() * 9.5;
        const spiralOffset = Math.sin(angle * 5) * 0.4;
        const x = Math.cos(angle) * (rad + spiralOffset);
        const z = Math.sin(angle) * (rad + spiralOffset);
        const y = Math.sin(angle * 3) * 0.6;
        spiralPos[i*3] = x;
        spiralPos[i*3+1] = y;
        spiralPos[i*3+2] = z;
        const hue = 0.55 + Math.random() * 0.3;
        const c = new THREE.Color().setHSL(hue, 1.0, 0.7);
        spiralCol[i*3] = c.r;
        spiralCol[i*3+1] = c.g;
        spiralCol[i*3+2] = c.b;
    }
    spiralGeo.setAttribute('position', new THREE.BufferAttribute(spiralPos, 3));
    spiralGeo.setAttribute('color', new THREE.BufferAttribute(spiralCol, 3));
    const spiralPointsMat = new THREE.PointsMaterial({ size: 0.065, vertexColors: true, blending: THREE.AdditiveBlending });
    const spiralParticles = new THREE.Points(spiralGeo, spiralPointsMat);
    scene.add(spiralParticles);
    
    // 背景深邃星空 (银河感)
    const bgStarCount = 2500;
    const bgStarGeo = new THREE.BufferGeometry();
    const bgStarPos = new Float32Array(bgStarCount * 3);
    for (let i = 0; i < bgStarCount; i++) {
        bgStarPos[i*3] = (Math.random() - 0.5) * 200;
        bgStarPos[i*3+1] = (Math.random() - 0.5) * 100;
        bgStarPos[i*3+2] = (Math.random() - 0.5) * 90 - 50;
    }
    bgStarGeo.setAttribute('position', new THREE.BufferAttribute(bgStarPos, 3));
    const bgStarMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    const bgStars = new THREE.Points(bgStarGeo, bgStarMat);
    scene.add(bgStars);
    
    // 增加环绕太阳的微粒子光晕 (动态光晕环)
    const solarHaloGeo = new THREE.BufferGeometry();
    const haloCount = 1800;
    const haloPositions = new Float32Array(haloCount * 3);
    for (let i = 0; i < haloCount; i++) {
        const radius = 2.1 + Math.random() * 0.6;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta) * 0.5;
        const z = radius * Math.cos(phi);
        haloPositions[i*3] = x;
        haloPositions[i*3+1] = y;
        haloPositions[i*3+2] = z;
    }
    solarHaloGeo.setAttribute('position', new THREE.BufferAttribute(haloPositions, 3));
    const haloMat = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.035, blending: THREE.AdditiveBlending, transparent: true });
    const solarHalo = new THREE.Points(solarHaloGeo, haloMat);
    scene.add(solarHalo);
    
    // 增加动态光晕曲线 (装饰)
    const glowRing = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.03, 64, 400), new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.4 }));
    scene.add(glowRing);
    const glowRing2 = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.02, 64, 400), new THREE.MeshBasicMaterial({ color: 0xffaa66, transparent: true, opacity: 0.3 }));
    scene.add(glowRing2);
    
    // ========== 交互官网链接 ==========
    const deptOfficialUrl = 'https://www.cs.tsinghua.edu.cn';
    const powerElement = document.getElementById('powerLink');
    if (powerElement) {
        powerElement.style.cursor = 'pointer';
        powerElement.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open(deptOfficialUrl, '_blank', 'noopener,noreferrer');
        });
        powerElement.setAttribute('title', '访问清华大学计算机科学与技术系官网');
    }
    
    // 动态装饰: 围绕土星等不影响现有，但可以添加几个随机的小卫星效果，简洁不冗余
    // 增加彗星效果: 流动的粒子点 (简单动态)
    const cometCount = 300;
    const cometGeo = new THREE.BufferGeometry();
    const cometPositions = new Float32Array(cometCount * 3);
    for (let i = 0; i < cometCount; i++) {
        cometPositions[i*3] = (Math.random() - 0.5) * 18;
        cometPositions[i*3+1] = (Math.random() - 0.5) * 5;
        cometPositions[i*3+2] = (Math.random() - 0.5) * 18;
    }
    cometGeo.setAttribute('position', new THREE.BufferAttribute(cometPositions, 3));
    const cometMat = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.045, blending: THREE.AdditiveBlending });
    const comets = new THREE.Points(cometGeo, cometMat);
    scene.add(comets);
    
    // 动画变量
    let time = 0;
    
    // 动画循环: 更新行星位置, 粒子系统旋转, 太阳脉动
    function animate() {
        requestAnimationFrame(animate);
        time += 0.012;
        
        // 1. 行星公转
        planets.forEach((planet, idx) => {
            const data = planetsData[idx];
            const angle = planetAngles[idx] + data.speed;
            planetAngles[idx] = angle;
            const x = Math.cos(angle) * data.distance;
            const z = Math.sin(angle) * data.distance;
            planet.position.set(x, 0, z);
        });
        
        // 2. 太阳自转与脉动效果
        sunMesh.rotation.y += 0.005;
        sunGlow.rotation.x += 0.002;
        const scaleVar = 1 + Math.sin(time * 3) * 0.008;
        sunGlow.scale.set(scaleVar, scaleVar, scaleVar);
        
        // 3. 小行星带整体缓慢旋转
        asteroidField.rotation.y += 0.0015;
        // 星尘粒子场整体公转效果: 整体自转
        starDustField.rotation.y += 0.001;
        starDustField.rotation.x = Math.sin(time * 0.2) * 0.1;
        spiralParticles.rotation.y += 0.002;
        spiralParticles.rotation.z += 0.0005;
        comets.rotation.y -= 0.0008;
        
        // 4. 太阳周围光晕环旋转
        glowRing.rotation.z += 0.008;
        glowRing.rotation.x = Math.sin(time * 0.7) * 0.2;
        glowRing2.rotation.y += 0.005;
        glowRing2.rotation.x = Math.cos(time * 0.5) * 0.15;
        
        // 5. 粒子光环动态透明度 (后期不做额外开销)
        // 让太阳光源强度略微波动
        const intensityVar = 2.2 + Math.sin(time * 1.8) * 0.3;
        sunLight.intensity = intensityVar;
        
        // 更新轨道控制
        controls.update();
        
        // 渲染场景 (带 bloom 特效)
        effectComposer.render();
    }
    
    animate();
    
    // 自适应窗口
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // 隐藏加载动画
    window.addEventListener('load', () => {
        const loaderDiv = document.getElementById('loader');
        if (loaderDiv) {
            setTimeout(() => {
                loaderDiv.style.opacity = '0';
                setTimeout(() => { loaderDiv.style.display = 'none'; }, 1500);
            }, 800);
        }
    });
