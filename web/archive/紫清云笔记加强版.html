<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清云笔记 · 清华黑紫</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== 全局重置 & 清华黑紫风格 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background-color: #0b0710;
      color: #e6e0f0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 主应用卡片 — 透明度提高 */
    .app-container {
      width: 1440px;
      max-width: 100%;
      height: 920px;
      max-height: 98vh;
      background: rgba(22, 16, 35, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 40px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(160, 120, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-image 0.5s ease;
      position: relative;
      background-size: cover;
      background-position: center;
    }

    /* 壁纸覆盖层（玻璃效果，透明度提高） */
    .app-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 6, 20, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 0;
    }

    .app-container > * {
      position: relative;
      z-index: 1;
    }

    /* ===== 顶部导航 ===== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      border-bottom: 1px solid rgba(180, 140, 255, 0.15);
      background: rgba(12, 8, 22, 0.25);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: linear-gradient(145deg, #b28aff, #7a4bff);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #f0ecff;
      box-shadow: 0 6px 14px rgba(90, 40, 200, 0.6);
    }

    .logo-text {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 1px;
      background: linear-gradient(to right, #d9caff, #b28aff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo-text small {
      font-weight: 400;
      font-size: 12px;
      color: #8f7bbf;
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      color: #9480c0;
      margin-left: 4px;
    }

    /* 导航中间区域：壁纸选择器 + 时钟天气 */
    .nav-center {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* 壁纸选择器（含自定义上传） */
    .wallpaper-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 20, 55, 0.4);
      padding: 4px 12px 4px 14px;
      border-radius: 40px;
      border: 1px solid rgba(160, 120, 255, 0.15);
      flex-wrap: wrap;
    }

    .wallpaper-selector span {
      font-size: 11px;
      color: #b3a1d4;
      margin-right: 2px;
    }

    .wallpaper-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(200, 180, 255, 0.3);
      cursor: pointer;
      transition: 0.2s;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .wallpaper-dot:hover {
      transform: scale(1.12);
      border-color: #b28aff;
    }

    .wallpaper-dot.active {
      border-color: #b28aff;
      box-shadow: 0 0 12px rgba(130, 70, 255, 0.4);
    }

    .upload-btn {
      background: rgba(130, 70, 255, 0.2);
      border: 1px solid rgba(160, 120, 255, 0.3);
      border-radius: 30px;
      padding: 2px 10px;
      font-size: 11px;
      color: #cbb8f0;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .upload-btn:hover {
      background: rgba(130, 70, 255, 0.35);
      border-color: #b28aff;
    }

    #wallpaperUpload {
      display: none;
    }

    /* 导航内嵌时钟 + 天气（紧凑小尺寸） */
    .nav-clock-weather {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(30, 20, 55, 0.3);
      padding: 4px 16px 4px 14px;
      border-radius: 40px;
      border: 1px solid rgba(160, 120, 255, 0.08);
    }

    .nav-clock {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .nav-clock .time {
      font-size: 16px;
      font-weight: 600;
      color: #f0eaff;
      letter-spacing: 0.5px;
    }

    .nav-clock .date {
      font-size: 11px;
      color: #b3a1d4;
    }

    .nav-weather {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-left: 10px;
      border-left: 1px solid rgba(160, 120, 255, 0.15);
    }

    .nav-weather .temp {
      font-size: 16px;
      font-weight: 500;
      color: #f0eaff;
    }

    .nav-weather .desc {
      font-size: 11px;
      color: #b3a1d4;
    }

    /* 右侧操作区 */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-actions i {
      font-size: 16px;
      color: #b8a8e0;
      transition: 0.2s;
      cursor: pointer;
    }

    .nav-actions i:hover {
      color: #d4c0ff;
      transform: scale(1.05);
    }

    .avatar {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6d44d0, #371b7a);
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      color: #e8dcff;
      border: 1px solid #a47eff;
      box-shadow: 0 0 10px rgba(130, 70, 255, 0.3);
    }

    /* ===== 主体布局 ===== */
    .main-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ===== 左侧笔记列表 ===== */
    .note-sidebar {
      width: 260px;
      background: rgba(16, 10, 30, 0.3);
      backdrop-filter: blur(4px);
      border-right: 1px solid rgba(160, 120, 255, 0.1);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .sidebar-header h3 {
      font-weight: 500;
      font-size: 14px;
      color: #cbb8f0;
    }

    .sidebar-header i {
      color: #a07aff;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .sidebar-header i:hover {
      color: #c9b0ff;
    }

    .search-box {
      background: rgba(40, 28, 70, 0.4);
      border-radius: 40px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border: 1px solid rgba(150, 110, 255, 0.1);
      transition: 0.2s;
    }

    .search-box i {
      color: #8b75b5;
      font-size: 12px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #e6def5;
      font-size: 12px;
      width: 100%;
    }

    .search-box input::placeholder {
      color: #6f5b96;
    }

    .search-box:focus-within {
      border-color: #9f7aff;
      box-shadow: 0 0 14px rgba(130, 70, 255, 0.12);
    }

    .note-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }

    .note-list::-webkit-scrollbar {
      width: 3px;
    }

    .note-list::-webkit-scrollbar-thumb {
      background: #4e3a78;
      border-radius: 10px;
    }

    .note-item {
      background: rgba(33, 22, 58, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      transition: all 0.2s;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .note-item:hover {
      background: rgba(55, 38, 90, 0.45);
      border-color: #6a47b0;
      transform: translateX(3px);
    }

    .note-item.active {
      background: rgba(88, 55, 170, 0.25);
      border-color: #9b77f0;
      box-shadow: 0 0 14px rgba(110, 60, 220, 0.15);
    }

    .note-title {
      font-weight: 600;
      font-size: 14px;
      color: #ede6ff;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }

    .note-title i {
      color: #8d71c7;
      font-size: 11px;
    }

    .note-preview {
      font-size: 11px;
      color: #b3a1d4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #6c5890;
    }

    .note-meta i {
      margin-right: 3px;
      font-size: 9px;
    }

    /* ===== 右侧面板 ===== */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 24px 18px 24px;
      overflow-y: auto;
      gap: 12px;
    }

    /* 编辑器区域 — 保证输入框足够大 */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(10, 6, 20, 0.2);
      backdrop-filter: blur(4px);
      border-radius: 24px;
      padding: 18px 22px 16px 22px;
      border: 1px solid rgba(160, 120, 255, 0.08);
      min-height: 240px;
    }

    .editor-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 10px;
    }

    .editor-actions {
      display: flex;
      gap: 12px;
      color: #9a83c7;
    }

    .editor-actions i {
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .editor-actions i:hover {
      color: #cbb4ff;
    }

    .editor-title-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(160, 120, 255, 0.12);
      padding: 6px 4px 8px 0;
      font-size: 22px;
      font-weight: 500;
      color: #f0eaff;
      outline: none;
      transition: 0.2s;
      margin-bottom: 10px;
    }

    .editor-title-input:focus {
      border-bottom-color: #a981ff;
    }

    .editor-textarea {
      flex: 1;
      background: rgba(20, 12, 38, 0.12);
      border: 1px solid rgba(130, 90, 210, 0.08);
      border-radius: 16px;
      padding: 16px 18px;
      color: #ddd2f0;
      font-size: 15px;
      line-height: 1.7;
      resize: none;
      outline: none;
      transition: 0.2s;
      min-height: 180px;
    }

    .editor-textarea:focus {
      border-color: #9e7aff;
      box-shadow: 0 0 20px rgba(110, 60, 220, 0.08);
    }

    .editor-footer {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      color: #7f6aac;
      font-size: 11px;
      gap: 14px;
    }

    /* ===== 移除旧的小组件区域 ===== */
    .widgets-row {
      display: none;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 1024px) {
      .note-sidebar {
        width: 220px;
      }
      .nav-clock-weather {
        padding: 4px 10px;
      }
      .nav-clock .time {
        font-size: 14px;
      }
      .nav-weather .temp {
        font-size: 14px;
      }
    }

    @media (max-width: 820px) {
      .navbar {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 10px 16px;
      }
      .nav-center {
        justify-content: center;
      }
      .nav-actions {
        justify-content: center;
      }
      .main-layout {
        flex-direction: column;
      }
      .note-sidebar {
        width: 100%;
        max-height: 180px;
        border-right: none;
        border-bottom: 1px solid rgba(160, 120, 255, 0.1);
      }
      .right-panel {
        padding: 12px 14px;
      }
      .app-container {
        height: 98vh;
        border-radius: 24px;
      }
    }

    @media (max-width: 480px) {
      .wallpaper-selector {
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px 8px;
      }
      .wallpaper-dot {
        width: 16px;
        height: 16px;
      }
      .nav-clock-weather {
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px 10px;
      }
      .nav-clock .date {
        display: none;
      }
      .nav-weather .desc {
        display: none;
      }
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">

  <!-- 顶部导航 -->
  <header class="navbar">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-feather-alt"></i></div>
      <div class="logo-text">清云笔记 <small>· 清华黑紫</small></div>
    </div>

    <!-- 中间区域：壁纸 + 时钟天气 -->
    <div class="nav-center">
      <!-- 壁纸选择器 -->
      <div class="wallpaper-selector" id="wallpaperSelector">
        <span><i class="fas fa-image"></i></span>
        <div class="wallpaper-dot active" data-wallpaper="default" style="background: linear-gradient(135deg, #1a1030, #2a1a4a);" title="默认黑紫"></div>
        <div class="wallpaper-dot" data-wallpaper="maldives" style="background-image: url('https://picsum.photos/seed/maldives/200/200');" title="马尔代夫"></div>
        <div class="wallpaper-dot" data-wallpaper="california" style="background-image: url('https://picsum.photos/seed/california/200/200');" title="加州阳光"></div>
        <div class="wallpaper-dot" data-wallpaper="beijing" style="background-image: url('https://picsum.photos/seed/beijing/200/200');" title="北京故宫"></div>
        <div class="wallpaper-dot" data-wallpaper="shanghai" style="background-image: url('https://picsum.photos/seed/shanghai/200/200');" title="上海陆家嘴"></div>
        <div class="wallpaper-dot" data-wallpaper="london" style="background-image: url('https://picsum.photos/seed/london/200/200');" title="伦敦金丝雀码头"></div>
        <div class="wallpaper-dot" data-wallpaper="chengdu" style="background-image: url('https://picsum.photos/seed/chengdu/200/200');" title="成都宽窄巷子"></div>
        <div class="wallpaper-dot" data-wallpaper="tsinghua" style="background-image: url('https://picsum.photos/seed/tsinghua/200/200');" title="清华二校门"></div>
        <div class="wallpaper-dot" data-wallpaper="ocean" style="background-image: url('https://picsum.photos/seed/ocean/200/200');" title="海底世界"></div>
        <label class="upload-btn" for="wallpaperUpload">
          <i class="fas fa-upload"></i> 上传
        </label>
        <input type="file" id="wallpaperUpload" accept="image/*">
      </div>

      <!-- 时钟 + 天气（紧凑小尺寸） -->
      <div class="nav-clock-weather">
        <div class="nav-clock">
          <span class="time" id="navClockTime">--:--:--</span>
          <span class="date" id="navClockDate">--/--</span>
        </div>
        <div class="nav-weather">
          <span class="temp" id="navWeatherTemp">--°C</span>
          <span class="desc" id="navWeatherDesc">--</span>
        </div>
      </div>
    </div>

    <!-- 右侧操作 -->
    <div class="nav-actions">
      <i class="fas fa-search"></i>
      <i class="fas fa-bell"></i>
      <i class="fas fa-th-large"></i>
      <div class="avatar">TH</div>
    </div>
  </header>

  <!-- 主体 -->
  <div class="main-layout">
    <!-- 左侧笔记列表 -->
    <aside class="note-sidebar">
      <div class="sidebar-header">
        <h3><i class="fas fa-list-ul" style="margin-right: 6px;"></i> 全部笔记</h3>
        <i class="fas fa-plus-circle" id="addNoteBtn"></i>
      </div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="搜索笔记..." />
      </div>
      <div class="note-list" id="noteListContainer"></div>
    </aside>

    <!-- 右侧面板 -->
    <div class="right-panel">
      <!-- 编辑器 — 移除大标题，保证输入框足够大 -->
      <div class="editor-panel">
        <div class="editor-header">
          <div class="editor-actions">
            <i class="fas fa-star" id="starBtn"></i>
            <i class="fas fa-trash-alt" id="deleteBtn" style="color: #b07a9a;"></i>
            <i class="fas fa-ellipsis-v"></i>
          </div>
        </div>
        <input class="editor-title-input" id="editorTitleInput" type="text" placeholder="笔记标题" />
        <textarea class="editor-textarea" id="editorBody" placeholder="开始书写……"></textarea>
        <div class="editor-footer">
          <span id="updateTime"><i class="far fa-clock"></i> 刚刚</span>
          <span><i class="fas fa-cloud-upload-alt"></i> 已同步</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ========== 数据 ==========
    let notes = [
      { id: '1', title: '清华紫 · 设计系统', body: '黑紫风格核心调色板：\n• 主色: #7a4bff\n• 辅色: #b28aff, #4d2e8a\n• 背景: #0b0710, #160f23\n• 字体: #e6e0f0, #cbb8f0\n\n玻璃质感 backdrop-filter: blur(12px)', updated: '2026-06-29 14:28', category: '产品' },
      { id: '2', title: '有道云笔记 · 竞品分析', body: '功能对比: 富文本、Markdown、多端同步...\n\n有道云笔记优势：历史版本回溯、笔记分享、语音速记', updated: '2026-06-28 10:15', category: '调研' },
      { id: '3', title: '快速原型 · 交互稿', body: 'Figma 链接: 黑紫主题组件库 v1.2\n\n页面框架：侧边栏 + 编辑器，响应式适配', updated: '2026-06-27 09:42', category: '设计' },
      { id: '4', title: '清华校训 · 笔记', body: '自强不息，厚德载物。\n\n黑紫风格下的文化表达：紫色象征智慧与高贵', updated: '2026-06-25 16:20', category: '文化' },
      { id: '5', title: '待办 · 前端任务', body: '- 完成笔记列表UI\n- 优化响应式\n- 添加搜索功能\n- 实现增删改', updated: '2026-06-24 11:05', category: '开发' }
    ];

    let currentNoteId = '1';
    let nextId = 6;
    let currentWallpaper = 'default';

    // DOM 引用
    const appContainer = document.getElementById('appContainer');
    const noteListEl = document.getElementById('noteListContainer');
    const editorTitleInput = document.getElementById('editorTitleInput');
    const editorBody = document.getElementById('editorBody');
    const updateTimeEl = document.getElementById('updateTime');
    const searchInput = document.getElementById('searchInput');
    const addBtn = document.getElementById('addNoteBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const starBtn = document.getElementById('starBtn');
    const wallpaperUpload = document.getElementById('wallpaperUpload');

    // 导航时钟/天气元素
    const navClockTime = document.getElementById('navClockTime');
    const navClockDate = document.getElementById('navClockDate');
    const navWeatherTemp = document.getElementById('navWeatherTemp');
    const navWeatherDesc = document.getElementById('navWeatherDesc');

    // ========== 时钟（导航版） ==========
    function updateClock() {
      const now = new Date();
      navClockTime.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
      navClockDate.textContent = now.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ========== 天气模拟（导航版） ==========
    const weathers = ['晴', '多云', '小雨', '阴', '晴', '多云'];
    function updateWeather() {
      const w = weathers[Math.floor(Math.random() * weathers.length)];
      navWeatherDesc.textContent = w;
      const temp = Math.floor(Math.random() * 12) + 20;
      navWeatherTemp.textContent = temp + '°C';
    }
    updateWeather();
    setInterval(updateWeather, 35000);

    // ========== 壁纸功能 ==========
    const wallpapers = [
      { id: 'default', name: '默认黑紫' },
      { id: 'maldives', name: '马尔代夫', url: 'https://picsum.photos/seed/maldives/1200/800' },
      { id: 'california', name: '加州阳光', url: 'https://picsum.photos/seed/california/1200/800' },
      { id: 'beijing', name: '北京故宫', url: 'https://picsum.photos/seed/beijing/1200/800' },
      { id: 'shanghai', name: '上海陆家嘴', url: 'https://picsum.photos/seed/shanghai/1200/800' },
      { id: 'london', name: '伦敦金丝雀码头', url: 'https://picsum.photos/seed/london/1200/800' },
      { id: 'chengdu', name: '成都宽窄巷子', url: 'https://picsum.photos/seed/chengdu/1200/800' },
      { id: 'tsinghua', name: '清华二校门', url: 'https://picsum.photos/seed/tsinghua/1200/800' },
      { id: 'ocean', name: '海底世界', url: 'https://picsum.photos/seed/ocean/1200/800' }
    ];

    function setWallpaper(id, customUrl = null) {
      currentWallpaper = id;
      if (id === 'default') {
        appContainer.style.backgroundImage = '';
        appContainer.style.backgroundColor = 'rgba(22, 16, 35, 0.45)';
      } else if (customUrl) {
        appContainer.style.backgroundImage = `url('${customUrl}')`;
        appContainer.style.backgroundColor = 'transparent';
      } else {
        const wp = wallpapers.find(w => w.id === id);
        if (wp) {
          appContainer.style.backgroundImage = `url('${wp.url}')`;
          appContainer.style.backgroundColor = 'transparent';
        }
      }
      document.querySelectorAll('.wallpaper-dot').forEach(d => d.classList.toggle('active', d.dataset.wallpaper === id));
    }

    document.querySelectorAll('.wallpaper-dot').forEach(d => {
      d.addEventListener('click', function() {
        setWallpaper(this.dataset.wallpaper);
      });
    });

    wallpaperUpload.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const url = ev.target.result;
        appContainer.style.backgroundImage = `url('${url}')`;
        appContainer.style.backgroundColor = 'transparent';
        currentWallpaper = 'custom_' + Date.now();
        document.querySelectorAll('.wallpaper-dot').forEach(d => d.classList.remove('active'));
      };
      reader.readAsDataURL(file);
      this.value = '';
    });

    // ========== 笔记渲染 ==========
    function renderNoteList(filter = '') {
      const filtered = notes.filter(n => n.title.includes(filter) || n.body.includes(filter) || n.category.includes(filter));
      if (filtered.length === 0) {
        noteListEl.innerHTML = `<div style="color:#6c5890; text-align:center; padding:16px 0; font-size:12px;">没有匹配的笔记</div>`;
        return;
      }
      let html = '';
      filtered.forEach(n => {
        const activeClass = (n.id === currentNoteId) ? 'active' : '';
        const preview = n.body.replace(/\n/g, ' ').substring(0, 45) + (n.body.length > 45 ? '…' : '');
        html += `
          <div class="note-item ${activeClass}" data-id="${n.id}">
            <div class="note-title"><span>📘 ${n.title}</span><i class="fas fa-pen-fancy"></i></div>
            <div class="note-preview">${preview}</div>
            <div class="note-meta"><span><i class="far fa-calendar-alt"></i> ${n.updated}</span><span><i class="far fa-bookmark"></i> ${n.category}</span></div>
          </div>
        `;
      });
      noteListEl.innerHTML = html;
      noteListEl.querySelectorAll('.note-item').forEach(item => {
        item.addEventListener('click', function() {
          loadNoteById(this.dataset.id);
        });
      });
    }

    function loadNoteById(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      currentNoteId = id;
      editorTitleInput.value = note.title;
      editorBody.value = note.body;
      updateTimeEl.innerHTML = `<i class="far fa-clock"></i> ${note.updated}`;
      renderNoteList(searchInput.value.trim());
      const activeItem = noteListEl.querySelector(`.note-item.active`);
      if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function saveCurrentNote() {
      const note = notes.find(n => n.id === currentNoteId);
      if (!note) return;
      const newTitle = editorTitleInput.value.trim() || '无标题';
      const newBody = editorBody.value;
      note.title = newTitle;
      note.body = newBody;
      const now = new Date();
      const timeStr = now.toLocaleString('zh-CN', { hour12: false });
      note.updated = timeStr;
      updateTimeEl.innerHTML = `<i class="far fa-clock"></i> ${timeStr}`;
      renderNoteList(searchInput.value.trim());
    }

    // ========== 笔记操作 ==========
    function addNewNote() {
      const now = new Date();
      const timeStr = now.toLocaleString('zh-CN', { hour12: false });
      const newNote = { id: String(nextId++), title: '新笔记', body: '在这里写下你的想法……', updated: timeStr, category: '未分类' };
      notes.unshift(newNote);
      currentNoteId = newNote.id;
      searchInput.value = '';
      renderNoteList('');
      loadNoteById(currentNoteId);
    }

    function deleteCurrentNote() {
      if (notes.length <= 1) { alert('至少保留一条笔记'); return; }
      const index = notes.findIndex(n => n.id === currentNoteId);
      if (index === -1) return;
      notes.splice(index, 1);
      currentNoteId = notes[0].id;
      renderNoteList(searchInput.value.trim());
      loadNoteById(currentNoteId);
    }

    // ========== 事件绑定 ==========
    editorTitleInput.addEventListener('input', saveCurrentNote);
    editorBody.addEventListener('input', saveCurrentNote);
    addBtn.addEventListener('click', addNewNote);
    deleteBtn.addEventListener('click', deleteCurrentNote);
    searchInput.addEventListener('input', function(e) {
      const keyword = e.target.value.trim();
      renderNoteList(keyword);
      const visible = noteListEl.querySelectorAll('.note-item');
      if (visible.length > 0) {
        const firstId = visible[0].dataset.id;
        if (firstId && !notes.find(n => n.id === currentNoteId && (n.title.includes(keyword) || n.body.includes(keyword) || n.category.includes(keyword)))) {
          loadNoteById(firstId);
        }
      } else {
        editorTitleInput.value = '';
        editorBody.value = '';
        updateTimeEl.innerHTML = `<i class="far fa-clock"></i> 无笔记`;
      }
    });

    starBtn.addEventListener('click', function() {
      this.classList.toggle('fas');
      this.classList.toggle('far');
      this.style.color = this.classList.contains('fas') ? '#f7c948' : '#9a83c7';
    });

    // Ctrl+S 保存
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveCurrentNote();
        const footer = document.querySelector('.editor-footer');
        footer.style.opacity = '0.5';
        setTimeout(() => footer.style.opacity = '1', 200);
      }
    });

    // ========== 初始化 ==========
    renderNoteList('');
    loadNoteById(currentNoteId);
    starBtn.classList.add('far');
    starBtn.style.color = '#9a83c7';
    setWallpaper('default');

  })();
</script>
</body>
</html>
