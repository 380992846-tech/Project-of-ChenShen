<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贵系学长 · 全能工坊</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }

        body {
            background: #0b0812;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(102,45,145,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(60,20,120,0.20) 0%, transparent 60%);
        }

        .card {
            max-width: 1480px;
            width: 100%;
            background: rgba(18, 12, 32, 0.72);
            backdrop-filter: blur(18px);
            border-radius: 48px;
            padding: 28px 32px 32px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7), 0 0 0 1px rgba(160,120,200,0.15);
            border: 1px solid rgba(160,120,200,0.20);
        }

        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(160,120,200,0.15);
            padding-bottom: 14px;
        }

        .header .avatar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .avatar i {
            font-size: 2.0rem;
            color: #c4a8e6;
            background: rgba(102,45,145,0.25);
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid rgba(160,120,200,0.25);
        }

        .header h1 {
            font-weight: 650;
            font-size: 1.9rem;
            color: #e4d5f5;
            background: linear-gradient(135deg, #c4a8e6, #a07ac9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .badge {
            margin-left: auto;
            background: rgba(102,45,145,0.2);
            padding: 6px 20px;
            border-radius: 60px;
            color: #d4c0ed;
            border: 1px solid rgba(160,120,200,0.2);
            font-weight: 500;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        /* API 密钥行 */
        .api-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(28,18,48,0.4);
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid rgba(160,120,200,0.10);
        }

        .api-row input {
            flex: 2 1 220px;
            padding: 8px 18px;
            border: 1px solid rgba(160,120,200,0.2);
            border-radius: 60px;
            font-size: 0.85rem;
            background: rgba(10,6,20,0.6);
            color: #e4d5f5;
            outline: none;
        }

        .api-row input:focus {
            border-color: #a07ac9;
            box-shadow: 0 0 0 3px rgba(102,45,145,0.2);
        }

        .api-row input::placeholder { color: #7a6a94; }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #a07ac9;
            color: #c4a8e6;
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }

        .btn-outline:hover {
            background: #a07ac9;
            color: #0b0812;
            box-shadow: 0 0 20px rgba(160,120,200,0.25);
        }

        .btn-primary {
            background: #662d91;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            box-shadow: 0 6px 18px rgba(102,45,145,0.30);
        }

        .btn-primary:hover {
            background: #4f1f73;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: rgba(160,120,200,0.10);
            border: 1px solid rgba(160,120,200,0.15);
            color: #c4a8e6;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }

        .btn-secondary:hover {
            background: rgba(160,120,200,0.2);
        }

        .btn:disabled { opacity: 0.4; pointer-events: none; }

        /* 双栏 */
        .grid-2col {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 24px;
        }
        @media (max-width: 1024px) { .grid-2col { grid-template-columns: 1fr; gap: 20px; } }

        .glass-box {
            background: rgba(28,18,48,0.5);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 16px 20px 20px;
            border: 1px solid rgba(160,120,200,0.12);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .section-title {
            font-weight: 600;
            color: #d4c0ed;
            margin-bottom: 12px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: #c4a8e6; width: 22px; }

        /* ===== AB 切换 ===== */
        .tab-bar {
            display: flex;
            gap: 4px;
            background: rgba(10,6,20,0.5);
            border-radius: 60px;
            padding: 4px;
            margin-bottom: 14px;
            border: 1px solid rgba(160,120,200,0.10);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 40px;
            background: transparent;
            color: #9a8ab0;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: #662d91;
            color: white;
            box-shadow: 0 4px 16px rgba(102,45,145,0.35);
        }

        .tab-btn:hover:not(.active) {
            color: #e4d5f5;
            background: rgba(160,120,200,0.08);
        }

        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }

        /* 聊天 */
        .chat-area {
            background: rgba(10,6,20,0.4);
            border-radius: 20px;
            padding: 12px 16px;
            min-height: 140px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(160,120,200,0.06);
            color: #d4c0ed;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .chat-area .message {
            margin-bottom: 6px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(160,120,200,0.05);
        }

        .chat-area .message .sender {
            color: #c4a8e6;
            font-weight: 600;
            margin-right: 6px;
        }
        .chat-area .message .sender.user { color: #9ab0e6; }
        .chat-area .message .text { color: #e4d5f5; }

        .chat-input-row {
            display: flex;
            gap: 8px;
        }

        .chat-input-row input {
            flex: 1;
            padding: 8px 16px;
            border: 1px solid rgba(160,120,200,0.15);
            border-radius: 60px;
            background: rgba(10,6,20,0.5);
            color: #e4d5f5;
            outline: none;
            font-size: 0.85rem;
        }

        .chat-input-row input:focus {
            border-color: #a07ac9;
            box-shadow: 0 0 0 3px rgba(102,45,145,0.12);
        }
        .chat-input-row input::placeholder { color: #7a6a94; }

        /* 题目列表 */
        .question-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 2px 0;
        }

        .question-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.12s;
            border-bottom: 1px solid rgba(160,120,200,0.05);
            color: #c4b8d8;
            font-size: 0.8rem;
        }

        .question-item:hover { background: rgba(160,120,200,0.06); }
        .question-item.active {
            background: rgba(102,45,145,0.2);
            border: 1px solid rgba(160,120,200,0.12);
            color: #e4d5f5;
        }
        .question-item .q-tag {
            font-size: 0.55rem;
            background: #662d91;
            color: white;
            padding: 1px 10px;
            border-radius: 40px;
            font-weight: 600;
        }
        .question-item .q-name { flex: 1; }
        .question-item .q-diff {
            font-size: 0.6rem;
            padding: 1px 10px;
            border-radius: 40px;
            background: rgba(160,120,200,0.1);
            color: #b0a0c8;
        }
        .question-item .q-diff.hard { background: rgba(200,80,80,0.12); color: #e8a0a0; }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .filter-row select {
            background: rgba(10,6,20,0.5);
            border: 1px solid rgba(160,120,200,0.12);
            color: #c4b8d8;
            padding: 6px 14px;
            border-radius: 60px;
            outline: none;
            font-size: 0.8rem;
            cursor: pointer;
            flex: 1;
        }

        /* 批改区域 */
        .review-area {
            background: rgba(10,6,20,0.4);
            border-radius: 20px;
            padding: 12px 16px;
            min-height: 100px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid rgba(160,120,200,0.06);
            color: #d4c0ed;
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-top: 4px;
        }

        .review-area .placeholder {
            color: #7a6a94;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 6px;
            height: 100%;
            min-height: 70px;
        }
        .review-area .placeholder i { font-size: 1.8rem; opacity: 0.3; }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        /* 日历 & 日记 (右侧下) */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-top: 6px;
        }

        .calendar-grid .day {
            text-align: center;
            padding: 4px 0;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #b0a0c8;
            background: rgba(10,6,20,0.3);
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.1s;
        }

        .calendar-grid .day.weekend { color: #c4a8e6; }
        .calendar-grid .day.today {
            border-color: #a07ac9;
            background: rgba(160,120,200,0.12);
            color: #e4d5f5;
        }
        .calendar-grid .day.selected {
            background: #662d91;
            color: white;
        }
        .calendar-grid .day.empty { background: transparent; border: none; cursor: default; }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            color: #c4b8d8;
            font-size: 0.8rem;
        }

        .calendar-header button {
            background: transparent;
            border: none;
            color: #c4a8e6;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 8px;
        }

        .diary-area textarea {
            width: 100%;
            background: rgba(10,6,20,0.4);
            border: 1px solid rgba(160,120,200,0.10);
            border-radius: 16px;
            padding: 10px 14px;
            color: #d4c0ed;
            font-size: 0.85rem;
            resize: vertical;
            min-height: 60px;
            outline: none;
            margin-top: 6px;
        }

        .diary-area textarea:focus {
            border-color: #a07ac9;
            box-shadow: 0 0 0 3px rgba(102,45,145,0.08);
        }

        .diary-area textarea::placeholder { color: #6a5a84; }

        /* 八股文 */
        .bagu-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin: 6px 0 4px;
        }

        .bagu-tag {
            background: rgba(160,120,200,0.08);
            border: 1px solid rgba(160,120,200,0.10);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #b0a0c8;
            cursor: pointer;
            transition: 0.15s;
        }

        .bagu-tag:hover {
            background: rgba(160,120,200,0.18);
            color: #e4d5f5;
        }

        .bagu-content {
            background: rgba(10,6,20,0.3);
            border-radius: 16px;
            padding: 10px 14px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #c4b8d8;
            max-height: 80px;
            overflow-y: auto;
            border: 1px solid rgba(160,120,200,0.04);
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .status-tip {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #b0a0c8;
            margin-top: 8px;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(160,120,200,0.15);
            border-top: 2px solid #c4a8e6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-note {
            margin-top: 22px;
            text-align: center;
            color: #6a5a84;
            border-top: 1px solid rgba(160,120,200,0.08);
            padding-top: 16px;
            font-size: 0.75rem;
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: rgba(160,120,200,0.03); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(160,120,200,0.15); border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <!-- 头部 -->
    <div class="header">
        <div class="avatar">
            <i class="fas fa-user-graduate"></i>
            <h1>贵系学长 · 全能工坊</h1>
        </div>
        <div class="badge"><i class="fas fa-robot"></i> DeepSeek · 清华紫</div>
    </div>

    <!-- API 密钥 -->
    <div class="api-row">
        <input type="password" id="apiKeyInput" placeholder="sk-... 输入 DeepSeek API Key" />
        <button class="btn-outline" id="saveKeyBtn"><i class="fas fa-save"></i> 保存</button>
        <span style="color:#6a5a84; font-size:0.7rem; margin-left:auto;"><i class="fas fa-lock"></i> 本地存储</span>
    </div>

    <!-- 双栏 -->
    <div class="grid-2col">
        <!-- ===== 左侧 ===== -->
        <div class="left-panel">
            <!-- AB 切换: 力扣题 / 学长对话 -->
            <div class="glass-box">
                <div class="tab-bar">
                    <button class="tab-btn active" data-tab="tab-leetcode"><i class="fas fa-code"></i> 力扣题</button>
                    <button class="tab-btn" data-tab="tab-chat"><i class="fas fa-comment-dots"></i> 问学长</button>
                </div>

                <!-- 力扣题面板 -->
                <div id="tab-leetcode" class="tab-panel active">
                    <div class="filter-row">
                        <select id="questionSource">
                            <option value="all">全部 (40题)</option>
                            <option value="company">大厂经典 (20题)</option>
                            <option value="leetcode">LeetCode Hard (20题)</option>
                        </select>
                    </div>
                    <div class="question-list" id="questionList">
                        <div style="color:#6a5a84; padding:16px; text-align:center; font-size:0.8rem;">加载中...</div>
                    </div>
                    <div class="action-row" style="margin-top:8px;">
                        <button class="btn-primary" id="reviewBtn"><i class="fas fa-wand-magic-sparkles"></i> 批改</button>
                        <button class="btn-secondary" id="clearReviewBtn"><i class="fas fa-rotate-left"></i> 清空</button>
                    </div>
                    <div class="review-area" id="reviewArea">
                        <div class="placeholder"><i class="fas fa-graduation-cap"></i><span>选题后写代码，点批改</span></div>
                    </div>
                </div>

                <!-- 学长对话面板 -->
                <div id="tab-chat" class="tab-panel">
                    <div class="chat-area" id="chatArea">
                        <div class="message"><span class="sender">🎓 学长</span><span class="text">学弟/学妹好！有啥问题随时问我 😄</span></div>
                    </div>
                    <div class="chat-input-row">
                        <input type="text" id="chatInput" placeholder="问学长 … 算法、代码、求职…" />
                        <button class="btn-primary" id="sendChatBtn"><i class="fas fa-paper-plane"></i> 发送</button>
                    </div>
                </div>
            </div>

            <!-- 代码编辑器 (共用) -->
            <div class="glass-box">
                <div class="section-title"><i class="fas fa-code"></i> 代码编辑器 <span style="font-weight:400; font-size:0.7rem; color:#7a6a94; margin-left:8px;">写代码 · 学长批改</span></div>
                <textarea id="codeEditor" style="width:100%; background:rgba(10,6,20,0.4); border:1px solid rgba(160,120,200,0.08); border-radius:16px; padding:12px 16px; color:#d4c0ed; font-family:'Courier New',monospace; font-size:0.85rem; resize:vertical; min-height:100px; outline:none;" placeholder="# 在这里写代码，然后选题 + 批改">def two_sum(nums, target):
    d = {}
    for i, num in enumerate(nums):
        if target - num in d:
            return [d[target - num], i]
        d[num] = i
    return []</textarea>
                <div class="action-row" style="margin-top:8px;">
                    <button class="btn-secondary" id="runCodeBtn"><i class="fas fa-play"></i> 模拟运行</button>
                    <button class="btn-secondary" id="clearCodeBtn"><i class="fas fa-rotate-left"></i> 清空</button>
                </div>
            </div>
        </div>

        <!-- ===== 右侧 ===== -->
        <div class="right-panel">
            <!-- 日历 + 日记 -->
            <div class="glass-box">
                <div class="section-title"><i class="fas fa-calendar-alt"></i> 日历 · 日记</div>
                <div class="calendar-header">
                    <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                    <span id="calendarTitle">2025年 1月</span>
                    <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
                <div class="diary-area" style="margin-top:8px;">
                    <textarea id="diaryInput" placeholder="写今天的日记… 点击日期可保存"></textarea>
                    <div style="display:flex; gap:8px; margin-top:4px;">
                        <button class="btn-secondary" id="saveDiaryBtn" style="flex:1; padding:4px 12px; font-size:0.75rem;"><i class="fas fa-save"></i> 保存日记</button>
                        <button class="btn-secondary" id="clearDiaryBtn" style="flex:1; padding:4px 12px; font-size:0.75rem;"><i class="fas fa-trash"></i> 清空</button>
                    </div>
                </div>
            </div>

            <!-- 大厂八股文 -->
            <div class="glass-box">
                <div class="section-title"><i class="fas fa-book-open"></i> 大厂 · 八股文</div>
                <div class="bagu-list" id="baguList">
                    <span class="bagu-tag" data-idx="0">TCP/IP</span>
                    <span class="bagu-tag" data-idx="1">进程线程</span>
                    <span class="bagu-tag" data-idx="2">Redis</span>
                    <span class="bagu-tag" data-idx="3">MySQL索引</span>
                    <span class="bagu-tag" data-idx="4">JVM</span>
                    <span class="bagu-tag" data-idx="5">设计模式</span>
                    <span class="bagu-tag" data-idx="6">操作系统</span>
                    <span class="bagu-tag" data-idx="7">网络协议</span>
                </div>
                <div class="bagu-content" id="baguContent">点击标签查看知识点 👆</div>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <i class="fas fa-shield-alt"></i> 密钥本地存储 · 力扣 + 学长 + 日历日记 + 八股文 · 自强不息
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== 题库 =====
        const companyProblems = [
            { id: 'c1', name: '两数之和 (三数之和变种)', diff: 'Medium', tag: '大厂' },
            { id: 'c2', name: 'LRU 缓存机制', diff: 'Hard', tag: '大厂' },
            { id: 'c3', name: '反转链表 (K个一组)', diff: 'Hard', tag: '大厂' },
            { id: 'c4', name: '寻找中位数 (两个有序数组)', diff: 'Hard', tag: '大厂' },
            { id: 'c5', name: '最大子数组和 (环形)', diff: 'Medium', tag: '大厂' },
            { id: 'c6', name: '字符串解码 (嵌套括号)', diff: 'Medium', tag: '大厂' },
            { id: 'c7', name: '岛屿数量 (DFS/BFS)', diff: 'Medium', tag: '大厂' },
            { id: 'c8', name: '合并K个排序链表', diff: 'Hard', tag: '大厂' },
            { id: 'c9', name: '滑动窗口最大值', diff: 'Hard', tag: '大厂' },
            { id: 'c10', name: '搜索旋转排序数组', diff: 'Medium', tag: '大厂' },
            { id: 'c11', name: '全排列 (去重)', diff: 'Medium', tag: '大厂' },
            { id: 'c12', name: '二叉树最大路径和', diff: 'Hard', tag: '大厂' },
            { id: 'c13', name: '接雨水 (双指针)', diff: 'Hard', tag: '大厂' },
            { id: 'c14', name: '跳跃游戏 II', diff: 'Medium', tag: '大厂' },
            { id: 'c15', name: '无重复字符最长子串', diff: 'Medium', tag: '大厂' },
            { id: 'c16', name: '链表环检测 (II)', diff: 'Medium', tag: '大厂' },
            { id: 'c17', name: '有效括号 (多种括号)', diff: 'Medium', tag: '大厂' },
            { id: 'c18', name: '合并区间', diff: 'Medium', tag: '大厂' },
            { id: 'c19', name: '不同路径 (障碍物)', diff: 'Medium', tag: '大厂' },
            { id: 'c20', name: '单词搜索 (回溯)', diff: 'Hard', tag: '大厂' }
        ];

        const leetcodeHard = [
            { id: 'l1', name: '正则表达式匹配', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l2', name: '合并K个升序链表', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l3', name: '缺失的第一个正数', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l4', name: '串联所有单词的子串', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l5', name: '最长有效括号', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l6', name: '解数独', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l7', name: 'N皇后 II', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l8', name: '最小覆盖子串', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l9', name: '买卖股票的最佳时机 IV', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l10', name: '最大矩形', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l11', name: '二叉树中的最大路径和', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l12', name: '单词接龙 II', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l13', name: '戳气球', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l14', name: '分割数组的最大值', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l15', name: 'Frog Jump (青蛙过河)', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l16', name: 'LFU 缓存', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l17', name: '滑动窗口最大值 (优化)', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l18', name: '子序列宽度之和', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l19', name: '骑士拨号器', diff: 'Hard', tag: 'LeetCode' },
            { id: 'l20', name: '最小化数组中的最大值', diff: 'Hard', tag: 'LeetCode' }
        ];

        const allQuestions = [...companyProblems, ...leetcodeHard];

        // ===== 八股文数据 =====
        const baguData = [
            'TCP/IP 四层模型：应用层、传输层、网络层、网络接口层。三次握手、四次挥手。',
            '进程与线程：进程是资源分配最小单位，线程是CPU调度最小单位。进程间通信(IPC)：管道、信号、消息队列、共享内存、套接字。',
            'Redis：内存数据库，单线程+IO多路复用，支持持久化(RDB/AOF)，数据结构：String, Hash, List, Set, ZSet。',
            'MySQL索引：B+树索引，聚簇索引与非聚簇索引，最左前缀原则，覆盖索引，索引下推。',
            'JVM内存模型：堆、栈、方法区、程序计数器、本地方法栈。垃圾回收：GC Roots，可达性分析，复制/标记清除/标记整理。',
            '设计模式：单例、工厂、观察者、策略、装饰者、代理、适配器、模板方法等。',
            '操作系统：虚拟内存、分页分段、页面置换算法(LRU, FIFO, Clock)、死锁四大必要条件。',
            '网络协议：HTTP/HTTPS，状态码，RESTful，WebSocket，DNS解析，CDN。'
        ];

        // ===== DOM =====
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');
        const chatArea = document.getElementById('chatArea');
        const codeEditor = document.getElementById('codeEditor');
        const runCodeBtn = document.getElementById('runCodeBtn');
        const clearCodeBtn = document.getElementById('clearCodeBtn');
        const questionSource = document.getElementById('questionSource');
        const questionListEl = document.getElementById('questionList');
        const reviewBtn = document.getElementById('reviewBtn');
        const clearReviewBtn = document.getElementById('clearReviewBtn');
        const reviewArea = document.getElementById('reviewArea');
        const statusText = document.querySelector('.status-tip span') || document.createElement('span');
        const loadingSpinner = document.querySelector('.spinner');

        // 日历元素
        const calendarGrid = document.getElementById('calendarGrid');
        const calendarTitle = document.getElementById('calendarTitle');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');
        const diaryInput = document.getElementById('diaryInput');
        const saveDiaryBtn = document.getElementById('saveDiaryBtn');
        const clearDiaryBtn = document.getElementById('clearDiaryBtn');

        // 八股文
        const baguList = document.getElementById('baguList');
        const baguContent = document.getElementById('baguContent');

        // ===== 状态 =====
        let currentQuestions = [...allQuestions];
        let selectedQuestionId = null;
        let currentYear = 2025, currentMonth = 1;
        let selectedDate = null; // 'YYYY-MM-DD'

        // ===== 工具 =====
        function setStatus(msg, color = '#b0a0c8') {
            if (statusText) {
                statusText.innerHTML = `<i class="fas fa-circle-info"></i> ${msg}`;
                statusText.style.color = color;
            }
        }

        function setLoading(isLoading) {
            if (loadingSpinner) {
                loadingSpinner.style.display = isLoading ? 'inline-block' : 'none';
            }
            if (reviewBtn) reviewBtn.disabled = isLoading;
            if (sendChatBtn) sendChatBtn.disabled = isLoading;
        }

        // ===== 渲染题目 =====
        function renderQuestions(list) {
            if (!list || list.length === 0) {
                questionListEl.innerHTML = `<div style="color:#6a5a84; padding:16px; text-align:center; font-size:0.8rem;">暂无题目</div>`;
                return;
            }
            let html = '';
            list.forEach(q => {
                const active = (q.id === selectedQuestionId) ? 'active' : '';
                const diffClass = q.diff.toLowerCase() === 'hard' ? 'hard' : '';
                html += `
                    <div class="question-item ${active}" data-id="${q.id}">
                        <span class="q-tag">${q.tag}</span>
                        <span class="q-name">${q.name}</span>
                        <span class="q-diff ${diffClass}">${q.diff}</span>
                    </div>
                `;
            });
            questionListEl.innerHTML = html;
            document.querySelectorAll('.question-item').forEach(el => {
                el.addEventListener('click', function() {
                    selectedQuestionId = this.dataset.id;
                    document.querySelectorAll('.question-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    setStatus(`已选: ${this.querySelector('.q-name').textContent}`);
                    setReviewPlaceholder('选题后写代码，点批改');
                });
            });
        }

        function filterQuestions(source) {
            if (source === 'company') currentQuestions = [...companyProblems];
            else if (source === 'leetcode') currentQuestions = [...leetcodeHard];
            else currentQuestions = [...allQuestions];
            selectedQuestionId = null;
            renderQuestions(currentQuestions);
            setReviewPlaceholder('选题后写代码，点批改');
        }

        function setReviewPlaceholder(text) {
            reviewArea.innerHTML = `<div class="placeholder"><i class="fas fa-graduation-cap"></i><span>${text}</span></div>`;
        }

        function setReviewContent(text) {
            reviewArea.innerHTML = `<pre style="margin:0; white-space:pre-wrap; font-family:inherit; color:#d4c0ed; font-size:0.85rem;">${text}</pre>`;
        }

        // ===== 聊天 =====
        function addChatMessage(sender, text, isUser = false) {
            const placeholder = chatArea.querySelector('.placeholder');
            if (placeholder) placeholder.remove();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            const senderSpan = document.createElement('span');
            senderSpan.className = `sender ${isUser ? 'user' : ''}`;
            senderSpan.textContent = isUser ? '🧑‍💻 我' : '🎓 学长';
            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.textContent = text;
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(textSpan);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ===== API 调用 =====
        async function callDeepSeek(prompt, apiKey) {
            const url = 'https://api.deepseek.com/v1/chat/completions';
            const body = {
                model: 'deepseek-chat',
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.7,
                max_tokens: 2000
            };
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(body)
            });
            if (!response.ok) {
                let errMsg = `API 请求失败 (${response.status})`;
                try { const errData = await response.json(); errMsg = errData?.error?.message || errMsg; } catch (_) {}
                throw new Error(errMsg);
            }
            const data = await response.json();
            if (data.choices && data.choices.length > 0) {
                return data.choices[0].message.content;
            }
            throw new Error('API 返回格式异常');
        }

        // ===== 批改 =====
        reviewBtn.addEventListener('click', async function() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) { setStatus('❌ 请先保存 API 密钥', '#e8a0a0'); return; }
            if (!selectedQuestionId) { setStatus('⚠️ 请选择一道题目', '#e8c060'); return; }
            const question = currentQuestions.find(q => q.id === selectedQuestionId);
            if (!question) { setStatus('❌ 题目不存在', '#e8a0a0'); return; }
            const userCode = codeEditor.value.trim();
            if (!userCode) { setStatus('⚠️ 请先写代码', '#e8c060'); return; }

            setLoading(true);
            setReviewPlaceholder('⏳ 学长正在批改...');
            try {
                const prompt = `你是一位清华贵系资深算法助教。请批改以下代码，并给出正确答案和详细解释。
        题目：${question.name} (难度: ${question.diff})
        学生代码：
        \`\`\`
        ${userCode}
        \`\`\`
        请按以下格式输出：
        1. 批改意见 (指出问题、优点)
        2. 正确答案 (完整代码，带注释)
        3. 复杂度分析`;
                const answer = await callDeepSeek(prompt, apiKey);
                setReviewContent(answer);
                setStatus('✅ 批改完成', '#8ac4a0');
            } catch (error) {
                setReviewContent(`❌ 批改失败: ${error.message}`);
                setStatus(`❌ ${error.message}`, '#e8a0a0');
            } finally { setLoading(false); }
        });

        clearReviewBtn.addEventListener('click', function() {
            setReviewPlaceholder('已清空，重新选题批改');
            setStatus('🔄 已清空', '#b0a0c8');
        });

        // ===== 学长对话 =====
        sendChatBtn.addEventListener('click', async function() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) { setStatus('❌ 请先保存 API 密钥', '#e8a0a0'); return; }
            const question = chatInput.value.trim();
            if (!question) { setStatus('⚠️ 输入你想问的问题', '#e8c060'); return; }
            chatInput.value = '';
            addChatMessage('我', question, true);
            setLoading(true);
            try {
                const prompt = `你是清华贵系学长，帮助学弟学妹解答算法、编程、求职问题。用亲切专业的语气回答。\n问题：${question}`;
                const answer = await callDeepSeek(prompt, apiKey);
                addChatMessage('学长', answer);
                setStatus('✅ 学长已回复', '#8ac4a0');
            } catch (error) {
                addChatMessage('学长', `😅 出错啦: ${error.message}`);
                setStatus(`❌ ${error.message}`, '#e8a0a0');
            } finally { setLoading(false); }
        });

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); sendChatBtn.click(); }
        });

        // ===== 代码功能 =====
        runCodeBtn.addEventListener('click', function() {
            const code = codeEditor.value.trim() || '// 没有代码';
            setStatus('⚡ 模拟运行 (仅演示)', '#c4a8e6');
            alert(`[模拟运行]\n代码:\n${code.substring(0, 400)}${code.length > 400 ? '...' : ''}`);
        });

        clearCodeBtn.addEventListener('click', function() {
            codeEditor.value = '';
            setStatus('🔄 代码已清空', '#b0a0c8');
        });

        // ===== 日历 =====
        function renderCalendar(year, month) {
            const firstDay = new Date(year, month - 1, 1).getDay();
            const daysInMonth = new Date(year, month, 0).getDate();
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

            calendarTitle.textContent = `${year}年 ${month}月`;

            let html = '';
            // 星期头
            const weekdays = ['日','一','二','三','四','五','六'];
            weekdays.forEach(d => {
                html += `<div class="day" style="font-weight:600; color:#7a6a94; background:transparent; cursor:default; border:none;">${d}</div>`;
            });

            // 空白
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="day empty"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = (dateStr === todayStr);
                const isSelected = (dateStr === selectedDate);
                const isWeekend = (firstDay + d - 1) % 7 === 0 || (firstDay + d - 1) % 7 === 6;
                let cls = 'day';
                if (isWeekend) cls += ' weekend';
                if (isToday) cls += ' today';
                if (isSelected) cls += ' selected';
                html += `<div class="${cls}" data-date="${dateStr}">${d}</div>`;
            }

            calendarGrid.innerHTML = html;

            // 点击日期 → 加载日记
            document.querySelectorAll('.calendar-grid .day:not(.empty)').forEach(el => {
                el.addEventListener('click', function() {
                    const date = this.dataset.date;
                    selectedDate = date;
                    // 重新渲染高亮
                    renderCalendar(year, month);
                    // 加载日记
                    const diary = localStorage.getItem(`diary_${date}`) || '';
                    diaryInput.value = diary;
                    setStatus(`📅 ${date} 的日记`, '#c4a8e6');
                });
            });

            // 如果选中日期不在当月，清除选中状态
            if (selectedDate) {
                const [y, m] = selectedDate.split('-').map(Number);
                if (y !== year || m !== month) {
                    // 不自动清除，但高亮消失
                }
            }
        }

        prevMonthBtn.addEventListener('click', function() {
            if (currentMonth === 1) { currentMonth = 12; currentYear--; }
            else { currentMonth--; }
            renderCalendar(currentYear, currentMonth);
        });

        nextMonthBtn.addEventListener('click', function() {
            if (currentMonth === 12) { currentMonth = 1; currentYear++; }
            else { currentMonth++; }
            renderCalendar(currentYear, currentMonth);
        });

        // ===== 日记 =====
        saveDiaryBtn.addEventListener('click', function() {
            if (!selectedDate) {
                setStatus('⚠️ 请先点击日历中的日期', '#e8c060');
                return;
            }
            const content = diaryInput.value.trim();
            if (!content) {
                setStatus('⚠️ 日记内容不能为空', '#e8c060');
                return;
            }
            localStorage.setItem(`diary_${selectedDate}`, content);
            setStatus(`✅ ${selectedDate} 日记已保存`, '#8ac4a0');
        });

        clearDiaryBtn.addEventListener('click', function() {
            if (!selectedDate) {
                setStatus('⚠️ 请先点击日期', '#e8c060');
                return;
            }
            localStorage.removeItem(`diary_${selectedDate}`);
            diaryInput.value = '';
            setStatus(`🗑️ ${selectedDate} 日记已删除`, '#b0a0c8');
        });

        // ===== 八股文 =====
        baguList.addEventListener('click', function(e) {
            const tag = e.target.closest('.bagu-tag');
            if (!tag) return;
            const idx = parseInt(tag.dataset.idx);
            if (isNaN(idx) || idx < 0 || idx >= baguData.length) return;
            baguContent.textContent = baguData[idx];
            // 高亮
            document.querySelectorAll('.bagu-tag').forEach(t => t.style.borderColor = 'rgba(160,120,200,0.10)');
            tag.style.borderColor = '#a07ac9';
            setStatus(`📖 ${tag.textContent}`, '#c4a8e6');
        });

        // 默认显示第一个
        baguContent.textContent = baguData[0];
        document.querySelector('.bagu-tag').style.borderColor = '#a07ac9';

        // ===== AB 切换 =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const target = this.dataset.tab;
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.getElementById(target).classList.add('active');
            });
        });

        // ===== 保存密钥 =====
        saveKeyBtn.addEventListener('click', function() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('deepseek_api_key', key);
                setStatus('✅ API 密钥已保存', '#8ac4a0');
            } else {
                localStorage.removeItem('deepseek_api_key');
                setStatus('⚠️ 密钥已清除', '#e8c060');
            }
        });

        // ===== 初始化 =====
        const savedKey = localStorage.getItem('deepseek_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        // 日历初始化
        const now = new Date();
        currentYear = now.getFullYear();
        currentMonth = now.getMonth() + 1;
        renderCalendar(currentYear, currentMonth);

        // 题目初始化
        filterQuestions('all');
        setStatus('🔑 就绪，选题批改 / 问学长', '#b0a0c8');

        // 如果保存了日记在当天
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        selectedDate = todayStr;
        const diary = localStorage.getItem(`diary_${todayStr}`) || '';
        diaryInput.value = diary;

        console.log('贵系学长 · 全能工坊 已启动');
    })();
</script>
