<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI视频工坊 · DeepSeek + 视频生成</title>
  <!-- Font Awesome Icons (免费) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0e1a 0%, #141a2b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .glass-card {
      background: rgba(20, 28, 45, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 32px 28px;
      max-width: 860px;
      width: 100%;
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e0e9ff, #9bbaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .subhead {
      color: #8b9acf;
      font-size: 0.95rem;
      font-weight: 400;
      border-left: 3px solid #3b5c9e;
      padding-left: 14px;
      margin-bottom: 28px;
      opacity: 0.8;
    }

    .api-area {
      background: rgba(12, 18, 30, 0.6);
      border-radius: 28px;
      padding: 20px 22px;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .label-row label {
      color: #b7c7f0;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    .label-row .badge {
      background: #1e2a44;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #9bbaff;
      border: 1px solid #2e3f68;
    }

    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group input {
      flex: 2;
      min-width: 200px;
      background: #101725;
      border: 1px solid #273457;
      border-radius: 40px;
      padding: 14px 20px;
      color: #edf2ff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #4f7bff;
      box-shadow: 0 0 0 3px rgba(79, 123, 255, 0.15);
    }

    .input-group input::placeholder {
      color: #53638b;
      font-weight: 300;
    }

    .btn {
      background: #1f2b48;
      border: none;
      border-radius: 40px;
      padding: 14px 28px;
      color: white;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #31456b;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b6bf0, #5a3cf0);
      border: none;
      box-shadow: 0 8px 18px -6px #2f46b0;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 24px -6px #3f55c0;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #3c5080;
    }

    .btn-outline:hover {
      background: #1f2d4f;
      border-color: #5f79b0;
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.6);
    }

    .prompt-preview {
      margin-top: 18px;
      background: #0d1323;
      border-radius: 24px;
      padding: 16px 20px;
      border-left: 4px solid #3b6bf0;
      color: #c8d6ff;
      font-size: 0.95rem;
      line-height: 1.5;
      min-height: 60px;
      word-break: break-word;
      position: relative;
    }

    .prompt-preview .placeholder-text {
      color: #4b5e8a;
      font-style: italic;
      font-weight: 300;
    }

    .video-section {
      margin-top: 28px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #b7cbf5;
      font-weight: 500;
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }

    .section-title i {
      font-size: 1.2rem;
      color: #5f7edb;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .video-card {
      background: #111b30;
      border-radius: 28px;
      padding: 16px 16px 18px;
      border: 1px solid #263153;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .video-card:hover {
      border-color: #4765b0;
      background: #14203a;
    }

    .video-thumb {
      background: #0e162b;
      border-radius: 20px;
      aspect-ratio: 16 / 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #6680b0;
      font-size: 0.8rem;
      gap: 8px;
      border: 1px solid #25335a;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .video-thumb i {
      font-size: 2.6rem;
      color: #3d5faa;
      opacity: 0.7;
    }

    .video-thumb .status-badge {
      background: #1b294a;
      padding: 4px 14px;
      border-radius: 60px;
      font-size: 0.7rem;
      color: #99b3f0;
      border: 1px solid #32487a;
      margin-top: 4px;
    }

    .video-card .video-title {
      color: #d6e2ff;
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-card .video-meta {
      display: flex;
      justify-content: space-between;
      color: #6a7fa8;
      font-size: 0.7rem;
      margin-top: 6px;
    }

    .video-card .video-meta i {
      margin-right: 4px;
      font-size: 0.7rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 10px;
      color: #4a5f8a;
      background: #0c1428;
      border-radius: 40px;
      border: 1px dashed #25345a;
    }

    .empty-state i {
      font-size: 2.8rem;
      opacity: 0.4;
      margin-bottom: 8px;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toast-msg {
      background: #1c2a4a;
      color: #bbd0ff;
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 0.75rem;
      border: 1px solid #2d4370;
    }

    @media (max-width: 600px) {
      .glass-card { padding: 20px 16px; }
      .video-grid { grid-template-columns: 1fr; }
      .input-group input { min-width: 140px; }
    }

    /* 加载微调 */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top: 2px solid #a5c0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="glass-card">

  <h1>
    <i class="fas fa-film" style="background: linear-gradient(135deg,#4f7bff,#a07aff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
    视频生成工坊
  </h1>
  <div class="subhead">
    <i class="fas fa-robot" style="margin-right: 8px;"></i> DeepSeek 提示词 · 即时抓取视频结果
  </div>

  <!-- API 区域：DeepSeek 生成提示词 -->
  <div class="api-area">
    <div class="label-row">
      <label><i class="fas fa-key" style="margin-right: 6px; color: #5f7edb;"></i> DeepSeek API Key</label>
      <span class="badge"><i class="fas fa-lock"></i> 本地存储</span>
    </div>
    <div class="input-group">
      <input type="password" id="apiKeyInput" placeholder="sk-... 输入你的 DeepSeek API Key" value="">
      <button class="btn btn-outline" id="saveKeyBtn" style="padding: 14px 22px;"><i class="fas fa-save"></i> 保存</button>
    </div>
    <div style="margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
      <input type="text" id="ideaInput" placeholder="描述你想要的视频主题，例如：赛博朋克城市、日落海滩..." style="flex:3; min-width: 160px; background: #101725; border: 1px solid #273457; border-radius: 40px; padding: 12px 20px; color: #edf2ff; outline: none;">
      <button class="btn btn-primary" id="generatePromptBtn"><i class="fas fa-wand-magic-sparkles"></i> 生成提示词</button>
    </div>
    <!-- 提示词预览 -->
    <div class="prompt-preview" id="promptDisplay">
      <span class="placeholder-text"><i class="fas fa-quote-left" style="opacity:0.3; margin-right: 8px;"></i>点击生成，DeepSeek 将为你创作视频提示词</span>
    </div>
  </div>

  <!-- 视频结果区域 -->
  <div class="video-section">
    <div class="section-title">
      <i class="fas fa-play-circle"></i> 
      视频生成结果 <span style="font-weight:300; font-size:0.8rem; color:#5f74a0;">(模拟抓取 · 基于提示词)</span>
    </div>
    <div class="video-grid" id="videoGrid">
      <!-- 占位空状态，由 JS 动态渲染 -->
      <div class="empty-state" id="emptyState">
        <i class="fas fa-video"></i>
        <div style="margin-top: 8px;">暂无视频结果</div>
        <div style="font-size:0.75rem; margin-top:4px; color:#3f5180;">生成提示词后将自动抓取示例视频</div>
      </div>
    </div>
    <div class="footer-actions">
      <span class="toast-msg" id="statusToast"><i class="fas fa-circle" style="color: #4f7bff; font-size: 0.5rem; vertical-align: middle; margin-right: 6px;"></i>就绪</span>
      <button class="btn btn-outline" id="refreshVideosBtn" style="padding: 10px 20px;"><i class="fas fa-rotate-right"></i> 刷新抓取</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- 模拟视频数据 (抓取结果) ----------
    // 不同的提示词触发不同的模拟视频列表（实际环境可替换为真实API抓取）
    const VIDEO_DATABASE = [
      // 默认/通用
      {
        title: "落日海岸 · 4K",
        duration: "0:12",
        views: "2.3k",
        style: "cinematic",
        thumbnailIcon: "fa-sun",
        promptMatch: ["日落", "海滩", "海岸", "夕阳", "热带"]
      },
      {
        title: "赛博都市 · 霓虹夜",
        duration: "0:18",
        views: "4.1k",
        style: "cyberpunk",
        thumbnailIcon: "fa-city",
        promptMatch: ["赛博", "霓虹", "城市", "未来", "punk"]
      },
      {
        title: "奇幻森林 · 精灵",
        duration: "0:09",
        views: "1.7k",
        style: "fantasy",
        thumbnailIcon: "fa-tree",
        promptMatch: ["森林", "精灵", "奇幻", "魔法", "自然"]
      },
      {
        title: "太空漫游 · 星云",
        duration: "0:15",
        views: "3.8k",
        style: "space",
        thumbnailIcon: "fa-rocket",
        promptMatch: ["太空", "宇宙", "星云", "银河", "科幻"]
      },
      {
        title: "水墨中国 · 意境",
        duration: "0:11",
        views: "2.0k",
        style: "ink",
        thumbnailIcon: "fa-paint-brush",
        promptMatch: ["水墨", "中国风", "山水", "古风", "国画"]
      },
      {
        title: "美食诱惑 · 慢动作",
        duration: "0:08",
        views: "5.2k",
        style: "food",
        thumbnailIcon: "fa-utensils",
        promptMatch: ["美食", "烹饪", "甜点", "咖啡", "料理"]
      }
    ];

    // 根据提示词文本匹配相关视频 (模拟抓取)
    function fetchVideosByPrompt(promptText) {
      if (!promptText || promptText.trim() === '') {
        return []; // 无提示词返回空
      }
      const lower = promptText.toLowerCase();
      // 计算匹配分数
      const scored = VIDEO_DATABASE.map(video => {
        let score = 0;
        video.promptMatch.forEach(keyword => {
          if (lower.includes(keyword.toLowerCase())) {
            score += 1;
          }
        });
        // 额外：如果提示词包含"视频" "生成" 等，提高部分权重
        if (lower.includes("视频") || lower.includes("动画") || lower.includes("生成")) score += 0.5;
        return { ...video, score };
      });
      // 按分数排序，取前3个，如果分数都为0则随机取2个作为展示
      const sorted = scored.sort((a, b) => b.score - a.score);
      const top = sorted.filter(v => v.score > 0);
      if (top.length >= 2) {
        return top.slice(0, 3);
      } else {
        // 如果匹配太少，补一些默认的（但不要重复）
        const defaultVideos = VIDEO_DATABASE.slice(0, 3);
        // 去重 (基于title)
        const existTitles = new Set(top.map(v => v.title));
        const complement = defaultVideos.filter(v => !existTitles.has(v.title));
        const result = [...top, ...complement];
        return result.slice(0, 3);
      }
    }

    // ---------- DOM 元素 ----------
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const ideaInput = document.getElementById('ideaInput');
    const generatePromptBtn = document.getElementById('generatePromptBtn');
    const promptDisplay = document.getElementById('promptDisplay');
    const videoGrid = document.getElementById('videoGrid');
    const emptyState = document.getElementById('emptyState');
    const statusToast = document.getElementById('statusToast');
    const refreshVideosBtn = document.getElementById('refreshVideosBtn');

    // 从 localStorage 加载 API Key
    const savedKey = localStorage.getItem('deepseek_api_key');
    if (savedKey) {
      apiKeyInput.value = savedKey;
    }

    // 保存 API Key
    saveKeyBtn.addEventListener('click', function() {
      const key = apiKeyInput.value.trim();
      if (key.startsWith('sk-') && key.length > 20) {
        localStorage.setItem('deepseek_api_key', key);
        statusToast.innerHTML = `<i class="fas fa-check-circle" style="color: #5f9b6b;"></i> API Key 已保存`;
        setTimeout(() => {
          statusToast.innerHTML = `<i class="fas fa-circle" style="color: #4f7bff; font-size: 0.5rem; vertical-align: middle; margin-right: 6px;"></i>就绪`;
        }, 2500);
      } else {
        statusToast.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #d97a4a;"></i> 请输入有效的 DeepSeek Key (sk-...)`;
      }
    });

    // ---------- 模拟 DeepSeek 生成提示词 ----------
    function generatePromptFromIdea(idea) {
      // 模拟调用 DeepSeek API (实际上由于浏览器跨域限制，这里做模拟)
      // 但在真实场景：使用 fetch 请求 https://api.deepseek.com/v1/chat/completions
      // 本演示用模拟数据 + 展示效果
      return new Promise((resolve) => {
        // 模拟网络延迟
        const delay = 600 + Math.random() * 800;
        setTimeout(() => {
          let prompt = '';
          if (!idea || idea.trim() === '') {
            const fallback = ['赛博朋克', '奇幻', '太空', '水墨', '美食'];
            const rand = fallback[Math.floor(Math.random() * fallback.length)];
            prompt = `【DeepSeek 生成】${rand}风格，电影级4K，8秒循环视频，光影细腻，色彩丰富，动态粒子效果，氛围感十足。`;
          } else {
            // 基于输入构造一个“像样”的提示词
            const styles = [' cinematic 4K', ' 慢动作 60fps', ' 唯美光影', ' 动态粒子', ' 赛博霓虹', ' 自然光'];
            const randStyle = styles[Math.floor(Math.random() * styles.length)];
            prompt = `【DeepSeek 生成】基于“${idea}”创作，${randStyle}，高质量视频，画面纯净，构图精美，适合短视频平台，时长8-12秒。`;
          }
          resolve(prompt);
        }, delay);
      });
    }

    // 渲染视频卡片
    function renderVideos(videos) {
      // 清除空状态
      const empty = document.getElementById('emptyState');
      if (empty) empty.remove();

      // 清除所有子节点 (保留空状态占位)
      while (videoGrid.firstChild) {
        videoGrid.removeChild(videoGrid.firstChild);
      }

      if (!videos || videos.length === 0) {
        // 显示空状态
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-state';
        emptyDiv.id = 'emptyState';
        emptyDiv.innerHTML = `
          <i class="fas fa-video"></i>
          <div style="margin-top: 8px;">暂无视频结果</div>
          <div style="font-size:0.75rem; margin-top:4px; color:#3f5180;">生成提示词后将自动抓取示例视频</div>
        `;
        videoGrid.appendChild(emptyDiv);
        return;
      }

      // 渲染视频卡片
      videos.forEach((video, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        // 随机延迟动画
        card.style.animation = `fadeIn 0.3s ease ${index * 0.05}s both`;
        card.innerHTML = `
          <div class="video-thumb">
            <i class="fas ${video.thumbnailIcon || 'fa-play'}"></i>
            <span class="status-badge"><i class="fas fa-circle" style="color: #4fcb6b; font-size: 0.4rem;"></i> 可播放</span>
          </div>
          <div class="video-title" title="${video.title}">${video.title}</div>
          <div class="video-meta">
            <span><i class="far fa-clock"></i> ${video.duration || '0:10'}</span>
            <span><i class="far fa-eye"></i> ${video.views || '1.2k'}</span>
          </div>
        `;
        videoGrid.appendChild(card);
      });
    }

    // 主流程：生成提示词 + 抓取视频
    async function handleGenerateAndFetch() {
      const idea = ideaInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey || !apiKey.startsWith('sk-')) {
        statusToast.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #d97a4a;"></i> 请先保存有效的 DeepSeek API Key`;
        return;
      }

      // 显示加载状态
      generatePromptBtn.disabled = true;
      generatePromptBtn.innerHTML = `<span class="spinner"></span> 生成中`;
      statusToast.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> DeepSeek 生成提示词...`;

      try {
        // 1. 调用模拟 DeepSeek (实际可替换为真实API)
        const prompt = await generatePromptFromIdea(idea);
        // 显示提示词
        promptDisplay.innerHTML = `<i class="fas fa-quote-left" style="opacity:0.5; margin-right: 8px;"></i> ${prompt}`;
        
        // 2. 根据提示词抓取视频 (模拟)
        statusToast.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> 抓取视频结果...`;
        const videos = fetchVideosByPrompt(prompt);
        
        // 3. 渲染视频
        renderVideos(videos);

        // 4. 更新状态
        statusToast.innerHTML = `<i class="fas fa-check-circle" style="color: #5f9b6b;"></i> 已生成 ${videos.length} 个视频`;
        setTimeout(() => {
          statusToast.innerHTML = `<i class="fas fa-circle" style="color: #4f7bff; font-size: 0.5rem; vertical-align: middle; margin-right: 6px;"></i>就绪`;
        }, 2500);
      } catch (err) {
        statusToast.innerHTML = `<i class="fas fa-times-circle" style="color: #d96a5a;"></i> 生成失败，请重试`;
        console.warn(err);
      } finally {
        generatePromptBtn.disabled = false;
        generatePromptBtn.innerHTML = `<i class="fas fa-wand-magic-sparkles"></i> 生成提示词`;
      }
    }

    // 刷新/手动抓取 (基于当前提示词)
    function handleRefresh() {
      const currentPrompt = promptDisplay.innerText;
      if (!currentPrompt || currentPrompt.includes('点击生成')) {
        statusToast.innerHTML = `<i class="fas fa-info-circle"></i> 请先生成提示词`;
        return;
      }
      // 从提示词中提取内容 (去除前缀)
      const cleanPrompt = currentPrompt.replace('【DeepSeek 生成】', '').trim();
      const videos = fetchVideosByPrompt(cleanPrompt);
      renderVideos(videos);
      statusToast.innerHTML = `<i class="fas fa-rotate-right"></i> 已刷新 (${videos.length} 个视频)`;
      setTimeout(() => {
        statusToast.innerHTML = `<i class="fas fa-circle" style="color: #4f7bff; font-size: 0.5rem; vertical-align: middle; margin-right: 6px;"></i>就绪`;
      }, 2000);
    }

    // 绑定事件
    generatePromptBtn.addEventListener('click', handleGenerateAndFetch);
    refreshVideosBtn.addEventListener('click', handleRefresh);

    // 额外：回车快捷生成
    ideaInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        generatePromptBtn.click();
      }
    });

    // 样式动画
    const styleAnim = document.createElement('style');
    styleAnim.textContent = `
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    `;
    document.head.appendChild(styleAnim);

    // 初始化加载演示：展示默认提示词样例 (未调用API)
    const initDemo = () => {
      // 设置一个默认的演示提示词 (但不用api)
      const demoPrompt = '【DeepSeek 生成】赛博朋克风格，霓虹都市夜景，4K高清，动态光影，未来感十足。';
      promptDisplay.innerHTML = `<i class="fas fa-quote-left" style="opacity:0.5; margin-right: 8px;"></i> ${demoPrompt}`;
      // 根据演示提示词抓取视频
      const videos = fetchVideosByPrompt(demoPrompt);
      renderVideos(videos);
      statusToast.innerHTML = `<i class="fas fa-circle" style="color: #4f7bff; font-size: 0.5rem; vertical-align: middle; margin-right: 6px;"></i> 演示加载完成`;
    };
    initDemo();

    // 如果用户没有key，提醒但不阻塞演示
    if (!savedKey) {
      statusToast.innerHTML = `<i class="fas fa-info-circle"></i> 请设置 DeepSeek API Key 以生成提示词`;
    }

  })();
</script>
</body>
</html>
